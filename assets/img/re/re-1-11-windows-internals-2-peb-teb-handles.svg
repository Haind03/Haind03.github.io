<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/></marker></defs>
<rect x="0" y="0" width="800" height="360" rx="12" fill="#0d121d" stroke="#263451"/>
<text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Reaching the PEB without an API</text>
<text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">one segment register read gives access to process internals</text>
<rect x="30" y="110" width="170" height="60" rx="7" fill="#111827" stroke="#00f0ff"/>
<text x="115.0" y="135.7" text-anchor="middle" font-size="12" fill="#e3fffa" font-family="'JetBrains Mono',monospace">gs:[0x60]  x64</text>
<text x="115.0" y="152.7" text-anchor="middle" font-size="12" fill="#e3fffa" font-family="'JetBrains Mono',monospace">fs:[0x30]  x86</text>
<rect x="260" y="110" width="130" height="60" rx="7" fill="#111827" stroke="#ff2a6d"/>
<text x="325.0" y="135.6" text-anchor="middle" font-size="12.5" fill="#e3fffa">PEB</text>
<text x="325.0" y="153.1" text-anchor="middle" font-size="10.5" fill="#9fb0c8">per process</text>
<line x1="200" y1="140" x2="256" y2="140" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<rect x="450" y="84" width="300" height="46" rx="7" fill="#111827" stroke="#fcee0a"/>
<text x="600.0" y="102.6" text-anchor="middle" font-size="12.5" fill="#e3fffa">+0x2  BeingDebugged</text>
<text x="600.0" y="120.1" text-anchor="middle" font-size="10.5" fill="#9fb0c8">1 when a debugger is attached</text>
<rect x="450" y="146" width="300" height="46" rx="7" fill="#111827" stroke="#5fe3b0"/>
<text x="600.0" y="164.6" text-anchor="middle" font-size="12.5" fill="#e3fffa">+0x18  Ldr</text>
<text x="600.0" y="182.1" text-anchor="middle" font-size="10.5" fill="#9fb0c8">lists of loaded modules</text>
<rect x="450" y="208" width="300" height="46" rx="7" fill="#111827" stroke="#fcee0a"/>
<text x="600.0" y="226.6" text-anchor="middle" font-size="12.5" fill="#e3fffa">NtGlobalFlag</text>
<text x="600.0" y="244.1" text-anchor="middle" font-size="10.5" fill="#9fb0c8">debug heap flag bits</text>
<line x1="390" y1="128" x2="446" y2="107" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<line x1="390" y1="140" x2="446" y2="169" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<line x1="390" y1="152" x2="446" y2="231" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<rect x="450" y="274" width="300" height="46" rx="7" fill="#111827" stroke="#ff2a6d" stroke-dasharray="5 4"/>
<text x="600.0" y="292.6" text-anchor="middle" font-size="12.5" fill="#ff2a6d">Anti-debug check</text>
<text x="600.0" y="310.1" text-anchor="middle" font-size="10.5" fill="#9fb0c8">or walk Ldr to find kernel32</text>
<text x="120" y="200" text-anchor="middle" font-size="11" fill="#6c7b93">no import, no API name</text>
<text x="120" y="218" text-anchor="middle" font-size="11" fill="#6c7b93">to search for</text>
</svg>
