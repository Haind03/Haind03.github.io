<text x="146.0" y="186.9" text-anchor="middle" font-size="10.5" fill="#6c7b93">victim</text>
<rect x="344" y="130" width="180" height="70" rx="7" fill="#111827" stroke="#00f0ff"/>
<text x="434.0" y="151.9" text-anchor="middle" font-size="12.5" fill="#e3fffa">Linux VM</text>
