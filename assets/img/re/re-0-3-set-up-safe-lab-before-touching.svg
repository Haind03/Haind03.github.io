<line x1="340" y1="165" x2="236" y2="165" stroke="#5fe3b0" stroke-width="2" marker-end="url(#a)"/>
<text x="288" y="150" text-anchor="middle" font-size="10.5" fill="#5fe3b0">host-only net</text>
