<line x1="526" y1="185" x2="606" y2="244" stroke="#ff2a6d" stroke-width="2" marker-end="url(#a)" stroke-dasharray="5 4"/>
<text x="400" y="338" text-anchor="middle" font-size="11" fill="#6c7b93">Fake services answer the malware, so it shows its behavior while the packets go nowhere.</text>
