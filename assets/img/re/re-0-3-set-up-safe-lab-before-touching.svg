<text x="146.0" y="256.6" text-anchor="middle" font-size="12.5" fill="#e3fffa">Snapshot: clean state</text>
<text x="146.0" y="274.1" text-anchor="middle" font-size="10.5" fill="#9fb0c8">revert in seconds</text>
<line x1="146" y1="236" x2="146" y2="202" stroke="#5fe3b0" stroke-width="2" marker-end="url(#a)" stroke-dasharray="5 4"/>
