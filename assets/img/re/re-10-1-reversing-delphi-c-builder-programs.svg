<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/></marker></defs>
  <rect x="0" y="0" width="800" height="300" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Reversing a Delphi program</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">identify, rebuild the VCL names, then start at the handler</text>
  <text x="400" y="282" text-anchor="middle" font-size="11" fill="#6c7b93">Skip main: in a GUI Delphi app it is only the VCL message loop.</text>
  <rect x="28.0" y="100" width="156.0" height="62" rx="7" fill="#111827" stroke="#00f0ff"/>
  <text x="106.0" y="126.5" text-anchor="middle" font-size="12.5" fill="#e3fffa">Identify</text>
  <text x="106.0" y="143.5" text-anchor="middle" font-size="10.5" fill="#9fb0c8">DIE: Borland, VCL</text>
  <line x1="186.0" y1="131.0" x2="221.0" y2="131.0" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <rect x="224.0" y="100" width="156.0" height="62" rx="7" fill="#111827" stroke="#5fe3b0"/>
  <text x="302.0" y="126.5" text-anchor="middle" font-size="12.5" fill="#e3fffa">IDR</text>
  <text x="302.0" y="143.5" text-anchor="middle" font-size="10.5" fill="#9fb0c8">rebuilds forms + names</text>
  <line x1="382.0" y1="131.0" x2="417.0" y2="131.0" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <rect x="420.0" y="100" width="156.0" height="62" rx="7" fill="#111827" stroke="#263451"/>
  <text x="498.0" y="126.5" text-anchor="middle" font-size="12.5" fill="#e3fffa">Export map</text>
  <text x="498.0" y="143.5" text-anchor="middle" font-size="10.5" fill="#9fb0c8">.idc / .map</text>
  <line x1="578.0" y1="131.0" x2="613.0" y2="131.0" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <rect x="616.0" y="100" width="156.0" height="62" rx="7" fill="#111827" stroke="#263451"/>
  <text x="694.0" y="126.5" text-anchor="middle" font-size="12.5" fill="#e3fffa">Load in IDA</text>
  <text x="694.0" y="143.5" text-anchor="middle" font-size="10.5" fill="#9fb0c8">VCL no longer sub_xxx</text>
  <rect x="28.0" y="200" width="208.0" height="56" rx="7" fill="#111827" stroke="#fcee0a"/>
  <text x="132.0" y="223.5" text-anchor="middle" font-size="12.5" fill="#e3fffa">Pick a handler</text>
  <text x="132.0" y="240.5" text-anchor="middle" font-size="10.5" fill="#9fb0c8">e.g. Button1Click</text>
  <line x1="238.0" y1="228.0" x2="293.0" y2="228.0" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <rect x="296.0" y="200" width="208.0" height="56" rx="7" fill="#111827" stroke="#263451"/>
  <text x="400.0" y="223.5" text-anchor="middle" font-size="12.5" fill="#e3fffa">Read the logic</text>
  <text x="400.0" y="240.5" text-anchor="middle" font-size="10.5" fill="#9fb0c8">length-prefixed strings</text>
  <line x1="506.0" y1="228.0" x2="561.0" y2="228.0" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <rect x="564.0" y="200" width="208.0" height="56" rx="7" fill="#111827" stroke="#263451"/>
  <text x="668.0" y="223.5" text-anchor="middle" font-size="12.5" fill="#e3fffa">Rename + note</text>
  <text x="668.0" y="240.5" text-anchor="middle" font-size="10.5" fill="#9fb0c8">back to 0.4 habits</text>
  <polyline points="400,164 400,182 100,182 100,198" fill="none" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
</svg>
