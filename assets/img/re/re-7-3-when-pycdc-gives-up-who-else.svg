<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="360" rx="12" fill="#0d121d" stroke="#263451"/>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Choosing a Python decompiler</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">pick the tool by the Python version in the .pyc header</text>
  <rect x="30" y="140" width="150" height="70" rx="7" fill="#111827" stroke="#263451"/>
  <text x="105.0" y="162.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">.pyc file</text>
  <text x="105.0" y="179.0" text-anchor="middle" font-size="11.0" fill="#6c7b93">read magic,</text>
  <text x="105.0" y="196.0" text-anchor="middle" font-size="11.0" fill="#6c7b93">get the version</text>
  <rect x="290" y="84" width="230" height="56" rx="7" fill="#111827" stroke="#00f0ff"/>
  <text x="405.0" y="107.5" text-anchor="middle" font-size="12.5" fill="#e3fffa">uncompyle6 / decompyle3</text>
  <text x="405.0" y="124.5" text-anchor="middle" font-size="11.0" fill="#6c7b93">Python 2.x up to about 3.8</text>
  <rect x="290" y="162" width="230" height="56" rx="7" fill="#111827" stroke="#5fe3b0"/>
  <text x="405.0" y="185.5" text-anchor="middle" font-size="12.5" fill="#e3fffa">pycdc</text>
  <text x="405.0" y="202.5" text-anchor="middle" font-size="11.0" fill="#6c7b93">no runtime needed, newer too</text>
  <rect x="290" y="240" width="230" height="56" rx="7" fill="#0b1518" stroke="#ff2a6d" stroke-dasharray="5 4"/>
  <text x="405.0" y="263.5" text-anchor="middle" font-size="12.5" fill="#e3fffa">PyLingual (web, ML)</text>
  <text x="405.0" y="280.5" text-anchor="middle" font-size="11.0" fill="#6c7b93">3.9 to 3.12, no secrets</text>
  <line x1="183" y1="165" x2="286" y2="115" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <line x1="183" y1="175" x2="286" y2="190" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <line x1="183" y1="185" x2="286" y2="266" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <rect x="590" y="140" width="180" height="70" rx="7" fill="#111827" stroke="#fcee0a"/>
  <text x="680.0" y="162.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">Still broken?</text>
  <text x="680.0" y="179.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">xdis pydisasm</text>
  <text x="680.0" y="196.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">or dis + marshal</text>
  <line x1="523" y1="115" x2="586" y2="160" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <line x1="523" y1="190" x2="586" y2="175" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <line x1="523" y1="266" x2="586" y2="190" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <text x="400" y="334" text-anchor="middle" font-size="11" fill="#6c7b93">Try several tools on the same file and keep the best result.</text>
</svg>
