<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
<rect x="0" y="0" width="800" height="380" rx="12" fill="#0d121d" stroke="#263451"/>
<text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">The fetch, decode, execute loop of a protector VM</text>
<text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">you read the interpreter first, only then the logic</text>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/></marker></defs>
<rect x="30" y="100" width="160" height="60" rx="7" fill="#111827" stroke="#fcee0a"/>
<text x="110.0" y="125.8" text-anchor="middle" font-size="12.5" fill="#e3fffa">VM bytecode</text>
<text x="110.0" y="142.2" text-anchor="middle" font-size="10.5" fill="#9fb0c8">original code, translated</text>
<rect x="250" y="100" width="180" height="60" rx="7" fill="#111827" stroke="#ff2a6d"/>
<text x="340.0" y="125.8" text-anchor="middle" font-size="12.5" fill="#e3fffa">Dispatcher</text>
<text x="340.0" y="142.2" text-anchor="middle" font-size="10.5" fill="#9fb0c8">fetch byte at VIP, inc VIP</text>
<rect x="490" y="100" width="150" height="60" rx="7" fill="#111827" stroke="#00f0ff"/>
<text x="565.0" y="125.8" text-anchor="middle" font-size="12.5" fill="#e3fffa">Handler table</text>
<text x="565.0" y="142.2" text-anchor="middle" font-size="10.5" fill="#9fb0c8">jmp [table + op*8]</text>
<line x1="190" y1="130" x2="248" y2="130" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<line x1="430" y1="130" x2="488" y2="130" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<rect x="30" y="200" width="180" height="44" rx="7" fill="#111827" stroke="#263451"/>
<text x="110" y="218" text-anchor="middle" font-size="12.5" fill="#e3fffa">VIP, VSP</text>
<text x="110" y="234" text-anchor="middle" font-size="10.5" fill="#9fb0c8">virtual ip and stack</text>
<line x1="190" y1="214" x2="270" y2="163" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" stroke-dasharray="5 4"/>
<rect x="660" y="92" width="110" height="34" rx="7" fill="#111827" stroke="#263451"/>
<text x="715.0" y="113.0" text-anchor="middle" font-size="11" fill="#e3fffa">handler: add</text>
<rect x="660" y="134" width="110" height="34" rx="7" fill="#111827" stroke="#263451"/>
<text x="715.0" y="155.0" text-anchor="middle" font-size="11" fill="#e3fffa">handler: load</text>
<rect x="660" y="176" width="110" height="34" rx="7" fill="#111827" stroke="#263451"/>
<text x="715.0" y="197.0" text-anchor="middle" font-size="11" fill="#e3fffa">handler: jmp</text>
<line x1="640" y1="126" x2="658" y2="110" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<line x1="640" y1="130" x2="658" y2="150" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<line x1="640" y1="134" x2="658" y2="190" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<path d="M715,212 L715,250 L340,250 L340,162" fill="none" stroke="#ff2a6d" stroke-width="2" marker-end="url(#a)"/>
<text x="530" y="244" text-anchor="middle" font-size="10.5" fill="#ff2a6d">each handler jumps back to the dispatcher</text>
<rect x="250" y="282" width="300" height="50" rx="7" fill="#0b1518" stroke="#ff2a6d" stroke-dasharray="5 4"/>
<text x="400.0" y="302.8" text-anchor="middle" font-size="12.5" fill="#e3fffa">Handlers are obfuscated too</text>
<text x="400.0" y="319.2" text-anchor="middle" font-size="10.5" fill="#9fb0c8">junk, MBA, opaque predicates</text>
<text x="400" y="360" text-anchor="middle" font-size="11" fill="#6c7b93">A loop that jumps through a pointer table and always returns is the VM signature.</text>
</svg>
