<svg xmlns="http://www.w3.org/2000/svg" width="700" height="360" viewBox="0 0 700 360" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="360" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#111">Inside an APK file (actually a ZIP)</text>

  <g font-size="12">
    <rect x="40" y="56" width="620" height="40" fill="#fdecea" stroke="#c0392b"/>
    <text x="54" y="80" font-weight="600" fill="#7b241c">AndroidManifest.xml</text>
    <text x="300" y="80" fill="#555">binary XML: components, permissions, launcher activity</text>

    <rect x="40" y="100" width="620" height="40" fill="#e8f0fe" stroke="#4472c4"/>
    <text x="54" y="124" font-weight="600" fill="#1a3a6b">classes.dex (, classes2.dex...)</text>
    <text x="320" y="124" fill="#555">DEX bytecode, register-based (decompiles to Java)</text>

    <rect x="40" y="144" width="620" height="40" fill="#eafaf0" stroke="#2e8b57"/>
    <text x="54" y="168" font-weight="600" fill="#1d5e3a">lib/</text>
    <text x="320" y="168" fill="#555">native .so per ABI: arm64-v8a, armeabi-v7a, x86_64</text>

    <rect x="40" y="188" width="620" height="40" fill="#fff7e6" stroke="#d99a00"/>
    <text x="54" y="212" font-weight="600" fill="#8a6100">resources.arsc + res/</text>
    <text x="320" y="212" fill="#555">strings, layouts, images, values</text>

    <rect x="40" y="232" width="620" height="40" fill="#f0eefb" stroke="#6b46c1"/>
    <text x="54" y="256" font-weight="600" fill="#45307d">assets/</text>
    <text x="320" y="256" fill="#555">app-specific files (DEX/scripts sometimes hidden here)</text>

    <rect x="40" y="276" width="620" height="40" fill="#f4f4f4" stroke="#999"/>
    <text x="54" y="300" font-weight="600" fill="#555">META-INF/</text>
    <text x="320" y="300" fill="#555">signature (re-sign after edits to install)</text>
  </g>

  <text x="350" y="338" text-anchor="middle" font-size="12" fill="#c0392b">Start by reading AndroidManifest for entry points, then dive into classes.dex.</text>
</svg>
