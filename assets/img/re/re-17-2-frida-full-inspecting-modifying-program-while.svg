<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/></marker></defs>
<rect x="0" y="0" width="800" height="330" rx="12" fill="#0d121d" stroke="#263451"/>
<text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">How Frida sees inside a running process</text>
<text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">your JavaScript runs in the target address space</text>
<rect x="28" y="120" width="170" height="90" rx="7" fill="#111827" stroke="#00f0ff"/>
<text x="113.0" y="152.0" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-weight="700">Host</text>
<text x="113.0" y="169.0" text-anchor="middle" font-size="11" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">frida / frida-trace</text>
<text x="113.0" y="186.0" text-anchor="middle" font-size="11" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">hook.js</text>
<rect x="260" y="82" width="512" height="190" rx="10" fill="#0b1518" stroke="#00f0ff" stroke-dasharray="5 4"/>
<text x="280" y="104" text-anchor="start" font-size="11" fill="#00f0ff" font-family="'JetBrains Mono',monospace">target process</text>
<rect x="290" y="130" width="170" height="80" rx="7" fill="#111827" stroke="#ff2a6d"/>
<text x="375.0" y="165.5" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-weight="700">gum engine</text>
<text x="375.0" y="182.5" text-anchor="middle" font-size="11" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">runs your agent JS</text>
<rect x="560" y="130" width="190" height="80" rx="7" fill="#111827" stroke="#fcee0a"/>
<text x="655.0" y="165.5" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-weight="700">Target function</text>
<text x="655.0" y="182.5" text-anchor="middle" font-size="11" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">onEnter / onLeave</text>
<line x1="198" y1="165" x2="286" y2="165" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<line x1="460" y1="165" x2="556" y2="165" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<text x="372" y="122" text-anchor="middle" font-size="11" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">attach / spawn</text>
<text x="508" y="156" text-anchor="middle" font-size="11" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">Interceptor</text>
<path d="M375,212 L375,245 L120,245 L120,214" fill="none" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<text x="250" y="262" text-anchor="middle" font-size="11" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">send() / console.log: args, return values, memory</text>
<text x="400" y="310" text-anchor="middle" font-size="11" fill="#6c7b93" font-family="'JetBrains Mono',monospace">Read or change arguments and results while the program keeps running.</text>
</svg>
