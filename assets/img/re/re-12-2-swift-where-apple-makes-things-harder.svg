<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/></marker></defs>
  <rect x="0" y="0" width="800" height="320" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Reading a Swift binary</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">recognize, demangle, skip the ARC noise, then follow the calls</text>
  <rect x="28.0" y="100" width="214.7" height="56" rx="7" fill="#111827" stroke="#00f0ff"/>
  <text x="135.35" y="123.5" text-anchor="middle" font-size="12.5" fill="#e3fffa">Recognize</text>
  <text x="135.35" y="140.5" text-anchor="middle" font-size="10.5" fill="#9fb0c8">$s symbols, __swift5_*</text>
  <line x1="244.7" y1="128.0" x2="289.7" y2="128.0" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <rect x="292.7" y="100" width="214.7" height="56" rx="7" fill="#111827" stroke="#5fe3b0"/>
  <text x="400.04999999999995" y="123.5" text-anchor="middle" font-size="12.5" fill="#e3fffa">Demangle</text>
  <text x="400.04999999999995" y="140.5" text-anchor="middle" font-size="10.5" fill="#9fb0c8">Hopper / IDA, swift demangle</text>
  <line x1="509.3" y1="128.0" x2="554.3" y2="128.0" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <rect x="557.3" y="100" width="214.7" height="56" rx="7" fill="#111827" stroke="#263451"/>
  <text x="664.65" y="123.5" text-anchor="middle" font-size="12.5" fill="#e3fffa">Skip ARC noise</text>
  <text x="664.65" y="140.5" text-anchor="middle" font-size="10.5" fill="#9fb0c8">retain / release</text>
  <rect x="28.0" y="210" width="214.7" height="56" rx="7" fill="#111827" stroke="#fcee0a"/>
  <text x="135.35" y="233.5" text-anchor="middle" font-size="12.5" fill="#e3fffa">Named calls + compares</text>
  <text x="135.35" y="250.5" text-anchor="middle" font-size="10.5" fill="#9fb0c8">the real logic</text>
  <line x1="244.7" y1="238.0" x2="289.7" y2="238.0" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <rect x="292.7" y="210" width="214.7" height="56" rx="7" fill="#111827" stroke="#ff2a6d"/>
  <text x="400.04999999999995" y="233.5" text-anchor="middle" font-size="12.5" fill="#e3fffa">objc_msgSend?</text>
  <text x="400.04999999999995" y="250.5" text-anchor="middle" font-size="10.5" fill="#9fb0c8">read like ObjC (12.1)</text>
  <line x1="509.3" y1="238.0" x2="554.3" y2="238.0" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <rect x="557.3" y="210" width="214.7" height="56" rx="7" fill="#111827" stroke="#ff2a6d" stroke-dasharray="5 4"/>
  <text x="664.65" y="233.5" text-anchor="middle" font-size="12.5" fill="#e3fffa">Witness table?</text>
  <text x="664.65" y="250.5" text-anchor="middle" font-size="10.5" fill="#9fb0c8">follow function pointers</text>
  <polyline points="700,158 700,184 100,184 100,208" fill="none" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
