<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
<rect x="0" y="0" width="800" height="380" rx="12" fill="#0d121d" stroke="#263451"/>
<text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Identify the Lua bytecode, then pick the tool</text>
<text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">the first bytes decide the decompiler</text>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/></marker></defs>
<rect x="300" y="76" width="200" height="52" rx="7" fill="#111827" stroke="#00f0ff"/>
<text x="400.0" y="97.8" text-anchor="middle" font-size="12.5" fill="#e3fffa">Script file from game</text>
<text x="400.0" y="114.2" text-anchor="middle" font-size="10.5" fill="#9fb0c8">read the first bytes</text>
<path d="M350,128 L350,150 L135,150 L135,184" fill="none" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<line x1="400" y1="128" x2="400" y2="184" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<path d="M450,128 L450,150 L665,150 L665,184" fill="none" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<rect x="30" y="186" width="210" height="60" rx="7" fill="#111827" stroke="#5fe3b0"/>
<text x="135.0" y="212.2" text-anchor="middle" font-size="11.5" fill="#e3fffa" font-family="'JetBrains Mono',monospace">1B 4C 75 61 (\x1bLua)</text>
<text x="135.0" y="227.8" text-anchor="middle" font-size="9.5" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">5th byte = version 51..54</text>
<rect x="295" y="186" width="210" height="60" rx="7" fill="#111827" stroke="#fcee0a"/>
<text x="400.0" y="212.2" text-anchor="middle" font-size="11.5" fill="#e3fffa" font-family="'JetBrains Mono',monospace">1B 4C 4A (\x1bLJ)</text>
<text x="400.0" y="227.8" text-anchor="middle" font-size="9.5" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">LuaJIT bytecode</text>
<rect x="560" y="186" width="210" height="60" rx="7" fill="#0b1518" stroke="#ff2a6d" stroke-dasharray="5 4"/>
<text x="665.0" y="212.2" text-anchor="middle" font-size="11.5" fill="#e3fffa">No magic, high entropy</text>
<text x="665.0" y="227.8" text-anchor="middle" font-size="9.5" fill="#9fb0c8">script is encrypted</text>
<line x1="135" y1="246" x2="135" y2="284" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<line x1="400" y1="246" x2="400" y2="284" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<line x1="665" y1="246" x2="665" y2="284" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<rect x="30" y="286" width="210" height="50" rx="7" fill="#111827" stroke="#5fe3b0"/>
<text x="135.0" y="306.8" text-anchor="middle" font-size="12.5" fill="#e3fffa">unluac</text>
<text x="135.0" y="323.2" text-anchor="middle" font-size="10.5" fill="#9fb0c8">pick the matching version</text>
<rect x="295" y="286" width="210" height="50" rx="7" fill="#111827" stroke="#fcee0a"/>
<text x="400.0" y="306.8" text-anchor="middle" font-size="12.5" fill="#e3fffa">ljd</text>
<text x="400.0" y="323.2" text-anchor="middle" font-size="10.5" fill="#9fb0c8">not unluac</text>
<rect x="560" y="286" width="210" height="50" rx="7" fill="#0b1518" stroke="#ff2a6d" stroke-dasharray="5 4"/>
<text x="665.0" y="306.8" text-anchor="middle" font-size="12.5" fill="#e3fffa">Find the key / loader</text>
<text x="665.0" y="323.2" text-anchor="middle" font-size="10.5" fill="#9fb0c8">in the engine, then decrypt</text>
<text x="400" y="364" text-anchor="middle" font-size="11" fill="#6c7b93">Plain .lua text needs no decompiler at all: open it and read.</text>
</svg>
