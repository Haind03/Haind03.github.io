<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/></marker></defs>
<rect x="0" y="0" width="800" height="330" rx="12" fill="#0d121d" stroke="#263451"/>
<text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">LD_PRELOAD: your library wins the lookup</text>
<text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">macOS uses DYLD_INSERT_LIBRARIES the same way</text>
<rect x="28" y="120" width="130" height="70" rx="7" fill="#111827" stroke="#00f0ff"/>
<text x="93.0" y="150.5" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-weight="700">Program</text>
<text x="93.0" y="167.5" text-anchor="middle" font-size="11" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">calls strcmp()</text>
<rect x="200" y="120" width="150" height="70" rx="7" fill="#111827" stroke="#263451"/>
<text x="275.0" y="150.5" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-weight="700">Dynamic linker</text>
<text x="275.0" y="167.5" text-anchor="middle" font-size="11" fill="#9fb0c8">first match wins</text>
<rect x="392" y="120" width="170" height="70" rx="7" fill="#111827" stroke="#ff2a6d"/>
<text x="477.0" y="150.5" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-weight="700">libhook.so</text>
<text x="477.0" y="167.5" text-anchor="middle" font-size="11" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">your strcmp: log it</text>
<rect x="604" y="120" width="168" height="70" rx="7" fill="#111827" stroke="#5fe3b0"/>
<text x="688.0" y="150.5" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-weight="700">libc.so</text>
<text x="688.0" y="167.5" text-anchor="middle" font-size="11" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">real strcmp</text>
<line x1="158" y1="155" x2="196" y2="155" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<line x1="350" y1="155" x2="388" y2="155" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<line x1="562" y1="155" x2="600" y2="155" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<text x="582" y="112" text-anchor="middle" font-size="11" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">dlsym(RTLD_NEXT)</text>
<text x="477" y="212" text-anchor="middle" font-size="11" fill="#fcee0a" font-family="'JetBrains Mono',monospace">listed first via LD_PRELOAD=./libhook.so</text>
<rect x="200" y="244" width="572" height="44" rx="7" fill="#111827" stroke="#263451" stroke-dasharray="5 4"/>
<text x="486.0" y="270.0" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-weight="700">ptrace: a different route, the tracer stops and edits a process from outside</text>
<text x="400" y="312" text-anchor="middle" font-size="11" fill="#6c7b93" font-family="'JetBrains Mono',monospace">Only PLT calls are caught; static or inlined calls pass straight through.</text>
</svg>
