<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="380" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">The x64dbg working loop</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">read statically, then confirm at runtime</text>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>
  <rect x="30" y="90" width="210" height="70" rx="7" fill="#111827" stroke="#00f0ff"/>
  <text x="135.0" y="120.5" text-anchor="middle" font-size="13" fill="#e3fffa" font-weight="700">1. Pick x32dbg/x64dbg</text>
  <text x="135.0" y="137.5" text-anchor="middle" font-size="11" fill="#9fb0c8">match the file bitness</text>
  <rect x="295" y="90" width="210" height="70" rx="7" fill="#111827" stroke="#fcee0a"/>
  <text x="400.0" y="120.5" text-anchor="middle" font-size="13" fill="#e3fffa" font-weight="700">2. Plant breakpoint</text>
  <text x="400.0" y="137.5" text-anchor="middle" font-size="11" fill="#9fb0c8">F2 software, hardware, memory</text>
  <rect x="560" y="90" width="210" height="70" rx="7" fill="#111827" stroke="#5fe3b0"/>
  <text x="665.0" y="120.5" text-anchor="middle" font-size="13" fill="#e3fffa" font-weight="700">3. Run</text>
  <text x="665.0" y="137.5" text-anchor="middle" font-size="11" fill="#9fb0c8">F9 until it stops</text>
  <rect x="30" y="200" width="210" height="70" rx="7" fill="#111827" stroke="#00f0ff"/>
  <text x="135.0" y="230.5" text-anchor="middle" font-size="13" fill="#e3fffa" font-weight="700">4. Inspect</text>
  <text x="135.0" y="247.5" text-anchor="middle" font-size="11" fill="#9fb0c8">registers, stack, dump</text>
  <rect x="295" y="200" width="210" height="70" rx="7" fill="#111827" stroke="#263451"/>
  <text x="400.0" y="230.5" text-anchor="middle" font-size="13" fill="#e3fffa" font-weight="700">5. Step</text>
  <text x="400.0" y="247.5" text-anchor="middle" font-size="11" fill="#9fb0c8">F7 into, F8 over, Ctrl+F9 out</text>
  <rect x="560" y="200" width="210" height="70" rx="7" fill="#111827" stroke="#ff2a6d"/>
  <text x="665.0" y="230.5" text-anchor="middle" font-size="13" fill="#e3fffa" font-weight="700">6. Patch or repeat</text>
  <text x="665.0" y="247.5" text-anchor="middle" font-size="11" fill="#9fb0c8">edit bytes, move breakpoint</text>
  <line x1="240" y1="125" x2="291" y2="125" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <line x1="505" y1="125" x2="556" y2="125" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <path d="M665,160 L665,180 L135,180 L135,196" fill="none" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <line x1="240" y1="235" x2="291" y2="235" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <line x1="505" y1="235" x2="556" y2="235" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <text x="400" y="362" text-anchor="middle" font-size="11" fill="#6c7b93">Static first to find the spot, then one breakpoint in the right place.</text>
</svg>
