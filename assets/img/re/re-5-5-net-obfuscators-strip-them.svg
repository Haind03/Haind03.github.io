<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 366" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="366" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Working through an obfuscated .NET file</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">a suggested order, one step at a time</text>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/></marker></defs>
  <rect x="28.0" y="88" width="221.3" height="88" rx="7" fill="#111827" stroke="#00f0ff"/>
  <text x="138.7" y="120.0" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-weight="700">1. Identify</text>
  <text x="138.7" y="136.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">protector</text>
  <text x="138.7" y="152.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">DIE or dnSpy</text>
  <rect x="289.3" y="88" width="221.3" height="88" rx="7" fill="#111827" stroke="#ff2a6d"/>
  <text x="400.0" y="120.0" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-weight="700">2. Automatic tool</text>
  <text x="400.0" y="136.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">de4dot, de4dot-cex</text>
  <text x="400.0" y="152.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">Reactor Slayer</text>
  <rect x="550.7" y="88" width="221.3" height="88" rx="7" fill="#111827" stroke="#5fe3b0"/>
  <text x="661.3" y="120.0" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-weight="700">3. Open cleaned</text>
  <text x="661.3" y="136.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">file</text>
  <text x="661.3" y="152.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">dnSpy / ILSpy</text>
  <rect x="550.7" y="224" width="221.3" height="88" rx="7" fill="#111827" stroke="#fcee0a" stroke-dasharray="6 4"/>
  <text x="661.3" y="256.0" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-weight="700">4. Strings still</text>
  <text x="661.3" y="272.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">encrypted?</text>
  <text x="661.3" y="288.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">trace Decrypt() live</text>
  <rect x="289.3" y="224" width="221.3" height="88" rx="7" fill="#111827" stroke="#fcee0a" stroke-dasharray="6 4"/>
  <text x="400.0" y="256.0" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-weight="700">5. Control flow</text>
  <text x="400.0" y="272.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">still messy?</text>
  <text x="400.0" y="288.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">read block by block</text>
  <rect x="28.0" y="224" width="221.3" height="88" rx="7" fill="#111827" stroke="#5fe3b0"/>
  <text x="138.7" y="256.0" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-weight="700">Readable</text>
  <text x="138.7" y="272.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">enough to</text>
  <text x="138.7" y="288.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">follow the logic</text>
  <path d="M249.3,132.0 L286.3,132.0" stroke="#6c7b93" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M510.7,132.0 L547.7,132.0" stroke="#6c7b93" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="669.3" y="204.0" font-size="10.5" fill="#6c7b93" font-family="'JetBrains Mono',monospace">leftovers</text>
  <path d="M661.3,176 L661.3,221" stroke="#6c7b93" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M550.7,268.0 L513.7,268.0" stroke="#6c7b93" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M289.3,268.0 L252.3,268.0" stroke="#6c7b93" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="400" y="346" text-anchor="middle" font-size="12" fill="#9fb0c8">Do not expect the original source back, only code you can follow</text>
