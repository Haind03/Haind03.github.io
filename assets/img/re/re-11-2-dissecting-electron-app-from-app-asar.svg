<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/></marker></defs>
  <rect x="0" y="0" width="800" height="320" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Inside an Electron app</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">plain JS in an archive, unless bytenode compiled it</text>
  <rect x="28" y="130" width="150" height="60" rx="7" fill="#111827" stroke="#00f0ff"/>
  <text x="103.0" y="155.5" text-anchor="middle" font-size="12.5" fill="#e3fffa">resources/</text>
  <text x="103.0" y="172.5" text-anchor="middle" font-size="10.5" fill="#9fb0c8">app.asar</text>
  <rect x="230" y="130" width="160" height="60" rx="7" fill="#111827" stroke="#5fe3b0"/>
  <text x="310.0" y="155.5" text-anchor="middle" font-size="12.5" fill="#e3fffa">asar extract</text>
  <text x="310.0" y="172.5" text-anchor="middle" font-size="10.5" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">app_extracted/</text>
  <line x1="180" y1="160" x2="226" y2="160" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <rect x="442" y="130" width="160" height="60" rx="7" fill="#111827" stroke="#fcee0a"/>
  <text x="522.0" y="155.5" text-anchor="middle" font-size="12.5" fill="#e3fffa">Entry point</text>
  <text x="522.0" y="172.5" text-anchor="middle" font-size="10.5" fill="#9fb0c8">package.json "main"</text>
  <line x1="392" y1="160" x2="438" y2="160" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <rect x="630" y="130" width="142" height="60" rx="7" fill="#111827" stroke="#263451"/>
  <text x="701.0" y="155.5" text-anchor="middle" font-size="12.5" fill="#e3fffa">Edit JS</text>
  <text x="701.0" y="172.5" text-anchor="middle" font-size="10.5" fill="#9fb0c8">asar pack</text>
  <line x1="604" y1="160" x2="626" y2="160" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <rect x="230" y="236" width="300" height="56" rx="7" fill="#111827" stroke="#ff2a6d" stroke-dasharray="5 4"/>
  <text x="380.0" y="259.5" text-anchor="middle" font-size="12.5" fill="#e3fffa">.jsc file? (bytenode V8 bytecode)</text>
  <text x="380.0" y="276.5" text-anchor="middle" font-size="10.5" fill="#9fb0c8">strings, then runtime dump</text>
  <polyline points="310,192 310,234" fill="none" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <text x="650" y="268" text-anchor="middle" font-size="11" fill="#6c7b93">version-locked to Node/V8</text>
