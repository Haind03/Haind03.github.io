<text x="150.0" y="230.9" text-anchor="middle" font-size="11" fill="#9fb0c8">.text  R-X</text>
<text x="150.0" y="248.4" text-anchor="middle" font-size="11" fill="#9fb0c8">.rodata  R--</text>
<text x="150.0" y="265.9" text-anchor="middle" font-size="11" fill="#9fb0c8">.data / .bss  RW-</text>
