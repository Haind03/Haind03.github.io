<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="320" rx="12" fill="#0d121d" stroke="#263451"/>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">pycdc and pycdas on a .pyc file</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">pycdc rebuilds source; pycdas always dumps bytecode</text>
  <rect x="40" y="130" width="130" height="60" rx="7" fill="#111827" stroke="#263451"/>
  <text x="105.0" y="155.5" text-anchor="middle" font-size="12.5" fill="#e3fffa">.pyc file</text>
  <text x="105.0" y="172.5" text-anchor="middle" font-size="11.0" fill="#6c7b93">check magic number</text>
  <rect x="250" y="130" width="130" height="60" rx="7" fill="#111827" stroke="#00f0ff"/>
  <text x="315.0" y="155.5" text-anchor="middle" font-size="12.5" fill="#e3fffa">pycdc</text>
  <text x="315.0" y="172.5" text-anchor="middle" font-size="11.0" fill="#6c7b93">rebuild the source</text>
  <rect x="520" y="84" width="240" height="56" rx="7" fill="#111827" stroke="#5fe3b0"/>
  <text x="640.0" y="107.5" text-anchor="middle" font-size="12.5" fill="#e3fffa">Readable Python source</text>
  <text x="640.0" y="124.5" text-anchor="middle" font-size="11.0" fill="#6c7b93">clean, supported version</text>
  <rect x="520" y="170" width="240" height="60" rx="7" fill="#0b1518" stroke="#ff2a6d" stroke-dasharray="5 4"/>
  <text x="640.0" y="195.5" text-anchor="middle" font-size="12.5" fill="#e3fffa">Unsupported opcode</text>
  <text x="640.0" y="212.5" text-anchor="middle" font-size="11.0" fill="#6c7b93">Decompyle incomplete</text>
  <line x1="173" y1="160" x2="246" y2="160" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <line x1="383" y1="145" x2="516" y2="118" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <line x1="383" y1="175" x2="516" y2="198" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <rect x="520" y="254" width="240" height="48" rx="7" fill="#111827" stroke="#fcee0a"/>
  <text x="640.0" y="273.5" text-anchor="middle" font-size="12.5" fill="#e3fffa">pycdas</text>
  <text x="640.0" y="290.5" text-anchor="middle" font-size="12.5" fill="#e3fffa">readable bytecode listing</text>
  <line x1="640" y1="232" x2="640" y2="250" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <text x="450" y="110" text-anchor="middle" font-size="11" fill="#5fe3b0">works</text>
  <text x="450" y="206" text-anchor="middle" font-size="11" fill="#ff2a6d">gives up</text>
  <text x="270" y="262" text-anchor="middle" font-size="11" fill="#6c7b93">Never trust output after a warning:</text>
  <text x="270" y="280" text-anchor="middle" font-size="11" fill="#6c7b93">read the bytecode instead.</text>
</svg>
