<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/></marker></defs>
  <rect x="0" y="0" width="800" height="330" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">VB6: two worlds inside one exe</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">the compile mode decides which tool you reach for</text>
  <rect x="28" y="150" width="130" height="56" rx="7" fill="#111827" stroke="#00f0ff"/>
  <text x="93.0" y="173.5" text-anchor="middle" font-size="12.5" fill="#e3fffa">VB6 .exe</text>
  <text x="93.0" y="190.5" text-anchor="middle" font-size="10.5" fill="#9fb0c8">msvbvm60.dll import</text>
  <rect x="220" y="150" width="170" height="56" rx="7" fill="#111827" stroke="#fcee0a"/>
  <text x="305.0" y="173.5" text-anchor="middle" font-size="12.5" fill="#e3fffa">Which mode?</text>
  <text x="305.0" y="190.5" text-anchor="middle" font-size="10.5" fill="#9fb0c8">DIE / VB Decompiler</text>
  <line x1="160" y1="178" x2="216" y2="178" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <rect x="470" y="92" width="302" height="70" rx="7" fill="#111827" stroke="#ff2a6d"/>
  <text x="621.0" y="114.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">P-Code</text>
  <text x="621.0" y="131.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">bytecode run by msvbvm60 VM</text>
  <text x="621.0" y="148.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">little real x86 in IDA</text>
  <rect x="470" y="194" width="302" height="70" rx="7" fill="#111827" stroke="#5fe3b0"/>
  <text x="621.0" y="216.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">Native</text>
  <text x="621.0" y="233.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">real x86 plus __vba* calls</text>
  <text x="621.0" y="250.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">cluttered, readable in IDA</text>
  <polyline points="392,178 430,178 430,127 466,127" fill="none" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <polyline points="392,178 430,178 430,229 466,229" fill="none" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <rect x="470" y="276" width="302" height="30" rx="7" fill="#111827" stroke="#263451" stroke-dasharray="5 4"/>
  <text x="621.0" y="295.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">VB Decompiler: near-source for P-Code</text>
</svg>
