<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/></marker></defs>
  <rect x="0" y="0" width="800" height="380" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">What an anti-VM sample checks before it runs</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">if any check says VM, it quietly does nothing</text>
  <rect x="20" y="160" width="120" height="56" rx="7" fill="#111827" stroke="#00f0ff"/>
  <text x="80.0" y="184.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">Sample</text>
  <text x="80.0" y="200.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">starts</text>
  <rect x="190" y="84" width="310" height="248" rx="7" fill="#0b1518" stroke="#263451" stroke-dasharray="5 4"/>
  <text x="345.0" y="212.0" text-anchor="middle" font-size="12.5" fill="#e3fffa"></text>
  <rect x="206" y="96" width="278" height="48" rx="7" fill="#111827" stroke="#00f0ff"/>
  <text x="345.0" y="116.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">CPUID</text>
  <text x="345.0" y="132.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">hypervisor bit, vendor string</text>
  <rect x="206" y="154" width="278" height="48" rx="7" fill="#111827" stroke="#fcee0a"/>
  <text x="345.0" y="174.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">Artifacts</text>
  <text x="345.0" y="190.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">registry keys, files, drivers</text>
  <rect x="206" y="212" width="278" height="48" rx="7" fill="#111827" stroke="#ff2a6d"/>
  <text x="345.0" y="232.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">Hardware</text>
  <text x="345.0" y="248.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">MAC prefix, small disk, few cores</text>
  <rect x="206" y="270" width="278" height="48" rx="7" fill="#111827" stroke="#5fe3b0"/>
  <text x="345.0" y="290.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">Sandbox signs</text>
  <text x="345.0" y="306.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">short uptime, no mouse, no files</text>
  <line x1="140" y1="188" x2="186" y2="188" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <rect x="570" y="100" width="210" height="70" rx="7" fill="#111827" stroke="#ff2a6d"/>
  <text x="675.0" y="131.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">VM or sandbox seen</text>
  <text x="675.0" y="147.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">exit, do nothing</text>
  <rect x="570" y="246" width="210" height="70" rx="7" fill="#111827" stroke="#5fe3b0"/>
  <text x="675.0" y="277.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">Looks like a real host</text>
  <text x="675.0" y="293.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">run the payload</text>
  <line x1="500" y1="190" x2="566" y2="145" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <line x1="500" y1="230" x2="566" y2="275" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <text x="400" y="358" text-anchor="middle" font-size="11" fill="#6c7b93">Counter: make the VM look real (hide the hypervisor bit, change MAC, add files and uptime).</text>
</svg>
