<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/></marker></defs>
  <rect x="0" y="0" width="800" height="380" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Two ways to detect a debugger without asking</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">time stretches when you single-step, exceptions get swallowed</text>
  <text x="30" y="92" text-anchor="start" font-size="12" fill="#00f0ff" font-family="'JetBrains Mono',monospace">TIMING</text>
  <rect x="30" y="106" width="150" height="54" rx="7" fill="#111827" stroke="#00f0ff"/>
  <text x="105.0" y="129.0" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-family="'JetBrains Mono',monospace">rdtsc</text>
  <text x="105.0" y="145.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">read counter</text>
  <rect x="225" y="106" width="150" height="54" rx="7" fill="#111827" stroke="#263451"/>
  <text x="300.0" y="129.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">Code under test</text>
  <text x="300.0" y="145.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">few hundred cycles</text>
  <rect x="420" y="106" width="150" height="54" rx="7" fill="#111827" stroke="#00f0ff"/>
  <text x="495.0" y="129.0" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-family="'JetBrains Mono',monospace">rdtsc</text>
  <text x="495.0" y="145.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">read counter again</text>
  <rect x="615" y="106" width="165" height="54" rx="7" fill="#111827" stroke="#ff2a6d"/>
  <text x="697.5" y="129.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">Delta too large</text>
  <text x="697.5" y="145.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">you are stepping</text>
  <line x1="180" y1="133" x2="221" y2="133" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <line x1="375" y1="133" x2="416" y2="133" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <line x1="570" y1="133" x2="611" y2="133" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <text x="30" y="208" text-anchor="start" font-size="12" fill="#fcee0a" font-family="'JetBrains Mono',monospace">TRAPS</text>
  <rect x="30" y="222" width="170" height="66" rx="7" fill="#111827" stroke="#fcee0a"/>
  <text x="115.0" y="243.0" text-anchor="middle" font-size="12" fill="#e3fffa" font-family="'JetBrains Mono',monospace">Raise exception</text>
  <text x="115.0" y="259.0" text-anchor="middle" font-size="10" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">INT 3, INT 2D, ICEBP</text>
  <text x="115.0" y="275.0" text-anchor="middle" font-size="10" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">trap flag</text>
  <rect x="260" y="222" width="160" height="66" rx="7" fill="#111827" stroke="#263451"/>
  <text x="340.0" y="243.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">Who handles it?</text>
  <text x="340.0" y="259.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">program SEH handler</text>
  <text x="340.0" y="275.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">or the debugger</text>
  <rect x="490" y="208" width="290" height="40" rx="7" fill="#111827" stroke="#5fe3b0"/>
  <text x="635.0" y="232.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">Handler runs: no debugger</text>
  <rect x="490" y="262" width="290" height="40" rx="7" fill="#111827" stroke="#ff2a6d"/>
  <text x="635.0" y="286.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">Debugger swallowed it: detected</text>
  <line x1="200" y1="255" x2="256" y2="255" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <line x1="420" y1="247" x2="486" y2="229" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <line x1="420" y1="263" x2="486" y2="281" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <text x="400" y="350" text-anchor="middle" font-size="11" fill="#6c7b93">Also checked: DR0 to DR7 hardware breakpoints and the single-step trap flag.</text>
</svg>
