<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/></marker></defs>
  <rect x="0" y="0" width="800" height="320" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Objective-C: every call is a message</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">the selector in rsi/x1 tells you what is really called</text>
  <rect x="28" y="110" width="170" height="60" rx="7" fill="#111827" stroke="#00f0ff"/>
  <text x="113.0" y="135.5" text-anchor="middle" font-size="12.5" fill="#e3fffa">[obj method:arg]</text>
  <text x="113.0" y="152.5" text-anchor="middle" font-size="10.5" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">source code</text>
  <rect x="250" y="110" width="230" height="60" rx="7" fill="#111827" stroke="#ff2a6d"/>
  <text x="365.0" y="135.5" text-anchor="middle" font-size="12.5" fill="#e3fffa">objc_msgSend(obj, SEL, arg)</text>
  <text x="365.0" y="152.5" text-anchor="middle" font-size="10.5" fill="#9fb0c8">rdi/x0 = obj, rsi/x1 = SEL</text>
  <rect x="532" y="110" width="240" height="60" rx="7" fill="#111827" stroke="#263451"/>
  <text x="652.0" y="135.5" text-anchor="middle" font-size="12.5" fill="#e3fffa">Runtime lookup</text>
  <text x="652.0" y="152.5" text-anchor="middle" font-size="10.5" fill="#9fb0c8">class method list, then IMP</text>
  <line x1="200" y1="140" x2="246" y2="140" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <line x1="482" y1="140" x2="528" y2="140" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <rect x="28.0" y="226" width="208.0" height="56" rx="7" fill="#111827" stroke="#5fe3b0"/>
  <text x="132.0" y="249.5" text-anchor="middle" font-size="12.5" fill="#e3fffa">class-dump</text>
  <text x="132.0" y="266.5" text-anchor="middle" font-size="10.5" fill="#9fb0c8">interface from metadata</text>
  <line x1="238.0" y1="254.0" x2="293.0" y2="254.0" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <rect x="296.0" y="226" width="208.0" height="56" rx="7" fill="#111827" stroke="#fcee0a"/>
  <text x="400.0" y="249.5" text-anchor="middle" font-size="12.5" fill="#e3fffa">Jump to method</text>
  <text x="400.0" y="266.5" text-anchor="middle" font-size="10.5" fill="#9fb0c8">-[Class sel:]</text>
  <line x1="506.0" y1="254.0" x2="561.0" y2="254.0" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <rect x="564.0" y="226" width="208.0" height="56" rx="7" fill="#111827" stroke="#263451"/>
  <text x="668.0" y="249.5" text-anchor="middle" font-size="12.5" fill="#e3fffa">Read selectors</text>
  <text x="668.0" y="266.5" text-anchor="middle" font-size="10.5" fill="#9fb0c8">follow the message chain</text>
  <text x="400" y="304" text-anchor="middle" font-size="11" fill="#6c7b93">Metadata keeps the names, so most of the work is reading selectors.</text>
</svg>
