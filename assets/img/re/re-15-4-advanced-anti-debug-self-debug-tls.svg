<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/></marker></defs>
  <rect x="0" y="0" width="800" height="380" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Self-debugging and TLS callbacks</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">one blocks the attach, the other runs before you can</text>
  <text x="30" y="90" text-anchor="start" font-size="12" fill="#ff2a6d" font-family="'JetBrains Mono',monospace">SELF-DEBUG</text>
  <rect x="30" y="104" width="130" height="56" rx="7" fill="#111827" stroke="#00f0ff"/>
  <text x="95.0" y="128.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">Parent</text>
  <text x="95.0" y="144.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">your target</text>
  <rect x="280" y="104" width="130" height="56" rx="7" fill="#111827" stroke="#ff2a6d"/>
  <text x="345.0" y="128.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">Child</text>
  <text x="345.0" y="144.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">copy of itself</text>
  <line x1="160" y1="122" x2="276" y2="122" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <line x1="276" y1="144" x2="160" y2="144" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <text x="218" y="116" text-anchor="middle" font-size="10.5" fill="#6c7b93">CreateProcess</text>
  <text x="218" y="162" text-anchor="middle" font-size="10.5" fill="#6c7b93">DebugActiveProcess</text>
  <rect x="500" y="104" width="280" height="56" rx="7" fill="#111827" stroke="#ff2a6d" stroke-dasharray="5 4"/>
  <text x="640.0" y="128.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">Debugger slot already taken</text>
  <text x="640.0" y="144.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">x64dbg attach fails</text>
  <line x1="410" y1="132" x2="496" y2="132" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <text x="30" y="222" text-anchor="start" font-size="12" fill="#fcee0a" font-family="'JetBrains Mono',monospace">TLS CALLBACK</text>
  <rect x="30" y="236" width="160" height="56" rx="7" fill="#111827" stroke="#263451"/>
  <text x="110.0" y="260.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">Loader maps</text>
  <text x="110.0" y="276.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">the image</text>
  <rect x="260" y="236" width="200" height="56" rx="7" fill="#111827" stroke="#fcee0a"/>
  <text x="360.0" y="260.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">TLS callback</text>
  <text x="360.0" y="276.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">anti-debug runs here</text>
  <rect x="530" y="236" width="160" height="56" rx="7" fill="#111827" stroke="#263451"/>
  <text x="610.0" y="260.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">Entry point</text>
  <text x="610.0" y="276.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">main starts</text>
  <line x1="190" y1="264" x2="256" y2="264" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <line x1="460" y1="264" x2="526" y2="264" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <text x="360" y="322" text-anchor="middle" font-size="11" fill="#6c7b93">Debuggers usually stop at the entry point, which is after the callback already ran.</text>
  <text x="400" y="356" text-anchor="middle" font-size="11" fill="#6c7b93">Fix: break on CreateProcess, or set the debugger to stop at the TLS callback.</text>
</svg>
