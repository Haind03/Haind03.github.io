  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/></marker></defs>
  <rect x="28.0" y="88" width="100.7" height="88" rx="7" fill="#111827" stroke="#00f0ff"/>
  <text x="78.3" y="120.0" text-anchor="middle" font-size="11" fill="#e3fffa" font-weight="700">Open</text>
  <text x="78.3" y="136.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">assembly</text>
  <text x="78.3" y="152.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">drag in .dll</text>
  <rect x="156.7" y="88" width="100.7" height="88" rx="7" fill="#111827" stroke="#263451"/>
  <text x="207.0" y="120.0" text-anchor="middle" font-size="11" fill="#e3fffa" font-weight="700">Browse</text>
  <text x="207.0" y="136.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">tree</text>
  <text x="207.0" y="152.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">namespace, type</text>
  <rect x="285.3" y="88" width="100.7" height="88" rx="7" fill="#111827" stroke="#5fe3b0"/>
  <text x="335.7" y="120.0" text-anchor="middle" font-size="11" fill="#e3fffa" font-weight="700">C# view</text>
  <text x="335.7" y="136.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">decompiled</text>
  <text x="335.7" y="152.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">near original</text>
  <rect x="414.0" y="88" width="100.7" height="88" rx="7" fill="#111827" stroke="#5fe3b0"/>
