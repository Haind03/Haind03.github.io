  <text x="464.3" y="152.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">ldstr, call</text>
  <rect x="542.7" y="88" width="100.7" height="88" rx="7" fill="#111827" stroke="#ff2a6d"/>
  <text x="593.0" y="120.0" text-anchor="middle" font-size="11" fill="#e3fffa" font-weight="700">Search</text>
  <text x="593.0" y="136.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">Analyze</text>
  <text x="593.0" y="152.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">strings, xrefs</text>
  <rect x="671.3" y="88" width="100.7" height="88" rx="7" fill="#111827" stroke="#fcee0a"/>
  <text x="721.7" y="120.0" text-anchor="middle" font-size="11" fill="#e3fffa" font-weight="700">Export</text>
  <text x="721.7" y="136.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">project</text>
