  <path d="M257.3,132.0 L282.3,132.0" stroke="#6c7b93" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M386.0,132.0 L411.0,132.0" stroke="#6c7b93" stroke-width="2" fill="none" marker-end="url(#a)"/>
