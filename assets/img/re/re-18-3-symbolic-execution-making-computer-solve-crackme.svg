<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="350" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">angr workflow: from binary to the right input</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">point at the goal, let the solver find the input</text>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/></marker></defs>
  <rect x="32" y="100" width="126" height="60" rx="7" fill="#111827" stroke="#00f0ff"/>
  <text x="95" y="126" text-anchor="middle" font-size="12.5" fill="#e3fffa">Project</text>
  <text x="95" y="144" text-anchor="middle" font-size="10.5" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">load the binary</text>
  <rect x="184" y="100" width="126" height="60" rx="7" fill="#111827" stroke="#00f0ff"/>
  <text x="248" y="126" text-anchor="middle" font-size="12.5" fill="#e3fffa">Symbolic input</text>
  <text x="248" y="144" text-anchor="middle" font-size="10.5" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">BVS bytes in a State</text>
  <rect x="337" y="100" width="126" height="60" rx="7" fill="#111827" stroke="#fcee0a"/>
  <text x="400" y="126" text-anchor="middle" font-size="12.5" fill="#e3fffa">explore()</text>
  <text x="400" y="144" text-anchor="middle" font-size="10.5" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">simgr splits on branches</text>
  <rect x="489" y="100" width="126" height="60" rx="7" fill="#111827" stroke="#5fe3b0"/>
  <text x="552" y="126" text-anchor="middle" font-size="12.5" fill="#e3fffa">Found state</text>
  <text x="552" y="144" text-anchor="middle" font-size="10.5" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">stdout has Correct</text>
  <rect x="642" y="100" width="126" height="60" rx="7" fill="#111827" stroke="#5fe3b0"/>
  <text x="705" y="126" text-anchor="middle" font-size="12.5" fill="#e3fffa">solver.eval</text>
  <text x="705" y="144" text-anchor="middle" font-size="10.5" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">concrete serial</text>
  <rect x="32" y="200" width="355" height="60" rx="7" fill="#0b1518" stroke="#ff2a6d" stroke-dasharray="5 4"/>
  <text x="210" y="226" text-anchor="middle" font-size="12.5" fill="#e3fffa">Avoid state</text>
  <text x="210" y="244" text-anchor="middle" font-size="10.5" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">stdout has Nope, discarded</text>
  <rect x="413" y="200" width="355" height="60" rx="7" fill="#0b1518" stroke="#ff2a6d" stroke-dasharray="5 4"/>
  <text x="590" y="226" text-anchor="middle" font-size="12.5" fill="#e3fffa">Path explosion</text>
  <text x="590" y="244" text-anchor="middle" font-size="10.5" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">too many branches blows up</text>
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="160" y1="130" x2="181" y2="130"/>
    <line x1="313" y1="130" x2="334" y2="130"/>
    <line x1="465" y1="130" x2="486" y2="130"/>
    <line x1="618" y1="130" x2="639" y2="130"/>
    <line x1="389" y1="230" x2="410" y2="230"/>
  </g>
  <text x="400" y="332" text-anchor="middle" font-size="11" fill="#6c7b93">Each path collects constraints; the SMT solver turns the winning set into bytes.</text>
</svg>
