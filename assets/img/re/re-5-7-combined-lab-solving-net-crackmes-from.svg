<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 366" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="366" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Three .NET crackmes, rising difficulty</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">what you read, and what you do about it</text>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/></marker></defs>
  <rect x="28.0" y="88" width="221.3" height="88" rx="7" fill="#111827" stroke="#5fe3b0"/>
  <text x="138.7" y="120.0" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-weight="700">Level 1: read</text>
  <text x="138.7" y="136.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">input == "..."</text>
  <text x="138.7" y="152.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">ldstr holds the key</text>
  <rect x="289.3" y="88" width="221.3" height="88" rx="7" fill="#111827" stroke="#fcee0a"/>
  <text x="400.0" y="120.0" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-weight="700">Level 2: keygen</text>
  <text x="400.0" y="136.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">djb2 on username</text>
  <text x="400.0" y="152.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">acc*33 + c</text>
  <rect x="550.7" y="88" width="221.3" height="88" rx="7" fill="#111827" stroke="#ff2a6d"/>
  <text x="661.3" y="120.0" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-weight="700">Level 3: hidden</text>
  <text x="661.3" y="136.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">XOR 0x3C</text>
  <text x="661.3" y="152.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">against byte array</text>
  <rect x="28.0" y="224" width="221.3" height="88" rx="7" fill="#111827" stroke="#263451" stroke-dasharray="6 4"/>
  <text x="138.7" y="256.0" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-weight="700">Tools</text>
  <text x="138.7" y="272.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">ILSpy search</text>
  <text x="138.7" y="288.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">Analyze</text>
  <rect x="289.3" y="224" width="221.3" height="88" rx="7" fill="#111827" stroke="#263451" stroke-dasharray="6 4"/>
  <text x="400.0" y="256.0" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-weight="700">Tools</text>
  <text x="400.0" y="272.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">Python port</text>
  <text x="400.0" y="288.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">of the loop</text>
  <rect x="550.7" y="224" width="221.3" height="88" rx="7" fill="#111827" stroke="#263451" stroke-dasharray="6 4"/>
  <text x="661.3" y="256.0" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-weight="700">Tools</text>
  <text x="661.3" y="272.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">XOR back in</text>
  <text x="661.3" y="288.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">Python, or debugger</text>
  <path d="M249.3,132.0 L286.3,132.0" stroke="#6c7b93" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M510.7,132.0 L547.7,132.0" stroke="#6c7b93" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M138.7,176 L138.7,221" stroke="#6c7b93" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M400.0,176 L400.0,221" stroke="#6c7b93" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M661.3,176 L661.3,221" stroke="#6c7b93" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="400" y="346" text-anchor="middle" font-size="12" fill="#9fb0c8">Whatever the runtime can read, you can read too</text>
</svg>
