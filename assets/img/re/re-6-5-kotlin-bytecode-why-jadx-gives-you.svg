<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 366" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="366" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Kotlin coroutines in decompiled output</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">a suspend fun becomes a state machine</text>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/></marker></defs>
  <rect x="28.0" y="88" width="156.0" height="88" rx="7" fill="#111827" stroke="#00f0ff"/>
  <text x="106.0" y="120.0" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-weight="700">suspend fun</text>
  <text x="106.0" y="136.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">fetch()</text>
  <text x="106.0" y="152.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">linear source</text>
  <rect x="224.0" y="88" width="156.0" height="88" rx="7" fill="#111827" stroke="#5fe3b0"/>
  <text x="302.0" y="120.0" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-weight="700">case 0</text>
  <text x="302.0" y="136.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">getToken()</text>
  <text x="302.0" y="152.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">label = 1</text>
  <rect x="420.0" y="88" width="156.0" height="88" rx="7" fill="#111827" stroke="#5fe3b0"/>
  <text x="498.0" y="120.0" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-weight="700">case 1</text>
  <text x="498.0" y="136.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">download(token)</text>
  <text x="498.0" y="152.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">label = 2</text>
  <rect x="616.0" y="88" width="156.0" height="88" rx="7" fill="#111827" stroke="#5fe3b0"/>
  <text x="694.0" y="128.0" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-weight="700">case 2</text>
  <text x="694.0" y="144.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">return data</text>
  <rect x="224.0" y="224" width="156.0" height="88" rx="7" fill="#111827" stroke="#fcee0a" stroke-dasharray="6 4"/>
  <text x="302.0" y="256.0" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-weight="700">COROUTINE_</text>
  <text x="302.0" y="272.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">SUSPENDED</text>
  <text x="302.0" y="288.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">return early</text>
  <rect x="420.0" y="224" width="156.0" height="88" rx="7" fill="#111827" stroke="#fcee0a" stroke-dasharray="6 4"/>
  <text x="498.0" y="256.0" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-weight="700">Resume</text>
  <text x="498.0" y="272.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">re-enter</text>
  <text x="498.0" y="288.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">switch(label)</text>
  <path d="M184.0,132.0 L221.0,132.0" stroke="#6c7b93" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M380.0,132.0 L417.0,132.0" stroke="#6c7b93" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M576.0,132.0 L613.0,132.0" stroke="#6c7b93" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="310.0" y="204.0" font-size="10.5" fill="#6c7b93" font-family="'JetBrains Mono',monospace">suspends</text>
  <path d="M302.0,176 L302.0,221" stroke="#6c7b93" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M380.0,268.0 L417.0,268.0" stroke="#6c7b93" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="400" y="346" text-anchor="middle" font-size="12" fill="#9fb0c8">Read each case in increasing order; label is just the step number</text>
</svg>
