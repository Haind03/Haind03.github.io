<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="300" rx="12" fill="#0d121d" stroke="#263451"/>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">From PyInstaller exe to Python source</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">identify, extract, decompile</text>
  <rect x="30.0" y="110" width="124" height="80" rx="7" fill="#111827" stroke="#263451"/>
  <text x="92.0" y="145.5" text-anchor="middle" font-size="12" fill="#e3fffa">Windows exe</text>
  <text x="92.0" y="162.5" text-anchor="middle" font-size="10.5" fill="#6c7b93">only bootloader</text>
  <rect x="184.0" y="110" width="124" height="80" rx="7" fill="#111827" stroke="#00f0ff"/>
  <text x="246.0" y="145.5" text-anchor="middle" font-size="12" fill="#e3fffa">Identify</text>
  <text x="246.0" y="162.5" text-anchor="middle" font-size="10.5" fill="#6c7b93">_MEIPASS, pyi-</text>
  <rect x="338.0" y="110" width="124" height="80" rx="7" fill="#111827" stroke="#00f0ff"/>
  <text x="400.0" y="145.5" text-anchor="middle" font-size="12" fill="#e3fffa">pyinstxtractor</text>
  <text x="400.0" y="162.5" text-anchor="middle" font-size="10.5" fill="#6c7b93">unpack the archive</text>
  <rect x="492.0" y="110" width="124" height="80" rx="7" fill="#0b1518" stroke="#fcee0a" stroke-dasharray="5 4"/>
  <text x="554.0" y="145.5" text-anchor="middle" font-size="12" fill="#e3fffa">Fix header</text>
  <text x="554.0" y="162.5" text-anchor="middle" font-size="10.5" fill="#6c7b93">copy from struct.pyc</text>
  <rect x="646.0" y="110" width="124" height="80" rx="7" fill="#111827" stroke="#5fe3b0"/>
  <text x="708.0" y="145.5" text-anchor="middle" font-size="12" fill="#e3fffa">pycdc / pycdas</text>
  <text x="708.0" y="162.5" text-anchor="middle" font-size="10.5" fill="#6c7b93">entry point .pyc</text>
  <line x1="157.0" y1="150.0" x2="180.0" y2="150.0" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <line x1="311.0" y1="150.0" x2="334.0" y2="150.0" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <line x1="465.0" y1="150.0" x2="488.0" y2="150.0" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <line x1="619.0" y1="150.0" x2="642.0" y2="150.0" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <text x="400" y="236" text-anchor="middle" font-size="11.5" fill="#9fb0c8">Note the Python version printed by the extractor; the decompiler choice depends on it.</text>
  <text x="400" y="262" text-anchor="middle" font-size="11" fill="#6c7b93">The header patch is only needed when the entry .pyc lost its magic bytes.</text>
</svg>
