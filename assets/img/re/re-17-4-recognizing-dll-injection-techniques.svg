<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/></marker></defs>
<rect x="0" y="0" width="800" height="330" rx="12" fill="#0d121d" stroke="#263451"/>
<text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">The three-step frame behind DLL injection</text>
<text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">the techniques differ mostly in steps 2 and 3</text>
<rect x="28" y="100" width="150" height="70" rx="7" fill="#111827" stroke="#00f0ff"/>
<text x="103.0" y="130.5" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-weight="700">Injector</text>
<text x="103.0" y="147.5" text-anchor="middle" font-size="11" fill="#9fb0c8">sample</text>
<rect x="220" y="100" width="150" height="70" rx="7" fill="#111827" stroke="#fcee0a"/>
<text x="295.0" y="130.5" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-weight="700">1. Open</text>
<text x="295.0" y="147.5" text-anchor="middle" font-size="11" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">OpenProcess</text>
<rect x="412" y="100" width="170" height="70" rx="7" fill="#111827" stroke="#fcee0a"/>
<text x="497.0" y="122.0" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-weight="700">2. Place payload</text>
<text x="497.0" y="139.0" text-anchor="middle" font-size="11" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">VirtualAllocEx +</text>
<text x="497.0" y="156.0" text-anchor="middle" font-size="11" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">WriteProcessMemory</text>
<rect x="624" y="100" width="148" height="70" rx="7" fill="#111827" stroke="#ff2a6d"/>
<text x="698.0" y="130.5" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-weight="700">3. Execute</text>
<text x="698.0" y="147.5" text-anchor="middle" font-size="11" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">CreateRemoteThread</text>
<line x1="178" y1="135" x2="216" y2="135" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<line x1="370" y1="135" x2="408" y2="135" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<line x1="582" y1="135" x2="620" y2="135" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<rect x="412" y="222" width="360" height="64" rx="7" fill="#111827" stroke="#5fe3b0" stroke-dasharray="5 4"/>
<text x="592.0" y="249.5" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-weight="700">Target process loads the DLL</text>
<text x="592.0" y="266.5" text-anchor="middle" font-size="11" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">LoadLibrary runs DllMain</text>
<path d="M698,172 L698,218" fill="none" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<text x="28" y="222" text-anchor="start" font-size="11" fill="#9fb0c8">Other step 3 options:</text>
<text x="28" y="242" text-anchor="start" font-size="11" fill="#6c7b93" font-family="'JetBrains Mono',monospace">SetWindowsHookEx, APC, thread hijack</text>
<text x="28" y="262" text-anchor="start" font-size="11" fill="#6c7b93" font-family="'JetBrains Mono',monospace">Manual map / reflective: skip LoadLibrary</text>
</svg>
