<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/></marker></defs>
<rect x="0" y="0" width="800" height="300" rx="12" fill="#0d121d" stroke="#263451"/>
<text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">From source to executable</text>
<text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">four stages hide behind one gcc command</text>
<rect x="24" y="120" width="112" height="60" rx="7" fill="#111827" stroke="#00f0ff"/>
<text x="80.0" y="145.6" text-anchor="middle" font-size="12.5" fill="#e3fffa">hello.c</text>
<text x="80.0" y="163.1" text-anchor="middle" font-size="10.5" fill="#9fb0c8">source</text>
<line x1="136" y1="150" x2="174" y2="150" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<text x="155" y="108" text-anchor="middle" font-size="11" fill="#fcee0a" font-family="'JetBrains Mono',monospace">1</text>
<text x="155" y="206" text-anchor="middle" font-size="11" fill="#e3fffa">Preprocessor</text>
<rect x="178" y="120" width="112" height="60" rx="7" fill="#111827" stroke="#263451"/>
<text x="234.0" y="145.6" text-anchor="middle" font-size="12.5" fill="#e3fffa">hello.i</text>
<text x="234.0" y="163.1" text-anchor="middle" font-size="10.5" fill="#9fb0c8">macros expanded</text>
<line x1="290" y1="150" x2="328" y2="150" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<text x="309" y="108" text-anchor="middle" font-size="11" fill="#fcee0a" font-family="'JetBrains Mono',monospace">2</text>
<text x="309" y="222" text-anchor="middle" font-size="11" fill="#e3fffa">Compiler</text>
<rect x="332" y="120" width="112" height="60" rx="7" fill="#111827" stroke="#263451"/>
<text x="388.0" y="145.6" text-anchor="middle" font-size="12.5" fill="#e3fffa">hello.s</text>
<text x="388.0" y="163.1" text-anchor="middle" font-size="10.5" fill="#9fb0c8">assembly</text>
<line x1="444" y1="150" x2="482" y2="150" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<text x="463" y="108" text-anchor="middle" font-size="11" fill="#fcee0a" font-family="'JetBrains Mono',monospace">3</text>
<text x="463" y="206" text-anchor="middle" font-size="11" fill="#e3fffa">Assembler</text>
<rect x="486" y="120" width="112" height="60" rx="7" fill="#111827" stroke="#263451"/>
<text x="542.0" y="145.6" text-anchor="middle" font-size="12.5" fill="#e3fffa">hello.o</text>
<text x="542.0" y="163.1" text-anchor="middle" font-size="10.5" fill="#9fb0c8">machine code</text>
<line x1="598" y1="150" x2="636" y2="150" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<text x="617" y="108" text-anchor="middle" font-size="11" fill="#fcee0a" font-family="'JetBrains Mono',monospace">4</text>
<text x="617" y="222" text-anchor="middle" font-size="11" fill="#e3fffa">Linker</text>
<rect x="640" y="120" width="112" height="60" rx="7" fill="#111827" stroke="#5fe3b0"/>
<text x="696.0" y="145.6" text-anchor="middle" font-size="12.5" fill="#e3fffa">hello</text>
<text x="696.0" y="163.1" text-anchor="middle" font-size="10.5" fill="#9fb0c8">executable</text>
<text x="400" y="266" text-anchor="middle" font-size="11" fill="#6c7b93">The optimizer works inside stage 2, which is why the binary rarely looks like your source.</text>
</svg>
