<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="360" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#111">Why .NET decompiles almost back to source</text>

  <rect x="270" y="52" width="180" height="44" rx="8" fill="#eafaf0" stroke="#2e8b57"/>
  <text x="360" y="72" text-anchor="middle" font-size="13" font-weight="600" fill="#1d5e3a">Source C#</text>
  <text x="360" y="90" text-anchor="middle" font-size="10" fill="#555">written by the programmer</text>

  <path d="M360 96 L360 118" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
  <text x="430" y="112" font-size="10" fill="#666">csc compiles</text>

  <rect x="210" y="120" width="300" height="70" rx="8" fill="#e8f0fe" stroke="#4472c4"/>
  <text x="360" y="142" text-anchor="middle" font-size="13" font-weight="600" fill="#1a3a6b">Assembly (.exe / .dll, a PE)</text>
  <text x="360" y="162" text-anchor="middle" font-size="11" fill="#1a3a6b">IL bytecode  +  Metadata</text>
  <text x="360" y="180" text-anchor="middle" font-size="10" fill="#c0392b">Metadata keeps type/method/field names</text>

  <path d="M360 190 L360 212" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
  <text x="430" y="206" font-size="10" fill="#666">JIT at runtime</text>

  <rect x="270" y="214" width="180" height="40" rx="8" fill="#fdecea" stroke="#c0392b"/>
  <text x="360" y="239" text-anchor="middle" font-size="12" fill="#7b241c">Native code (CPU)</text>

  <!-- decompile back arrow -->
  <path d="M210 155 C90 155 90 74 268 74" fill="none" stroke="#2e8b57" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#g)"/>
  <text x="95" y="120" font-size="11" fill="#2e8b57">dnSpy / ILSpy</text>
  <text x="95" y="134" font-size="11" fill="#2e8b57">decompile back</text>

  <text x="360" y="292" text-anchor="middle" font-size="13" fill="#333">A decompiler just reads IL + metadata to rebuild near-original C#.</text>
  <text x="360" y="316" text-anchor="middle" font-size="12" fill="#c0392b">The real barrier is not IL but obfuscation (see Lesson 5.5).</text>
  <text x="360" y="340" text-anchor="middle" font-size="11" fill="#888">Unlike native C/C++, where variable names are gone.</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#888"/></marker>
    <marker id="g" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#2e8b57"/></marker>
  </defs>
</svg>
