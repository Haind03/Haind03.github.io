<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="640" height="300" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="320" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#111">Little-endian: multi-byte values stored reversed</text>

  <text x="320" y="64" text-anchor="middle" font-size="15" fill="#333">32-bit value: <tspan font-family="Consolas, monospace" font-weight="700" fill="#1a3a6b">0x12345678</tspan></text>

  <!-- value bytes -->
  <g font-family="Consolas, monospace" font-size="15">
    <rect x="200" y="84" width="60" height="40" fill="#e8f0fe" stroke="#4472c4"/><text x="230" y="110" text-anchor="middle" fill="#1a3a6b">12</text>
    <rect x="260" y="84" width="60" height="40" fill="#e8f0fe" stroke="#4472c4"/><text x="290" y="110" text-anchor="middle" fill="#1a3a6b">34</text>
    <rect x="320" y="84" width="60" height="40" fill="#e8f0fe" stroke="#4472c4"/><text x="350" y="110" text-anchor="middle" fill="#1a3a6b">56</text>
    <rect x="380" y="84" width="60" height="40" fill="#e8f0fe" stroke="#4472c4"/><text x="410" y="110" text-anchor="middle" fill="#1a3a6b">78</text>
  </g>
  <text x="230" y="140" text-anchor="middle" font-size="10" fill="#888">most significant</text>
  <text x="410" y="140" text-anchor="middle" font-size="10" fill="#888">least significant</text>

  <path d="M320 150 L320 176" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
  <text x="335" y="168" font-size="12" fill="#666">stored in memory</text>

  <!-- memory bytes reversed -->
  <text x="60" y="205" font-size="12" fill="#888">address:</text>
  <g font-family="Consolas, monospace" font-size="15">
    <text x="230" y="186" text-anchor="middle" font-size="10" fill="#888">+0</text>
    <text x="290" y="186" text-anchor="middle" font-size="10" fill="#888">+1</text>
    <text x="350" y="186" text-anchor="middle" font-size="10" fill="#888">+2</text>
    <text x="410" y="186" text-anchor="middle" font-size="10" fill="#888">+3</text>
    <rect x="200" y="190" width="60" height="40" fill="#fff7e6" stroke="#d99a00"/><text x="230" y="216" text-anchor="middle" fill="#8a6100">78</text>
    <rect x="260" y="190" width="60" height="40" fill="#fff7e6" stroke="#d99a00"/><text x="290" y="216" text-anchor="middle" fill="#8a6100">56</text>
    <rect x="320" y="190" width="60" height="40" fill="#fff7e6" stroke="#d99a00"/><text x="350" y="216" text-anchor="middle" fill="#8a6100">34</text>
    <rect x="380" y="190" width="60" height="40" fill="#fff7e6" stroke="#d99a00"/><text x="410" y="216" text-anchor="middle" fill="#8a6100">12</text>
  </g>

  <text x="320" y="262" text-anchor="middle" font-size="13" fill="#c0392b" font-weight="600">In a hex editor you see: 78 56 34 12</text>
  <text x="320" y="284" text-anchor="middle" font-size="12" fill="#555">To get the real value, read the bytes in reverse.</text>

  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#888"/></marker></defs>
</svg>
