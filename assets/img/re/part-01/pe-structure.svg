<svg xmlns="http://www.w3.org/2000/svg" width="620" height="470" viewBox="0 0 620 470" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="620" height="470" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="310" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#111">PE file structure (Portable Executable)</text>

  <g font-size="13">
    <rect x="150" y="50" width="320" height="38" fill="#fdecea" stroke="#c0392b"/>
    <text x="310" y="70" text-anchor="middle" font-weight="600" fill="#7b241c">DOS header (MZ) + DOS stub</text>
    <text x="310" y="84" text-anchor="middle" font-size="10" fill="#777">first 2 bytes: 4D 5A = "MZ"</text>

    <rect x="150" y="90" width="320" height="34" fill="#fff7e6" stroke="#d99a00"/>
    <text x="310" y="112" text-anchor="middle" fill="#8a6100">PE signature (50 45 00 00)</text>

    <rect x="150" y="126" width="320" height="34" fill="#e8f0fe" stroke="#4472c4"/>
    <text x="310" y="148" text-anchor="middle" fill="#1a3a6b">File header (machine, section count)</text>

    <rect x="150" y="162" width="320" height="50" fill="#e8f0fe" stroke="#4472c4"/>
    <text x="310" y="182" text-anchor="middle" fill="#1a3a6b">Optional header</text>
    <text x="310" y="200" text-anchor="middle" font-size="10" fill="#777">AddressOfEntryPoint, ImageBase, Data Directories</text>

    <rect x="150" y="214" width="320" height="34" fill="#eef6ff" stroke="#4472c4"/>
    <text x="310" y="236" text-anchor="middle" fill="#1a3a6b">Section table (describes each section)</text>

    <rect x="150" y="256" width="320" height="34" fill="#eafaf0" stroke="#2e8b57"/>
    <text x="310" y="278" text-anchor="middle" fill="#1d5e3a">.text  (code)</text>

    <rect x="150" y="292" width="320" height="34" fill="#eafaf0" stroke="#2e8b57"/>
    <text x="310" y="314" text-anchor="middle" fill="#1d5e3a">.rdata  (strings, constants, IAT)</text>

    <rect x="150" y="328" width="320" height="34" fill="#eafaf0" stroke="#2e8b57"/>
    <text x="310" y="350" text-anchor="middle" fill="#1d5e3a">.data  (global variables)</text>

    <rect x="150" y="364" width="320" height="34" fill="#eafaf0" stroke="#2e8b57"/>
    <text x="310" y="386" text-anchor="middle" fill="#1d5e3a">.rsrc / .reloc / .tls ...</text>
  </g>

  <text x="135" y="60" text-anchor="end" font-size="11" fill="#888">headers</text>
  <path d="M130 56 L130 244" stroke="#bbb" stroke-width="2"/>
  <text x="135" y="280" text-anchor="end" font-size="11" fill="#888">sections</text>
  <path d="M130 256 L130 396" stroke="#bbb" stroke-width="2"/>

  <text x="310" y="424" text-anchor="middle" font-size="12" fill="#333">RVA (offset once loaded in memory) differs from file offset (position on disk).</text>
  <text x="310" y="446" text-anchor="middle" font-size="11" fill="#888">View with PE-bear / CFF Explorer / Detect It Easy</text>
</svg>
