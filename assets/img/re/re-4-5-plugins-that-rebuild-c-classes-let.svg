  <text x="106.0" y="144.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">with RTTI</text>
  <rect x="224.0" y="88" width="156.0" height="88" rx="7" fill="#111827" stroke="#ff2a6d"/>
