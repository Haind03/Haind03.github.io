  <rect x="420.0" y="88" width="156.0" height="88" rx="7" fill="#111827" stroke="#ff2a6d"/>
  <text x="498.0" y="128.0" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-weight="700">Make types</text>
  <text x="498.0" y="144.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">HexRaysPyTools</text>
  <rect x="616.0" y="88" width="156.0" height="88" rx="7" fill="#111827" stroke="#ff2a6d"/>
  <text x="694.0" y="120.0" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-weight="700">Name calls</text>
  <text x="694.0" y="136.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">Virtuailor</text>
  <text x="694.0" y="152.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">call Dog::speak</text>
  <rect x="28.0" y="224" width="156.0" height="88" rx="7" fill="#111827" stroke="#fcee0a" stroke-dasharray="6 4"/>
