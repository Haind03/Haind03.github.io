  <text x="106.0" y="280.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">packed</text>
  <rect x="224.0" y="224" width="156.0" height="88" rx="7" fill="#111827" stroke="#fcee0a" stroke-dasharray="6 4"/>
  <text x="302.0" y="264.0" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-weight="700">Unpack first</text>
  <text x="302.0" y="280.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">(Part 14)</text>
  <rect x="420.0" y="224" width="156.0" height="88" rx="7" fill="#111827" stroke="#fcee0a" stroke-dasharray="6 4"/>
  <text x="498.0" y="264.0" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-weight="700">OOAnalyzer</text>
  <text x="498.0" y="280.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">infers classes</text>
  <rect x="616.0" y="224" width="156.0" height="88" rx="7" fill="#111827" stroke="#fcee0a" stroke-dasharray="6 4"/>
  <text x="694.0" y="264.0" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-weight="700">By hand</text>
  <text x="694.0" y="280.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">like lesson 4.2</text>
