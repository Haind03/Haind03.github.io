<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="380" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Solving a first C crackme</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">triage, static to the check, dynamic to confirm</text>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>
  <rect x="30" y="90" width="210" height="70" rx="7" fill="#111827" stroke="#00f0ff"/>
  <text x="135.0" y="120.5" text-anchor="middle" font-size="13" fill="#e3fffa" font-weight="700">1. Triage</text>
  <text x="135.0" y="137.5" text-anchor="middle" font-size="11" fill="#9fb0c8">DIE: not packed</text>
  <rect x="295" y="90" width="210" height="70" rx="7" fill="#111827" stroke="#5fe3b0"/>
  <text x="400.0" y="120.5" text-anchor="middle" font-size="13" fill="#e3fffa" font-weight="700">2. strings</text>
  <text x="400.0" y="137.5" text-anchor="middle" font-size="11" fill="#9fb0c8">find Correct / Wrong</text>
  <rect x="560" y="90" width="210" height="70" rx="7" fill="#111827" stroke="#fcee0a"/>
  <text x="665.0" y="120.5" text-anchor="middle" font-size="13" fill="#e3fffa" font-weight="700">3. xref to check</text>
  <text x="665.0" y="137.5" text-anchor="middle" font-size="11" fill="#9fb0c8">locate the compare function</text>
  <rect x="30" y="200" width="210" height="70" rx="7" fill="#111827" stroke="#263451"/>
  <text x="135.0" y="230.5" text-anchor="middle" font-size="13" fill="#e3fffa" font-weight="700">4. Pull expected data</text>
  <text x="135.0" y="247.5" text-anchor="middle" font-size="11" fill="#9fb0c8">read the array in the check</text>
  <rect x="295" y="200" width="210" height="70" rx="7" fill="#111827" stroke="#00f0ff"/>
  <text x="400.0" y="230.5" text-anchor="middle" font-size="13" fill="#e3fffa" font-weight="700">5. Confirm dynamically</text>
  <text x="400.0" y="247.5" text-anchor="middle" font-size="11" fill="#9fb0c8">one breakpoint, read memory</text>
  <rect x="560" y="200" width="210" height="70" rx="7" fill="#111827" stroke="#ff2a6d"/>
  <text x="665.0" y="230.5" text-anchor="middle" font-size="13" fill="#e3fffa" font-weight="700">6. Password</text>
  <text x="665.0" y="247.5" text-anchor="middle" font-size="11" fill="#9fb0c8">prints Correct!</text>
  <line x1="240" y1="125" x2="291" y2="125" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <line x1="505" y1="125" x2="556" y2="125" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <path d="M665,160 L665,180 L135,180 L135,196" fill="none" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <line x1="240" y1="235" x2="291" y2="235" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <line x1="505" y1="235" x2="556" y2="235" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <text x="400" y="362" text-anchor="middle" font-size="11" fill="#6c7b93">Read statically up to the suspicious spot, then place a single breakpoint.</text>
</svg>
