<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/></marker></defs>
<rect x="0" y="0" width="800" height="340" rx="12" fill="#0d121d" stroke="#263451"/>
<text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">From check function to valid input</text>
<text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">simple transforms get inverted, tangled constraints go to Z3</text>
<rect x="28" y="150" width="140" height="60" rx="7" fill="#111827" stroke="#00f0ff"/>
<text x="98.0" y="175.5" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-weight="700">Read the check</text>
<text x="98.0" y="192.5" text-anchor="middle" font-size="11" fill="#9fb0c8">in the disassembler</text>
<rect x="210" y="150" width="150" height="60" rx="7" fill="#111827" stroke="#fcee0a"/>
<text x="285.0" y="175.5" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-weight="700">Is it an invertible</text>
<text x="285.0" y="192.5" text-anchor="middle" font-size="11" fill="#9fb0c8">transform?</text>
<rect x="420" y="86" width="170" height="60" rx="7" fill="#111827" stroke="#5fe3b0"/>
<text x="505.0" y="111.5" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-weight="700">Rewrite in Python</text>
<text x="505.0" y="128.5" text-anchor="middle" font-size="11" fill="#9fb0c8">invert or brute-force</text>
<rect x="420" y="214" width="170" height="60" rx="7" fill="#111827" stroke="#ff2a6d"/>
<text x="505.0" y="239.5" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-weight="700">Z3 solver</text>
<text x="505.0" y="256.5" text-anchor="middle" font-size="11" fill="#9fb0c8">vars + constraints</text>
<rect x="630" y="150" width="142" height="60" rx="7" fill="#111827" stroke="#5fe3b0"/>
<text x="701.0" y="175.5" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-weight="700">Valid input</text>
<text x="701.0" y="192.5" text-anchor="middle" font-size="11" fill="#9fb0c8">(the key)</text>
<line x1="168" y1="180" x2="206" y2="180" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<line x1="360" y1="165" x2="416" y2="128" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<line x1="360" y1="195" x2="416" y2="236" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<line x1="590" y1="116" x2="640" y2="150" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<line x1="590" y1="244" x2="640" y2="210" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<text x="388" y="132" text-anchor="middle" font-size="11" fill="#5fe3b0" font-family="'JetBrains Mono',monospace">yes</text>
<text x="388" y="238" text-anchor="middle" font-size="11" fill="#ff2a6d" font-family="'JetBrains Mono',monospace">no</text>
<text x="505" y="296" text-anchor="middle" font-size="11" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">s.check() then s.model() returns the solution</text>
</svg>
