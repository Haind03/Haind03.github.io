<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/></marker></defs>
<rect x="0" y="0" width="800" height="360" rx="12" fill="#0d121d" stroke="#263451"/>
<text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">IAT hook vs inline hook</text>
<text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">same goal, different place in memory</text>
<text x="28" y="92" text-anchor="start" font-size="12.5" fill="#00f0ff" font-family="'JetBrains Mono',monospace">IAT hook</text>
<rect x="28" y="102" width="160" height="56" rx="7" fill="#111827" stroke="#263451"/>
<text x="108.0" y="134.0" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-weight="700">call [IAT slot]</text>
<rect x="250" y="102" width="170" height="56" rx="7" fill="#111827" stroke="#ff2a6d"/>
<text x="335.0" y="125.5" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-weight="700">my_hook</text>
<text x="335.0" y="142.5" text-anchor="middle" font-size="11" fill="#9fb0c8">log / modify args</text>
<rect x="482" y="102" width="200" height="56" rx="7" fill="#111827" stroke="#5fe3b0"/>
<text x="582.0" y="125.5" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-weight="700">user32!MessageBoxW</text>
<text x="582.0" y="142.5" text-anchor="middle" font-size="11" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">real function</text>
<line x1="188" y1="130" x2="246" y2="130" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<line x1="420" y1="130" x2="478" y2="130" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<text x="400" y="180" text-anchor="middle" font-size="11" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">slot overwritten; misses GetProcAddress and internal calls</text>
<text x="28" y="222" text-anchor="start" font-size="12.5" fill="#fcee0a" font-family="'JetBrains Mono',monospace">Inline hook</text>
<rect x="28" y="232" width="120" height="56" rx="7" fill="#111827" stroke="#263451"/>
<text x="88.0" y="264.0" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-weight="700">call func</text>
<rect x="190" y="232" width="140" height="56" rx="7" fill="#111827" stroke="#fcee0a"/>
<text x="260.0" y="255.5" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-weight="700">func prologue</text>
<text x="260.0" y="272.5" text-anchor="middle" font-size="11" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">jmp my_hook</text>
<rect x="372" y="232" width="120" height="56" rx="7" fill="#111827" stroke="#ff2a6d"/>
<text x="432.0" y="264.0" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-weight="700">my_hook</text>
<rect x="534" y="232" width="238" height="56" rx="7" fill="#111827" stroke="#00f0ff"/>
<text x="653.0" y="255.5" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-weight="700">trampoline</text>
<text x="653.0" y="272.5" text-anchor="middle" font-size="11" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">saved bytes + jmp func+N</text>
<line x1="148" y1="260" x2="186" y2="260" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<line x1="330" y1="260" x2="368" y2="260" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<line x1="492" y1="260" x2="530" y2="260" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<text x="400" y="320" text-anchor="middle" font-size="11" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">catches every call path, but patches code bytes (EDRs look for this)</text>
</svg>
