<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/></marker></defs>
<rect x="0" y="0" width="800" height="400" rx="12" fill="#0d121d" stroke="#263451"/>
<text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Compiler templates, read in reverse</text>
<text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">what you see in the asm, and the C construct behind it</text>
<rect x="40" y="82" width="340" height="36" rx="7" fill="#111827" stroke="#00f0ff"/>
<text x="210.0" y="104.2" text-anchor="middle" font-size="12" fill="#e3fffa" font-family="'JetBrains Mono',monospace">cmp/test + jcc + jmp over block</text>
<line x1="384" y1="100" x2="450" y2="100" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<rect x="454" y="82" width="300" height="36" rx="7" fill="#111827" stroke="#00f0ff"/>
<text x="604.0" y="104.4" text-anchor="middle" font-size="12.5" fill="#e3fffa">if / else</text>
<rect x="40" y="130" width="340" height="36" rx="7" fill="#111827" stroke="#5fe3b0"/>
<text x="210.0" y="152.2" text-anchor="middle" font-size="12" fill="#e3fffa" font-family="'JetBrains Mono',monospace">jump back to an address above</text>
<line x1="384" y1="148" x2="450" y2="148" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<rect x="454" y="130" width="300" height="36" rx="7" fill="#111827" stroke="#5fe3b0"/>
<text x="604.0" y="152.4" text-anchor="middle" font-size="12.5" fill="#e3fffa">loop</text>
<rect x="40" y="178" width="340" height="36" rx="7" fill="#111827" stroke="#fcee0a"/>
<text x="210.0" y="200.2" text-anchor="middle" font-size="12" fill="#e3fffa" font-family="'JetBrains Mono',monospace">jmp [table + index*8]</text>
<line x1="384" y1="196" x2="450" y2="196" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<rect x="454" y="178" width="300" height="36" rx="7" fill="#111827" stroke="#fcee0a"/>
<text x="604.0" y="200.4" text-anchor="middle" font-size="12.5" fill="#e3fffa">switch with jump table</text>
<rect x="40" y="226" width="340" height="36" rx="7" fill="#111827" stroke="#00f0ff"/>
<text x="210.0" y="248.2" text-anchor="middle" font-size="12" fill="#e3fffa" font-family="'JetBrains Mono',monospace">[base + index*scale]</text>
<line x1="384" y1="244" x2="450" y2="244" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<rect x="454" y="226" width="300" height="36" rx="7" fill="#111827" stroke="#00f0ff"/>
<text x="604.0" y="248.4" text-anchor="middle" font-size="12.5" fill="#e3fffa">array access</text>
<rect x="40" y="274" width="340" height="36" rx="7" fill="#111827" stroke="#5fe3b0"/>
<text x="210.0" y="296.2" text-anchor="middle" font-size="12" fill="#e3fffa" font-family="'JetBrains Mono',monospace">[base + constant] repeated</text>
<line x1="384" y1="292" x2="450" y2="292" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<rect x="454" y="274" width="300" height="36" rx="7" fill="#111827" stroke="#5fe3b0"/>
<text x="604.0" y="296.4" text-anchor="middle" font-size="12.5" fill="#e3fffa">struct field offsets</text>
<rect x="40" y="322" width="340" height="36" rx="7" fill="#111827" stroke="#fcee0a"/>
<text x="210.0" y="344.2" text-anchor="middle" font-size="12" fill="#e3fffa" font-family="'JetBrains Mono',monospace">inc/dec, then compare</text>
<line x1="384" y1="340" x2="450" y2="340" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<rect x="454" y="322" width="300" height="36" rx="7" fill="#111827" stroke="#fcee0a"/>
<text x="604.0" y="344.4" text-anchor="middle" font-size="12.5" fill="#e3fffa">loop counter</text>
<text x="400" y="382" text-anchor="middle" font-size="11" fill="#6c7b93">Write small C programs, compile them, and check each template in Ghidra or IDA.</text>
</svg>
