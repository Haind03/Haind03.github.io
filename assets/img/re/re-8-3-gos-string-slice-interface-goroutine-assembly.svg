<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="330" rx="12" fill="#0d121d" stroke="#263451"/>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Go data types in memory</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">one cell is 8 bytes on x64</text>
  <text x="24" y="112" text-anchor="start" font-size="13" fill="#e3fffa" font-family="'JetBrains Mono',monospace">string</text>
  <text x="24" y="130" text-anchor="start" font-size="10.5" fill="#6c7b93">16 bytes, no 0 byte</text>
  <rect x="174" y="90" width="120" height="44" rx="7" fill="#111827" stroke="#00f0ff"/>
  <text x="234.0" y="116.0" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-family="'JetBrains Mono',monospace">data *byte</text>
  <rect x="294" y="90" width="120" height="44" rx="7" fill="#111827" stroke="#5fe3b0"/>
  <text x="354.0" y="116.0" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-family="'JetBrains Mono',monospace">len</text>
  <text x="430" y="116" text-anchor="start" font-size="11" fill="#9fb0c8">LEA ptr + small const = len</text>
  <text x="24" y="182" text-anchor="start" font-size="13" fill="#e3fffa" font-family="'JetBrains Mono',monospace">slice</text>
  <text x="24" y="200" text-anchor="start" font-size="10.5" fill="#6c7b93">24 bytes</text>
  <rect x="174" y="160" width="120" height="44" rx="7" fill="#111827" stroke="#00f0ff"/>
  <text x="234.0" y="186.0" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-family="'JetBrains Mono',monospace">data *T</text>
  <rect x="294" y="160" width="120" height="44" rx="7" fill="#111827" stroke="#5fe3b0"/>
  <text x="354.0" y="186.0" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-family="'JetBrains Mono',monospace">len</text>
  <rect x="414" y="160" width="120" height="44" rx="7" fill="#111827" stroke="#fcee0a"/>
  <text x="474.0" y="186.0" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-family="'JetBrains Mono',monospace">cap</text>
  <text x="550" y="186" text-anchor="start" font-size="11" fill="#9fb0c8">3 values travel together</text>
  <text x="24" y="252" text-anchor="start" font-size="13" fill="#e3fffa" font-family="'JetBrains Mono',monospace">interface</text>
  <text x="24" y="270" text-anchor="start" font-size="10.5" fill="#6c7b93">16 bytes</text>
  <rect x="174" y="230" width="120" height="44" rx="7" fill="#111827" stroke="#ff2a6d"/>
  <text x="234.0" y="256.0" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-family="'JetBrains Mono',monospace">tab *itab</text>
  <rect x="294" y="230" width="120" height="44" rx="7" fill="#111827" stroke="#00f0ff"/>
  <text x="354.0" y="256.0" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-family="'JetBrains Mono',monospace">data *T</text>
  <text x="430" y="256" text-anchor="start" font-size="11" fill="#9fb0c8">tab gives type + methods</text>
  <text x="400" y="308" text-anchor="middle" font-size="11" fill="#6c7b93">Literals are merged into one blob; follow the code that loads pointer and length.</text>
</svg>
