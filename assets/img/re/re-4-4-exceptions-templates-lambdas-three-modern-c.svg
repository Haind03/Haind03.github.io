<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="400" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Three compiler tricks that clutter the decompiler</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">recognize, label, then focus on the real logic</text>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>
  <text x="135" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#00f0ff">Template</text>
  <rect x="30" y="108" width="210" height="52" rx="7" fill="#111827" stroke="#00f0ff"/>
  <text x="135.0" y="129.5" text-anchor="middle" font-size="13" fill="#e3fffa" font-weight="700">Source</text>
  <text x="135.0" y="146.5" text-anchor="middle" font-size="11" fill="#9fb0c8">one add_one&lt;T&gt;</text>
  <line x1="135" y1="160" x2="135" y2="190" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <rect x="30" y="192" width="210" height="52" rx="7" fill="#111827" stroke="#00f0ff"/>
  <text x="135.0" y="213.5" text-anchor="middle" font-size="13" fill="#e3fffa" font-weight="700">add_one&lt;int&gt;</text>
  <text x="135.0" y="230.5" text-anchor="middle" font-size="11" fill="#9fb0c8">own function</text>
  <line x1="135" y1="244" x2="135" y2="274" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <rect x="30" y="276" width="210" height="52" rx="7" fill="#111827" stroke="#00f0ff"/>
  <text x="135.0" y="297.5" text-anchor="middle" font-size="13" fill="#e3fffa" font-weight="700">add_one&lt;double&gt;</text>
  <text x="135.0" y="314.5" text-anchor="middle" font-size="11" fill="#9fb0c8">own function</text>
  <text x="385" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#fcee0a">Lambda</text>
  <rect x="280" y="108" width="210" height="52" rx="7" fill="#111827" stroke="#fcee0a"/>
  <text x="385.0" y="129.5" text-anchor="middle" font-size="13" fill="#e3fffa" font-weight="700">Source</text>
  <text x="385.0" y="146.5" text-anchor="middle" font-size="11" fill="#9fb0c8">[x](int a){...}</text>
  <line x1="385" y1="160" x2="385" y2="190" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <rect x="280" y="192" width="210" height="52" rx="7" fill="#111827" stroke="#fcee0a"/>
  <text x="385.0" y="213.5" text-anchor="middle" font-size="13" fill="#e3fffa" font-weight="700">Hidden class</text>
  <text x="385.0" y="230.5" text-anchor="middle" font-size="11" fill="#9fb0c8">capture fields</text>
  <line x1="385" y1="244" x2="385" y2="274" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <rect x="280" y="276" width="210" height="52" rx="7" fill="#111827" stroke="#fcee0a"/>
  <text x="385.0" y="297.5" text-anchor="middle" font-size="13" fill="#e3fffa" font-weight="700">operator()</text>
  <text x="385.0" y="314.5" text-anchor="middle" font-size="11" fill="#9fb0c8">the lambda body</text>
  <text x="635" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#ff2a6d">Exception</text>
  <rect x="530" y="108" width="210" height="52" rx="7" fill="#111827" stroke="#ff2a6d"/>
  <text x="635.0" y="129.5" text-anchor="middle" font-size="13" fill="#e3fffa" font-weight="700">try body</text>
  <text x="635.0" y="146.5" text-anchor="middle" font-size="11" fill="#9fb0c8">happy path</text>
  <line x1="635" y1="160" x2="635" y2="190" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <rect x="530" y="192" width="210" height="52" rx="7" fill="#111827" stroke="#ff2a6d"/>
  <text x="635.0" y="213.5" text-anchor="middle" font-size="13" fill="#e3fffa" font-weight="700">__cxa_throw</text>
  <text x="635.0" y="230.5" text-anchor="middle" font-size="11" fill="#9fb0c8">or _CxxThrowException</text>
  <line x1="635" y1="244" x2="635" y2="274" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <rect x="530" y="276" width="210" height="52" rx="7" fill="#111827" stroke="#ff2a6d" stroke-dasharray="5 4"/>
  <text x="635.0" y="297.5" text-anchor="middle" font-size="13" fill="#e3fffa" font-weight="700">Landing pad</text>
  <text x="635.0" y="314.5" text-anchor="middle" font-size="11" fill="#9fb0c8">orphan block after ret</text>
  <text x="400" y="382" text-anchor="middle" font-size="11" fill="#6c7b93">Template: many copies. Lambda: a class. Exception: code cut apart.</text>
</svg>
