<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="300" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#111">Structure of a .pyc file</text>

  <text x="350" y="56" text-anchor="middle" font-size="12" fill="#888">16-byte header + marshalled code object</text>

  <g font-size="11" font-family="Consolas, monospace">
    <rect x="60" y="70" width="140" height="50" fill="#fdecea" stroke="#c0392b"/><text x="130" y="92" text-anchor="middle" fill="#7b241c">magic (4B)</text><text x="130" y="108" text-anchor="middle" font-size="9" fill="#555">Python version</text>
    <rect x="200" y="70" width="120" height="50" fill="#fff7e6" stroke="#d99a00"/><text x="260" y="92" text-anchor="middle" fill="#8a6100">bit field (4B)</text>
    <rect x="320" y="70" width="140" height="50" fill="#e8f0fe" stroke="#4472c4"/><text x="390" y="92" text-anchor="middle" fill="#1a3a6b">timestamp/hash</text><text x="390" y="108" text-anchor="middle" font-size="9" fill="#555">(4B)</text>
    <rect x="460" y="70" width="120" height="50" fill="#eef6ff" stroke="#4472c4"/><text x="520" y="92" text-anchor="middle" fill="#1a3a6b">size (4B)</text>
  </g>

  <rect x="60" y="134" width="520" height="80" fill="#eafaf0" stroke="#2e8b57"/>
  <text x="320" y="156" text-anchor="middle" font-size="13" font-weight="700" fill="#1d5e3a">code object (marshalled)</text>
  <text x="320" y="178" text-anchor="middle" font-size="11" font-family="Consolas,monospace" fill="#1d5e3a">co_code (bytecode) , co_consts , co_names , co_varnames</text>
  <text x="320" y="198" text-anchor="middle" font-size="11" fill="#555">keeps almost everything: names, constants, strings</text>

  <text x="350" y="244" text-anchor="middle" font-size="13" fill="#c0392b" font-weight="600">The magic number gives the Python version, which decides the decompiler to use.</text>
  <text x="350" y="270" text-anchor="middle" font-size="12" fill="#333">Since it keeps so much information, Python is one of the easiest to reverse.</text>
</svg>
