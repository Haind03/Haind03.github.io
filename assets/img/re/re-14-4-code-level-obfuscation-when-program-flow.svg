<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
<rect x="0" y="0" width="800" height="420" rx="12" fill="#0d121d" stroke="#263451"/>
<text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Control flow flattening</text>
<text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">the natural flow becomes one switch driven by a state variable</text>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/></marker></defs>
<text x="150" y="86" text-anchor="middle" font-size="13" fill="#e3fffa">Original</text>
<rect x="100" y="98" width="100" height="36" rx="7" fill="#111827" stroke="#00f0ff"/>
<text x="150.0" y="120.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">A</text>
<rect x="40" y="172" width="80" height="36" rx="7" fill="#111827" stroke="#00f0ff"/>
<text x="80.0" y="194.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">B</text>
<rect x="180" y="172" width="80" height="36" rx="7" fill="#111827" stroke="#00f0ff"/>
<text x="220.0" y="194.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">C</text>
<rect x="100" y="246" width="100" height="36" rx="7" fill="#111827" stroke="#00f0ff"/>
<text x="150.0" y="268.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">D</text>
<line x1="150" y1="134" x2="100" y2="170" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<line x1="150" y1="134" x2="200" y2="170" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<line x1="80" y1="208" x2="130" y2="244" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<line x1="220" y1="208" x2="170" y2="244" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<text x="150" y="312" text-anchor="middle" font-size="10.5" fill="#6c7b93">natural tree in the graph view</text>
<text x="580" y="86" text-anchor="middle" font-size="13" fill="#e3fffa">Flattened</text>
<rect x="480" y="98" width="200" height="48" rx="7" fill="#111827" stroke="#ff2a6d"/>
<text x="580.0" y="117.8" text-anchor="middle" font-size="12.5" fill="#e3fffa">Dispatcher</text>
<text x="580.0" y="134.2" text-anchor="middle" font-size="10.5" fill="#9fb0c8">switch (state)</text>
<rect x="420" y="236" width="72" height="36" rx="7" fill="#111827" stroke="#00f0ff"/>
<text x="456.0" y="258.0" text-anchor="middle" font-size="12" fill="#e3fffa">case A</text>
<line x1="456" y1="236" x2="505.0" y2="148" stroke="#ff2a6d" stroke-width="2" marker-end="url(#a)"/>
<rect x="510" y="236" width="72" height="36" rx="7" fill="#111827" stroke="#00f0ff"/>
<text x="546.0" y="258.0" text-anchor="middle" font-size="12" fill="#e3fffa">case B</text>
<line x1="546" y1="236" x2="555.0" y2="148" stroke="#ff2a6d" stroke-width="2" marker-end="url(#a)"/>
<rect x="600" y="236" width="72" height="36" rx="7" fill="#111827" stroke="#00f0ff"/>
<text x="636.0" y="258.0" text-anchor="middle" font-size="12" fill="#e3fffa">case C</text>
<line x1="636" y1="236" x2="605.0" y2="148" stroke="#ff2a6d" stroke-width="2" marker-end="url(#a)"/>
<rect x="690" y="236" width="72" height="36" rx="7" fill="#111827" stroke="#00f0ff"/>
<text x="726.0" y="258.0" text-anchor="middle" font-size="12" fill="#e3fffa">case D</text>
<line x1="726" y1="236" x2="655.0" y2="148" stroke="#ff2a6d" stroke-width="2" marker-end="url(#a)"/>
<text x="580" y="312" text-anchor="middle" font-size="10.5" fill="#6c7b93">every block sets state = next and jumps back to the dispatcher</text>
<text x="400" y="372" text-anchor="middle" font-size="11" fill="#6c7b93">To undo it, recover the state-to-next-state table and rebuild the real edges.</text>
</svg>
