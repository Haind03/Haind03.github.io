<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/></marker></defs>
  <rect x="0" y="0" width="800" height="330" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">From IPA to readable code</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">FairPlay is one obstacle, after it the Mach-O workflow is normal</text>
  <text x="400" y="312" text-anchor="middle" font-size="11" fill="#6c7b93">Needs a jailbroken device or equivalent, and only your own app or one you may test.</text>
  <rect x="28.0" y="96" width="214.7" height="56" rx="7" fill="#111827" stroke="#00f0ff"/>
  <text x="135.35" y="119.5" text-anchor="middle" font-size="12.5" fill="#e3fffa">.ipa</text>
  <text x="135.35" y="136.5" text-anchor="middle" font-size="10.5" fill="#9fb0c8">rename to .zip</text>
  <line x1="244.7" y1="124.0" x2="289.7" y2="124.0" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <rect x="292.7" y="96" width="214.7" height="56" rx="7" fill="#111827" stroke="#263451"/>
  <text x="400.04999999999995" y="119.5" text-anchor="middle" font-size="12.5" fill="#e3fffa">Payload/App.app</text>
  <text x="400.04999999999995" y="136.5" text-anchor="middle" font-size="10.5" fill="#9fb0c8">Info.plist + Mach-O</text>
  <line x1="509.3" y1="124.0" x2="554.3" y2="124.0" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <rect x="557.3" y="96" width="214.7" height="56" rx="7" fill="#111827" stroke="#ff2a6d"/>
  <text x="664.65" y="119.5" text-anchor="middle" font-size="12.5" fill="#e3fffa">__TEXT encrypted</text>
  <text x="664.65" y="136.5" text-anchor="middle" font-size="10.5" fill="#9fb0c8">FairPlay, cryptid = 1</text>
  <rect x="28.0" y="206" width="160.5" height="56" rx="7" fill="#111827" stroke="#fcee0a"/>
  <text x="108.25" y="229.5" text-anchor="middle" font-size="12.5" fill="#e3fffa">Dump from RAM</text>
  <text x="108.25" y="246.5" text-anchor="middle" font-size="10.5" fill="#9fb0c8">frida-ios-dump</text>
  <line x1="190.5" y1="234.0" x2="219.5" y2="234.0" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <rect x="222.5" y="206" width="160.5" height="56" rx="7" fill="#111827" stroke="#5fe3b0"/>
  <text x="302.75" y="229.5" text-anchor="middle" font-size="12.5" fill="#e3fffa">cryptid = 0</text>
  <text x="302.75" y="246.5" text-anchor="middle" font-size="10.5" fill="#9fb0c8">decrypted Mach-O</text>
  <line x1="385.0" y1="234.0" x2="414.0" y2="234.0" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <rect x="417.0" y="206" width="160.5" height="56" rx="7" fill="#111827" stroke="#263451"/>
  <text x="497.25" y="229.5" text-anchor="middle" font-size="12.5" fill="#e3fffa">IDA / Ghidra</text>
  <text x="497.25" y="246.5" text-anchor="middle" font-size="10.5" fill="#9fb0c8">ObjC or Swift lessons</text>
  <line x1="579.5" y1="234.0" x2="608.5" y2="234.0" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <rect x="611.5" y="206" width="160.5" height="56" rx="7" fill="#111827" stroke="#00f0ff" stroke-dasharray="5 4"/>
  <text x="691.75" y="229.5" text-anchor="middle" font-size="12.5" fill="#e3fffa">Frida / objection</text>
  <text x="691.75" y="246.5" text-anchor="middle" font-size="10.5" fill="#9fb0c8">runtime hooking</text>
  <polyline points="700,152 700,180 100,180 100,204" fill="none" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
</svg>
