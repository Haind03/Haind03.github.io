<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/></marker></defs>
  <rect x="0" y="0" width="800" height="360" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Peeling stacked anti layers in order</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">earliest layer first, logic core last</text>
  <rect x="20" y="90" width="170" height="70" rx="7" fill="#111827" stroke="#00f0ff"/>
  <text x="105.0" y="121.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">1 Triage</text>
  <text x="105.0" y="137.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">DIE, strings, entropy</text>
  <line x1="190" y1="125" x2="211" y2="125" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <rect x="215" y="90" width="170" height="70" rx="7" fill="#111827" stroke="#00f0ff"/>
  <text x="300.0" y="121.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">2 Environment</text>
  <text x="300.0" y="137.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">realistic VM, ScyllaHide</text>
  <line x1="385" y1="125" x2="406" y2="125" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <rect x="410" y="90" width="170" height="70" rx="7" fill="#111827" stroke="#fcee0a"/>
  <text x="495.0" y="121.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">3 Unpack</text>
  <text x="495.0" y="137.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">OEP, dump, rebuild IAT</text>
  <line x1="580" y1="125" x2="601" y2="125" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <rect x="605" y="90" width="170" height="70" rx="7" fill="#111827" stroke="#fcee0a"/>
  <text x="690.0" y="121.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">4 Anti-debug / VM</text>
  <text x="690.0" y="137.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">ScyllaHide, patch the rest</text>
  <rect x="20" y="215" width="170" height="70" rx="7" fill="#111827" stroke="#ff2a6d"/>
  <text x="105.0" y="246.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">5 Integrity check</text>
  <text x="105.0" y="262.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">neutralize the check</text>
  <line x1="190" y1="250" x2="211" y2="250" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <rect x="215" y="215" width="170" height="70" rx="7" fill="#111827" stroke="#ff2a6d"/>
  <text x="300.0" y="246.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">6 Virtualized core</text>
  <text x="300.0" y="262.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">black-box or emulation</text>
  <line x1="385" y1="250" x2="406" y2="250" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <rect x="410" y="215" width="170" height="70" rx="7" fill="#111827" stroke="#5fe3b0"/>
  <text x="495.0" y="246.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">7 Notes</text>
  <text x="495.0" y="262.0" text-anchor="middle" font-size="10.5" fill="#9fb0c8">write down every step</text>
  <polyline points="690,160 690,187 105,187 105,211" fill="none" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <text x="400" y="338" text-anchor="middle" font-size="11" fill="#6c7b93">Whatever runs earliest (packer, TLS callback) must be handled first or you never reach the next layer.</text>
</svg>
