<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="350" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Unicorn: four steps to run one function</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">a CPU with no OS, so you supply everything</text>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/></marker></defs>
  <rect x="32" y="100" width="126" height="60" rx="7" fill="#111827" stroke="#00f0ff"/>
  <text x="95" y="126" text-anchor="middle" font-size="12.5" fill="#e3fffa">Create VM</text>
  <text x="95" y="144" text-anchor="middle" font-size="10.5" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">Uc(ARCH, MODE)</text>
  <rect x="184" y="100" width="126" height="60" rx="7" fill="#111827" stroke="#00f0ff"/>
  <text x="248" y="126" text-anchor="middle" font-size="12.5" fill="#e3fffa">Map memory</text>
  <text x="248" y="144" text-anchor="middle" font-size="10.5" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">mem_map, mem_write</text>
  <rect x="337" y="100" width="126" height="60" rx="7" fill="#111827" stroke="#fcee0a"/>
  <text x="400" y="126" text-anchor="middle" font-size="12.5" fill="#e3fffa">Set inputs</text>
  <text x="400" y="144" text-anchor="middle" font-size="10.5" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">reg_write rdi,rsi,rsp</text>
  <rect x="489" y="100" width="126" height="60" rx="7" fill="#111827" stroke="#ff2a6d"/>
  <text x="552" y="126" text-anchor="middle" font-size="12.5" fill="#e3fffa">Run</text>
  <text x="552" y="144" text-anchor="middle" font-size="10.5" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">emu_start(begin,end)</text>
  <rect x="642" y="100" width="126" height="60" rx="7" fill="#111827" stroke="#5fe3b0"/>
  <text x="705" y="126" text-anchor="middle" font-size="12.5" fill="#e3fffa">Read result</text>
  <text x="705" y="144" text-anchor="middle" font-size="10.5" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">mem_read, reg_read</text>
  <rect x="32" y="200" width="355" height="60" rx="7" fill="#0b1518" stroke="#ff2a6d" stroke-dasharray="5 4"/>
  <text x="210" y="235" text-anchor="middle" font-size="12.5" fill="#e3fffa">Traps: ret needs a valid return address on the stack</text>
  <rect x="413" y="200" width="355" height="60" rx="7" fill="#0b1518" stroke="#ff2a6d" stroke-dasharray="5 4"/>
  <text x="590" y="235" text-anchor="middle" font-size="12.5" fill="#e3fffa">Syscalls and API calls need a hook that fakes them</text>
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="160" y1="130" x2="181" y2="130"/>
    <line x1="313" y1="130" x2="334" y2="130"/>
    <line x1="465" y1="130" x2="486" y2="130"/>
    <line x1="618" y1="130" x2="639" y2="130"/>
    <line x1="389" y1="230" x2="410" y2="230"/>
  </g>
  <text x="400" y="332" text-anchor="middle" font-size="11" fill="#6c7b93">Stop emu_start at a known address so the final ret has somewhere safe to land.</text>
</svg>
