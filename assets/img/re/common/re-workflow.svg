<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="680" height="400" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="340" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#111">Reverse workflow: one loop</text>

  <!-- Triage -->
  <rect x="240" y="56" width="200" height="54" rx="8" fill="#fff7e6" stroke="#d99a00"/>
  <text x="340" y="80" text-anchor="middle" font-size="15" font-weight="600" fill="#8a6100">1. TRIAGE</text>
  <text x="340" y="98" text-anchor="middle" font-size="11" fill="#555">DIE, strings, file type, packed?</text>

  <path d="M340 110 L340 140" stroke="#888" stroke-width="2" marker-end="url(#a)"/>

  <!-- Static -->
  <rect x="240" y="142" width="200" height="54" rx="8" fill="#e8f0fe" stroke="#4472c4"/>
  <text x="340" y="166" text-anchor="middle" font-size="15" font-weight="600" fill="#1a3a6b">2. STATIC</text>
  <text x="340" y="184" text-anchor="middle" font-size="11" fill="#555">read, narrow down, rename</text>

  <!-- Dynamic -->
  <rect x="240" y="228" width="200" height="54" rx="8" fill="#eafaf0" stroke="#2e8b57"/>
  <text x="340" y="252" text-anchor="middle" font-size="15" font-weight="600" fill="#1d5e3a">3. DYNAMIC</text>
  <text x="340" y="270" text-anchor="middle" font-size="11" fill="#555">run, confirm by observing</text>

  <path d="M340 196 L340 226" stroke="#888" stroke-width="2" marker-end="url(#a)"/>

  <!-- loop back static <-> dynamic -->
  <path d="M460 255 C540 255 540 169 462 169" fill="none" stroke="#2e8b57" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#g)"/>
  <text x="560" y="216" font-size="11" fill="#2e8b57">new insight,</text>
  <text x="560" y="230" font-size="11" fill="#2e8b57">re-read</text>

  <!-- Notes -->
  <rect x="240" y="300" width="200" height="54" rx="8" fill="#f0eefb" stroke="#6b46c1"/>
  <text x="340" y="324" text-anchor="middle" font-size="15" font-weight="600" fill="#45307d">4. NOTES</text>
  <text x="340" y="342" text-anchor="middle" font-size="11" fill="#555">rename, comment, note, IOC</text>

  <path d="M340 282 L340 298" stroke="#888" stroke-width="2" marker-end="url(#a)"/>

  <!-- big loop back to static -->
  <path d="M240 327 C100 327 100 169 238 169" fill="none" stroke="#bbb" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#gg)"/>
  <text x="70" y="250" font-size="11" fill="#999" transform="rotate(-90 70 250)">loop until the question is answered</text>

  <text x="340" y="384" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="600">Always start with a specific question so you know when to stop.</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#888"/></marker>
    <marker id="g" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#2e8b57"/></marker>
    <marker id="gg" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#bbb"/></marker>
  </defs>
</svg>
