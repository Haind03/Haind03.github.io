<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="420" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="380" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#111">Abstraction layers of a program</text>

  <!-- Source -->
  <rect x="200" y="56" width="360" height="52" rx="8" fill="#e8f0fe" stroke="#4472c4"/>
  <text x="380" y="80" text-anchor="middle" font-size="15" font-weight="600" fill="#1a3a6b">Source code</text>
  <text x="380" y="98" text-anchor="middle" font-size="12" fill="#444">C, C++, C#, Java, Python...  (programmers write here)</text>

  <text x="380" y="128" text-anchor="middle" font-size="12" fill="#666">compiler</text>
  <path d="M380 112 L380 134" stroke="#888" stroke-width="2" marker-end="url(#a)"/>

  <!-- Bytecode -->
  <rect x="200" y="140" width="360" height="52" rx="8" fill="#eafaf0" stroke="#2e8b57"/>
  <text x="380" y="164" text-anchor="middle" font-size="15" font-weight="600" fill="#1d5e3a">Bytecode / IL</text>
  <text x="380" y="182" text-anchor="middle" font-size="12" fill="#444">.NET, Java, Python  (keeps function, variable, class names)</text>

  <text x="380" y="212" text-anchor="middle" font-size="12" fill="#666">JIT / interpreter</text>
  <path d="M380 196 L380 218" stroke="#888" stroke-width="2" marker-end="url(#a)"/>

  <!-- Machine code -->
  <rect x="200" y="224" width="360" height="52" rx="8" fill="#fdecea" stroke="#c0392b"/>
  <text x="380" y="248" text-anchor="middle" font-size="15" font-weight="600" fill="#7b241c">Machine code / Assembly</text>
  <text x="380" y="266" text-anchor="middle" font-size="12" fill="#444">native: C, C++, Go, Rust  (variable names gone)</text>

  <text x="380" y="296" text-anchor="middle" font-size="12" fill="#666">CPU</text>
  <path d="M380 280 L380 302" stroke="#888" stroke-width="2" marker-end="url(#a)"/>

  <!-- Electricity -->
  <rect x="280" y="308" width="200" height="40" rx="8" fill="#f4f4f4" stroke="#999"/>
  <text x="380" y="333" text-anchor="middle" font-size="14" fill="#333">Electricity</text>

  <!-- side labels -->
  <text x="180" y="170" text-anchor="end" font-size="12" fill="#2e8b57" font-weight="600">easy to reverse</text>
  <text x="180" y="252" text-anchor="end" font-size="12" fill="#c0392b" font-weight="600">hard to reverse</text>
  <path d="M120 150 L120 260" stroke="#bbb" stroke-width="2" marker-end="url(#a)"/>
  <text x="112" y="205" text-anchor="end" font-size="11" fill="#999" transform="rotate(-90 112 205)">further down, further from humans</text>

  <text x="380" y="378" text-anchor="middle" font-size="12" fill="#555">Reversing difficulty depends on which layer the program stops at.</text>
  <text x="380" y="398" text-anchor="middle" font-size="11" fill="#888">blog Reverse Engineering</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#888"/>
    </marker>
  </defs>
</svg>
