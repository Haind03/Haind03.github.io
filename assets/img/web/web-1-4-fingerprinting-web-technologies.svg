<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="400" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Fingerprinting maps signals to a stack and CVEs</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">headers, cookie name and favicon hash identify the tech stack</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- HTTP response -->
  <g font-size="12" text-anchor="middle">
    <rect x="26" y="100" width="210" height="190" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="131" y="124" fill="#00f0ff" font-weight="700">HTTP response</text>
  </g>
  <g font-size="10.5" text-anchor="start" font-family="'JetBrains Mono',monospace" fill="#9fb0c8">
    <text x="42" y="150">Server: Apache/2.4.41</text>
    <text x="42" y="172">X-Powered-By: PHP/7.4.3</text>
    <text x="42" y="194">Set-Cookie: PHPSESSID=..</text>
    <text x="42" y="216">X-Generator / X-Drupal</text>
    <text x="42" y="238">/favicon.ico bytes</text>
    <text x="42" y="260">debug error page</text>
    <text x="42" y="278" fill="#6c7b93">characteristic paths</text>
  </g>

  <!-- inferred stack -->
  <g font-size="12" text-anchor="middle">
    <rect x="310" y="96" width="180" height="60" rx="7" fill="#111827" stroke="#263451"/>
    <text x="400" y="121" fill="#e3fffa">Apache + PHP 7.4.3</text>
    <text x="400" y="140" fill="#6c7b93" font-size="10.5">three signals agree</text>

    <rect x="310" y="168" width="180" height="60" rx="7" fill="#111827" stroke="#263451"/>
    <text x="400" y="193" fill="#e3fffa">Node.js Express</text>
    <text x="400" y="212" fill="#6c7b93" font-size="10.5">connect.sid cookie</text>

    <rect x="310" y="240" width="180" height="60" rx="7" fill="#111827" stroke="#263451"/>
    <text x="400" y="265" fill="#e3fffa">Python Django</text>
    <text x="400" y="284" fill="#6c7b93" font-size="10.5">csrftoken + sessionid</text>
  </g>

  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="236" y1="140" x2="306" y2="126"/>
    <line x1="236" y1="196" x2="306" y2="198"/>
    <line x1="236" y1="252" x2="306" y2="270"/>
  </g>

  <!-- CVE target -->
  <g font-size="12.5" text-anchor="middle">
    <rect x="566" y="150" width="200" height="96" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="666" y="178" fill="#fcee0a" font-weight="700">known CVEs</text>
    <text x="666" y="201" fill="#9fb0c8" font-size="10.5">version -&gt; CVE lookup</text>
    <text x="666" y="219" fill="#9fb0c8" font-size="10.5">right payload per stack</text>
    <text x="666" y="237" fill="#6c7b93" font-size="10">(check if patched)</text>
  </g>
  <line x1="490" y1="198" x2="562" y2="198" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>

  <text x="400" y="334" text-anchor="middle" font-size="11" fill="#6c7b93">A well-configured server strips or fakes these headers; many do not.</text>
  <text x="400" y="358" text-anchor="middle" font-size="11" fill="#6c7b93">Several signals together are more trustworthy than any one alone.</text>
</svg>
