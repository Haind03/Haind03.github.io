<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="400" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Client-side chain: stored XSS to CSRF to account takeover</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">the engine is the victim's logged-in browser</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- link 1: stored xss -->
  <g font-size="11" text-anchor="middle">
    <rect x="20" y="92" width="188" height="74" rx="7" fill="#0b1518" stroke="#ff2a6d" stroke-dasharray="5 4"/>
    <text x="114" y="114" fill="#ff2a6d">1. Stored XSS</text>
    <text x="114" y="133" fill="#9fb0c8" font-size="10">POST /comment with &lt;script&gt;</text>
    <text x="114" y="149" fill="#9fb0c8" font-size="10">/feed returns it un-escaped</text>
  </g>

  <!-- victim browser -->
  <g font-size="11" text-anchor="middle">
    <rect x="248" y="92" width="188" height="74" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="342" y="114" fill="#e3fffa">Victim opens /feed</text>
    <text x="342" y="133" fill="#6c7b93" font-size="10">logged in, holds session</text>
    <text x="342" y="149" fill="#00f0ff" font-size="10">script runs same-origin</text>
  </g>

  <!-- link 2: csrf -->
  <g font-size="11" text-anchor="middle">
    <rect x="476" y="92" width="188" height="74" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="570" y="114" fill="#ff2a6d">2. CSRF</text>
    <text x="570" y="133" fill="#9fb0c8" font-size="10">POST /account/email</text>
    <text x="570" y="149" fill="#9fb0c8" font-size="10">cookie only, no token</text>
  </g>

  <!-- arrows across top -->
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="208" y1="129" x2="244" y2="129"/>
    <line x1="436" y1="129" x2="472" y2="129"/>
  </g>

  <!-- link 3: email changed -->
  <g font-size="11" text-anchor="middle">
    <rect x="476" y="222" width="188" height="56" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="570" y="246" fill="#e3fffa">account email changed</text>
    <text x="570" y="264" fill="#fcee0a" font-size="10.5">to attacker@evil.local</text>
  </g>
  <line x1="570" y1="166" x2="570" y2="218" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none"/>

  <!-- link 4: reset -> takeover -->
  <g font-size="11" text-anchor="middle">
    <rect x="248" y="222" width="188" height="56" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="342" y="242" fill="#e3fffa">password reset</text>
    <text x="342" y="260" fill="#9fb0c8" font-size="10">link goes to new email</text>

    <rect x="248" y="310" width="188" height="50" rx="7" fill="#0b1518" stroke="#fcee0a"/>
    <text x="342" y="332" fill="#fcee0a">account takeover</text>
    <text x="342" y="349" fill="#9fb0c8" font-size="10">FLAG{...}</text>
  </g>
  <line x1="476" y1="250" x2="440" y2="250" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none"/>
  <line x1="342" y1="278" x2="342" y2="306" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none"/>

  <text x="400" y="386" text-anchor="middle" font-size="11" fill="#6c7b93">Stored XSS runs same-origin, so it defeats the CSRF token; reset to the new email completes the takeover.</text>
</svg>
