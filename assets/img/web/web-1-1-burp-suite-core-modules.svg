<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="400" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Burp intercepts and rewrites every request</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">the client can send anything; you edit each byte before it reaches the server</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- main proxy chain -->
  <g font-size="12.5" text-anchor="middle">
    <rect x="30"  y="96" width="130" height="54" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="95"  y="120" fill="#e3fffa">Browser</text>
    <text x="95"  y="137" fill="#6c7b93" font-size="10.5">user=admin</text>

    <rect x="335" y="90" width="150" height="66" rx="7" fill="#111827" stroke="#ff2a6d" stroke-dasharray="5 4"/>
    <text x="410" y="114" fill="#ff2a6d" font-weight="700">Proxy intercept</text>
    <text x="410" y="132" fill="#9fb0c8" font-size="10.5">hold and rewrite</text>
    <text x="410" y="147" fill="#9fb0c8" font-size="10.5">before Forward</text>

    <rect x="650" y="96" width="120" height="54" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="710" y="120" fill="#e3fffa">Server</text>
    <text x="710" y="137" fill="#6c7b93" font-size="10.5">user=guest</text>
  </g>

  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="160" y1="123" x2="331" y2="123"/>
    <line x1="485" y1="123" x2="646" y2="123"/>
  </g>
  <text x="248" y="112" text-anchor="middle" font-size="10.5" fill="#ff2a6d" font-family="'JetBrains Mono',monospace">rewrite</text>

  <!-- HTTP history feeds modules -->
  <g font-size="12" text-anchor="middle">
    <rect x="300" y="196" width="200" height="40" rx="7" fill="#111827" stroke="#263451"/>
    <text x="400" y="221" fill="#e3fffa">HTTP history (review traffic)</text>
  </g>
  <line x1="410" y1="156" x2="410" y2="194" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>

  <!-- modules row -->
  <g font-size="11.5" text-anchor="middle">
    <rect x="34"  y="286" width="166" height="70" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="117" y="310" fill="#5fe3b0" font-weight="700">Repeater</text>
    <text x="117" y="328" fill="#9fb0c8" font-size="10.5">send, edit, resend,</text>
    <text x="117" y="342" fill="#9fb0c8" font-size="10.5">observe</text>

    <rect x="218" y="286" width="166" height="70" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="301" y="310" fill="#ff2a6d" font-weight="700">Intruder</text>
    <text x="301" y="328" fill="#9fb0c8" font-size="10.5">automate payloads:</text>
    <text x="301" y="342" fill="#9fb0c8" font-size="10.5">Sniper / Cluster bomb</text>

    <rect x="402" y="286" width="166" height="70" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="485" y="310" fill="#00f0ff" font-weight="700">Decoder</text>
    <text x="485" y="328" fill="#9fb0c8" font-size="10.5">encode / decode</text>
    <text x="485" y="342" fill="#9fb0c8" font-size="10.5">Base64, URL, hex</text>

    <rect x="586" y="286" width="180" height="70" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="676" y="310" fill="#fcee0a" font-weight="700">Comparer</text>
    <text x="676" y="328" fill="#9fb0c8" font-size="10.5">diff two responses</text>
    <text x="676" y="342" fill="#9fb0c8" font-size="10.5">byte or word</text>
  </g>
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="340" y1="236" x2="150" y2="284"/>
    <line x1="372" y1="236" x2="305" y2="284"/>
    <line x1="428" y1="236" x2="482" y2="284"/>
    <line x1="460" y1="236" x2="650" y2="284"/>
  </g>
</svg>
