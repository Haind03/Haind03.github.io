<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="380" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">A repeatable method for an unknown web lab</text>
  <text x="400" y="54" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">read, map, find the entry point, probe, observe, escalate</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- six step chain -->
  <g font-size="11.5" text-anchor="middle">
    <rect x="24"  y="80" width="104" height="54" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="76"  y="103" fill="#e3fffa">1. Read</text>
    <text x="76"  y="119" fill="#e3fffa">the brief</text>

    <rect x="154" y="80" width="104" height="54" rx="7" fill="#111827" stroke="#263451"/>
    <text x="206" y="103" fill="#e3fffa">2. Map</text>
    <text x="206" y="119" fill="#e3fffa">the app</text>

    <rect x="284" y="80" width="104" height="54" rx="7" fill="#111827" stroke="#263451"/>
    <text x="336" y="103" fill="#e3fffa">3. Find</text>
    <text x="336" y="119" fill="#e3fffa">entry point</text>

    <rect x="414" y="80" width="104" height="54" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="466" y="103" fill="#ff2a6d" font-weight="700">4. Probe</text>
    <text x="466" y="119" fill="#e3fffa">a payload</text>

    <rect x="544" y="80" width="104" height="54" rx="7" fill="#111827" stroke="#263451"/>
    <text x="596" y="103" fill="#e3fffa">5. Observe</text>
    <text x="596" y="119" fill="#e3fffa">the response</text>

    <rect x="674" y="80" width="102" height="54" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="725" y="103" fill="#e3fffa">6. Escalate</text>
    <text x="725" y="119" fill="#e3fffa">to the goal</text>
  </g>

  <!-- chain arrows -->
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="128" y1="107" x2="150" y2="107"/>
    <line x1="258" y1="107" x2="280" y2="107"/>
    <line x1="388" y1="107" x2="410" y2="107"/>
    <line x1="518" y1="107" x2="540" y2="107"/>
    <line x1="648" y1="107" x2="670" y2="107"/>
  </g>

  <!-- probe payloads feeding step 4 (attacker controlled) -->
  <g font-size="11" text-anchor="middle">
    <rect x="356" y="176" width="220" height="46" rx="7" fill="#0b1518" stroke="#00f0ff" stroke-dasharray="5 4"/>
    <text x="466" y="195" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">' " &lt;script&gt; {{7*7}} ../</text>
    <text x="466" y="211" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">change id, change Origin</text>
  </g>
  <line x1="466" y1="176" x2="466" y2="136" stroke="#00f0ff" stroke-width="2" marker-end="url(#a)" opacity="0.85"/>

  <!-- four lab types -->
  <text x="24" y="258" font-size="12" fill="#e3fffa">Four apprentice labs, one probe each:</text>
  <g font-size="11.5" font-family="'JetBrains Mono',monospace">
    <text x="24"  y="284" fill="#ff2a6d">SQLi</text>
    <text x="150" y="284" fill="#9fb0c8">administrator'-- in username bypasses login</text>
    <text x="24"  y="308" fill="#ff2a6d">XSS</text>
    <text x="150" y="308" fill="#9fb0c8">&lt;script&gt;alert(1)&lt;/script&gt; reflected into HTML</text>
    <text x="24"  y="332" fill="#ff2a6d">IDOR</text>
    <text x="150" y="332" fill="#9fb0c8">id=carlos returns another user's account</text>
    <text x="24"  y="356" fill="#ff2a6d">SSRF</text>
    <text x="150" y="356" fill="#9fb0c8">stockApi=http://localhost/admin reaches internal</text>
  </g>
</svg>
