<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="360" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Same-origin policy: send allowed, read blocked</text>
  <text x="400" y="52" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">origin = scheme + host + port, all three must match</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
    <marker id="m" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#ff2a6d"/>
    </marker>
  </defs>

  <!-- boxes -->
  <g font-size="12.5" text-anchor="middle">
    <rect x="28" y="92" width="182" height="72" rx="7" fill="#0b1518" stroke="#ff2a6d" stroke-dasharray="5 4"/>
    <text x="119" y="122" fill="#ff2a6d" font-weight="700">Attacker page</text>
    <text x="119" y="142" fill="#9fb0c8" font-size="10.5">script on evil.com</text>

    <rect x="320" y="92" width="160" height="72" rx="7" fill="#111827" stroke="#263451"/>
    <text x="400" y="122" fill="#e3fffa">Browser</text>
    <text x="400" y="142" fill="#9fb0c8" font-size="10.5">holds your cookies</text>

    <rect x="590" y="92" width="182" height="72" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="681" y="122" fill="#e3fffa">bank.com</text>
    <text x="681" y="142" fill="#9fb0c8" font-size="10.5">you are logged in</text>
  </g>

  <!-- SEND path: magenta dashed, allowed -->
  <g stroke="#ff2a6d" stroke-width="2" marker-end="url(#m)" fill="none" stroke-dasharray="6 4">
    <line x1="210" y1="118" x2="316" y2="118"/>
    <line x1="480" y1="118" x2="586" y2="118"/>
  </g>
  <text x="400" y="84" text-anchor="middle" font-size="11" fill="#ff2a6d" font-family="'JetBrains Mono',monospace">SEND: request + your cookie (SOP does NOT block this)</text>

  <!-- READ path: blocked -->
  <line x1="586" y1="210" x2="372" y2="210" stroke="#5fe3b0" stroke-width="2" fill="none"/>
  <g stroke="#ff2a6d" stroke-width="3">
    <line x1="352" y1="202" x2="336" y2="218"/>
    <line x1="336" y1="202" x2="352" y2="218"/>
  </g>
  <text x="470" y="236" text-anchor="middle" font-size="11" fill="#5fe3b0" font-family="'JetBrains Mono',monospace">READ: response blocked, evil.com cannot see it</text>

  <!-- annotations -->
  <text x="400" y="290" text-anchor="middle" font-size="12" fill="#9fb0c8">The gap, send allowed but read blocked, is the root of CSRF. XSS matters because it runs inside the origin and can read.</text>
  <text x="400" y="320" text-anchor="middle" font-size="11" fill="#6c7b93" font-family="'JetBrains Mono',monospace">cookie flags: HttpOnly stops JS reading it, Secure forces HTTPS, SameSite limits cross-site sending</text>
</svg>
