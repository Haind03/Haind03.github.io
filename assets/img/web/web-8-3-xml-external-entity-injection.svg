<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="380" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">XXE: an external entity points the parser out</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">SYSTEM file:// reads a file, SYSTEM http:// makes the server request a URL</text>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <rect x="24" y="112" width="210" height="100" rx="7" fill="#111827" stroke="#00f0ff" stroke-dasharray="5 4"/>
  <text x="129" y="136" text-anchor="middle" font-size="12.5" fill="#e3fffa">Attacker XML</text>
  <text x="129" y="159" text-anchor="middle" font-size="10" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">&lt;!ENTITY xxe SYSTEM</text>
  <text x="129" y="174" text-anchor="middle" font-size="10" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">"file:///etc/passwd"&gt;</text>
  <text x="129" y="196" text-anchor="middle" font-size="10" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">&lt;name&gt;&amp;xxe;&lt;/name&gt;</text>

  <rect x="268" y="128" width="156" height="68" rx="7" fill="#111827" stroke="#ff2a6d"/>
  <text x="346" y="156" text-anchor="middle" font-size="12.5" fill="#ff2a6d" font-weight="700">XML parser</text>
  <text x="346" y="177" text-anchor="middle" font-size="10.5" fill="#9fb0c8">resolves the entity</text>

  <rect x="458" y="100" width="318" height="58" rx="7" fill="#111827" stroke="#fcee0a"/>
  <text x="617" y="124" text-anchor="middle" font-size="12" fill="#fcee0a" font-weight="700">file:// read</text>
  <text x="617" y="144" text-anchor="middle" font-size="10.5" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">/etc/passwd leaked</text>

  <rect x="458" y="176" width="318" height="58" rx="7" fill="#111827" stroke="#ff2a6d" stroke-dasharray="5 4"/>
  <text x="617" y="200" text-anchor="middle" font-size="12" fill="#e3fffa">http:// SSRF</text>
  <text x="617" y="220" text-anchor="middle" font-size="10.5" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">169.254.169.254 metadata</text>

  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="234" y1="162" x2="266" y2="162"/>
    <line x1="424" y1="152" x2="456" y2="132"/>
    <line x1="424" y1="172" x2="456" y2="200"/>
  </g>

  <rect x="268" y="288" width="368" height="66" rx="7" fill="#111827" stroke="#5fe3b0"/>
  <text x="452" y="314" text-anchor="middle" font-size="11.5" fill="#e3fffa">&amp;xxe; substituted into &lt;name&gt;</text>
  <text x="452" y="334" text-anchor="middle" font-size="10.5" fill="#9fb0c8">echoed back in the response (in-band)</text>
  <line x1="346" y1="196" x2="346" y2="288" stroke="#5fe3b0" stroke-width="2" marker-end="url(#a)" fill="none"/>
</svg>
