<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="380" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">sqlmap with a tamper against a space filter</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">rewrite the payload so the blocked character never reaches the WAF</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- blocked path note -->
  <g text-anchor="middle">
    <rect x="248" y="78" width="304" height="40" rx="7" fill="#0b1518" stroke="#ff2a6d" stroke-dasharray="5 4"/>
    <text x="400" y="103" fill="#ff2a6d" font-size="11">Without a tamper, the raw space hits the WAF, 403</text>
  </g>

  <!-- pipeline -->
  <g font-size="12" text-anchor="middle">
    <rect x="18" y="162" width="178" height="64" rx="7" fill="#0b1518" stroke="#00f0ff" stroke-dasharray="5 4"/>
    <text x="107" y="184" fill="#e3fffa">sqlmap payload</text>
    <text x="107" y="204" fill="#00f0ff" font-family="'JetBrains Mono',monospace" font-size="11">id=1 AND 1=1</text>
    <text x="107" y="218" fill="#6c7b93" font-size="9.5">(contains a space)</text>

    <rect x="212" y="162" width="190" height="64" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="307" y="184" fill="#5fe3b0">tamper space2comment</text>
    <text x="307" y="205" fill="#9fb0c8" font-family="'JetBrains Mono',monospace" font-size="10.5">id=1/**/AND/**/1=1</text>

    <rect x="418" y="162" width="150" height="64" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="493" y="188" fill="#ff2a6d">WAF</text>
    <text x="493" y="206" fill="#9fb0c8" font-size="10">no space, passes</text>

    <rect x="584" y="162" width="196" height="64" rx="7" fill="#111827" stroke="#263451"/>
    <text x="682" y="188" fill="#e3fffa">/product</text>
    <text x="682" y="206" fill="#9fb0c8" font-size="10">sqlite query</text>
  </g>

  <!-- arrows -->
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="196" y1="194" x2="210" y2="194"/>
    <line x1="402" y1="194" x2="416" y2="194"/>
    <line x1="568" y1="194" x2="582" y2="194"/>
  </g>

  <!-- dumped flag -->
  <g font-size="12" text-anchor="middle">
    <rect x="474" y="282" width="306" height="58" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="627" y="304" fill="#e3fffa">Dumped secret table</text>
    <text x="627" y="325" fill="#fcee0a" font-family="'JetBrains Mono',monospace" font-size="10.5">WEB{sqlmap_tamper_space2comment_bypass_waf}</text>
  </g>
  <line x1="682" y1="226" x2="660" y2="278" stroke="#fcee0a" stroke-width="2" marker-end="url(#a)" opacity="0.85"/>
  <text x="235" y="322" text-anchor="middle" font-size="11" fill="#6c7b93">Pick the tamper that matches exactly what is blocked.</text>
</svg>
