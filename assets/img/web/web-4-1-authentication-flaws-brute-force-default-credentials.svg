<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="400" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Username enumeration and brute force</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">different response and timing reveal valid accounts, no rate limit cracks them</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- attacker -->
  <g font-size="12.5" text-anchor="middle">
    <rect x="24" y="170" width="108" height="56" rx="7" fill="#0b1518" stroke="#00f0ff" stroke-dasharray="5 4"/>
    <text x="78" y="194" fill="#e3fffa">Attacker</text>
    <text x="78" y="211" fill="#6c7b93" font-size="10.5">(untrusted)</text>
  </g>
  <line x1="132" y1="198" x2="178" y2="198" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>

  <!-- login endpoint -->
  <g font-size="12" text-anchor="middle">
    <rect x="180" y="168" width="150" height="60" rx="7" fill="#111827" stroke="#263451"/>
    <text x="255" y="190" fill="#e3fffa">POST /login</text>
    <text x="255" y="208" fill="#9fb0c8" font-size="11" font-family="'JetBrains Mono',monospace">username + password</text>
    <text x="255" y="222" fill="#6c7b93" font-size="10">does username exist?</text>
  </g>

  <!-- branch: unknown user -->
  <line x1="330" y1="184" x2="500" y2="132" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <g font-size="11.5" text-anchor="middle">
    <rect x="500" y="104" width="276" height="52" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="638" y="126" fill="#5fe3b0" font-family="'JetBrains Mono',monospace">root -&gt; "Unknown user"</text>
    <text x="638" y="144" fill="#9fb0c8" font-size="10.5">fast ~0.003s, no hash run = not real</text>
  </g>

  <!-- branch: existing user, wrong pass -->
  <line x1="330" y1="212" x2="500" y2="200" stroke="#ff2a6d" stroke-width="2" marker-end="url(#a)"/>
  <g font-size="11.5" text-anchor="middle">
    <rect x="500" y="174" width="276" height="52" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="638" y="196" fill="#ff2a6d" font-family="'JetBrains Mono',monospace">admin -&gt; "Invalid password"</text>
    <text x="638" y="214" fill="#9fb0c8" font-size="10.5">slow ~0.12s, hash runs = real account</text>
  </g>

  <!-- oracle label -->
  <text x="345" y="258" font-size="11" fill="#ff2a6d" font-family="'JetBrains Mono',monospace">the two answers are an oracle</text>

  <!-- brute force step -->
  <g font-size="12" text-anchor="middle">
    <rect x="180" y="286" width="196" height="56" rx="7" fill="#111827" stroke="#ff2a6d" stroke-dasharray="5 4"/>
    <text x="278" y="308" fill="#e3fffa">brute force valid user</text>
    <text x="278" y="326" fill="#9fb0c8" font-size="10.5">wordlist, no rate limit</text>
  </g>
  <line x1="255" y1="228" x2="268" y2="284" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <line x1="376" y1="314" x2="452" y2="314" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>

  <!-- cracked -->
  <g font-size="11.5" text-anchor="middle">
    <rect x="454" y="286" width="322" height="56" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="615" y="308" fill="#fcee0a" font-family="'JetBrains Mono',monospace">CRACKED admin:Password123</text>
    <text x="615" y="326" fill="#9fb0c8" font-size="10.5">FLAG{4.1_brute_force_no_rate_limit}</text>
  </g>

  <text x="400" y="376" text-anchor="middle" font-size="11" fill="#6c7b93">A login form that answers differently for real and fake accounts, with no throttle, is a free account list.</text>
</svg>
