<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="400" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Command injection: the shell runs a second command</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">shell=True plus string concatenation turns input into commands</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- main chain -->
  <g font-size="12" text-anchor="middle">
    <rect x="18" y="140" width="200" height="64" rx="7" fill="#0b1518" stroke="#00f0ff" stroke-dasharray="5 4"/>
    <text x="118" y="164" fill="#e3fffa">User input (host)</text>
    <text x="118" y="186" fill="#00f0ff" font-family="'JetBrains Mono',monospace" font-size="10">127.0.0.1; cat flag.txt</text>
    <text x="118" y="199" fill="#6c7b93" font-size="9.5">(attacker-controlled)</text>

    <rect x="234" y="140" width="196" height="64" rx="7" fill="#111827" stroke="#263451"/>
    <text x="332" y="166" fill="#e3fffa">subprocess.run(cmd,</text>
    <text x="332" y="184" fill="#9fb0c8" font-family="'JetBrains Mono',monospace" font-size="10.5">shell=True)</text>

    <rect x="446" y="140" width="172" height="64" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="532" y="162" fill="#ff2a6d" font-weight="700">shell runs both</text>
    <text x="532" y="182" fill="#9fb0c8" font-family="'JetBrains Mono',monospace" font-size="9.5">ping ... ; cat flag.txt</text>
    <text x="532" y="196" fill="#6c7b93" font-size="9.5">RCE</text>

    <rect x="634" y="128" width="146" height="88" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="707" y="158" fill="#e3fffa">flag.txt</text>
    <text x="707" y="180" fill="#9fb0c8" font-size="9.5">WEB{c0mm4nd_</text>
    <text x="707" y="194" fill="#9fb0c8" font-size="9.5">1nj3ct10n_rce}</text>
  </g>

  <!-- arrows -->
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="218" y1="172" x2="232" y2="172"/>
    <line x1="430" y1="172" x2="444" y2="172"/>
    <line x1="618" y1="172" x2="632" y2="172"/>
  </g>

  <!-- three channels -->
  <g font-size="11.5" text-anchor="middle">
    <rect x="20" y="288" width="244" height="64" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="142" y="312" fill="#00f0ff">In-band</text>
    <text x="142" y="332" fill="#9fb0c8" font-family="'JetBrains Mono',monospace" font-size="10">; id  output in response</text>

    <rect x="278" y="288" width="244" height="64" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="400" y="312" fill="#ff2a6d">Blind time-based</text>
    <text x="400" y="332" fill="#9fb0c8" font-family="'JetBrains Mono',monospace" font-size="10">; sleep 5  measure delay</text>

    <rect x="536" y="288" width="244" height="64" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="658" y="312" fill="#5fe3b0">Filter bypass</text>
    <text x="658" y="332" fill="#9fb0c8" font-family="'JetBrains Mono',monospace" font-size="10">newline %0a not blocked</text>
  </g>
  <text x="400" y="372" text-anchor="middle" font-size="11" fill="#6c7b93">A blacklist filter is usually incomplete; do not build the command by concatenation.</text>
</svg>
