<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="390" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Chaining recon to RCE: each link unlocks the next</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">a forgotten comment leads to command execution on the server</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- four links -->
  <g font-size="11.5" text-anchor="middle">
    <rect x="20" y="96" width="176" height="72" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="108" y="120" fill="#00f0ff">0. Recon</text>
    <text x="108" y="140" fill="#9fb0c8" font-size="10">HTML comment + app.js</text>
    <text x="108" y="156" fill="#9fb0c8" font-size="10">leak /api/v2/users/&lt;id&gt;/keys</text>

    <rect x="226" y="96" width="176" height="72" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="314" y="120" fill="#ff2a6d">1. IDOR</text>
    <text x="314" y="140" fill="#9fb0c8" font-size="10">GET .../users/1/keys</text>
    <text x="314" y="156" fill="#9fb0c8" font-size="10">no auth, pick id=1 (admin)</text>

    <rect x="432" y="96" width="176" height="72" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="520" y="120" fill="#ff2a6d">2. SSTI</text>
    <text x="520" y="140" fill="#9fb0c8" font-size="10">/admin/template/preview</text>
    <text x="520" y="156" fill="#9fb0c8" font-size="10">{{7*7}} renders 49</text>

    <rect x="638" y="96" width="142" height="72" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="709" y="120" fill="#ff2a6d">3. RCE</text>
    <text x="709" y="140" fill="#9fb0c8" font-size="10">Jinja2 globals</text>
    <text x="709" y="156" fill="#9fb0c8" font-size="10">os.popen -&gt; cmd</text>
  </g>

  <!-- chain arrows -->
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="196" y1="132" x2="222" y2="132"/>
    <line x1="402" y1="132" x2="428" y2="132"/>
    <line x1="608" y1="132" x2="634" y2="132"/>
  </g>

  <!-- leaked secret flowing from IDOR to SSTI -->
  <g font-size="10.5" text-anchor="middle">
    <rect x="320" y="218" width="256" height="48" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="448" y="238" fill="#fcee0a">leaked secret: admin_api_key</text>
    <text x="448" y="254" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">adm_k3y_31337_internal</text>
  </g>
  <line x1="340" y1="218" x2="314" y2="172" stroke="#fcee0a" stroke-width="2" marker-end="url(#a)" opacity="0.85"/>
  <line x1="520" y1="218" x2="520" y2="172" stroke="#fcee0a" stroke-width="2" marker-end="url(#a)" opacity="0.85"/>
  <text x="448" y="200" text-anchor="middle" font-size="10" fill="#6c7b93">the only "protection" on the SSTI endpoint is the key the IDOR just leaked</text>

  <!-- result -->
  <g font-size="11.5" text-anchor="middle">
    <rect x="300" y="300" width="200" height="46" rx="7" fill="#0b1518" stroke="#5fe3b0"/>
    <text x="400" y="328" fill="#5fe3b0">cat flag.txt -&gt; FLAG{...}</text>
  </g>
  <line x1="709" y1="168" x2="470" y2="298" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none"/>
  <text x="400" y="372" text-anchor="middle" font-size="11" fill="#6c7b93">Breaking one link cuts the chain; each medium-severity bug is critical once chained.</text>
</svg>
