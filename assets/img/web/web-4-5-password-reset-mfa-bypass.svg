<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="440" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Password reset and MFA bypass</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">a computable token, a poisoned link, and a page that skips the OTP</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- Row 1: predictable reset token -->
  <text x="30" y="90" font-size="12" fill="#00f0ff" font-family="'JetBrains Mono',monospace">1. reset token derived from the email</text>
  <g font-size="11" text-anchor="middle">
    <rect x="30" y="100" width="150" height="54" rx="7" fill="#0b1518" stroke="#00f0ff" stroke-dasharray="5 4"/>
    <text x="105" y="122" fill="#e3fffa">know the email</text>
    <text x="105" y="140" fill="#9fb0c8" font-size="10">ceo@corp.local</text>
  </g>
  <line x1="180" y1="127" x2="222" y2="127" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <g font-size="11" text-anchor="middle">
    <rect x="224" y="100" width="206" height="54" rx="7" fill="#0b1518" stroke="#ff2a6d" stroke-dasharray="5 4"/>
    <text x="327" y="121" fill="#ff2a6d">compute token offline</text>
    <text x="327" y="139" fill="#9fb0c8" font-size="10" font-family="'JetBrains Mono',monospace">md5(email+pepper)[:12]</text>
  </g>
  <line x1="430" y1="127" x2="472" y2="127" stroke="#ff2a6d" stroke-width="2" marker-end="url(#a)"/>
  <g font-size="11" text-anchor="middle">
    <rect x="474" y="100" width="296" height="54" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="622" y="121" fill="#fcee0a">/reset -&gt; password changed</text>
    <text x="622" y="139" fill="#9fb0c8" font-size="10" font-family="'JetBrains Mono',monospace">FLAG{4.5_reset_token_predictable}</text>
  </g>

  <!-- Row 2: host header poisoning -->
  <text x="30" y="192" font-size="12" fill="#ff2a6d" font-family="'JetBrains Mono',monospace">2. host header poisoning (leaks even a strong token)</text>
  <g font-size="11" text-anchor="middle">
    <rect x="30" y="202" width="236" height="54" rx="7" fill="#0b1518" stroke="#ff2a6d" stroke-dasharray="5 4"/>
    <text x="148" y="223" fill="#e3fffa">POST /forgot</text>
    <text x="148" y="241" fill="#9fb0c8" font-size="10" font-family="'JetBrains Mono',monospace">Host: attacker.evil</text>
  </g>
  <line x1="266" y1="229" x2="308" y2="229" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <g font-size="11" text-anchor="middle">
    <rect x="310" y="202" width="460" height="54" rx="7" fill="#111827" stroke="#263451"/>
    <text x="540" y="223" fill="#e3fffa">server builds link from Host, real token embedded</text>
    <text x="540" y="241" fill="#9fb0c8" font-size="10" font-family="'JetBrains Mono',monospace">http://attacker.evil/reset?token=35fda2afc20b</text>
  </g>

  <!-- Row 3: MFA bypass missing check -->
  <text x="30" y="294" font-size="12" fill="#ff2a6d" font-family="'JetBrains Mono',monospace">3. MFA bypass by missing check</text>
  <g font-size="11" text-anchor="middle">
    <rect x="30" y="304" width="170" height="60" rx="7" fill="#111827" stroke="#263451"/>
    <text x="115" y="326" fill="#e3fffa">pass password</text>
    <text x="115" y="344" fill="#9fb0c8" font-size="10" font-family="'JetBrains Mono',monospace">stage=mfa_required</text>
  </g>
  <line x1="200" y1="334" x2="244" y2="334" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <g font-size="11" text-anchor="middle">
    <rect x="246" y="304" width="196" height="60" rx="7" fill="#0b1518" stroke="#ff2a6d" stroke-dasharray="5 4"/>
    <text x="344" y="326" fill="#ff2a6d">GET /mfa/account</text>
    <text x="344" y="344" fill="#9fb0c8" font-size="10">skip OTP entirely</text>
  </g>
  <line x1="442" y1="334" x2="486" y2="334" stroke="#ff2a6d" stroke-width="2" marker-end="url(#a)"/>
  <g font-size="11" text-anchor="middle">
    <rect x="488" y="304" width="282" height="60" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="629" y="326" fill="#fcee0a">page checks password only</text>
    <text x="629" y="344" fill="#9fb0c8" font-size="10" font-family="'JetBrains Mono',monospace">FLAG{4.5_mfa_bypassed}</text>
  </g>

  <text x="400" y="404" text-anchor="middle" font-size="11" fill="#6c7b93">Changing a password needs no old password, so every reset and MFA step must be checked on the server.</text>
  <text x="400" y="424" text-anchor="middle" font-size="10.5" fill="#6c7b93" font-family="'JetBrains Mono',monospace">a 4-digit OTP with no rate limit also falls to brute force (0000..9999)</text>
</svg>
