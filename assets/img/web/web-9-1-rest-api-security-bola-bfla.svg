<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="400" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">BOLA and BFLA: the missing second check</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">a valid token is checked, ownership and role are not</text>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <rect x="24" y="152" width="134" height="72" rx="7" fill="#111827" stroke="#00f0ff"/>
  <text x="91" y="182" text-anchor="middle" font-size="12.5" fill="#e3fffa">alice (user)</text>
  <text x="91" y="203" text-anchor="middle" font-size="10.5" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">tok-alice-111</text>

  <!-- Row 1: BOLA -->
  <rect x="190" y="96" width="172" height="58" rx="7" fill="#111827" stroke="#ff2a6d" stroke-dasharray="5 4"/>
  <text x="276" y="120" text-anchor="middle" font-size="11.5" fill="#e3fffa" font-family="'JetBrains Mono',monospace">GET /api/users/2</text>
  <text x="276" y="140" text-anchor="middle" font-size="10.5" fill="#9fb0c8">change the id</text>

  <rect x="396" y="96" width="190" height="58" rx="7" fill="#111827" stroke="#ff2a6d"/>
  <text x="491" y="119" text-anchor="middle" font-size="11" fill="#5fe3b0">token valid: yes</text>
  <text x="491" y="140" text-anchor="middle" font-size="11" fill="#ff2a6d" font-weight="700">owner check: MISSING</text>

  <rect x="620" y="96" width="156" height="58" rx="7" fill="#111827" stroke="#fcee0a"/>
  <text x="698" y="119" text-anchor="middle" font-size="10.5" fill="#e3fffa">bob object + secret</text>
  <text x="698" y="140" text-anchor="middle" font-size="12" fill="#fcee0a" font-weight="700">BOLA</text>

  <!-- Row 2: BFLA -->
  <rect x="190" y="238" width="172" height="58" rx="7" fill="#111827" stroke="#ff2a6d" stroke-dasharray="5 4"/>
  <text x="276" y="262" text-anchor="middle" font-size="10.5" fill="#e3fffa" font-family="'JetBrains Mono',monospace">POST /admin/promote</text>
  <text x="276" y="282" text-anchor="middle" font-size="10.5" fill="#9fb0c8">ordinary token</text>

  <rect x="396" y="238" width="190" height="58" rx="7" fill="#111827" stroke="#ff2a6d"/>
  <text x="491" y="261" text-anchor="middle" font-size="11" fill="#5fe3b0">token valid: yes</text>
  <text x="491" y="282" text-anchor="middle" font-size="11" fill="#ff2a6d" font-weight="700">role check: MISSING</text>

  <rect x="620" y="238" width="156" height="58" rx="7" fill="#111827" stroke="#fcee0a"/>
  <text x="698" y="261" text-anchor="middle" font-size="10.5" fill="#e3fffa">promoted to admin</text>
  <text x="698" y="282" text-anchor="middle" font-size="12" fill="#fcee0a" font-weight="700">BFLA</text>

  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="158" y1="178" x2="188" y2="128"/>
    <line x1="158" y1="198" x2="188" y2="268"/>
    <line x1="362" y1="125" x2="394" y2="125"/>
    <line x1="586" y1="125" x2="618" y2="125"/>
    <line x1="362" y1="267" x2="394" y2="267"/>
    <line x1="586" y1="267" x2="618" y2="267"/>
  </g>

  <text x="400" y="360" text-anchor="middle" font-size="11.5" fill="#9fb0c8">Authentication proves who you are. It does not prove what you may touch or do.</text>
</svg>
