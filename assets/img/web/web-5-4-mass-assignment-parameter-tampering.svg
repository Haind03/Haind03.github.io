<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="380" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Mass assignment: an extra field rides the bind into the model</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">the form shows email and bio; the request carries isAdmin too</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- request body -->
  <g font-size="11" text-anchor="middle">
    <rect x="22" y="138" width="206" height="90" rx="7" fill="#0b1518" stroke="#ff2a6d" stroke-dasharray="5 4"/>
    <text x="125" y="160" fill="#ff2a6d">POST /api/profile (JSON)</text>
    <text x="125" y="180" fill="#9fb0c8" font-family="'JetBrains Mono',monospace" font-size="10.5">"email": "...",</text>
    <text x="125" y="196" fill="#9fb0c8" font-family="'JetBrains Mono',monospace" font-size="10.5">"bio": "...",</text>
    <text x="125" y="214" fill="#ff2a6d" font-family="'JetBrains Mono',monospace" font-size="10.5">"isAdmin": true</text>
  </g>

  <!-- bind -->
  <g font-size="11.5" text-anchor="middle">
    <rect x="300" y="150" width="190" height="66" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="395" y="176" fill="#e3fffa">blind bind</text>
    <text x="395" y="196" fill="#ff2a6d" font-family="'JetBrains Mono',monospace" font-size="10">for k,v in data: user[k]=v</text>
  </g>

  <!-- resulting object -->
  <g font-size="11" text-anchor="middle">
    <rect x="562" y="138" width="214" height="90" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="669" y="160" fill="#e3fffa">user object (stored)</text>
    <text x="669" y="180" fill="#9fb0c8" font-size="10.5">email, bio updated</text>
    <text x="669" y="198" fill="#fcee0a" font-size="10.5">isAdmin=true, role=admin</text>
    <text x="669" y="214" fill="#fcee0a" font-size="10.5">reaches /admin + FLAG</text>
  </g>

  <!-- arrows -->
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="228" y1="183" x2="296" y2="183"/>
    <line x1="490" y1="183" x2="558" y2="183"/>
  </g>

  <!-- fix -->
  <g font-size="11" text-anchor="middle">
    <rect x="300" y="276" width="190" height="52" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="395" y="298" fill="#5fe3b0">Fix: whitelist writable</text>
    <text x="395" y="314" fill="#9fb0c8" font-size="10.5">fields via a DTO/schema</text>
  </g>
  <line x1="395" y1="270" x2="395" y2="220" stroke="#5fe3b0" stroke-width="2" marker-end="url(#a)" opacity="0.85"/>
  <text x="400" y="356" text-anchor="middle" font-size="11" fill="#6c7b93">The request is attacker-controlled; the UI hiding a field does not stop the field from being sent.</text>
</svg>
