<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="400" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Blind SQL injection: one bit per question</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">no printed data, so each condition returns true or false only</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- injected condition -->
  <g font-size="12" text-anchor="middle">
    <rect x="20" y="150" width="210" height="64" rx="7" fill="#0b1518" stroke="#00f0ff" stroke-dasharray="5 4"/>
    <text x="125" y="172" fill="#e3fffa">Injected condition</text>
    <text x="125" y="192" fill="#00f0ff" font-family="'JetBrains Mono',monospace" font-size="9.5">AND unicode(substr(pw,i,1))</text>
    <text x="125" y="206" fill="#00f0ff" font-family="'JetBrains Mono',monospace" font-size="9.5">&gt; MID -- -</text>
  </g>

  <!-- server -->
  <g font-size="12" text-anchor="middle">
    <rect x="276" y="150" width="150" height="64" rx="7" fill="#111827" stroke="#263451"/>
    <text x="351" y="178" fill="#e3fffa">Server runs</text>
    <text x="351" y="196" fill="#9fb0c8" font-size="10">the query</text>
  </g>

  <!-- true / false outcomes -->
  <g font-size="11.5" text-anchor="middle">
    <rect x="472" y="112" width="186" height="46" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="565" y="131" fill="#ff2a6d" font-weight="700">TRUE</text>
    <text x="565" y="148" fill="#9fb0c8" font-size="10">FOUND, or slow response</text>

    <rect x="472" y="206" width="186" height="46" rx="7" fill="#111827" stroke="#263451"/>
    <text x="565" y="225" fill="#e3fffa">FALSE</text>
    <text x="565" y="242" fill="#9fb0c8" font-size="10">NOTFOUND, or fast response</text>
  </g>

  <!-- arrows -->
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="230" y1="182" x2="272" y2="182"/>
    <line x1="426" y1="172" x2="468" y2="140"/>
    <line x1="426" y1="192" x2="468" y2="224"/>
  </g>

  <!-- recovered secret -->
  <g font-size="12" text-anchor="middle">
    <rect x="472" y="296" width="306" height="56" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="625" y="318" fill="#e3fffa">Recovered character by character</text>
    <text x="625" y="338" fill="#fcee0a" font-family="'JetBrains Mono',monospace" font-size="11">WEB{bl1nd_b00l3an_and_t1me}</text>
  </g>
  <line x1="565" y1="252" x2="565" y2="292" stroke="#fcee0a" stroke-width="2" marker-end="url(#a)" opacity="0.85"/>

  <!-- binary search loop -->
  <path d="M472,318 L140,318 L125,220" stroke="#5fe3b0" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="300" y="312" text-anchor="middle" font-size="10.5" fill="#5fe3b0" font-family="'JetBrains Mono',monospace">binary search: ~7 questions per character</text>
</svg>
