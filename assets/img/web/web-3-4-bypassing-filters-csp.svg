<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 384" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="384" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Bypassing filters and CSP</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">a blacklist leaks; a loose CSP trusts the wrong script</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- track 1 -->
  <text x="28" y="84" font-size="12.5" fill="#00f0ff" font-weight="700">1. One-pass blacklist, nested injection</text>
  <g text-anchor="middle">
    <rect x="28" y="96" width="224" height="58" rx="7" fill="#0b1518" stroke="#00f0ff" stroke-dasharray="5 4"/>
    <text x="140" y="118" font-size="11.5" fill="#9fb0c8">Payload (nested)</text>
    <text x="140" y="138" font-size="10" fill="#00f0ff" font-family="'JetBrains Mono',monospace">&lt;scr&lt;script&gt;ipt&gt;alert(1)</text>

    <rect x="288" y="96" width="224" height="58" rx="7" fill="#111827" stroke="#263451"/>
    <text x="400" y="118" font-size="11.5" fill="#e3fffa">Blacklist removes</text>
    <text x="400" y="138" font-size="10" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">'&lt;script&gt;' once only</text>

    <rect x="548" y="96" width="224" height="58" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="660" y="118" font-size="11.5" fill="#ff2a6d" font-weight="700">Tag revived, runs</text>
    <text x="660" y="138" font-size="10" fill="#e3fffa" font-family="'JetBrains Mono',monospace">&lt;script&gt;alert(1)</text>
  </g>
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="252" y1="125" x2="284" y2="125"/>
    <line x1="512" y1="125" x2="544" y2="125"/>
  </g>

  <line x1="28" y1="184" x2="772" y2="184" stroke="#263451" stroke-width="1"/>

  <!-- track 2 -->
  <text x="28" y="210" font-size="12.5" fill="#ff2a6d" font-weight="700">2. CSP bypass via same-origin JSONP</text>
  <g text-anchor="middle">
    <rect x="28" y="222" width="236" height="58" rx="7" fill="#0b1518" stroke="#ff2a6d" stroke-dasharray="5 4"/>
    <text x="146" y="244" font-size="11.5" fill="#9fb0c8">Attacker &lt;script&gt; from 'self'</text>
    <text x="146" y="264" font-size="10" fill="#ff2a6d" font-family="'JetBrains Mono',monospace">src=/jsonp?callback=alert(1)//</text>

    <rect x="300" y="222" width="224" height="58" rx="7" fill="#111827" stroke="#263451"/>
    <text x="412" y="244" font-size="11.5" fill="#e3fffa">JSONP reflects callback</text>
    <text x="412" y="264" font-size="10" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">content-type = JS</text>

    <rect x="560" y="222" width="212" height="58" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="666" y="244" font-size="11.5" fill="#ff2a6d" font-weight="700">alert(1) runs</text>
    <text x="666" y="264" font-size="10" fill="#9fb0c8">valid under CSP</text>
  </g>
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="264" y1="251" x2="296" y2="251"/>
    <line x1="524" y1="251" x2="556" y2="251"/>
  </g>

  <!-- csp note -->
  <rect x="120" y="312" width="560" height="42" rx="7" fill="#0b1518" stroke="#5fe3b0"/>
  <text x="400" y="337" text-anchor="middle" font-size="11.5" fill="#5fe3b0">script-src 'self' trusts same-origin scripts, so it allows the JSONP tag</text>
</svg>
