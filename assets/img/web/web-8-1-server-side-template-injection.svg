<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="360" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">SSTI: input becomes template code</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">{{7*7}} -&gt; 49 means the engine evaluates the expression</text>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <g text-anchor="middle">
    <rect x="24" y="110" width="156" height="78" rx="7" fill="#111827" stroke="#00f0ff" stroke-dasharray="5 4"/>
    <text x="102" y="134" font-size="12.5" fill="#e3fffa">User input</text>
    <text x="102" y="153" font-size="10.5" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">name={{ lipsum</text>
    <text x="102" y="167" font-size="10.5" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">.__globals__ }}</text>
    <text x="102" y="182" font-size="10" fill="#6c7b93">attacker-controlled</text>

    <rect x="212" y="110" width="190" height="78" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="307" y="138" font-size="12.5" fill="#ff2a6d" font-weight="700">render_template_string</text>
    <text x="307" y="160" font-size="11" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">"Hello " + name</text>
    <text x="307" y="178" font-size="10" fill="#6c7b93">input concatenated in</text>

    <rect x="434" y="110" width="132" height="78" rx="7" fill="#111827" stroke="#263451"/>
    <text x="500" y="144" font-size="12.5" fill="#e3fffa">Jinja2 engine</text>
    <text x="500" y="164" font-size="10.5" fill="#9fb0c8">evaluates expr</text>

    <rect x="598" y="110" width="178" height="78" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="687" y="138" font-size="12.5" fill="#fcee0a" font-weight="700">reach os</text>
    <text x="687" y="160" font-size="10.5" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">os.popen('id')</text>
    <text x="687" y="178" font-size="10" fill="#6c7b93">.read()</text>
  </g>

  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="180" y1="149" x2="208" y2="149"/>
    <line x1="402" y1="149" x2="430" y2="149"/>
    <line x1="566" y1="149" x2="594" y2="149"/>
  </g>
  <line x1="687" y1="188" x2="687" y2="250" stroke="#5fe3b0" stroke-width="2" marker-end="url(#a)" fill="none"/>

  <rect x="540" y="250" width="236" height="56" rx="7" fill="#111827" stroke="#5fe3b0"/>
  <text x="658" y="274" text-anchor="middle" font-size="11.5" fill="#e3fffa">command output in response</text>
  <text x="658" y="292" text-anchor="middle" font-size="10.5" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">uid=1000(...) ...</text>

  <g font-family="'JetBrains Mono',monospace">
    <text x="24" y="276" font-size="11" fill="#00f0ff">{{7*7}} -&gt; 49</text>
    <text x="24" y="296" font-size="11" fill="#9fb0c8">detect injection</text>
    <text x="24" y="330" font-size="11" fill="#fcee0a">{{7*'7'}} -&gt; 7777777 = Jinja2 , 49 = Twig</text>
  </g>
</svg>
