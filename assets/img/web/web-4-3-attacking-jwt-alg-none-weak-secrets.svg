<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="430" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Three ways to forge a JWT</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">the signature is the only thing between role=user and role=admin</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- JWT structure -->
  <g font-size="12" text-anchor="middle">
    <rect x="150" y="80" width="150" height="46" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="225" y="100" fill="#00f0ff" font-family="'JetBrains Mono',monospace">header</text>
    <text x="225" y="117" fill="#9fb0c8" font-size="10">alg, typ (editable)</text>

    <rect x="310" y="80" width="150" height="46" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="385" y="100" fill="#00f0ff" font-family="'JetBrains Mono',monospace">payload</text>
    <text x="385" y="117" fill="#9fb0c8" font-size="10">role=user -&gt; role=admin</text>

    <rect x="470" y="80" width="180" height="46" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="560" y="100" fill="#fcee0a" font-family="'JetBrains Mono',monospace">signature</text>
    <text x="560" y="117" fill="#9fb0c8" font-size="10">the only real check</text>
  </g>
  <text x="305" y="109" font-size="16" fill="#6c7b93">.</text>
  <text x="465" y="109" font-size="16" fill="#6c7b93">.</text>

  <!-- three attack boxes -->
  <g font-size="11.5" text-anchor="middle">
    <rect x="30" y="178" width="236" height="70" rx="7" fill="#0b1518" stroke="#ff2a6d" stroke-dasharray="5 4"/>
    <text x="148" y="200" fill="#ff2a6d" font-weight="700">1. alg=none</text>
    <text x="148" y="219" fill="#9fb0c8" font-size="10.5">set {"alg":"none"}, write payload,</text>
    <text x="148" y="234" fill="#9fb0c8" font-size="10.5">leave signature empty: header.payload.</text>

    <rect x="282" y="178" width="236" height="70" rx="7" fill="#0b1518" stroke="#ff2a6d" stroke-dasharray="5 4"/>
    <text x="400" y="200" fill="#ff2a6d" font-weight="700">2. crack weak secret</text>
    <text x="400" y="219" fill="#9fb0c8" font-size="10.5">HMAC each candidate vs real sig</text>
    <text x="400" y="234" fill="#9fb0c8" font-size="10.5">secret='secret', then re-sign admin</text>

    <rect x="534" y="178" width="236" height="70" rx="7" fill="#0b1518" stroke="#ff2a6d" stroke-dasharray="5 4"/>
    <text x="652" y="200" fill="#ff2a6d" font-weight="700">3. kid injection</text>
    <text x="652" y="219" fill="#9fb0c8" font-size="10.5">kid=/dev/null -&gt; key is empty</text>
    <text x="652" y="234" fill="#9fb0c8" font-size="10.5">sign token with the empty key</text>
  </g>

  <!-- arrows from structure to attacks -->
  <line x1="300" y1="126" x2="180" y2="174" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <line x1="390" y1="126" x2="400" y2="174" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <line x1="500" y1="126" x2="620" y2="174" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>

  <!-- converge -->
  <line x1="148" y1="248" x2="340" y2="300" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <line x1="400" y1="248" x2="400" y2="300" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <line x1="652" y1="248" x2="460" y2="300" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>

  <!-- server verify -->
  <g font-size="12" text-anchor="middle">
    <rect x="300" y="304" width="200" height="46" rx="7" fill="#111827" stroke="#263451"/>
    <text x="400" y="324" fill="#e3fffa">loose verifier accepts it</text>
    <text x="400" y="340" fill="#6c7b93" font-size="10">trusts alg / reads key from token</text>
  </g>
  <line x1="400" y1="350" x2="400" y2="374" stroke="#ff2a6d" stroke-width="2" marker-end="url(#a)"/>

  <!-- flag -->
  <g font-size="12" text-anchor="middle">
    <rect x="258" y="378" width="284" height="40" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="400" y="403" fill="#fcee0a" font-family="'JetBrains Mono',monospace">/admin -&gt; FLAG{4.3_jwt_forged_admin}</text>
  </g>
</svg>
