<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="400" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Path traversal reads a file outside the folder</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">a filename parameter walks up the tree with ../</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- input -->
  <g text-anchor="middle" font-size="11.5">
    <rect x="28" y="120" width="214" height="60" rx="7" fill="#0b1518" stroke="#00f0ff" stroke-dasharray="5 4"/>
    <text x="135" y="145" fill="#e3fffa" font-size="12">?file=</text>
    <text x="135" y="164" fill="#9fb0c8" font-family="'JetBrains Mono',monospace" font-size="10.5">../../../../etc/passwd</text>
  </g>

  <!-- sink -->
  <g text-anchor="middle" font-size="11.5">
    <rect x="296" y="112" width="208" height="76" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="400" y="136" fill="#ff2a6d" font-weight="700" font-size="12">Vulnerable sink</text>
    <text x="400" y="157" fill="#9fb0c8" font-family="'JetBrains Mono',monospace" font-size="10">os.path.join(DOCS_DIR, file)</text>
    <text x="400" y="174" fill="#9fb0c8" font-family="'JetBrains Mono',monospace" font-size="10">open(path).read()</text>
  </g>

  <!-- leaked file -->
  <g text-anchor="middle" font-size="11.5">
    <rect x="558" y="112" width="214" height="76" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="665" y="136" fill="#e3fffa" font-size="12">/etc/passwd</text>
    <text x="665" y="157" fill="#fcee0a" font-family="'JetBrains Mono',monospace" font-size="9.5">root:x:0:0:root:/root:/bin/bash</text>
    <text x="665" y="173" fill="#9fb0c8" font-size="10">system file leaked</text>
  </g>

  <line x1="242" y1="150" x2="292" y2="150" stroke="#00f0ff" stroke-width="2" marker-end="url(#a)" stroke-dasharray="5 4"/>
  <line x1="504" y1="150" x2="554" y2="150" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>

  <!-- tree walk -->
  <g font-size="10.5" font-family="'JetBrains Mono',monospace" fill="#9fb0c8">
    <text x="296" y="224" fill="#6c7b93" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif" font-size="11.5">How ../ climbs out of DOCS_DIR</text>
    <text x="296" y="246">/app/docs/  ->  /app/  ->  /  ->  /etc/passwd</text>
    <text x="296" y="264" fill="#6c7b93">extra ../ is harmless; too few never reaches the root</text>
  </g>

  <!-- filter bypass -->
  <g font-size="11" font-family="'JetBrains Mono',monospace">
    <rect x="28" y="286" width="744" height="74" rx="7" fill="#0b1518" stroke="#263451"/>
    <text x="44" y="308" fill="#00f0ff" font-size="11.5" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">Beating a one-pass filter</text>
    <text x="44" y="330" fill="#9fb0c8">input   ....//            replace("../","") runs once</text>
    <text x="44" y="348" fill="#5fe3b0">result  ../              the single pass leaves a working ../</text>
  </g>

  <text x="400" y="388" text-anchor="middle" font-size="11" fill="#6c7b93">Fix: resolve with realpath and confirm the result still sits inside the intended root.</text>
</svg>
