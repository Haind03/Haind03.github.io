<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="400" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">From scope to a pentest report</text>
  <text x="400" y="54" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">agree scope, test by WSTG, score with CVSS, write the report</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- top pipeline -->
  <g font-size="11.5" text-anchor="middle">
    <rect x="24" y="78" width="170" height="54" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="109" y="101" fill="#e3fffa">Scope &amp; RoE</text>
    <text x="109" y="118" fill="#9fb0c8" font-size="10">what is in, what is out</text>

    <rect x="218" y="78" width="170" height="54" rx="7" fill="#111827" stroke="#263451"/>
    <text x="303" y="101" fill="#e3fffa">Test by WSTG</text>
    <text x="303" y="118" fill="#9fb0c8" font-size="10">checklist, no gaps</text>

    <rect x="412" y="78" width="170" height="54" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="497" y="101" fill="#ff2a6d" font-weight="700">Findings</text>
    <text x="497" y="118" fill="#9fb0c8" font-size="10">score each with CVSS</text>

    <rect x="606" y="78" width="170" height="54" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="691" y="101" fill="#5fe3b0">Report</text>
    <text x="691" y="118" fill="#9fb0c8" font-size="10">summary + findings + fix</text>
  </g>
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="194" y1="105" x2="214" y2="105"/>
    <line x1="388" y1="105" x2="408" y2="105"/>
    <line x1="582" y1="105" x2="602" y2="105"/>
  </g>

  <!-- finding card -->
  <rect x="24" y="166" width="382" height="206" rx="7" fill="#0b1518" stroke="#263451"/>
  <text x="40" y="188" font-size="12.5" fill="#e3fffa" font-weight="700">Finding F-01, anchored</text>
  <g font-size="11" font-family="'JetBrains Mono',monospace">
    <text x="40" y="210" fill="#ff2a6d">Severity Critical (9.1)</text>
    <text x="40" y="228" fill="#9fb0c8">AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H</text>
    <text x="40" y="252" fill="#e3fffa">Title  IDOR -&gt; SSTI -&gt; RCE</text>
    <text x="40" y="272" fill="#e3fffa">Impact arbitrary command execution</text>
    <text x="40" y="292" fill="#e3fffa">PoC    real request/response, steps</text>
    <text x="40" y="312" fill="#5fe3b0">Fix    authz per endpoint, no template</text>
    <text x="40" y="330" fill="#5fe3b0">       render on user input</text>
    <text x="40" y="356" fill="#6c7b93">Ref    CWE-639, CWE-1336, WSTG-ATHZ</text>
  </g>

  <!-- CVSS scale -->
  <rect x="418" y="166" width="358" height="206" rx="7" fill="#0b1518" stroke="#263451"/>
  <text x="434" y="188" font-size="12.5" fill="#e3fffa" font-weight="700">CVSS severity bands</text>
  <g font-size="11" font-family="'JetBrains Mono',monospace">
    <text x="434" y="212" fill="#9fb0c8">0.0        None</text>
    <text x="434" y="232" fill="#00f0ff">0.1 - 3.9  Low</text>
    <text x="434" y="252" fill="#fcee0a">4.0 - 6.9  Medium</text>
    <text x="434" y="272" fill="#ff2a6d">7.0 - 8.9  High</text>
    <text x="434" y="292" fill="#ff2a6d" font-weight="700">9.0 - 10.0 Critical</text>
    <text x="434" y="322" fill="#9fb0c8">PR:L -&gt; 8.8 High</text>
    <text x="434" y="340" fill="#9fb0c8">PR:N -&gt; 9.8 Critical</text>
  </g>
  <text x="434" y="360" font-size="10" fill="#6c7b93">same bug, context moves the score</text>
</svg>
