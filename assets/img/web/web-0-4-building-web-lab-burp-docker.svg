<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="350" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">The lab traffic path you control</text>
  <text x="400" y="52" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">browser -&gt; FoxyProxy -&gt; Burp (your MITM) -&gt; Docker app</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- main chain -->
  <g font-size="12.5" text-anchor="middle">
    <rect x="22" y="120" width="132" height="66" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="88" y="150" fill="#e3fffa">Browser</text>
    <text x="88" y="169" fill="#9fb0c8" font-size="10.5">test profile</text>

    <rect x="192" y="120" width="130" height="66" rx="7" fill="#111827" stroke="#263451"/>
    <text x="257" y="150" fill="#e3fffa">FoxyProxy</text>
    <text x="257" y="169" fill="#9fb0c8" font-size="10.5">on / off toggle</text>

    <rect x="360" y="120" width="162" height="66" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="441" y="148" fill="#ff2a6d" font-weight="700">Burp Proxy</text>
    <text x="441" y="169" fill="#9fb0c8" font-size="10.5">127.0.0.1:8080 (MITM)</text>

    <rect x="560" y="120" width="216" height="66" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="668" y="148" fill="#5fe3b0" font-weight="700">Docker app</text>
    <text x="668" y="169" fill="#9fb0c8" font-size="10.5">Juice Shop 127.0.0.1:8013</text>
  </g>

  <!-- arrows along the chain -->
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="154" y1="153" x2="190" y2="153"/>
    <line x1="322" y1="153" x2="358" y2="153"/>
    <line x1="522" y1="153" x2="558" y2="153"/>
  </g>

  <!-- CA cert into Burp -->
  <rect x="360" y="242" width="162" height="58" rx="7" fill="#0b1518" stroke="#fcee0a"/>
  <text x="441" y="266" text-anchor="middle" font-size="11.5" fill="#fcee0a" font-family="'JetBrains Mono',monospace">Burp CA cert</text>
  <text x="441" y="284" text-anchor="middle" font-size="10.5" fill="#9fb0c8">trusted by browser =&gt; reads HTTPS</text>
  <line x1="441" y1="242" x2="441" y2="188" stroke="#fcee0a" stroke-width="2" marker-end="url(#a)" opacity="0.85"/>

  <text x="400" y="326" text-anchor="middle" font-size="11" fill="#6c7b93" font-family="'JetBrains Mono',monospace">map the container to 127.0.0.1 only, so the vulnerable app stays on your machine</text>
</svg>
