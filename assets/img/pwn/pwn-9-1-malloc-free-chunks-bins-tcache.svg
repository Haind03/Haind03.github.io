<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="440" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Chunk layout and tcache safe-linking</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">glibc 2.39, real addresses from labs/9.1</text>

  <defs>
    <marker id="a3" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- allocated chunk layout -->
  <text x="30" y="90" font-size="13" font-weight="700" fill="#00f0ff">Allocated chunk</text>
  <g font-size="11.5">
    <rect x="30"  y="100" width="220" height="30" rx="4" fill="#111827" stroke="#263451"/>
    <text x="40" y="120" fill="#9fb0c8">prev_size (0x00)</text>
    <rect x="30"  y="130" width="220" height="30" rx="4" fill="#111827" stroke="#263451"/>
    <text x="40" y="150" fill="#9fb0c8">size_field = 0x41 (0x08)</text>
    <rect x="30"  y="160" width="220" height="56" rx="4" fill="#111827" stroke="#00f0ff"/>
    <text x="40" y="182" fill="#e3fffa">mem = chunk + 0x10</text>
    <text x="40" y="198" fill="#6c7b93" font-size="10">user data region</text>
  </g>
  <text x="140" y="92" font-size="10" fill="#6c7b93" text-anchor="middle"></text>

  <!-- freed chunk as tcache entry -->
  <text x="300" y="90" font-size="13" font-weight="700" fill="#ff2a6d">Freed: same bytes become a tcache entry</text>
  <g font-size="11.5">
    <rect x="300" y="100" width="220" height="30" rx="4" fill="#111827" stroke="#263451"/>
    <text x="310" y="120" fill="#9fb0c8">prev_size (0x00)</text>
    <rect x="300" y="130" width="220" height="30" rx="4" fill="#111827" stroke="#263451"/>
    <text x="310" y="150" fill="#9fb0c8">size_field = 0x41 (0x08)</text>
    <rect x="300" y="160" width="220" height="28" rx="4" fill="#111827" stroke="#ff2a6d"/>
    <text x="310" y="179" fill="#ff2a6d" font-weight="700">fd / next (0x10)</text>
    <text x="500" y="179" fill="#9fb0c8" font-size="10" text-anchor="end">PROTECT(mem,next)</text>
    <rect x="300" y="188" width="220" height="28" rx="4" fill="#111827" stroke="#fcee0a"/>
    <text x="310" y="207" fill="#fcee0a" font-weight="700">key (0x18)</text>
    <text x="500" y="207" fill="#9fb0c8" font-size="10" text-anchor="end">random 64-bit</text>
  </g>

  <!-- tcache bin chain -->
  <text x="30" y="250" font-size="13" font-weight="700" fill="#5fe3b0">tcache[0x40], LIFO, head first</text>
  <g font-size="12" text-anchor="middle">
    <rect x="30"  y="264" width="150" height="50" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="105" y="284" fill="#e3fffa">b (head)</text>
    <text x="105" y="300" fill="#6c7b93" font-size="10">0x4052e0</text>

    <rect x="222" y="264" width="150" height="50" rx="7" fill="#111827" stroke="#263451"/>
    <text x="297" y="284" fill="#e3fffa">a</text>
    <text x="297" y="300" fill="#6c7b93" font-size="10">0x4052a0</text>

    <rect x="414" y="264" width="130" height="50" rx="7" fill="#111827" stroke="#263451" stroke-dasharray="4 3"/>
    <text x="479" y="284" fill="#9fb0c8">NULL</text>
    <text x="479" y="300" fill="#6c7b93" font-size="10">end of list</text>
  </g>
  <line x1="180" y1="289" x2="218" y2="289" stroke="#6c7b93" stroke-width="2" marker-end="url(#a3)"/>
  <line x1="372" y1="289" x2="410" y2="289" stroke="#6c7b93" stroke-width="2" marker-end="url(#a3)"/>
  <text x="199" y="279" text-anchor="middle" font-size="9.5" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">b.fd</text>
  <text x="391" y="279" text-anchor="middle" font-size="9.5" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">a.fd</text>

  <!-- math box -->
  <g font-size="11.5" font-family="'JetBrains Mono',monospace">
    <rect x="580" y="100" width="190" height="116" rx="7" fill="#0b1518" stroke="#fcee0a" stroke-dasharray="5 4"/>
    <text x="590" y="120" fill="#fcee0a">safe-linking</text>
    <text x="590" y="140" fill="#9fb0c8" font-size="10.5">PROTECT(pos,ptr) =</text>
    <text x="590" y="154" fill="#9fb0c8" font-size="10.5">(pos&gt;&gt;12) XOR ptr</text>
    <text x="590" y="176" fill="#9fb0c8" font-size="10.5">a.fd = a&gt;&gt;12 = 0x405</text>
    <text x="590" y="192" fill="#9fb0c8" font-size="10.5">b.fd = (b&gt;&gt;12)^a</text>
    <text x="590" y="206" fill="#9fb0c8" font-size="10.5">     = 0x4056a5</text>
  </g>

  <text x="400" y="420" text-anchor="middle" font-size="11" fill="#6c7b93">Reading fd of the first chunk freed into an empty bin leaks mem &gt;&gt; 12, almost the heap base.</text>
</svg>
