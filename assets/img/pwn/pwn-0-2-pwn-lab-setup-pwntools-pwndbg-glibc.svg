<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="380" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Why the glibc version decides the exploit</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">offsets are computed against one specific libc</text>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>
  <g font-size="12.5" text-anchor="middle">
    <rect x="30" y="140" width="190" height="70" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="125" y="166" fill="#fcee0a" font-weight="700">Exploit script</text>
    <text x="125" y="186" fill="#9fb0c8" font-size="11">libc base + offset(system)</text>
    <text x="125" y="200" fill="#9fb0c8" font-size="11">offsets from glibc 2.35</text>

    <rect x="320" y="100" width="210" height="70" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="425" y="126" fill="#5fe3b0" font-weight="700">libc 2.35 (Ubuntu 22.04)</text>
    <text x="425" y="146" fill="#9fb0c8" font-size="11">offsets match, tcache present</text>
    <text x="425" y="160" fill="#5fe3b0" font-size="11">exploit works</text>

    <rect x="320" y="200" width="210" height="70" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="425" y="226" fill="#ff2a6d" font-weight="700">libc 2.31 (Ubuntu 20.04)</text>
    <text x="425" y="246" fill="#9fb0c8" font-size="11">offsets differ, jump lands wrong</text>
    <text x="425" y="260" fill="#ff2a6d" font-size="11">crash, fails silently</text>

    <rect x="590" y="140" width="180" height="70" rx="7" fill="#0b1518" stroke="#00f0ff" stroke-dasharray="5 4"/>
    <text x="680" y="166" fill="#00f0ff" font-weight="700">Challenge files</text>
    <text x="680" y="186" fill="#9fb0c8" font-size="11">libc.so.6 + ld-linux</text>
    <text x="680" y="200" fill="#9fb0c8" font-size="11">patchelf / pwninit</text>
  </g>
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <path d="M220,165 L270,165 L270,135 L316,135"/>
    <path d="M220,185 L270,185 L270,235 L316,235"/>
  </g>
  <text x="400" y="320" text-anchor="middle" font-size="11" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">strings libc.so.6 | grep "GNU C Library"</text>
  <text x="400" y="344" text-anchor="middle" font-size="11" fill="#6c7b93">Run the binary with the libc the challenge ships, not the one on your machine.</text>
</svg>
