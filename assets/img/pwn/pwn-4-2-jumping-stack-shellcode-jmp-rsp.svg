<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="400" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">jmp rsp: landing on stack shellcode</text>
  <text x="400" y="54" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">works even when ASLR is on, because it never needs the stack address</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- stack column -->
  <g font-size="12.5" text-anchor="middle">
    <rect x="60" y="90" width="220" height="50" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="170" y="112" fill="#e3fffa">'A' * offset (72)</text>
    <text x="170" y="128" fill="#6c7b93" font-size="10.5">padding up to saved RIP</text>

    <rect x="60" y="150" width="220" height="50" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="170" y="172" fill="#ff2a6d" font-weight="700">saved RIP = &amp;(jmp rsp)</text>
    <text x="170" y="188" fill="#9fb0c8" font-size="10.5">overwritten with gadget address</text>

    <rect x="60" y="210" width="220" height="50" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="170" y="232" fill="#e3fffa">shellcode</text>
    <text x="170" y="248" fill="#9fb0c8" font-size="10.5">placed right after saved RIP</text>
  </g>
  <text x="170" y="78" text-anchor="middle" font-size="11" fill="#6c7b93" font-family="'JetBrains Mono',monospace">low address</text>
  <text x="170" y="276" text-anchor="middle" font-size="11" fill="#6c7b93" font-family="'JetBrains Mono',monospace">high address</text>

  <!-- vuln ret -->
  <g font-size="12.5" text-anchor="middle">
    <rect x="360" y="150" width="140" height="50" rx="7" fill="#111827" stroke="#263451"/>
    <text x="430" y="172" fill="#e3fffa">vuln: ret</text>
    <text x="430" y="188" fill="#9fb0c8" font-size="10.5">pops saved RIP</text>
  </g>
  <line x1="280" y1="175" x2="356" y2="175" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>

  <!-- jmp rsp gadget -->
  <g font-size="12.5" text-anchor="middle">
    <rect x="550" y="150" width="190" height="50" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="645" y="172" fill="#ff2a6d" font-weight="700">jmp rsp</text>
    <text x="645" y="188" fill="#9fb0c8" font-size="10.5">opcode ff e4, fixed in no-PIE</text>
  </g>
  <line x1="500" y1="175" x2="546" y2="175" stroke="#ff2a6d" stroke-width="2" marker-end="url(#a)"/>

  <!-- jmp rsp lands back on shellcode -->
  <path d="M645,200 C645,260 430,300 170,260" fill="none" stroke="#fcee0a" stroke-width="2" marker-end="url(#a)"/>
  <text x="430" y="300" text-anchor="middle" font-size="11" fill="#fcee0a" font-family="'JetBrains Mono',monospace">rsp now points at shellcode -&gt; CPU jumps in</text>

  <!-- after ret, rsp note -->
  <g font-size="11" text-anchor="middle">
    <rect x="330" y="235" width="140" height="40" rx="7" fill="#0b1518" stroke="#00f0ff" stroke-dasharray="5 4"/>
    <text x="400" y="251" fill="#9fb0c8">after ret:</text>
    <text x="400" y="266" fill="#9fb0c8">rsp -&gt; shellcode slot</text>
  </g>
  <line x1="430" y1="200" x2="400" y2="233" stroke="#00f0ff" stroke-width="2" marker-end="url(#a)" opacity="0.8"/>

  <text x="400" y="340" text-anchor="middle" font-size="11.5" fill="#00f0ff" font-family="'JetBrains Mono',monospace">Direct jump to &amp;buf needs a known stack address: fails once ASLR is on.</text>
  <text x="400" y="362" text-anchor="middle" font-size="11" fill="#6c7b93">Requires NX off (stack RWE). With NX on, this technique fails and ROP (Part 6) is the way forward.</text>
</svg>
