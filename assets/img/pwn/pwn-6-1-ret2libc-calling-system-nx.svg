<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="380" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">ret2libc: reuse system() instead of new code</text>
  <text x="400" y="54" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">NX blocks new shellcode, but never blocks code already marked executable</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- stack chain -->
  <g font-size="12" text-anchor="middle">
    <rect x="30" y="90" width="150" height="46" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="105" y="117" fill="#e3fffa">'A' * offset (72)</text>

    <rect x="30" y="140" width="150" height="46" rx="7" fill="#111827" stroke="#263451"/>
    <text x="105" y="167" fill="#9fb0c8">ret gadget</text>
    <text x="105" y="182" fill="#6c7b93" font-size="9.5">align rsp to 16</text>

    <rect x="30" y="192" width="150" height="46" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="105" y="214" fill="#fcee0a" font-weight="700">pop rdi ; ret</text>
    <text x="105" y="229" fill="#6c7b93" font-size="9.5">saved RIP target</text>

    <rect x="30" y="244" width="150" height="46" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="105" y="266" fill="#e3fffa">&amp;"/bin/sh"</text>
    <text x="105" y="281" fill="#6c7b93" font-size="9.5">popped into rdi</text>

    <rect x="30" y="296" width="150" height="46" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="105" y="318" fill="#ff2a6d" font-weight="700">&amp;system</text>
    <text x="105" y="333" fill="#6c7b93" font-size="9.5">next ret target</text>
  </g>

  <!-- rdi register -->
  <g font-size="12" text-anchor="middle">
    <rect x="300" y="200" width="140" height="56" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="370" y="222" fill="#fcee0a" font-weight="700">rdi</text>
    <text x="370" y="240" fill="#9fb0c8" font-size="10.5">= &amp;"/bin/sh"</text>
  </g>
  <line x1="180" y1="215" x2="296" y2="220" stroke="#fcee0a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="180" y1="267" x2="305" y2="235" stroke="#00f0ff" stroke-width="2" marker-end="url(#a)"/>

  <!-- system call -->
  <g font-size="12" text-anchor="middle">
    <rect x="560" y="140" width="190" height="60" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="655" y="165" fill="#ff2a6d" font-weight="700">system(rdi)</text>
    <text x="655" y="183" fill="#9fb0c8" font-size="10.5">runs /bin/sh via libc</text>
  </g>
  <line x1="440" y1="225" x2="560" y2="180" stroke="#ff2a6d" stroke-width="2" marker-end="url(#a)"/>
  <line x1="180" y1="319" x2="556" y2="195" stroke="#ff2a6d" stroke-width="2" marker-end="url(#a)" opacity="0.6"/>

  <!-- NX note -->
  <g font-size="11" text-anchor="middle">
    <rect x="560" y="230" width="190" height="60" rx="7" fill="#0b1518" stroke="#263451" stroke-dasharray="5 4"/>
    <text x="655" y="252" fill="#9fb0c8">NX still on</text>
    <text x="655" y="268" fill="#9fb0c8">no new code executes</text>
    <text x="655" y="282" fill="#6c7b93" font-size="9.5">only existing libc code runs</text>
  </g>

  <text x="400" y="365" text-anchor="middle" font-size="11" fill="#6c7b93">With ASLR on, system, /bin/sh, and the gadget all need the leaked libc base added first.</text>
</svg>
