<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="400" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">%n writes: exit@got becomes win</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">fmtstr_payload splits the write into two half-word stages</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <g font-size="12" text-anchor="middle">
    <rect x="30" y="100" width="170" height="54" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="115" y="122" fill="#e3fffa">%4486c</text>
    <text x="115" y="139" fill="#9fb0c8" font-size="10.5">print 4486 chars</text>

    <rect x="222" y="100" width="170" height="54" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="307" y="122" fill="#ff2a6d" font-weight="700">%9$lln</text>
    <text x="307" y="139" fill="#9fb0c8" font-size="10.5">write low word</text>

    <rect x="414" y="100" width="170" height="54" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="499" y="122" fill="#e3fffa">%186c</text>
    <text x="499" y="139" fill="#9fb0c8" font-size="10.5">print 186 more</text>

    <rect x="606" y="100" width="170" height="54" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="691" y="122" fill="#ff2a6d" font-weight="700">%10$hhn</text>
    <text x="691" y="139" fill="#9fb0c8" font-size="10.5">write high byte</text>
  </g>
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="200" y1="127" x2="218" y2="127"/>
    <line x1="392" y1="127" x2="410" y2="127"/>
    <line x1="584" y1="127" x2="602" y2="127"/>
  </g>

  <!-- target -->
  <g font-size="12.5" text-anchor="middle">
    <rect x="130" y="210" width="220" height="60" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="240" y="233" fill="#fcee0a" font-weight="700">exit@got</text>
    <text x="240" y="251" fill="#9fb0c8" font-size="10.5">0x404030, Partial RELRO = writable</text>

    <rect x="450" y="210" width="220" height="60" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="560" y="233" fill="#5fe3b0" font-weight="700">win()</text>
    <text x="560" y="251" fill="#9fb0c8" font-size="10.5">0x401186, system("/bin/sh")</text>
  </g>
  <line x1="350" y1="240" x2="446" y2="240" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <text x="400" y="232" text-anchor="middle" fill="#9fb0c8" font-size="10.5">now points to</text>
  <line x1="307" y1="154" x2="260" y2="206" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" opacity="0.85"/>
  <line x1="691" y1="154" x2="280" y2="206" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" opacity="0.85"/>

  <!-- trigger -->
  <rect x="300" y="300" width="200" height="50" rx="7" fill="#0b1518" stroke="#ff2a6d" stroke-dasharray="5 4"/>
  <text x="400" y="320" text-anchor="middle" fill="#9fb0c8" font-size="11.5">exit(0) in main</text>
  <text x="400" y="337" text-anchor="middle" fill="#9fb0c8" font-size="10.5">jumps through exit@got -> win</text>
  <line x1="240" y1="270" x2="360" y2="296" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" opacity="0.85"/>

  <text x="400" y="380" text-anchor="middle" font-size="11" fill="#6c7b93">no-PIE keeps the GOT and win at fixed addresses, so no leak is needed.</text>
</svg>
