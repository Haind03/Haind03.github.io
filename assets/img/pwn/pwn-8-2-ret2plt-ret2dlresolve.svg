<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="440" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">No leak: ret2plt vs ret2dlresolve</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">both reuse fixed No-PIE addresses instead of a libc base</text>

  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- Part A: ret2plt -->
  <text x="30" y="90" font-size="13" font-weight="700" fill="#5fe3b0">A. ret2plt (function already imported)</text>
  <g font-size="12" text-anchor="middle">
    <rect x="28"  y="104" width="130" height="46" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="93" y="124" fill="#e3fffa">pop rdi ; ret</text>
    <text x="93" y="138" fill="#6c7b93" font-size="10">push "/bin/sh"</text>

    <rect x="196" y="104" width="150" height="46" rx="7" fill="#111827" stroke="#263451"/>
    <text x="271" y="124" fill="#e3fffa">&amp;"/bin/sh"</text>
    <text x="271" y="138" fill="#6c7b93" font-size="10">string in .rodata</text>

    <rect x="384" y="104" width="150" height="46" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="459" y="124" fill="#fcee0a" font-weight="700">system@plt</text>
    <text x="459" y="138" fill="#6c7b93" font-size="10">fixed stub, self-resolves</text>

    <rect x="572" y="104" width="190" height="46" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="667" y="124" fill="#5fe3b0" font-weight="700">system("/bin/sh")</text>
    <text x="667" y="138" fill="#6c7b93" font-size="10">shell, no libc leak</text>
  </g>
  <line x1="158" y1="127" x2="192" y2="127" stroke="#6c7b93" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="346" y1="127" x2="380" y2="127" stroke="#6c7b93" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="534" y1="127" x2="568" y2="127" stroke="#6c7b93" stroke-width="2" marker-end="url(#a2)"/>

  <!-- Part B: ret2dlresolve -->
  <text x="30" y="200" font-size="13" font-weight="700" fill="#ff2a6d">B. ret2dlresolve (nothing is imported)</text>

  <g font-size="12" text-anchor="middle">
    <rect x="28"  y="214" width="190" height="56" rx="7" fill="#111827" stroke="#00f0ff" stroke-dasharray="5 4"/>
    <text x="123" y="236" fill="#e3fffa">read(0, .bss, len)</text>
    <text x="123" y="252" fill="#6c7b93" font-size="10">stage 1: forged Rela+Sym+"system"</text>

    <rect x="256" y="214" width="190" height="56" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="351" y="232" fill="#ff2a6d" font-weight="700">PLT[0]</text>
    <text x="351" y="248" fill="#9fb0c8" font-size="10">reloc_index = 0x309 (forged)</text>

    <rect x="484" y="214" width="150" height="56" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="559" y="232" fill="#fcee0a" font-weight="700">_dl_runtime_resolve</text>
    <text x="559" y="248" fill="#9fb0c8" font-size="10">trusts our fake structs</text>

    <rect x="672" y="214" width="100" height="56" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="722" y="236" fill="#5fe3b0" font-weight="700">system()</text>
    <text x="722" y="250" fill="#6c7b93" font-size="10">resolved live</text>
  </g>
  <line x1="218" y1="242" x2="252" y2="242" stroke="#00f0ff" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="446" y1="242" x2="480" y2="242" stroke="#ff2a6d" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="634" y1="242" x2="668" y2="242" stroke="#fcee0a" stroke-width="2" marker-end="url(#a2)"/>

  <!-- forged blob detail -->
  <g font-size="11" text-anchor="middle">
    <rect x="60" y="300" width="130" height="70" rx="6" fill="#0b1518" stroke="#263451" stroke-dasharray="4 3"/>
    <text x="125" y="318" fill="#9fb0c8">Elf64_Rela</text>
    <text x="125" y="333" fill="#6c7b93" font-size="10">r_offset, r_info</text>
    <rect x="210" y="300" width="130" height="70" rx="6" fill="#0b1518" stroke="#263451" stroke-dasharray="4 3"/>
    <text x="275" y="318" fill="#9fb0c8">Elf64_Sym</text>
    <text x="275" y="333" fill="#6c7b93" font-size="10">st_name offset</text>
    <rect x="360" y="300" width="130" height="70" rx="6" fill="#0b1518" stroke="#263451" stroke-dasharray="4 3"/>
    <text x="425" y="318" fill="#9fb0c8">"system\0"</text>
    <text x="425" y="333" fill="#6c7b93" font-size="10">.dynstr-style name</text>
    <rect x="510" y="300" width="130" height="70" rx="6" fill="#0b1518" stroke="#263451" stroke-dasharray="4 3"/>
    <text x="575" y="318" fill="#9fb0c8">"/bin/sh\0"</text>
    <text x="575" y="333" fill="#6c7b93" font-size="10">arg string, rdi target</text>
  </g>
  <text x="400" y="296" text-anchor="middle" font-size="11" fill="#6c7b93">forged blob placed at data_addr (.bss)</text>

  <text x="400" y="404" text-anchor="middle" font-size="11" fill="#6c7b93">Both need Partial RELRO + lazy binding + No-PIE. Full RELRO blocks both.</text>
</svg>
