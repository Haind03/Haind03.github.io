<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="380" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Finding the offset to saved RIP with a cyclic pattern</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">every 4-byte window of the pattern is unique</text>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/></marker></defs>
  <g font-size="12" text-anchor="middle">
    <rect x="28" y="92" width="160" height="62" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="108" y="116" fill="#e3fffa">cyclic(200)</text>
    <text x="108" y="134" fill="#6c7b93" font-size="10.5" font-family="'JetBrains Mono',monospace">aaaabaaacaaad...</text>
    <rect x="228" y="92" width="160" height="62" rx="7" fill="#0b1518" stroke="#ff2a6d" stroke-dasharray="5 4"/>
    <text x="308" y="116" fill="#e3fffa">run &lt; pat.txt</text>
    <text x="308" y="134" fill="#6c7b93" font-size="10.5">input overflows buf</text>
    <rect x="428" y="92" width="160" height="62" rx="7" fill="#111827" stroke="#263451"/>
    <text x="508" y="116" fill="#e3fffa">SIGSEGV at ret</text>
    <text x="508" y="134" fill="#6c7b93" font-size="10.5">x/s  = "saaa..."</text>
    <rect x="628" y="92" width="144" height="62" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="700" y="116" fill="#e3fffa">cyclic_find</text>
    <text x="700" y="134" fill="#5fe3b0" font-family="'JetBrains Mono',monospace" font-size="11">('saaa') = 72</text>
  </g>
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="188" y1="123" x2="224" y2="123"/>
    <line x1="388" y1="123" x2="424" y2="123"/>
    <line x1="588" y1="123" x2="624" y2="123"/>
  </g>
  <text x="28" y="200" font-size="12.5" font-weight="700" fill="#e3fffa">Pattern on the stack at the crash</text>
  <g font-size="11" text-anchor="middle" font-family="'JetBrains Mono',monospace">
    <rect x="28" y="214" width="450" height="46" rx="0" fill="#111827" stroke="#00f0ff"/>
    <text x="253" y="242" fill="#e3fffa">buf[64] + padding + saved RBP = 72 bytes</text>
    <rect x="478" y="214" width="150" height="46" rx="0" fill="#111827" stroke="#fcee0a"/>
    <text x="553" y="242" fill="#e3fffa">saved RIP "saaa"</text>
    <rect x="628" y="214" width="144" height="46" rx="0" fill="#111827" stroke="#263451"/>
    <text x="700" y="242" fill="#9fb0c8">rest of pattern</text>
  </g>
  <g font-size="11.5" font-family="'JetBrains Mono',monospace" fill="#9fb0c8">
    <text x="28" y="296">x/8gx      examine memory</text>
    <text x="28" y="316">vmmap          regions and permissions</text>
    <text x="28" y="336">got / plt      entries and targets</text>
    <text x="420" y="296">telescope  10   follow pointers</text>
    <text x="420" y="316">cyclic -l saaa      offset inside gdb</text>
    <text x="420" y="336">break vuln, stepi, continue</text>
  </g>
</svg>
