<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="460" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Linux x86-64 process memory layout</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">high addresses at the top, page permissions on the right</text>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>
  <g font-size="12.5" text-anchor="middle">
    <rect x="200" y="76" width="300" height="52" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="350" y="98" fill="#e3fffa" font-weight="700">[stack]</text>
    <text x="350" y="116" fill="#9fb0c8" font-size="11">locals, saved RBP, saved RIP</text>

    <rect x="200" y="140" width="300" height="46" rx="7" fill="#0b1518" stroke="#263451" stroke-dasharray="5 4"/>
    <text x="350" y="168" fill="#6c7b93" font-size="11">unused gap</text>

    <rect x="200" y="198" width="300" height="52" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="350" y="220" fill="#e3fffa" font-weight="700">mmap region / libc.so.6</text>
    <text x="350" y="238" fill="#9fb0c8" font-size="11">base found by ret2libc</text>

    <rect x="200" y="262" width="300" height="46" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="350" y="282" fill="#e3fffa" font-weight="700">[heap]</text>
    <text x="350" y="298" fill="#9fb0c8" font-size="11">malloc, grows up via brk</text>

    <rect x="200" y="320" width="300" height="34" rx="7" fill="#111827" stroke="#263451"/>
    <text x="350" y="342" fill="#e3fffa">.data / .bss</text>

    <rect x="200" y="362" width="300" height="34" rx="7" fill="#111827" stroke="#263451"/>
    <text x="350" y="384" fill="#e3fffa">.rodata</text>

    <rect x="200" y="404" width="300" height="34" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="350" y="426" fill="#e3fffa">.text (program code)</text>
  </g>
  <g font-size="12" font-family="'JetBrains Mono',monospace" fill="#9fb0c8">
    <text x="520" y="106">rw-p  no x, NX blocks shellcode</text>
    <text x="520" y="228">r-xp code / rw-p data</text>
    <text x="520" y="290">rw-p</text>
    <text x="520" y="342">rw-p</text>
    <text x="520" y="384">r--p</text>
    <text x="520" y="426" fill="#5fe3b0">r-xp  runs, never writable</text>
  </g>
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="150" y1="90" x2="150" y2="130"/>
    <line x1="150" y1="300" x2="150" y2="262"/>
  </g>
  <g font-size="11" fill="#9fb0c8" text-anchor="middle">
    <text x="100" y="106">grows down</text>
    <text x="100" y="284">grows up</text>
  </g>
  <text x="32" y="160" font-size="11" fill="#6c7b93" font-family="'JetBrains Mono',monospace">0x7fff...</text>
  <text x="32" y="430" font-size="11" fill="#6c7b93" font-family="'JetBrains Mono',monospace">0x400000</text>
</svg>
