<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="400" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">GOT overwrite: redirecting puts() into win()</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">format string %n write primitive flips one pointer in .got.plt</text>

  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- call chain -->
  <g font-size="12.5" text-anchor="middle">
    <rect x="28" y="88" width="150" height="48" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="103" y="108" fill="#e3fffa">call puts@plt</text>
    <text x="103" y="123" fill="#6c7b93" font-size="10.5">fixed stub address</text>

    <rect x="226" y="88" width="150" height="48" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="301" y="108" fill="#ff2a6d" font-weight="700">jmp [puts@got]</text>
    <text x="301" y="123" fill="#9fb0c8" font-size="10.5">0x404008</text>

    <rect x="424" y="88" width="170" height="48" rx="7" fill="#111827" stroke="#263451" stroke-dasharray="5 4"/>
    <text x="509" y="108" fill="#9fb0c8">before: real puts()</text>
    <text x="509" y="123" fill="#6c7b93" font-size="10.5">libc.so.6 (0x7f...)</text>
  </g>
  <line x1="178" y1="112" x2="222" y2="112" stroke="#6c7b93" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="376" y1="112" x2="420" y2="112" stroke="#6c7b93" stroke-width="2" marker-end="url(#a1)" opacity="0.6"/>

  <!-- write primitive -->
  <g font-size="12.5" text-anchor="middle">
    <rect x="28" y="178" width="220" height="56" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="138" y="200" fill="#fcee0a" font-weight="700">printf(buf) bug</text>
    <text x="138" y="217" fill="#9fb0c8" font-size="10.5">%hhn writes 3 low bytes</text>
    <text x="138" y="230" fill="#6c7b93" font-size="10">offset found via %6$p marker</text>
  </g>
  <line x1="138" y1="178" x2="138" y2="140" stroke="#fcee0a" stroke-width="2" marker-end="url(#a1)"/>

  <!-- target -->
  <g font-size="12.5" text-anchor="middle">
    <rect x="300" y="178" width="200" height="56" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="400" y="200" fill="#ff2a6d" font-weight="700">puts@got = &amp;win</text>
    <text x="400" y="217" fill="#9fb0c8" font-size="10.5">0x404008 overwritten</text>
    <text x="400" y="230" fill="#6c7b93" font-size="10">Partial RELRO: .got.plt is rw-</text>
  </g>
  <line x1="248" y1="206" x2="296" y2="206" stroke="#fcee0a" stroke-width="2" marker-end="url(#a1)"/>

  <g font-size="12.5" text-anchor="middle">
    <rect x="552" y="178" width="220" height="56" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="662" y="200" fill="#5fe3b0" font-weight="700">win()</text>
    <text x="662" y="217" fill="#9fb0c8" font-size="10.5">write(1, msg) + system("/bin/sh")</text>
    <text x="662" y="230" fill="#6c7b93" font-size="10">never calls puts (no recursion)</text>
  </g>
  <line x1="500" y1="206" x2="548" y2="206" stroke="#ff2a6d" stroke-width="2" marker-end="url(#a1)"/>

  <!-- second call -->
  <g font-size="12.5" text-anchor="middle">
    <rect x="300" y="280" width="200" height="48" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="400" y="300" fill="#e3fffa">puts("goodbye")</text>
    <text x="400" y="315" fill="#6c7b93" font-size="10.5">2nd call, same stub</text>
  </g>
  <line x1="400" y1="280" x2="400" y2="234" stroke="#00f0ff" stroke-width="2" marker-end="url(#a1)"/>
  <path d="M400,280 C400,255 480,255 552,206" stroke="#5fe3b0" stroke-width="2" fill="none" marker-end="url(#a1)"/>

  <text x="400" y="368" text-anchor="middle" font-size="11" fill="#6c7b93">Full RELRO locks the whole GOT read-only at load time and blocks this entire path.</text>
</svg>
