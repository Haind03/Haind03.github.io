<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="380" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">First five minutes with an unknown binary</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">each tool answers one question</text>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/></marker></defs>
  <g font-size="12" text-anchor="middle">
    <rect x="28" y="88" width="224" height="150" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="140" y="112" fill="#e3fffa" font-weight="700">checksec</text>
    <text x="140" y="130" fill="#6c7b93" font-size="10.5">what is turned on?</text>
    <text x="140" y="158" fill="#9fb0c8" font-family="'JetBrains Mono',monospace" font-size="11">RELRO  GOT writable?</text>
    <text x="140" y="176" fill="#9fb0c8" font-family="'JetBrains Mono',monospace" font-size="11">Canary  smash blocked?</text>
    <text x="140" y="194" fill="#9fb0c8" font-family="'JetBrains Mono',monospace" font-size="11">NX  stack executable?</text>
    <text x="140" y="212" fill="#9fb0c8" font-family="'JetBrains Mono',monospace" font-size="11">PIE  fixed addresses?</text>
    <rect x="288" y="88" width="224" height="150" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="400" y="112" fill="#e3fffa" font-weight="700">ROPgadget / ropper</text>
    <text x="400" y="130" fill="#6c7b93" font-size="10.5">which snippets can I reuse?</text>
    <text x="400" y="158" fill="#ff2a6d" font-family="'JetBrains Mono',monospace" font-size="11">pop rdi ; ret</text>
    <text x="400" y="176" fill="#ff2a6d" font-family="'JetBrains Mono',monospace" font-size="11">pop rsi ; ret</text>
    <text x="400" y="194" fill="#ff2a6d" font-family="'JetBrains Mono',monospace" font-size="11">ret  (stack alignment)</text>
    <text x="400" y="212" fill="#ff2a6d" font-family="'JetBrains Mono',monospace" font-size="11">syscall ; ret</text>
    <rect x="548" y="88" width="224" height="150" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="660" y="112" fill="#e3fffa" font-weight="700">one_gadget</text>
    <text x="660" y="130" fill="#6c7b93" font-size="10.5">run it on libc.so.6, not the binary</text>
    <text x="660" y="158" fill="#fcee0a" font-family="'JetBrains Mono',monospace" font-size="11">0xe3afe execve("/bin/sh")</text>
    <text x="660" y="176" fill="#9fb0c8" font-family="'JetBrains Mono',monospace" font-size="11">constraints:</text>
    <text x="660" y="194" fill="#9fb0c8" font-family="'JetBrains Mono',monospace" font-size="11">r15 == NULL</text>
    <text x="660" y="212" fill="#9fb0c8" font-family="'JetBrains Mono',monospace" font-size="11">r12 == NULL</text>
  </g>
  <text x="28" y="280" font-size="12.5" font-weight="700" fill="#e3fffa">Reading the result</text>
  <g font-size="11.5" font-family="'JetBrains Mono',monospace">
    <text x="28" y="302" fill="#5fe3b0">NX on          : no shellcode on the stack, use ret2win / ROP</text>
    <text x="28" y="320" fill="#5fe3b0">No PIE         : addresses are fixed, use them directly</text>
    <text x="28" y="338" fill="#ff2a6d">PIE / canary   : leak the base or the canary first</text>
    <text x="28" y="356" fill="#ff2a6d">Full RELRO     : GOT overwrite is off the table</text>
  </g>
</svg>
