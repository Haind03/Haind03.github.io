<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="400" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">From unknown binary to shell</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">triage answers four questions, the mitigations pick the technique</text>

  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- stage chain -->
  <g font-size="12" text-anchor="middle">
    <rect x="20"  y="90" width="108" height="56" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="74" y="113" fill="#e3fffa">Triage</text>
    <text x="74" y="130" fill="#6c7b93" font-size="10">file / checksec</text>

    <rect x="152" y="90" width="108" height="56" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="206" y="113" fill="#e3fffa">Find bug</text>
    <text x="206" y="130" fill="#6c7b93" font-size="10">read decompiler</text>

    <rect x="284" y="90" width="108" height="56" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="338" y="113" fill="#e3fffa">Primitive</text>
    <text x="338" y="130" fill="#6c7b93" font-size="10">hijack / r / w</text>

    <rect x="416" y="90" width="120" height="56" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="476" y="113" fill="#ff2a6d" font-weight="700">Decision tree</text>
    <text x="476" y="130" fill="#6c7b93" font-size="10">NX / PIE / ASLR</text>

    <rect x="568" y="90" width="100" height="56" rx="7" fill="#111827" stroke="#263451"/>
    <text x="618" y="113" fill="#e3fffa">Leak</text>
    <text x="618" y="130" fill="#6c7b93" font-size="10">canary / libc</text>

    <rect x="700" y="90" width="84" height="56" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="742" y="113" fill="#5fe3b0" font-weight="700">Exploit</text>
    <text x="742" y="130" fill="#6c7b93" font-size="10">+ stabilize</text>
  </g>

  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a1)" fill="none">
    <line x1="128" y1="118" x2="148" y2="118"/>
    <line x1="260" y1="118" x2="280" y2="118"/>
    <line x1="392" y1="118" x2="412" y2="118"/>
    <line x1="536" y1="118" x2="564" y2="118"/>
    <line x1="668" y1="118" x2="696" y2="118"/>
  </g>

  <!-- decision branches below -->
  <g font-size="11.5" font-family="'JetBrains Mono',monospace">
    <text x="30" y="200" fill="#fcee0a">NX off</text>
    <text x="30" y="216" fill="#9fb0c8">-&gt; shellcode on stack</text>

    <text x="220" y="200" fill="#fcee0a">NX on, static</text>
    <text x="220" y="216" fill="#9fb0c8">-&gt; ret2syscall</text>

    <text x="430" y="200" fill="#fcee0a">NX on, dynamic</text>
    <text x="430" y="216" fill="#9fb0c8">-&gt; leak libc, ret2libc</text>

    <text x="650" y="200" fill="#fcee0a">win() exists</text>
    <text x="650" y="216" fill="#9fb0c8">-&gt; ret2win</text>
  </g>

  <g stroke="#263451" stroke-width="1.5">
    <line x1="60" y1="146" x2="60" y2="185"/>
    <line x1="260" y1="146" x2="260" y2="185"/>
    <line x1="480" y1="146" x2="480" y2="185"/>
    <line x1="690" y1="146" x2="690" y2="185"/>
  </g>

  <!-- canary / RELRO notes -->
  <g font-size="11" text-anchor="middle">
    <rect x="130" y="270" width="230" height="56" rx="7" fill="#0b1518" stroke="#00f0ff" stroke-dasharray="5 4"/>
    <text x="245" y="291" fill="#9fb0c8">Canary ON</text>
    <text x="245" y="308" fill="#9fb0c8">-&gt; must leak canary first</text>

    <rect x="440" y="270" width="230" height="56" rx="7" fill="#0b1518" stroke="#ff2a6d" stroke-dasharray="5 4"/>
    <text x="555" y="291" fill="#9fb0c8">RELRO Partial</text>
    <text x="555" y="308" fill="#9fb0c8">-&gt; GOT overwrite viable</text>
  </g>
  <line x1="245" y1="270" x2="440" y2="146" stroke="#00f0ff" stroke-width="2" marker-end="url(#a1)" opacity="0.7"/>
  <line x1="555" y1="270" x2="470" y2="146" stroke="#ff2a6d" stroke-width="2" marker-end="url(#a1)" opacity="0.7"/>

  <text x="400" y="370" text-anchor="middle" font-size="11" fill="#6c7b93">Each mitigation only adds one more leak step before the final payload.</text>
</svg>
