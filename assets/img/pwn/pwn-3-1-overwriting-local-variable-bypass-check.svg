<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="380" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Overflowing buf into the adjacent authed flag</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">struct { char buf[32]; int authed; } s;</text>

  <!-- stack memory column: low address top, high address bottom -->
  <g font-size="12" text-anchor="middle">
    <text x="90" y="100" fill="#6c7b93" font-size="11">low address</text>
    <rect x="40" y="112" width="220" height="90" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="150" y="140" fill="#e3fffa">s.buf[32]</text>
    <text x="150" y="158" fill="#9fb0c8" font-size="11" font-family="'JetBrains Mono',monospace">32 bytes written here</text>
    <text x="150" y="176" fill="#9fb0c8" font-size="11" font-family="'JetBrains Mono',monospace">'A' * 32 fills exactly</text>

    <rect x="40" y="210" width="220" height="60" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="150" y="235" fill="#e3fffa">s.authed (int)</text>
    <text x="150" y="252" fill="#9fb0c8" font-size="11" font-family="'JetBrains Mono',monospace">at buf + 32</text>
    <text x="90" y="290" fill="#6c7b93" font-size="11">high address</text>
  </g>

  <!-- overflow bytes arrow -->
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#ff2a6d"/>
    </marker>
  </defs>
  <rect x="40" y="202" width="220" height="16" rx="4" fill="#1a0e14" stroke="#ff2a6d" stroke-dasharray="4 3"/>
  <text x="150" y="214" text-anchor="middle" font-size="10" fill="#ff2a6d" font-family="'JetBrains Mono',monospace">bytes 33-36 spill over</text>
  <line x1="150" y1="202" x2="150" y2="212" stroke="#ff2a6d" stroke-width="2" marker-end="url(#a)"/>

  <!-- payload breakdown -->
  <g font-size="12" text-anchor="middle">
    <rect x="340" y="120" width="200" height="50" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="440" y="140" fill="#e3fffa" font-family="'JetBrains Mono',monospace">b'A' * 32</text>
    <text x="440" y="157" fill="#9fb0c8" font-size="10.5">padding, fills buf</text>

    <rect x="560" y="120" width="200" height="50" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="660" y="140" fill="#ff2a6d" font-weight="700" font-family="'JetBrains Mono',monospace">b'B' * 4</text>
    <text x="660" y="157" fill="#9fb0c8" font-size="10.5">lands on authed</text>
  </g>
  <line x1="260" y1="145" x2="336" y2="145" stroke="#6c7b93" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="540" y1="145" x2="556" y2="145" stroke="#6c7b93" stroke-width="2" marker-end="url(#a2)"/>
  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- result -->
  <rect x="560" y="210" width="200" height="60" rx="7" fill="#0b1518" stroke="#5fe3b0"/>
  <text x="660" y="233" text-anchor="middle" fill="#5fe3b0" font-weight="700">authed = 0x42424242</text>
  <text x="660" y="251" text-anchor="middle" fill="#9fb0c8" font-size="11">nonzero -&gt; win() runs</text>
  <line x1="660" y1="170" x2="660" y2="206" stroke="#6c7b93" stroke-width="2" marker-end="url(#a2)"/>

  <!-- compiler reorder warning -->
  <rect x="40" y="300" width="720" height="56" rx="7" fill="#0b1518" stroke="#263451" stroke-dasharray="5 4"/>
  <text x="400" y="322" text-anchor="middle" fill="#9fb0c8" font-size="11.5">Without a struct, the compiler can place authed BELOW buf (lower address).</text>
  <text x="400" y="340" text-anchor="middle" fill="#9fb0c8" font-size="11.5">A struct forces declaration order, so the target is guaranteed to sit above the buffer.</text>
</svg>
