<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="400" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Two-stage leak: GOT to libc base</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">stage 1 leaks, stage 2 ret2libc with the known base</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- stage 1 row -->
  <text x="30" y="100" font-size="12.5" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">Stage 1 - leak</text>
  <g font-size="12" text-anchor="middle">
    <rect x="30" y="112" width="130" height="50" rx="7" fill="#111827" stroke="#263451"/>
    <text x="95" y="132" fill="#e3fffa">pop rdi ; ret</text>
    <text x="95" y="148" fill="#9fb0c8" font-size="10.5">(embedded gadget)</text>

    <rect x="195" y="112" width="130" height="50" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="260" y="132" fill="#fcee0a" font-weight="700">puts@got</text>
    <text x="260" y="148" fill="#9fb0c8" font-size="10.5">arg = libc ptr</text>

    <rect x="360" y="112" width="130" height="50" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="425" y="132" fill="#ff2a6d" font-weight="700">puts@plt</text>
    <text x="425" y="148" fill="#9fb0c8" font-size="10.5">call, prints leak</text>

    <rect x="525" y="112" width="130" height="50" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="590" y="132" fill="#e3fffa">main</text>
    <text x="590" y="148" fill="#9fb0c8" font-size="10.5">return for round 2</text>
  </g>
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="160" y1="137" x2="191" y2="137"/>
    <line x1="325" y1="137" x2="356" y2="137"/>
    <line x1="490" y1="137" x2="521" y2="137"/>
  </g>

  <!-- compute base -->
  <rect x="195" y="200" width="260" height="46" rx="7" fill="#111827" stroke="#fcee0a" stroke-dasharray="5 4"/>
  <text x="325" y="220" text-anchor="middle" fill="#9fb0c8" font-size="11.5" font-family="'JetBrains Mono',monospace">libc.address = leak - libc.sym['puts']</text>
  <text x="325" y="236" text-anchor="middle" fill="#9fb0c8" font-size="10.5">assert base &amp; 0xfff == 0</text>
  <line x1="425" y1="162" x2="325" y2="196" stroke="#fcee0a" stroke-width="2" marker-end="url(#a)" opacity="0.85"/>

  <!-- stage 2 row -->
  <text x="30" y="300" font-size="12.5" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">Stage 2 - ret2libc</text>
  <g font-size="12" text-anchor="middle">
    <rect x="30" y="312" width="130" height="50" rx="7" fill="#111827" stroke="#263451"/>
    <text x="95" y="332" fill="#e3fffa">ret</text>
    <text x="95" y="348" fill="#9fb0c8" font-size="10.5">align 16 bytes</text>

    <rect x="195" y="312" width="150" height="50" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="270" y="332" fill="#fcee0a" font-weight="700">pop rdi, binsh</text>
    <text x="270" y="348" fill="#9fb0c8" font-size="10.5">libc.search</text>

    <rect x="380" y="312" width="130" height="50" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="445" y="332" fill="#ff2a6d" font-weight="700">system</text>
    <text x="445" y="348" fill="#9fb0c8" font-size="10.5">libc.sym</text>

    <rect x="545" y="312" width="130" height="50" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="610" y="332" fill="#5fe3b0" font-weight="700">/bin/sh</text>
    <text x="610" y="348" fill="#9fb0c8" font-size="10.5">shell</text>
  </g>
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="160" y1="337" x2="191" y2="337"/>
    <line x1="345" y1="337" x2="376" y2="337"/>
    <line x1="510" y1="337" x2="541" y2="337"/>
  </g>
  <line x1="325" y1="246" x2="270" y2="308" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" opacity="0.85"/>

  <text x="400" y="384" text-anchor="middle" font-size="11" fill="#6c7b93">Reading the GOT is never blocked by RELRO; only writing to it is.</text>
</svg>
