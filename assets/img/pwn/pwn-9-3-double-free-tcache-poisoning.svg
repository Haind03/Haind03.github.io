<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="440" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Tcache poisoning: next -&gt; TARGET</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">count gate needs two freed chunks; next must be PROTECT()'d and 16-aligned</text>

  <defs>
    <marker id="a5" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- before poison: two chunks in bin -->
  <text x="30" y="90" font-size="13" font-weight="700" fill="#9fb0c8">1. free(0); free(1) -&gt; tcache[0x40] count = 2</text>
  <g font-size="12" text-anchor="middle">
    <rect x="30"  y="100" width="150" height="50" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="105" y="120" fill="#e3fffa">chunk1 (head)</text>
    <text x="105" y="136" fill="#6c7b93" font-size="10">fd = PROTECT(c1,c0)</text>

    <rect x="222" y="100" width="150" height="50" rx="7" fill="#111827" stroke="#263451"/>
    <text x="297" y="120" fill="#e3fffa">chunk0</text>
    <text x="297" y="136" fill="#6c7b93" font-size="10">fd = c0&gt;&gt;12 (leak!)</text>
  </g>
  <line x1="180" y1="125" x2="218" y2="125" stroke="#6c7b93" stroke-width="2" marker-end="url(#a5)"/>

  <!-- leak box -->
  <g font-size="11" font-family="'JetBrains Mono',monospace">
    <rect x="414" y="100" width="356" height="56" rx="7" fill="#0b1518" stroke="#00f0ff" stroke-dasharray="5 4"/>
    <text x="424" y="120" fill="#00f0ff">show(0) -&gt; chunk0.fd = heap_base &gt;&gt; 12</text>
    <text x="424" y="140" fill="#9fb0c8">heap_base = leak &lt;&lt; 12 (chunk0 offset &lt; 0x1000)</text>
  </g>

  <!-- poison step -->
  <text x="30" y="200" font-size="13" font-weight="700" fill="#ff2a6d">2. edit(1, PROTECT(chunk1, &amp;hook)) -&gt; poison next</text>
  <g font-size="12" text-anchor="middle">
    <rect x="30" y="214" width="180" height="50" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="120" y="234" fill="#ff2a6d" font-weight="700">chunk1.fd forged</text>
    <text x="120" y="250" fill="#9fb0c8" font-size="10">= (chunk1&gt;&gt;12) XOR &amp;hook</text>
  </g>
  <line x1="210" y1="239" x2="250" y2="239" stroke="#6c7b93" stroke-width="2" marker-end="url(#a5)"/>
  <g font-size="12" text-anchor="middle">
    <rect x="254" y="214" width="150" height="50" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="329" y="234" fill="#fcee0a" font-weight="700">&amp;hook</text>
    <text x="329" y="250" fill="#9fb0c8" font-size="10">16-byte aligned</text>
  </g>

  <!-- two mallocs -->
  <text x="30" y="310" font-size="13" font-weight="700" fill="#9fb0c8">3. alloc(2) -&gt; chunk1 ; alloc(3) -&gt; &amp;hook</text>
  <g font-size="12" text-anchor="middle">
    <rect x="30" y="324" width="150" height="50" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="105" y="344" fill="#e3fffa">alloc(2)</text>
    <text x="105" y="360" fill="#6c7b93" font-size="10">returns chunk1</text>

    <rect x="222" y="324" width="150" height="50" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="297" y="344" fill="#e3fffa">alloc(3)</text>
    <text x="297" y="360" fill="#6c7b93" font-size="10">returns &amp;hook</text>

    <rect x="424" y="324" width="160" height="50" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="504" y="344" fill="#ff2a6d" font-weight="700">edit(3, &amp;win)</text>
    <text x="504" y="360" fill="#9fb0c8" font-size="10">*hook = win</text>

    <rect x="616" y="324" width="150" height="50" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="691" y="344" fill="#5fe3b0" font-weight="700">run-hook()</text>
    <text x="691" y="360" fill="#9fb0c8" font-size="10">hook() -&gt; win()</text>
  </g>
  <line x1="180" y1="349" x2="218" y2="349" stroke="#6c7b93" stroke-width="2" marker-end="url(#a5)"/>
  <line x1="372" y1="349" x2="420" y2="349" stroke="#6c7b93" stroke-width="2" marker-end="url(#a5)"/>
  <line x1="584" y1="349" x2="612" y2="349" stroke="#6c7b93" stroke-width="2" marker-end="url(#a5)"/>

  <text x="400" y="408" text-anchor="middle" font-size="11" fill="#6c7b93">Only two chunks freed make the count gate let the second malloc return TARGET.</text>
</svg>
