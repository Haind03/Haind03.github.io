<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="400" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Stack canary: leak it, then write it back</text>
  <text x="400" y="54" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">a wrong value aborts at the epilogue; the exact value passes through</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- stack layout -->
  <g font-size="12" text-anchor="middle">
    <rect x="40" y="90" width="150" height="46" rx="7" fill="#111827" stroke="#263451"/>
    <text x="115" y="117" fill="#9fb0c8">local buffer</text>

    <rect x="40" y="140" width="150" height="46" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="115" y="162" fill="#fcee0a" font-weight="700">CANARY (8 B)</text>
    <text x="115" y="177" fill="#6c7b93" font-size="9.5">last byte always 0x00</text>

    <rect x="40" y="190" width="150" height="40" rx="7" fill="#111827" stroke="#263451"/>
    <text x="115" y="214" fill="#9fb0c8">saved RBP</text>

    <rect x="40" y="234" width="150" height="40" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="115" y="258" fill="#ff2a6d" font-weight="700">saved RIP</text>
  </g>

  <!-- leak path -->
  <g font-size="11.5" text-anchor="middle">
    <rect x="280" y="90" width="210" height="60" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="385" y="112" fill="#00f0ff" font-weight="700">printf(buf)</text>
    <text x="385" y="128" fill="#9fb0c8" font-size="10.5">format string: %15$p reads</text>
    <text x="385" y="142" fill="#9fb0c8" font-size="10.5">the canary slot straight out</text>
  </g>
  <line x1="190" y1="163" x2="276" y2="130" stroke="#00f0ff" stroke-width="2" marker-end="url(#a)"/>

  <g font-size="11.5" text-anchor="middle">
    <rect x="280" y="170" width="210" height="60" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="385" y="192" fill="#5fe3b0" font-weight="700">write canary back</text>
    <text x="385" y="208" fill="#9fb0c8" font-size="10.5">overflow payload inserts the</text>
    <text x="385" y="222" fill="#9fb0c8" font-size="10.5">exact leaked value at offset 72</text>
  </g>
  <line x1="280" y1="200" x2="190" y2="163" stroke="#5fe3b0" stroke-width="2" marker-end="url(#a)"/>

  <g font-size="11.5" text-anchor="middle">
    <rect x="550" y="130" width="190" height="60" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="645" y="152" fill="#ff2a6d" font-weight="700">epilogue check</text>
    <text x="645" y="168" fill="#9fb0c8" font-size="10.5">match -&gt; ret to win()</text>
    <text x="645" y="182" fill="#9fb0c8" font-size="10.5">mismatch -&gt; __stack_chk_fail</text>
  </g>
  <line x1="490" y1="200" x2="550" y2="170" stroke="#5fe3b0" stroke-width="2" marker-end="url(#a)"/>

  <!-- fork brute force box -->
  <g font-size="11" text-anchor="middle">
    <rect x="320" y="270" width="420" height="80" rx="7" fill="#0b1518" stroke="#fcee0a" stroke-dasharray="5 4"/>
    <text x="530" y="292" fill="#fcee0a" font-weight="700">fork server, no re-exec</text>
    <text x="530" y="310" fill="#9fb0c8">canary stays identical across every child</text>
    <text x="530" y="326" fill="#9fb0c8">brute force 1 byte at a time: 7 x 256 tries</text>
    <text x="530" y="342" fill="#6c7b93" font-size="9.5">no crash = correct byte, crash = wrong byte</text>
  </g>

  <text x="400" y="385" text-anchor="middle" font-size="11" fill="#6c7b93">A fresh exec regenerates the canary, so this brute force only works under fork.</text>
</svg>
