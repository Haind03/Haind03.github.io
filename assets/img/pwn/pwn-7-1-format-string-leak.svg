<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="400" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">printf(buf): one bug, three leaks</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">%N$p walks the argument list straight onto the stack</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- vulnerable call -->
  <rect x="30" y="90" width="200" height="54" rx="7" fill="#111827" stroke="#ff2a6d" stroke-dasharray="5 4"/>
  <text x="130" y="112" text-anchor="middle" fill="#ff2a6d" font-weight="700" font-size="12.5">printf(buf)</text>
  <text x="130" y="129" text-anchor="middle" fill="#9fb0c8" font-size="10.5">buf = user input</text>

  <!-- offset finder -->
  <rect x="280" y="90" width="200" height="54" rx="7" fill="#111827" stroke="#00f0ff"/>
  <text x="380" y="112" text-anchor="middle" fill="#e3fffa" font-size="12.5">AAAAAAAA + %N$p</text>
  <text x="380" y="129" text-anchor="middle" fill="#9fb0c8" font-size="10.5">finds our offset = 8</text>

  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="230" y1="117" x2="276" y2="117"/>
  </g>

  <!-- stack column -->
  <rect x="30" y="180" width="190" height="180" rx="7" fill="#111827" stroke="#263451"/>
  <text x="125" y="198" text-anchor="middle" fill="#9fb0c8" font-size="11" font-family="'JetBrains Mono',monospace">stack slots</text>
  <text x="45" y="220" fill="#9fb0c8" font-size="11" font-family="'JetBrains Mono',monospace">%8$p  our buf</text>
  <text x="45" y="244" fill="#fcee0a" font-size="11" font-family="'JetBrains Mono',monospace">%25$p canary (..00)</text>
  <text x="45" y="268" fill="#ff2a6d" font-size="11" font-family="'JetBrains Mono',monospace">%27$p libc ptr</text>
  <text x="45" y="292" fill="#5fe3b0" font-size="11" font-family="'JetBrains Mono',monospace">%51$p main ptr</text>
  <text x="45" y="316" fill="#9fb0c8" font-size="10.5">(ASLR: changes every run)</text>

  <!-- three derived bases -->
  <g font-size="12" text-anchor="middle">
    <rect x="280" y="180" width="200" height="46" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="380" y="200" fill="#e3fffa">canary value</text>
    <text x="380" y="216" fill="#9fb0c8" font-size="10.5">reuse it to pass the check</text>

    <rect x="280" y="238" width="200" height="46" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="380" y="258" fill="#e3fffa">libc base</text>
    <text x="380" y="274" fill="#9fb0c8" font-size="10.5">leak - fixed libc offset</text>

    <rect x="280" y="296" width="200" height="46" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="380" y="316" fill="#e3fffa">PIE base</text>
    <text x="380" y="332" fill="#9fb0c8" font-size="10.5">leak - elf.sym['main']</text>
  </g>
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="220" y1="244" x2="276" y2="203"/>
    <line x1="220" y1="268" x2="276" y2="261"/>
    <line x1="220" y1="292" x2="276" y2="319"/>
  </g>

  <!-- final read -->
  <rect x="550" y="238" width="200" height="54" rx="7" fill="#111827" stroke="#00f0ff"/>
  <text x="650" y="260" text-anchor="middle" fill="#e3fffa" font-size="12.5">%9$s + p64(addr)</text>
  <text x="650" y="277" text-anchor="middle" fill="#9fb0c8" font-size="10.5">reads any chosen address</text>
  <line x1="480" y1="265" x2="546" y2="265" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>

  <text x="400" y="380" text-anchor="middle" font-size="11" fill="#6c7b93">The leak and its use must happen in the same process; ASLR resets on a new run.</text>
</svg>
