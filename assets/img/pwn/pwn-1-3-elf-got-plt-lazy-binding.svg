<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="400" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">PLT and GOT: how a libc call is resolved</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">the first call goes through the resolver, later calls jump straight to libc</text>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/></marker></defs>
  <g font-size="12.5" text-anchor="middle">
    <rect x="28" y="90" width="150" height="56" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="103" y="114" fill="#e3fffa">your code</text>
    <text x="103" y="132" fill="#9fb0c8" font-family="'JetBrains Mono',monospace" font-size="11">call printf@plt</text>
    <rect x="228" y="90" width="150" height="56" rx="7" fill="#111827" stroke="#263451"/>
    <text x="303" y="114" fill="#e3fffa">PLT stub (r-x)</text>
    <text x="303" y="132" fill="#9fb0c8" font-family="'JetBrains Mono',monospace" font-size="11">jmp [printf@got]</text>
    <rect x="428" y="90" width="150" height="56" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="503" y="114" fill="#e3fffa">GOT entry (rw-)</text>
    <text x="503" y="132" fill="#9fb0c8" font-family="'JetBrains Mono',monospace" font-size="11">leak or overwrite</text>
    <rect x="628" y="90" width="144" height="56" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="700" y="114" fill="#e3fffa">printf in libc</text>
    <text x="700" y="132" fill="#9fb0c8" font-family="'JetBrains Mono',monospace" font-size="11">0x7fff...</text>
  </g>
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="178" y1="118" x2="224" y2="118"/>
    <line x1="378" y1="118" x2="424" y2="118"/>
    <line x1="578" y1="118" x2="624" y2="118"/>
  </g>
  <text x="28" y="196" font-size="13" font-weight="700" fill="#ff2a6d">1st call</text>
  <text x="28" y="216" font-size="11.5" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">GOT still points back into the PLT</text>
  <g font-size="12" text-anchor="middle">
    <rect x="28" y="236" width="170" height="50" rx="7" fill="#111827" stroke="#263451"/>
    <text x="113" y="257" fill="#e3fffa">PLT resolver stub</text>
    <text x="113" y="274" fill="#6c7b93" font-size="10.5">push index, jmp PLT[0]</text>
    <rect x="262" y="236" width="190" height="50" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="357" y="257" fill="#e3fffa">_dl_runtime_resolve</text>
    <text x="357" y="274" fill="#6c7b93" font-size="10.5">ld.so looks up printf</text>
    <rect x="516" y="236" width="256" height="50" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="644" y="257" fill="#e3fffa">writes the real address</text>
    <text x="644" y="274" fill="#6c7b93" font-size="10.5">into [printf@got], then jumps to printf</text>
  </g>
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="198" y1="261" x2="258" y2="261"/>
    <line x1="452" y1="261" x2="512" y2="261"/>
  </g>
  <text x="28" y="334" font-size="13" font-weight="700" fill="#5fe3b0">2nd call and later</text>
  <text x="28" y="354" font-size="11.5" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">GOT holds the libc address, so the stub jumps directly into printf</text>
  <text x="400" y="384" text-anchor="middle" font-size="11" fill="#6c7b93">Full RELRO resolves everything at startup and makes the GOT read-only.</text>
</svg>
