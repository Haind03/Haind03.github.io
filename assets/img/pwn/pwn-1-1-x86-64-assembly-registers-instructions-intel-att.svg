<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="400" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Registers, ret, and two syntaxes</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">rax sub-registers, the call/ret pair, Intel vs AT&amp;T</text>

  <g font-size="12" font-family="'JetBrains Mono',monospace">
    <rect x="30" y="76" width="340" height="110" rx="7" fill="#111827" stroke="#263451"/>
    <text x="200" y="98" text-anchor="middle" fill="#e3fffa" font-weight="700">rax sub-registers</text>
    <rect x="48" y="112" width="304" height="18" fill="#0d121d" stroke="#00f0ff"/>
    <text x="200" y="125" text-anchor="middle" fill="#9fb0c8" font-size="10.5">rax (64 bit)</text>
    <rect x="48" y="134" width="152" height="18" fill="#0d121d" stroke="#5fe3b0"/>
    <text x="124" y="147" text-anchor="middle" fill="#9fb0c8" font-size="10.5">eax (32)</text>
    <rect x="48" y="156" width="76" height="18" fill="#0d121d" stroke="#fcee0a"/>
    <text x="86" y="169" text-anchor="middle" fill="#9fb0c8" font-size="10.5">ax (16)</text>
    <rect x="48" y="178" width="38" height="16" fill="#0d121d" stroke="#ff2a6d"/>
    <text x="67" y="190" text-anchor="middle" fill="#9fb0c8" font-size="9.5">al (8)</text>
  </g>

  <g font-size="12" font-family="'JetBrains Mono',monospace" text-anchor="middle">
    <rect x="420" y="76" width="350" height="54" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="595" y="98" fill="#e3fffa">call addr</text>
    <text x="595" y="116" fill="#9fb0c8" font-size="10.5">push return addr, then jmp</text>

    <rect x="420" y="146" width="350" height="54" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="595" y="168" fill="#e3fffa">ret</text>
    <text x="595" y="186" fill="#ff2a6d" font-size="10.5">pop top of stack into rip</text>
  </g>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>
  <line x1="595" y1="130" x2="595" y2="142" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <text x="595" y="212" text-anchor="middle" font-size="11" fill="#ff2a6d">ret trusts the stack: overwrite it, control rip</text>

  <g font-size="12.5">
    <rect x="30" y="236" width="340" height="130" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="200" y="258" text-anchor="middle" fill="#5fe3b0" font-weight="700">Intel syntax (used for pwn)</text>
    <text x="48" y="282" fill="#9fb0c8" font-family="'JetBrains Mono',monospace" font-size="11.5">mov rax, rbx</text>
    <text x="48" y="304" fill="#9fb0c8" font-family="'JetBrains Mono',monospace" font-size="11.5">mov rax, [rbp-0x8]</text>
    <text x="48" y="326" fill="#6c7b93" font-size="10.5">dest, src order</text>
    <text x="48" y="346" fill="#6c7b93" font-size="10.5">objdump -M intel / set disassembly-flavor intel</text>

    <rect x="420" y="236" width="350" height="130" rx="7" fill="#111827" stroke="#263451"/>
    <text x="595" y="258" text-anchor="middle" fill="#9fb0c8" font-weight="700">AT&amp;T syntax (gdb default)</text>
    <text x="440" y="282" fill="#9fb0c8" font-family="'JetBrains Mono',monospace" font-size="11.5">movq %rbx, %rax</text>
    <text x="440" y="304" fill="#9fb0c8" font-family="'JetBrains Mono',monospace" font-size="11.5">movq -0x8(%rbp), %rax</text>
    <text x="440" y="326" fill="#6c7b93" font-size="10.5">src, dest order, % and $ prefixes</text>
  </g>
</svg>
