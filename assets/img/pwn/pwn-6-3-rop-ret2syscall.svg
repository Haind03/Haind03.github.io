<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="400" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">ret2syscall: set registers, then syscall</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">rsp walks the gadget chain; each ret pulls the next address</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- stack list on the left -->
  <g font-size="11.5" font-family="'JetBrains Mono',monospace">
    <rect x="30" y="90" width="190" height="270" rx="7" fill="#111827" stroke="#263451"/>
    <text x="125" y="108" text-anchor="middle" fill="#9fb0c8" font-size="11">stack (rsp walks down)</text>
    <text x="45" y="130" fill="#e3fffa">pop rax ; ret</text>
    <text x="45" y="148" fill="#fcee0a">59</text>
    <text x="45" y="168" fill="#e3fffa">pop rdi ; ret</text>
    <text x="45" y="186" fill="#fcee0a">&amp;"/bin/sh"</text>
    <text x="45" y="206" fill="#e3fffa">pop rsi ; ret</text>
    <text x="45" y="224" fill="#fcee0a">0</text>
    <text x="45" y="244" fill="#e3fffa">pop rdx ; ret</text>
    <text x="45" y="262" fill="#fcee0a">0</text>
    <text x="45" y="282" fill="#ff2a6d" font-weight="700">syscall</text>
  </g>

  <!-- registers on the right, filled as chain runs -->
  <g font-size="12.5" text-anchor="middle">
    <rect x="300" y="90" width="460" height="50" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="530" y="110" fill="#e3fffa">rax = 59</text>
    <text x="530" y="127" fill="#9fb0c8" font-size="10.5">execve syscall number</text>

    <rect x="300" y="152" width="460" height="50" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="530" y="172" fill="#e3fffa">rdi = address of "/bin/sh"</text>
    <text x="530" y="189" fill="#9fb0c8" font-size="10.5">argv[0], embedded or written via write4</text>

    <rect x="300" y="214" width="460" height="50" rx="7" fill="#111827" stroke="#263451"/>
    <text x="530" y="234" fill="#e3fffa">rsi = 0, rdx = 0</text>
    <text x="530" y="251" fill="#9fb0c8" font-size="10.5">argv = NULL, envp = NULL</text>

    <rect x="300" y="276" width="460" height="50" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="530" y="296" fill="#ff2a6d" font-weight="700">syscall</text>
    <text x="530" y="313" fill="#9fb0c8" font-size="10.5">kernel runs execve("/bin/sh", 0, 0)</text>
  </g>

  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="220" y1="116" x2="296" y2="116"/>
    <line x1="220" y1="178" x2="296" y2="178"/>
    <line x1="220" y1="240" x2="296" y2="240"/>
    <line x1="220" y1="282" x2="296" y2="302"/>
  </g>

  <text x="400" y="384" text-anchor="middle" font-size="11" fill="#6c7b93">A gadget with an extra pop needs a filler slot or the whole chain shifts.</text>
</svg>
