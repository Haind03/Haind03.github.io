<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="400" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Three ret2win chains, increasing difficulty</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">same workflow: measure offset, chain gadgets, align, jump</text>

  <!-- column 1: chall1 -->
  <g font-size="11.5" text-anchor="middle">
    <text x="140" y="86" fill="#00f0ff" font-weight="700">chall1 (offset 56)</text>
    <rect x="50" y="96" width="180" height="46" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="140" y="124" fill="#e3fffa" font-family="'JetBrains Mono',monospace">A*56</text>
    <rect x="50" y="150" width="180" height="46" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="140" y="178" fill="#5fe3b0" font-weight="700" font-family="'JetBrains Mono',monospace">win()</text>
    <text x="140" y="210" fill="#9fb0c8" font-size="10.5">no argument, syscalls only</text>
  </g>

  <!-- column 2: chall2 -->
  <g font-size="11.5" text-anchor="middle">
    <text x="400" y="86" fill="#fcee0a" font-weight="700">chall2 (offset 40)</text>
    <rect x="310" y="96" width="180" height="40" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="400" y="121" fill="#e3fffa" font-family="'JetBrains Mono',monospace">A*40</text>
    <rect x="310" y="142" width="180" height="40" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="400" y="167" fill="#ff2a6d" font-family="'JetBrains Mono',monospace">pop_rdi, 0xcafed00d</text>
    <rect x="310" y="188" width="180" height="36" rx="7" fill="#111827" stroke="#263451"/>
    <text x="400" y="211" fill="#e3fffa" font-family="'JetBrains Mono',monospace">ret (align)</text>
    <rect x="310" y="230" width="180" height="36" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="400" y="253" fill="#5fe3b0" font-weight="700" font-family="'JetBrains Mono',monospace">win(k)</text>
  </g>

  <!-- column 3: chall3 -->
  <g font-size="11.5" text-anchor="middle">
    <text x="660" y="86" fill="#ff2a6d" font-weight="700">chall3 (offset 56)</text>
    <rect x="570" y="96" width="180" height="32" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="660" y="117" fill="#e3fffa" font-family="'JetBrains Mono',monospace">A*56</text>
    <rect x="570" y="132" width="180" height="32" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="660" y="153" fill="#ff2a6d" font-family="'JetBrains Mono',monospace">pop_rdi, 0xc0ffee</text>
    <rect x="570" y="168" width="180" height="32" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="660" y="189" fill="#ff2a6d" font-family="'JetBrains Mono',monospace">pop_rsi, 0x1337</text>
    <rect x="570" y="204" width="180" height="28" rx="7" fill="#111827" stroke="#263451"/>
    <text x="660" y="224" fill="#e3fffa" font-family="'JetBrains Mono',monospace">ret (align)</text>
    <rect x="570" y="236" width="180" height="30" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="660" y="256" fill="#5fe3b0" font-weight="700" font-family="'JetBrains Mono',monospace">win(a, b)</text>
  </g>

  <text x="400" y="300" text-anchor="middle" font-size="11" fill="#6c7b93">Each column is one challenge's payload, low address at the top, saved RIP slot first.</text>
  <text x="400" y="320" text-anchor="middle" font-size="11" fill="#6c7b93">chall2 and chall3 call system(), so both need a ret to put RSP back on a multiple of 16.</text>
  <rect x="50" y="344" width="700" height="40" rx="7" fill="#0b1518" stroke="#263451" stroke-dasharray="5 4"/>
  <text x="400" y="368" text-anchor="middle" font-size="11.5" fill="#9fb0c8">checksec -&gt; measure offset -&gt; find gadgets -&gt; build chain -&gt; align -&gt; interactive()</text>
</svg>
