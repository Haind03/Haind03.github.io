<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="380" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">ret2win: overwriting saved RIP</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">payload = b'A' * offset + p64(win)</text>

  <!-- stack frame column -->
  <g font-size="12.5" text-anchor="middle">
    <text x="150" y="92" fill="#6c7b93" font-size="11">low address</text>
    <rect x="50" y="100" width="200" height="64" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="150" y="126" fill="#e3fffa">buf[64]</text>
    <text x="150" y="144" fill="#9fb0c8" font-size="10.5" font-family="'JetBrains Mono',monospace">'A' * 64, your data</text>

    <rect x="50" y="168" width="200" height="40" rx="7" fill="#111827" stroke="#263451"/>
    <text x="150" y="192" fill="#e3fffa">saved RBP (8)</text>

    <rect x="50" y="212" width="200" height="48" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="150" y="233" fill="#ff2a6d" font-weight="700">saved RIP (8)</text>
    <text x="150" y="250" fill="#9fb0c8" font-size="10" font-family="'JetBrains Mono',monospace">overwritten with win's addr</text>
    <text x="150" y="278" fill="#6c7b93" font-size="11">high address</text>
  </g>

  <!-- offset bracket -->
  <g font-size="11" fill="#9fb0c8">
    <line x1="30" y1="100" x2="30" y2="208" stroke="#9fb0c8" stroke-width="1.5"/>
    <text x="18" y="160" transform="rotate(-90 18 160)" text-anchor="middle">offset = 72 bytes</text>
  </g>

  <!-- ret arrow to win -->
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#5fe3b0"/>
    </marker>
  </defs>
  <path d="M250,236 C 420,236 420,150 500,150" fill="none" stroke="#5fe3b0" stroke-width="2" marker-end="url(#a)"/>
  <text x="400" y="118" text-anchor="middle" fill="#5fe3b0" font-size="11" font-family="'JetBrains Mono',monospace">ret pops the top value into RIP</text>

  <rect x="500" y="118" width="230" height="64" rx="7" fill="#111827" stroke="#5fe3b0"/>
  <text x="615" y="146" text-anchor="middle" fill="#e3fffa" font-weight="700">win()</text>
  <text x="615" y="164" text-anchor="middle" fill="#9fb0c8" font-size="11">elf.sym['win'] = 0x401176</text>

  <!-- offset measuring box -->
  <rect x="500" y="212" width="230" height="66" rx="7" fill="#0b1518" stroke="#fcee0a" stroke-dasharray="5 4"/>
  <text x="615" y="233" text-anchor="middle" fill="#fcee0a" font-size="11.5" font-family="'JetBrains Mono',monospace">cyclic(200) -&gt; crash</text>
  <text x="615" y="250" text-anchor="middle" fill="#9fb0c8" font-size="11">x/s $rsp, cyclic_find(...)</text>
  <text x="615" y="266" text-anchor="middle" fill="#9fb0c8" font-size="11">gives the real offset</text>

  <text x="400" y="316" text-anchor="middle" font-size="11" fill="#6c7b93">No canary + No PIE means the only unknown is the offset, and that is measured, not guessed.</text>
  <text x="400" y="336" text-anchor="middle" font-size="11" fill="#6c7b93">Compile flags: -fno-stack-protector -no-pie -O0</text>
</svg>
