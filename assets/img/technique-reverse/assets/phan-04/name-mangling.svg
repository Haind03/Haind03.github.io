<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="280" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#111">Name mangling: tên C++ trong binary</text>

  <rect x="260" y="54" width="200" height="40" rx="6" fill="#eafaf0" stroke="#2e8b57"/>
  <text x="360" y="79" text-anchor="middle" font-size="13" font-family="Consolas, monospace" fill="#1d5e3a">Account::check(int)</text>
  <text x="360" y="108" text-anchor="middle" font-size="11" fill="#888">compiler mã hoá tên + tham số</text>
  <path d="M360 94 L360 116" stroke="#888" stroke-width="2" marker-end="url(#a)"/>

  <!-- itanium -->
  <rect x="40" y="128" width="300" height="50" rx="6" fill="#e8f0fe" stroke="#4472c4"/>
  <text x="190" y="148" text-anchor="middle" font-size="11" fill="#1a3a6b">GCC/Clang (Itanium ABI)</text>
  <text x="190" y="168" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#1a3a6b">_ZN7Account5checkEi</text>

  <!-- msvc -->
  <rect x="380" y="128" width="300" height="50" rx="6" fill="#fdecea" stroke="#c0392b"/>
  <text x="530" y="148" text-anchor="middle" font-size="11" fill="#7b241c">MSVC</text>
  <text x="530" y="168" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#7b241c">?check@Account@@QEAAHH@Z</text>

  <text x="360" y="212" text-anchor="middle" font-size="13" fill="#333" font-weight="600">Demangle để đọc lại:</text>
  <text x="360" y="234" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#555">c++filt (GCC)   ,   undname (MSVC)   ,   IDA/Ghidra tự demangle</text>
  <text x="360" y="262" text-anchor="middle" font-size="12" fill="#c0392b">Mangling chứa cả tên class và kiểu tham số, nên overload mới phân biệt được.</text>

  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#888"/></marker></defs>
</svg>
