<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="320" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#111">Layout std::string và std::vector</text>

  <!-- vector -->
  <text x="180" y="62" text-anchor="middle" font-size="13" font-weight="600" fill="#333">std::vector = 3 con trỏ</text>
  <g font-size="11" font-family="Consolas, monospace">
    <rect x="40" y="74" width="90" height="36" fill="#e8f0fe" stroke="#4472c4"/><text x="85" y="97" text-anchor="middle" fill="#1a3a6b">begin</text>
    <rect x="130" y="74" width="90" height="36" fill="#e8f0fe" stroke="#4472c4"/><text x="175" y="97" text-anchor="middle" fill="#1a3a6b">end</text>
    <rect x="220" y="74" width="100" height="36" fill="#e8f0fe" stroke="#4472c4"/><text x="270" y="97" text-anchor="middle" fill="#1a3a6b">cap_end</text>
  </g>
  <text x="180" y="128" text-anchor="middle" font-size="10" fill="#888">size = (end - begin) / sizeof(phần tử)</text>
  <rect x="420" y="74" width="240" height="36" fill="#eafaf0" stroke="#2e8b57"/>
  <text x="540" y="97" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#1d5e3a">[ dữ liệu trên heap ]</text>
  <path d="M85 110 C85 150 400 150 420 95" fill="none" stroke="#4472c4" stroke-width="1.5" marker-end="url(#b)"/>

  <!-- string SSO -->
  <text x="360" y="196" text-anchor="middle" font-size="13" font-weight="600" fill="#333">std::string với Small String Optimization (SSO)</text>
  <text x="180" y="224" text-anchor="middle" font-size="12" fill="#2e8b57">Chuỗi ngắn: nằm ngay trong object</text>
  <g font-size="11" font-family="Consolas, monospace">
    <rect x="40" y="232" width="280" height="34" fill="#eafaf0" stroke="#2e8b57"/><text x="180" y="254" text-anchor="middle" fill="#1d5e3a">"hello\0......"  (buffer nội bộ)</text>
  </g>
  <text x="540" y="224" text-anchor="middle" font-size="12" fill="#c0392b">Chuỗi dài: con trỏ ra heap</text>
  <g font-size="11" font-family="Consolas, monospace">
    <rect x="400" y="232" width="90" height="34" fill="#fdecea" stroke="#c0392b"/><text x="445" y="254" text-anchor="middle" fill="#7b241c">ptr</text>
    <rect x="490" y="232" width="80" height="34" fill="#fdecea" stroke="#c0392b"/><text x="530" y="254" text-anchor="middle" fill="#7b241c">size</text>
    <rect x="570" y="232" width="90" height="34" fill="#fdecea" stroke="#c0392b"/><text x="615" y="254" text-anchor="middle" fill="#7b241c">cap</text>
  </g>

  <text x="360" y="298" text-anchor="middle" font-size="12" fill="#555">SSO là lý do chuỗi ngắn hiện thẳng trong bộ nhớ object, chuỗi dài thì phải follow con trỏ.</text>

  <defs><marker id="b" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4472c4"/></marker></defs>
</svg>
