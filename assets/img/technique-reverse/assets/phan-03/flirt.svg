<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="300" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#111">FLIRT signature: trước và sau</text>

  <text x="175" y="62" text-anchor="middle" font-size="14" font-weight="600" fill="#c0392b">Trước (static libc)</text>
  <g font-size="12" font-family="Consolas, monospace" fill="#7b241c">
    <rect x="40" y="74" width="270" height="150" fill="#fdecea" stroke="#c0392b"/>
    <text x="54" y="98">sub_401000</text>
    <text x="54" y="118">sub_4012A0</text>
    <text x="54" y="138">sub_401530</text>
    <text x="54" y="158">sub_401880</text>
    <text x="54" y="178">sub_401B20</text>
    <text x="54" y="198">... hàng trăm sub_ ...</text>
    <text x="54" y="218" fill="#999">không biết cái nào của tác giả</text>
  </g>

  <path d="M320 150 L380 150" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
  <text x="350" y="140" text-anchor="middle" font-size="11" fill="#666">áp</text>
  <text x="350" y="168" text-anchor="middle" font-size="10" fill="#666">FLIRT</text>

  <text x="525" y="62" text-anchor="middle" font-size="14" font-weight="600" fill="#1d5e3a">Sau</text>
  <g font-size="12" font-family="Consolas, monospace" fill="#1d5e3a">
    <rect x="390" y="74" width="270" height="150" fill="#eafaf0" stroke="#2e8b57"/>
    <text x="404" y="98">strlen</text>
    <text x="404" y="118">memcpy</text>
    <text x="404" y="138">printf</text>
    <text x="404" y="158">malloc</text>
    <text x="404" y="178" fill="#c0392b" font-weight="700">sub_401B20  &#8592; của tác giả</text>
    <text x="404" y="198">__libc_start_main</text>
    <text x="404" y="218" fill="#888">còn vài sub_ là code thật</text>
  </g>

  <text x="350" y="256" text-anchor="middle" font-size="12" fill="#333">Signature đặt tên lại các hàm thư viện đã biết.</text>
  <text x="350" y="280" text-anchor="middle" font-size="12" fill="#c0392b">Vài hàm còn sub_ chính là code của tác giả. Tập trung vào đó.</text>

  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#888"/></marker></defs>
</svg>
