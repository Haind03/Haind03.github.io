<svg xmlns="http://www.w3.org/2000/svg" width="700" height="340" viewBox="0 0 700 340" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="340" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#111">Bố cục struct trong bộ nhớ (có padding)</text>

  <text x="40" y="66" font-size="13" font-family="Consolas, monospace" fill="#333">struct Account {</text>
  <text x="60" y="88" font-size="13" font-family="Consolas, monospace" fill="#333">char   type;    // 1 byte</text>
  <text x="60" y="108" font-size="13" font-family="Consolas, monospace" fill="#333">int    id;      // 4 byte</text>
  <text x="60" y="128" font-size="13" font-family="Consolas, monospace" fill="#333">double balance; // 8 byte</text>
  <text x="40" y="148" font-size="13" font-family="Consolas, monospace" fill="#333">};</text>

  <!-- memory layout bar -->
  <text x="40" y="196" font-size="12" fill="#888">bộ nhớ (offset từ đầu struct):</text>
  <g font-size="11" font-family="Consolas, monospace">
    <rect x="40" y="206" width="40" height="44" fill="#eafaf0" stroke="#2e8b57"/><text x="60" y="233" text-anchor="middle" fill="#1d5e3a">type</text>
    <rect x="80" y="206" width="120" height="44" fill="#f4f4f4" stroke="#bbb"/><text x="140" y="233" text-anchor="middle" fill="#999">padding (3)</text>
    <rect x="200" y="206" width="160" height="44" fill="#e8f0fe" stroke="#4472c4"/><text x="280" y="233" text-anchor="middle" fill="#1a3a6b">id (4)</text>
    <rect x="360" y="206" width="300" height="44" fill="#fdecea" stroke="#c0392b"/><text x="510" y="233" text-anchor="middle" fill="#7b241c">balance (8)</text>
  </g>
  <g font-size="10" fill="#888">
    <text x="42" y="266">+0</text>
    <text x="202" y="266">+4</text>
    <text x="362" y="266">+8</text>
    <text x="636" y="266">+16</text>
  </g>

  <text x="350" y="298" text-anchor="middle" font-size="12" fill="#333">Trong asm: id = [base+4], balance = [base+8]. Offset nhảy cóc vì padding/alignment.</text>
  <text x="350" y="322" text-anchor="middle" font-size="12" fill="#c0392b">Gán kiểu struct trong IDA/Ghidra để offset biến thành tên field, pseudocode đọc được ngay.</text>
</svg>
