<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="320" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#111">Con trỏ và mảng trong bộ nhớ</text>

  <!-- pointer -->
  <text x="40" y="66" font-size="13" font-weight="600" fill="#333">Con trỏ: biến chứa địa chỉ</text>
  <rect x="40" y="76" width="120" height="40" fill="#e8f0fe" stroke="#4472c4"/>
  <text x="100" y="101" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#1a3a6b">p = 0x1040</text>
  <rect x="300" y="76" width="120" height="40" fill="#eafaf0" stroke="#2e8b57"/>
  <text x="360" y="101" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#1d5e3a">value = 42</text>
  <text x="360" y="70" text-anchor="middle" font-size="10" fill="#888">tại 0x1040</text>
  <path d="M160 96 L298 96" stroke="#4472c4" stroke-width="2" marker-end="url(#b)"/>
  <text x="470" y="100" font-size="12" font-family="Consolas, monospace" fill="#555">asm: mov rax,[p]; mov ebx,[rax]</text>

  <!-- array -->
  <text x="40" y="168" font-size="13" font-weight="600" fill="#333">Mảng: các phần tử liền nhau, truy cập [base + index*scale]</text>
  <g font-size="12" font-family="Consolas, monospace">
    <rect x="40" y="180" width="70" height="40" fill="#fff7e6" stroke="#d99a00"/><text x="75" y="205" text-anchor="middle" fill="#8a6100">a[0]</text>
    <rect x="110" y="180" width="70" height="40" fill="#fff7e6" stroke="#d99a00"/><text x="145" y="205" text-anchor="middle" fill="#8a6100">a[1]</text>
    <rect x="180" y="180" width="70" height="40" fill="#fff7e6" stroke="#d99a00"/><text x="215" y="205" text-anchor="middle" fill="#8a6100">a[2]</text>
    <rect x="250" y="180" width="70" height="40" fill="#fff7e6" stroke="#d99a00"/><text x="285" y="205" text-anchor="middle" fill="#8a6100">a[3]</text>
  </g>
  <g font-size="10" fill="#888">
    <text x="42" y="236">base+0</text><text x="112" y="236">+4</text><text x="182" y="236">+8</text><text x="252" y="236">+12</text>
  </g>
  <text x="360" y="208" font-size="12" font-family="Consolas, monospace" fill="#555">a[i] (int) -> [base + i*4]</text>

  <text x="350" y="272" text-anchor="middle" font-size="12" fill="#333">scale = kích thước phần tử (int=4, char=1, con trỏ=8).</text>
  <text x="350" y="296" text-anchor="middle" font-size="12" fill="#c0392b">Thấy [reg1 + reg2*4] là gần như chắc đang truy cập mảng int.</text>

  <defs><marker id="b" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4472c4"/></marker></defs>
</svg>
