<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="300" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="360" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#111">Từ entry point tới main thật</text>

  <rect x="30" y="70" width="150" height="60" rx="8" fill="#fff7e6" stroke="#d99a00"/>
  <text x="105" y="96" text-anchor="middle" font-size="13" font-weight="600" fill="#8a6100">Entry point</text>
  <text x="105" y="114" text-anchor="middle" font-size="11" fill="#555">AddressOfEntryPoint</text>

  <rect x="210" y="70" width="170" height="60" rx="8" fill="#e8f0fe" stroke="#4472c4"/>
  <text x="295" y="92" text-anchor="middle" font-size="13" font-weight="600" fill="#1a3a6b">CRT startup</text>
  <text x="295" y="110" text-anchor="middle" font-size="10" fill="#555">mainCRTStartup /</text>
  <text x="295" y="124" text-anchor="middle" font-size="10" fill="#555">__libc_start_main</text>

  <rect x="410" y="70" width="150" height="60" rx="8" fill="#eef6ff" stroke="#4472c4"/>
  <text x="485" y="92" text-anchor="middle" font-size="12" font-weight="600" fill="#1a3a6b">khởi tạo</text>
  <text x="485" y="110" text-anchor="middle" font-size="10" fill="#555">heap, stdio, global</text>
  <text x="485" y="124" text-anchor="middle" font-size="10" fill="#555">constructors</text>

  <rect x="590" y="70" width="100" height="60" rx="8" fill="#eafaf0" stroke="#2e8b57"/>
  <text x="640" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#1d5e3a">main()</text>
  <text x="640" y="114" text-anchor="middle" font-size="10" fill="#555">code tác giả</text>

  <path d="M180 100 L208 100" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
  <path d="M380 100 L408 100" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
  <path d="M560 100 L588 100" stroke="#888" stroke-width="2" marker-end="url(#a)"/>

  <text x="360" y="180" text-anchor="middle" font-size="13" fill="#333" font-weight="600">Mẹo tìm main thật</text>
  <text x="360" y="206" text-anchor="middle" font-size="12" fill="#555">Linux: main là tham số đầu truyền vào __libc_start_main (trong rdi).</text>
  <text x="360" y="228" text-anchor="middle" font-size="12" fill="#555">Windows: tìm hàm nhận argc/argv/envp, hoặc đi theo call tới printf/puts.</text>
  <text x="360" y="262" text-anchor="middle" font-size="12" fill="#c0392b">Đống code trước main là CRT, không phải của tác giả. Đừng phí thời gian đọc.</text>

  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#888"/></marker></defs>
</svg>
