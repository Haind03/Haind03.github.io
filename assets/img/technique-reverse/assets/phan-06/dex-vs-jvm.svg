<svg xmlns="http://www.w3.org/2000/svg" width="700" height="250" viewBox="0 0 700 250" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="250" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#111">JVM bytecode vs DEX bytecode</text>

  <rect x="30" y="56" width="310" height="150" rx="8" fill="#e8f0fe" stroke="#4472c4"/>
  <text x="185" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#1a3a6b">JVM (.class, Java SE)</text>
  <text x="185" y="104" text-anchor="middle" font-size="12" fill="#333">stack-based</text>
  <text x="50" y="132" font-size="11" font-family="Consolas,monospace" fill="#555">iload_1</text>
  <text x="50" y="150" font-size="11" font-family="Consolas,monospace" fill="#555">iload_2</text>
  <text x="50" y="168" font-size="11" font-family="Consolas,monospace" fill="#555">iadd</text>
  <text x="50" y="186" font-size="11" font-family="Consolas,monospace" fill="#555">ireturn</text>

  <rect x="360" y="56" width="310" height="150" rx="8" fill="#eafaf0" stroke="#2e8b57"/>
  <text x="515" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#1d5e3a">DEX (classes.dex, Android)</text>
  <text x="515" y="104" text-anchor="middle" font-size="12" fill="#333">register-based</text>
  <text x="380" y="132" font-size="11" font-family="Consolas,monospace" fill="#555">add-int v0, p1, p2</text>
  <text x="380" y="150" font-size="11" font-family="Consolas,monospace" fill="#555">return v0</text>
  <text x="380" y="182" font-size="11" fill="#888">ít lệnh hơn, dùng thanh ghi ảo</text>

  <text x="350" y="232" text-anchor="middle" font-size="12" fill="#555">Cả hai đều giữ tên qua constant pool, nên decompile ra Java đọc được. JADX lo phần này cho bạn.</text>
</svg>
