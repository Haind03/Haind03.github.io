<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="250" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#111">Quy trình patch APK bằng apktool</text>

  <g font-size="12">
    <rect x="20" y="70" width="120" height="70" rx="8" fill="#e8f0fe" stroke="#4472c4"/>
    <text x="80" y="98" text-anchor="middle" font-weight="600" fill="#1a3a6b">app.apk</text>
    <text x="80" y="118" text-anchor="middle" font-size="10" fill="#555">bản gốc</text>

    <rect x="180" y="70" width="140" height="70" rx="8" fill="#fff7e6" stroke="#d99a00"/>
    <text x="250" y="94" text-anchor="middle" font-weight="600" fill="#8a6100">smali/</text>
    <text x="250" y="114" text-anchor="middle" font-size="10" fill="#555">sửa hàm check</text>
    <text x="250" y="130" text-anchor="middle" font-size="10" font-family="Consolas,monospace" fill="#c0392b">const/4 v0,0x1</text>

    <rect x="360" y="70" width="140" height="70" rx="8" fill="#eafaf0" stroke="#2e8b57"/>
    <text x="430" y="98" text-anchor="middle" font-weight="600" fill="#1d5e3a">app-new.apk</text>
    <text x="430" y="118" text-anchor="middle" font-size="10" fill="#555">chưa ký</text>

    <rect x="540" y="70" width="150" height="70" rx="8" fill="#f0eefb" stroke="#6b46c1"/>
    <text x="615" y="98" text-anchor="middle" font-weight="600" fill="#45307d">app-signed.apk</text>
    <text x="615" y="118" text-anchor="middle" font-size="10" fill="#555">cài được</text>
  </g>

  <path d="M140 105 L178 105" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
  <text x="159" y="96" text-anchor="middle" font-size="9" fill="#666">apktool d</text>
  <path d="M320 105 L358 105" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
  <text x="339" y="96" text-anchor="middle" font-size="9" fill="#666">apktool b</text>
  <path d="M500 105 L538 105" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
  <text x="519" y="96" text-anchor="middle" font-size="9" fill="#666">apksigner</text>

  <text x="360" y="185" text-anchor="middle" font-size="13" fill="#333">Sửa smali chứ không sửa Java, vì không có đường biên dịch Java ngược lại DEX dễ dàng.</text>
  <text x="360" y="212" text-anchor="middle" font-size="12" fill="#c0392b">Quên bước ký lại là máy từ chối cài. Android không nhận APK không có chữ ký hợp lệ.</text>

  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#888"/></marker></defs>
</svg>
