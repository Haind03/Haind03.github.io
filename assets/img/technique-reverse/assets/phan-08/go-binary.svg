<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="300" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#111">Binary Go: to, nhưng có pclntab cứu bạn</text>
  <rect x="40" y="56" width="620" height="40" fill="#fdecea" stroke="#c0392b"/>
  <text x="54" y="80" font-size="12" font-weight="600" fill="#7b241c">runtime + GC + scheduler</text>
  <text x="360" y="80" font-size="11" fill="#555">luôn nhúng kèm, làm file phình to (hello = ~1.9 MB)</text>
  <rect x="40" y="100" width="620" height="54" fill="#eafaf0" stroke="#2e8b57"/>
  <text x="54" y="122" font-size="12" font-weight="700" fill="#1d5e3a">pclntab (program counter line table)</text>
  <text x="54" y="142" font-size="11" fill="#555">bảng tên hàm + dòng, runtime cần để in stack trace, nên SỐNG SÓT qua strip</text>
  <rect x="40" y="158" width="620" height="40" fill="#e8f0fe" stroke="#4472c4"/>
  <text x="54" y="182" font-size="12" font-weight="600" fill="#1a3a6b">main.* , code của bạn</text>
  <text x="360" y="182" font-size="11" fill="#555">lẫn giữa rừng runtime.*</text>
  <text x="350" y="232" text-anchor="middle" font-size="13" fill="#333">GoReSym đọc pclntab, trả lại tên hàm và type dù binary đã stripped.</text>
  <text x="350" y="258" text-anchor="middle" font-size="12" fill="#c0392b">Calling convention đổi: trước Go 1.17 qua stack, từ 1.17 qua register (RAX, RBX...).</text>
  <text x="350" y="284" text-anchor="middle" font-size="11" fill="#888">String Go = (con trỏ, length), không null-terminated: chuỗi dính liền thành blob.</text>
</svg>
