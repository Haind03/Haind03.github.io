<svg xmlns="http://www.w3.org/2000/svg" width="700" height="290" viewBox="0 0 700 290" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="290" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#111">Binary Rust: gần C++, inline rất mạnh</text>
  <rect x="40" y="54" width="620" height="40" fill="#fff7e6" stroke="#d99a00"/>
  <text x="54" y="78" font-size="12" font-weight="600" fill="#8a6100">Panic string</text>
  <text x="300" y="78" font-size="11" fill="#555">lộ src/main.rs:dòng, dùng làm mỏ neo định vị code</text>
  <rect x="40" y="98" width="620" height="54" fill="#e8f0fe" stroke="#4472c4"/>
  <text x="54" y="120" font-size="12" font-weight="700" fill="#1a3a6b">Mangling: legacy _ZN...  và v0 _R...</text>
  <text x="54" y="140" font-size="11" fill="#555">demangle bằng rustfilt hoặc IDA/Ghidra</text>
  <rect x="40" y="156" width="620" height="40" fill="#fdecea" stroke="#c0392b"/>
  <text x="54" y="180" font-size="12" font-weight="600" fill="#7b241c">Iterator chain, monomorphization</text>
  <text x="340" y="180" font-size="11" fill="#555">map/filter/sum bị inline thành một vòng lặp phẳng</text>
  <text x="350" y="226" text-anchor="middle" font-size="13" fill="#333">String/Vec = con trỏ + len + cap, không null-terminated (giống Go).</text>
  <text x="350" y="252" text-anchor="middle" font-size="12" fill="#c0392b">Không có GC nên đọc gần như C++, nhưng inline khiến iterator khó nhận ra gốc.</text>
  <text x="350" y="276" text-anchor="middle" font-size="11" fill="#888">trait object = fat pointer (data + vtable), dispatch qua call [vtable+offset].</text>
</svg>
