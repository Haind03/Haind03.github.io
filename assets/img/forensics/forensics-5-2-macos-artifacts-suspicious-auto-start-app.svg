<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="380" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Tracing a macOS app that auto-starts</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">from download source to persistence, usage, and the permissions it was granted</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- main chain -->
  <g font-size="12" text-anchor="middle">
    <rect x="24"  y="140" width="138" height="66" rx="7" fill="#0b1518" stroke="#00f0ff" stroke-dasharray="5 4"/>
    <text x="93"  y="164" fill="#00f0ff" font-weight="700">Download</text>
    <text x="93"  y="182" fill="#9fb0c8" font-size="10.5">quarantine + WhereFroms</text>
    <text x="93"  y="197" fill="#9fb0c8" font-size="10.5">Chrome, su.zip</text>

    <rect x="186" y="140" width="138" height="66" rx="7" fill="#111827" stroke="#263451"/>
    <text x="255" y="164" fill="#e3fffa">Dropped binary</text>
    <text x="255" y="182" fill="#9fb0c8" font-size="10" font-family="'JetBrains Mono',monospace">/Users/Shared/</text>
    <text x="255" y="196" fill="#9fb0c8" font-size="10" font-family="'JetBrains Mono',monospace">.updater/softwareupdated</text>

    <rect x="348" y="140" width="138" height="66" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="417" y="164" fill="#ff2a6d" font-weight="700">LaunchAgent plist</text>
    <text x="417" y="182" fill="#9fb0c8" font-size="10.5">RunAtLoad = 1</text>
    <text x="417" y="197" fill="#9fb0c8" font-size="10.5">KeepAlive = 1</text>

    <rect x="510" y="140" width="130" height="66" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="575" y="164" fill="#e3fffa">KnowledgeC.db</text>
    <text x="575" y="182" fill="#9fb0c8" font-size="10.5">foreground after</text>
    <text x="575" y="197" fill="#9fb0c8" font-size="10.5">each login</text>

    <rect x="664" y="140" width="112" height="66" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="720" y="164" fill="#fcee0a" font-weight="700">TCC.db</text>
    <text x="720" y="182" fill="#9fb0c8" font-size="10.5">Accessibility</text>
    <text x="720" y="197" fill="#9fb0c8" font-size="10.5">= 2 (granted)</text>
  </g>

  <!-- arrows along the chain -->
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="162" y1="173" x2="184" y2="173"/>
    <line x1="324" y1="173" x2="346" y2="173"/>
    <line x1="486" y1="173" x2="508" y2="173"/>
    <line x1="640" y1="173" x2="662" y2="173"/>
  </g>

  <!-- unified log supporting the plist -->
  <rect x="348" y="256" width="138" height="48" rx="7" fill="#0b1518" stroke="#263451"/>
  <text x="417" y="275" text-anchor="middle" font-size="11" fill="#9fb0c8">Unified log</text>
  <text x="417" y="291" text-anchor="middle" font-size="10" fill="#6c7b93" font-family="'JetBrains Mono',monospace">launchd spawned binary</text>
  <line x1="417" y1="256" x2="417" y2="208" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" opacity="0.8"/>

  <!-- boundary note -->
  <rect x="24" y="256" width="300" height="48" rx="7" fill="#0b1518" stroke="#5fe3b0"/>
  <text x="174" y="275" text-anchor="middle" font-size="11" fill="#5fe3b0">Suspect /Library and ~/Library first</text>
  <text x="174" y="291" text-anchor="middle" font-size="10.5" fill="#6c7b93">/System/Library is Apple, signed by SIP</text>

  <text x="400" y="350" text-anchor="middle" font-size="11" fill="#6c7b93">Read binary plists with plutil, not cat. KnowledgeC/TCC times need +978307200.</text>
</svg>
