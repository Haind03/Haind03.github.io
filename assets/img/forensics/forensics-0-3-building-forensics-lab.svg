<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 388" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="388" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">A forensics lab is three layers of isolation</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">read-only evidence, contained malware, separated cases</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
    <marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#5fe3b0"/>
    </marker>
  </defs>

  <!-- evidence -->
  <g text-anchor="middle">
    <rect x="24"  y="92" width="150" height="72" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="99"  y="124" font-size="13" font-weight="700" fill="#fcee0a">Evidence</text>
    <text x="99"  y="144" font-size="11" fill="#9fb0c8">disk or image</text>

    <!-- write blocker -->
    <rect x="222" y="92" width="178" height="72" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="311" y="118" font-size="12.5" font-weight="700" fill="#5fe3b0">Write blocker</text>
    <text x="311" y="137" font-size="10.5" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">mount -o ro</text>
    <text x="311" y="153" font-size="10.5" fill="#9fb0c8">reads pass, writes blocked</text>

    <!-- analysis VM -->
    <rect x="448" y="92" width="190" height="72" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="543" y="116" font-size="12.5" font-weight="700" fill="#00f0ff">Analysis VM (SIFT)</text>
    <text x="543" y="135" font-size="10.5" fill="#9fb0c8">host-only net, shares off</text>
    <text x="543" y="151" font-size="10.5" fill="#9fb0c8">clean snapshot to revert</text>

    <!-- malware sample -->
    <rect x="662" y="92" width="114" height="72" rx="7" fill="#0b1518" stroke="#ff2a6d" stroke-dasharray="5 4"/>
    <text x="719" y="120" font-size="11.5" font-weight="700" fill="#ff2a6d">Malware</text>
    <text x="719" y="138" font-size="10" fill="#9fb0c8">sample,</text>
    <text x="719" y="152" font-size="10" fill="#9fb0c8">contained</text>
  </g>

  <!-- read path (green) -->
  <line x1="174" y1="118" x2="218" y2="118" stroke="#5fe3b0" stroke-width="2" marker-end="url(#g)"/>
  <line x1="400" y1="118" x2="444" y2="118" stroke="#5fe3b0" stroke-width="2" marker-end="url(#g)"/>
  <text x="311" y="82" text-anchor="middle" font-size="9.5" fill="#5fe3b0" font-family="'JetBrains Mono',monospace">READ</text>

  <!-- blocked write path (magenta dashed) -->
  <line x1="444" y1="150" x2="402" y2="150" stroke="#ff2a6d" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="318" y1="150" x2="176" y2="150" stroke="#ff2a6d" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.5"/>
  <line x1="332" y1="138" x2="348" y2="162" stroke="#ff2a6d" stroke-width="2.5"/>
  <line x1="348" y1="138" x2="332" y2="162" stroke="#ff2a6d" stroke-width="2.5"/>
  <text x="400" y="178" text-anchor="middle" font-size="9.5" fill="#ff2a6d" font-family="'JetBrains Mono',monospace">write attempt blocked</text>

  <!-- malware containment note -->
  <text x="719" y="180" text-anchor="middle" font-size="9.5" fill="#6c7b93" font-family="'JetBrains Mono',monospace">no NAT, cannot call out</text>

  <!-- three isolation layers legend -->
  <rect x="24" y="210" width="752" height="152" rx="7" fill="#0b1518" stroke="#263451"/>
  <text x="40" y="234" font-size="12" font-weight="700" fill="#9fb0c8">Three layers, each stops one kind of accident</text>
  <g font-size="11.5">
    <text x="40" y="264" fill="#fcee0a" font-weight="700">1.</text>
    <text x="62" y="264" fill="#e3fffa">Keep evidence unchanged</text>
    <text x="330" y="264" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">write blocker / mount read-only</text>

    <text x="40" y="298" fill="#ff2a6d" font-weight="700">2.</text>
    <text x="62" y="298" fill="#e3fffa">Keep malware from escaping</text>
    <text x="330" y="298" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">isolated network, shares off, snapshots</text>

    <text x="40" y="332" fill="#00f0ff" font-weight="700">3.</text>
    <text x="62" y="332" fill="#e3fffa">Keep cases from mixing</text>
    <text x="330" y="332" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">one case = one named folder</text>
  </g>
</svg>
