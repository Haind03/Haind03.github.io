<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="430" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Read the Received chain from the bottom up</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">the top hop is nearest the recipient, the bottom hop is the true sender</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- read-up arrow -->
  <line x1="34" y1="296" x2="34" y2="104" stroke="#5fe3b0" stroke-width="2" marker-end="url(#a)" opacity="0.9"/>
  <text x="30" y="360" font-size="10" fill="#5fe3b0" transform="rotate(-90 30 360)" font-family="'JetBrains Mono',monospace">read up</text>

  <!-- Received stack -->
  <g font-family="'JetBrains Mono',monospace">
    <rect x="54" y="86" width="366" height="60" rx="7" fill="#111827" stroke="#263451"/>
    <text x="70" y="110" font-size="11" fill="#e3fffa">Received: by mbox.victim.com</text>
    <text x="70" y="130" font-size="10" fill="#6c7b93">last hop, nearest the recipient</text>

    <rect x="54" y="158" width="366" height="60" rx="7" fill="#111827" stroke="#263451"/>
    <text x="70" y="182" font-size="11" fill="#e3fffa">Received: by relay.isp.net</text>
    <text x="70" y="202" font-size="10" fill="#6c7b93">middle hop</text>

    <rect x="54" y="230" width="366" height="64" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="70" y="254" font-size="11" fill="#ff2a6d">Received: from [45.77.123.45]</text>
    <text x="70" y="274" font-size="10" fill="#9fb0c8">first hop = the true sender IP</text>
  </g>

  <!-- auth results -->
  <rect x="448" y="86" width="328" height="128" rx="7" fill="#111827" stroke="#fcee0a"/>
  <text x="466" y="110" font-size="12.5" fill="#fcee0a" font-weight="700">Authentication-Results</text>
  <text x="466" y="134" font-size="11" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">spf=fail</text>
  <text x="466" y="154" font-size="11" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">dkim=none</text>
  <text x="466" y="174" font-size="11" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">dmarc=fail (p=reject)</text>
  <text x="466" y="196" font-size="10" fill="#6c7b93" font-family="'JetBrains Mono',monospace">header.from=paypal.com</text>

  <!-- mismatch -->
  <rect x="448" y="226" width="328" height="120" rx="7" fill="#0b1518" stroke="#ff2a6d" stroke-dasharray="5 4"/>
  <text x="466" y="249" font-size="11.5" fill="#ff2a6d" font-weight="700">four fields, four mismatches</text>
  <text x="466" y="270" font-size="10" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">From: service@paypal.com</text>
  <text x="466" y="289" font-size="10" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">Return-Path: @paypa1-support.com</text>
  <text x="466" y="308" font-size="10" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">Reply-To: @secure-paypal-check.info</text>
  <text x="466" y="327" font-size="10" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">Message-ID: @relay.cheaphost.net</text>

  <text x="400" y="400" text-anchor="middle" font-size="11" fill="#6c7b93">From is just text. The Received chain, Return-Path, and the auth results are what you trust.</text>
</svg>
