<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="420" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Order of volatility</text>
  <text x="400" y="54" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">collect the most volatile first, live (RAM) before dead (disk)</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- direction arrow -->
  <line x1="26" y1="88" x2="26" y2="362" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <text x="15" y="225" text-anchor="middle" transform="rotate(-90 15 225)" font-size="10.5" fill="#6c7b93" font-family="'JetBrains Mono',monospace">order of collection</text>

  <!-- column headers -->
  <text x="252" y="73" text-anchor="middle" font-size="11.5" fill="#9fb0c8">What to collect, most volatile at top</text>
  <text x="641" y="73" text-anchor="middle" font-size="11.5" fill="#9fb0c8">Acquisition decision</text>

  <!-- volatility ladder -->
  <g font-size="12">
    <rect x="48" y="82" width="404" height="42" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="60" y="100" fill="#e3fffa">Registers, CPU cache</text>
    <text x="60" y="116" fill="#6c7b93" font-size="10.5">milliseconds, not collectable by hand</text>

    <rect x="48" y="131" width="404" height="42" rx="7" fill="#111827" stroke="#00f0ff" stroke-width="2"/>
    <text x="60" y="149" fill="#e3fffa">ARP, netstat, processes, memory</text>
    <text x="60" y="165" fill="#00f0ff" font-size="10.5">seconds to minutes - the RAM dump sits here</text>

    <rect x="48" y="180" width="404" height="42" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="60" y="198" fill="#e3fffa">Temp files, swap, pagefile.sys</text>
    <text x="60" y="214" fill="#6c7b93" font-size="10.5">fragments of RAM stored on disk</text>

    <rect x="48" y="229" width="404" height="42" rx="7" fill="#111827" stroke="#263451"/>
    <text x="60" y="247" fill="#e3fffa">Disk: system and user files</text>
    <text x="60" y="263" fill="#6c7b93" font-size="10.5">stable for months if not overwritten</text>

    <rect x="48" y="278" width="404" height="42" rx="7" fill="#111827" stroke="#263451"/>
    <text x="60" y="296" fill="#e3fffa">Remote logs, router, firewall</text>
    <text x="60" y="312" fill="#6c7b93" font-size="10.5">kept on other devices</text>

    <rect x="48" y="327" width="404" height="42" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="60" y="345" fill="#e3fffa">Physical media, backups, paper</text>
    <text x="60" y="361" fill="#6c7b93" font-size="10.5">most durable</text>
  </g>

  <!-- acquisition decision -->
  <g font-size="12" text-anchor="middle">
    <rect x="510" y="86" width="262" height="40" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="641" y="111" fill="#e3fffa">Machine ON, suspected malware</text>

    <rect x="510" y="150" width="262" height="46" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="641" y="170" fill="#e3fffa">1. Capture RAM (live)</text>
    <text x="641" y="187" fill="#9fb0c8" font-size="10.5">volatile state, keys, C2</text>

    <rect x="510" y="220" width="262" height="46" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="641" y="240" fill="#e3fffa">2. Image disk (dead)</text>
    <text x="641" y="257" fill="#9fb0c8" font-size="10.5">pull plug, then write-blocked image</text>

    <rect x="510" y="300" width="262" height="52" rx="7" fill="#0b1518" stroke="#fcee0a" stroke-dasharray="5 4"/>
    <text x="641" y="321" fill="#e3fffa">If already OFF when you arrive</text>
    <text x="641" y="338" fill="#9fb0c8" font-size="10.5">image dead, never boot it</text>
  </g>

  <!-- arrows in decision column -->
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="641" y1="126" x2="641" y2="148"/>
    <line x1="641" y1="196" x2="641" y2="218"/>
  </g>

  <text x="400" y="402" text-anchor="middle" font-size="11" fill="#6c7b93">Live first (RAM, volatile), then dead (disk image). Basis: RFC 3227.</text>
</svg>
