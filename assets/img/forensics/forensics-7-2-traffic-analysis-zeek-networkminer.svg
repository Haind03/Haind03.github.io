<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="410" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Zeek turns a pcap into joinable logs</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">one uid links the file, the connection, and the DNS name</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- top: pcap -> zeek -> log list -->
  <g font-size="12" text-anchor="middle">
    <rect x="30" y="86" width="120" height="52" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="90" y="110" fill="#e3fffa">raw pcap</text>
    <text x="90" y="127" fill="#6c7b93" font-size="10.5">one blob of bytes</text>

    <rect x="210" y="86" width="130" height="52" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="275" y="110" fill="#5fe3b0" font-weight="700">zeek -r pcap</text>
    <text x="275" y="127" fill="#9fb0c8" font-size="10.5">per-event logger</text>
  </g>
  <rect x="400" y="80" width="372" height="64" rx="7" fill="#0b1518" stroke="#263451"/>
  <text x="586" y="104" text-anchor="middle" font-size="11.5" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">conn.log  dns.log  http.log</text>
  <text x="586" y="124" text-anchor="middle" font-size="11.5" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">ssl.log  files.log  x509.log</text>

  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="150" y1="112" x2="206" y2="112"/>
    <line x1="340" y1="112" x2="396" y2="112"/>
    <line x1="586" y1="144" x2="586" y2="232"/>
  </g>

  <!-- the uid join -->
  <g font-size="12.5" text-anchor="middle">
    <rect x="40" y="248" width="196" height="72" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="138" y="274" fill="#fcee0a" font-weight="700">files.log</text>
    <text x="138" y="293" fill="#9fb0c8" font-size="10.5">mime, md5/sha1, size</text>
    <text x="138" y="309" fill="#6c7b93" font-size="10" font-family="'JetBrains Mono',monospace">conn_uids</text>

    <rect x="302" y="248" width="196" height="72" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="400" y="274" fill="#00f0ff" font-weight="700">conn.log (backbone)</text>
    <text x="400" y="293" fill="#9fb0c8" font-size="10.5">orig/resp, bytes, state</text>
    <text x="400" y="309" fill="#6c7b93" font-size="10" font-family="'JetBrains Mono',monospace">uid, id.resp_h</text>

    <rect x="564" y="248" width="196" height="72" rx="7" fill="#111827" stroke="#263451"/>
    <text x="662" y="274" fill="#e3fffa" font-weight="700">dns.log</text>
    <text x="662" y="293" fill="#9fb0c8" font-size="10.5">query, answer IP</text>
    <text x="662" y="309" fill="#6c7b93" font-size="10" font-family="'JetBrains Mono',monospace">name -&gt; resp_h</text>
  </g>

  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="236" y1="284" x2="298" y2="284"/>
    <line x1="498" y1="284" x2="560" y2="284"/>
  </g>
  <text x="267" y="276" text-anchor="middle" font-size="10" fill="#fcee0a" font-family="'JetBrains Mono',monospace">uid</text>
  <text x="531" y="276" text-anchor="middle" font-size="10" fill="#00f0ff" font-family="'JetBrains Mono',monospace">resp IP</text>

  <!-- x509 red flag -->
  <rect x="302" y="344" width="196" height="44" rx="7" fill="#0b1518" stroke="#ff2a6d" stroke-dasharray="5 4"/>
  <text x="400" y="364" text-anchor="middle" font-size="11" fill="#ff2a6d">x509.log: self-signed cert</text>
  <text x="400" y="379" text-anchor="middle" font-size="10" fill="#9fb0c8">subject = issuer, a red flag</text>
  <line x1="400" y1="320" x2="400" y2="342" stroke="#ff2a6d" stroke-width="2" marker-end="url(#a)" opacity="0.85"/>

  <text x="138" y="366" text-anchor="middle" font-size="10.5" fill="#6c7b93">NetworkMiner carves the</text>
  <text x="138" y="380" text-anchor="middle" font-size="10.5" fill="#6c7b93">file here, grouped by host</text>
</svg>
