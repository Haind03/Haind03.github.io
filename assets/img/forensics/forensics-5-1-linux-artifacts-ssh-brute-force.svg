<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="380" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">An SSH brute force, artifact by artifact</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">one weak account, then persistence and a backdoor, each step leaves a trace</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- timeline label -->
  <text x="24" y="104" font-size="11" fill="#6c7b93" font-family="'JetBrains Mono',monospace">time ----&gt;</text>

  <!-- main chain -->
  <g font-size="12" text-anchor="middle">
    <rect x="24"  y="150" width="134" height="66" rx="7" fill="#0b1518" stroke="#ff2a6d" stroke-dasharray="5 4"/>
    <text x="91"  y="174" fill="#ff2a6d" font-weight="700">Brute force</text>
    <text x="91"  y="192" fill="#9fb0c8" font-size="10.5" font-family="'JetBrains Mono',monospace">203.0.113.44</text>
    <text x="91"  y="207" fill="#9fb0c8" font-size="10.5">thousands Failed</text>

    <rect x="182" y="150" width="134" height="66" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="249" y="174" fill="#e3fffa">auth.log</text>
    <text x="249" y="192" fill="#9fb0c8" font-size="10.5">Accepted: deploy</text>
    <text x="249" y="207" fill="#9fb0c8" font-size="10.5">14:23:11 + session</text>

    <rect x="340" y="150" width="134" height="66" rx="7" fill="#111827" stroke="#263451"/>
    <text x="407" y="174" fill="#e3fffa">.bash_history</text>
    <text x="407" y="192" fill="#9fb0c8" font-size="10.5" font-family="'JetBrains Mono',monospace">wget x.sh; ./x.sh</text>
    <text x="407" y="207" fill="#9fb0c8" font-size="10.5" font-family="'JetBrains Mono',monospace">sudo su</text>

    <rect x="498" y="150" width="134" height="66" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="565" y="174" fill="#ff2a6d" font-weight="700">systemd</text>
    <text x="565" y="192" fill="#9fb0c8" font-size="10.5">.service + .timer</text>
    <text x="565" y="207" fill="#9fb0c8" font-size="10.5">reverse shell :4444</text>

    <rect x="656" y="150" width="120" height="66" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="716" y="174" fill="#fcee0a" font-weight="700">backdoor</text>
    <text x="716" y="192" fill="#9fb0c8" font-size="10.5">UID 0 in passwd</text>
    <text x="716" y="207" fill="#9fb0c8" font-size="10.5">SUID /tmp/.cache</text>
  </g>

  <!-- arrows along the chain -->
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="158" y1="183" x2="180" y2="183"/>
    <line x1="316" y1="183" x2="338" y2="183"/>
    <line x1="474" y1="183" x2="496" y2="183"/>
    <line x1="632" y1="183" x2="654" y2="183"/>
  </g>

  <!-- supporting binary login records feeding auth.log -->
  <rect x="182" y="262" width="134" height="46" rx="7" fill="#0b1518" stroke="#00f0ff" stroke-dasharray="5 4"/>
  <text x="249" y="281" text-anchor="middle" font-size="11" fill="#9fb0c8">btmp / wtmp</text>
  <text x="249" y="297" text-anchor="middle" font-size="10.5" fill="#6c7b93" font-family="'JetBrains Mono',monospace">lastb / last</text>
  <line x1="249" y1="262" x2="249" y2="218" stroke="#00f0ff" stroke-width="2" marker-end="url(#a)" opacity="0.8"/>

  <!-- stat note under backdoor -->
  <rect x="498" y="262" width="278" height="46" rx="7" fill="#0b1518" stroke="#263451"/>
  <text x="637" y="281" text-anchor="middle" font-size="11" fill="#9fb0c8">stat: compare atime / mtime / ctime</text>
  <text x="637" y="297" text-anchor="middle" font-size="10.5" fill="#6c7b93">ctime is harder to timestomp than mtime</text>

  <text x="400" y="352" text-anchor="middle" font-size="11" fill="#6c7b93">Work on a read-only image copy. An empty .bash_history can itself be the artifact.</text>
</svg>
