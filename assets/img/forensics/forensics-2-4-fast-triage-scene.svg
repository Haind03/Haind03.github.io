<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="420" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Fast triage at the scene</text>
  <text x="400" y="54" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">grab the high-value subset in minutes, not a full image in hours</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- top flow -->
  <g font-size="12.5" text-anchor="middle">
    <rect x="24" y="96" width="160" height="60" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="104" y="122" fill="#e3fffa">Live machine disk</text>
    <text x="104" y="140" fill="#6c7b93" font-size="10.5">files locked, in use</text>

    <rect x="216" y="96" width="180" height="60" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="306" y="122" fill="#e3fffa">Triage collector</text>
    <text x="306" y="140" fill="#9fb0c8" font-size="10.5" font-family="'JetBrains Mono',monospace">KAPE / CyLR</text>

    <rect x="428" y="96" width="160" height="60" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="508" y="122" fill="#e3fffa">Artifact set</text>
    <text x="508" y="140" fill="#9fb0c8" font-size="10.5">hundreds of MB</text>

    <rect x="620" y="96" width="156" height="60" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="698" y="122" fill="#e3fffa">Parse to CSV</text>
    <text x="698" y="140" fill="#9fb0c8" font-size="10.5">Eric Zimmerman</text>
  </g>

  <text x="306" y="177" text-anchor="middle" font-size="10.5" fill="#ff2a6d">raw NTFS / VSS reads locked files</text>

  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="184" y1="126" x2="214" y2="126"/>
    <line x1="396" y1="126" x2="426" y2="126"/>
    <line x1="588" y1="126" x2="618" y2="126"/>
    <line x1="500" y1="156" x2="462" y2="194"/>
    <line x1="698" y1="156" x2="698" y2="208"/>
  </g>

  <!-- artifact contents -->
  <rect x="300" y="196" width="300" height="152" rx="7" fill="#0b1518" stroke="#00f0ff" stroke-dasharray="5 4"/>
  <text x="450" y="217" text-anchor="middle" font-size="12" fill="#e3fffa">what triage grabs</text>
  <g font-size="10.5" fill="#9fb0c8">
    <text x="316" y="240">registry hives (SYSTEM, SAM, NTUSER)</text>
    <text x="316" y="261">event logs (.evtx)</text>
    <text x="316" y="282">$MFT, $LogFile, $UsnJrnl</text>
    <text x="316" y="303">Prefetch, Amcache, SRUM</text>
    <text x="316" y="324">LNK, Shellbag, RecentDocs</text>
    <text x="316" y="340">browser history, cache</text>
  </g>

  <!-- decision -->
  <rect x="620" y="208" width="156" height="66" rx="7" fill="#111827" stroke="#5fe3b0"/>
  <text x="698" y="236" text-anchor="middle" font-size="12.5" fill="#e3fffa">Decision</text>
  <text x="698" y="255" text-anchor="middle" font-size="10.5" fill="#9fb0c8">affected? then image full</text>

  <!-- fleet note -->
  <rect x="24" y="200" width="258" height="60" rx="7" fill="#0b1518" stroke="#00f0ff" stroke-dasharray="5 4"/>
  <text x="153" y="224" text-anchor="middle" font-size="12" fill="#e3fffa">Velociraptor: at scale</text>
  <text x="153" y="244" text-anchor="middle" font-size="10.5" fill="#9fb0c8">same collection across many machines</text>

  <text x="400" y="398" text-anchor="middle" font-size="11" fill="#6c7b93">Full image = 2TB, hours. Triage = hundreds of MB, minutes. RAM still comes first on a live machine.</text>
</svg>
