<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="420" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Reading an MBR partition table by hand</text>
  <text x="400" y="55" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">512 bytes: bootstrap + 4 entries + 55 AA signature</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- Row 1: MBR 512-byte bar -->
  <g font-size="10.5" text-anchor="middle">
    <rect x="33" y="78" width="300" height="38" rx="6" fill="#111827" stroke="#263451"/>
    <text x="183" y="101" fill="#9fb0c8">bootstrap 446 B (0x000-0x1BD)</text>
    <rect x="335" y="78" width="92" height="38" rx="6" fill="#111827" stroke="#00f0ff"/>
    <text x="381" y="101" fill="#e3fffa">entry 1</text>
    <rect x="429" y="78" width="92" height="38" rx="6" fill="#111827" stroke="#263451"/>
    <text x="475" y="101" fill="#9fb0c8">entry 2</text>
    <rect x="523" y="78" width="92" height="38" rx="6" fill="#111827" stroke="#263451"/>
    <text x="569" y="101" fill="#9fb0c8">entry 3</text>
    <rect x="617" y="78" width="92" height="38" rx="6" fill="#111827" stroke="#263451"/>
    <text x="663" y="101" fill="#9fb0c8">entry 4</text>
    <rect x="711" y="78" width="56" height="38" rx="6" fill="#111827" stroke="#fcee0a"/>
    <text x="739" y="101" fill="#fcee0a" font-family="'JetBrains Mono',monospace">55 AA</text>
  </g>

  <!-- connector entry1 -> zoom -->
  <line x1="381" y1="116" x2="300" y2="148" stroke="#00f0ff" stroke-width="1.5" marker-end="url(#a)" opacity="0.8"/>
  <text x="33" y="142" font-size="11.5" fill="#00f0ff" font-family="'JetBrains Mono',monospace">one entry = 16 bytes:</text>

  <!-- Row 2: 16-byte entry fields -->
  <g font-size="10" text-anchor="middle" font-family="'JetBrains Mono',monospace">
    <rect x="33" y="152" width="44" height="46" rx="5" fill="#111827" stroke="#263451"/>
    <text x="55" y="174" fill="#e3fffa">boot</text>
    <text x="55" y="188" fill="#9fb0c8">80</text>
    <rect x="79" y="152" width="132" height="46" rx="5" fill="#111827" stroke="#263451"/>
    <text x="145" y="179" fill="#6c7b93">CHS (skip)</text>
    <rect x="213" y="152" width="44" height="46" rx="5" fill="#111827" stroke="#fcee0a"/>
    <text x="235" y="174" fill="#fcee0a">type</text>
    <text x="235" y="188" fill="#9fb0c8">07</text>
    <rect x="259" y="152" width="132" height="46" rx="5" fill="#111827" stroke="#263451"/>
    <text x="325" y="179" fill="#6c7b93">CHS (skip)</text>
    <rect x="393" y="152" width="176" height="46" rx="5" fill="#111827" stroke="#00f0ff"/>
    <text x="481" y="174" fill="#e3fffa">LBA start (LE)</text>
    <text x="481" y="188" fill="#9fb0c8">00 08 00 00</text>
    <rect x="571" y="152" width="176" height="46" rx="5" fill="#111827" stroke="#263451"/>
    <text x="659" y="174" fill="#e3fffa">n sectors (LE)</text>
    <text x="659" y="188" fill="#9fb0c8">00 20 03 00</text>
  </g>

  <!-- Row 3: LBA conversion -->
  <text x="33" y="238" font-size="11.5" fill="#9fb0c8">LBA start, three steps: take 4 bytes, reverse little-endian, multiply by sector size.</text>
  <g font-size="11" text-anchor="middle">
    <rect x="33" y="252" width="206" height="50" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="136" y="273" fill="#e3fffa">on disk</text>
    <text x="136" y="291" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">00 08 00 00</text>

    <rect x="289" y="252" width="230" height="50" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="404" y="273" fill="#e3fffa">reversed value</text>
    <text x="404" y="291" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">0x800 = 2048 sec</text>

    <rect x="569" y="252" width="198" height="50" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="668" y="273" fill="#e3fffa">byte offset</text>
    <text x="668" y="291" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">x512 = 1 MiB</text>
  </g>
  <line x1="239" y1="277" x2="285" y2="277" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <line x1="519" y1="277" x2="565" y2="277" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>

  <text x="400" y="344" text-anchor="middle" font-size="11" fill="#6c7b93">Partition type is a self-declared label; jump to LBA start and read the boot sector to confirm.</text>
  <text x="400" y="372" text-anchor="middle" font-size="11" fill="#6c7b93">A GPT disk starts with a protective MBR (type 0xEE); the real map is "EFI PART" at LBA 1, with a backup at the end.</text>
</svg>
