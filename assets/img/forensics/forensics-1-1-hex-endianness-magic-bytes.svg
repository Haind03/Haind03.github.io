<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="420" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Reading bytes the way the machine does</text>
  <text x="400" y="55" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">hex dump columns, endianness, magic bytes</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- Row A: hex dump three columns -->
  <text x="28" y="92" font-size="12.5" fill="#00f0ff" font-family="'JetBrains Mono',monospace">1. A hex dump is three columns</text>
  <g font-size="11.5" text-anchor="middle">
    <rect x="28" y="104" width="140" height="44" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="98" y="124" fill="#e3fffa">offset (hex)</text>
    <text x="98" y="140" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">00000010</text>

    <rect x="182" y="104" width="382" height="44" rx="7" fill="#111827" stroke="#263451"/>
    <text x="373" y="124" fill="#e3fffa">hex bytes</text>
    <text x="373" y="140" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">44 69 65 75 20 74 72 61 20 73 6f 20</text>

    <rect x="578" y="104" width="194" height="44" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="675" y="124" fill="#e3fffa">ASCII</text>
    <text x="675" y="140" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">|Dieu tra so|</text>
  </g>

  <!-- Row B: endianness -->
  <text x="28" y="192" font-size="12.5" fill="#fcee0a" font-family="'JetBrains Mono',monospace">2. Little-endian: reverse the bytes before you read the number</text>
  <g font-size="12" text-anchor="middle">
    <rect x="28" y="206" width="236" height="48" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="146" y="226" fill="#e3fffa">on disk (x86)</text>
    <text x="146" y="244" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">78 56 34 12</text>

    <rect x="400" y="206" width="236" height="48" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="518" y="226" fill="#e3fffa">value</text>
    <text x="518" y="244" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">0x12345678</text>
  </g>
  <line x1="264" y1="230" x2="396" y2="230" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <text x="330" y="222" text-anchor="middle" font-size="10.5" fill="#6c7b93">reverse</text>
  <text x="648" y="233" font-size="10.5" fill="#6c7b93">big-endian (network) reads straight</text>

  <!-- Row C: magic bytes vs extension -->
  <text x="28" y="300" font-size="12.5" fill="#ff2a6d" font-family="'JetBrains Mono',monospace">3. Identify by magic bytes, never by the extension</text>
  <g font-size="12" text-anchor="middle">
    <rect x="28" y="314" width="248" height="48" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="152" y="334" fill="#e3fffa">first bytes</text>
    <text x="152" y="352" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">89 50 4E 47 = .PNG</text>

    <rect x="412" y="314" width="150" height="48" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="487" y="334" fill="#e3fffa">format</text>
    <text x="487" y="352" fill="#5fe3b0" font-family="'JetBrains Mono',monospace">PNG image</text>

    <rect x="590" y="314" width="182" height="48" rx="7" fill="#0b1518" stroke="#ff2a6d" stroke-dasharray="5 4"/>
    <text x="681" y="334" fill="#9fb0c8">name photo.jpg</text>
    <text x="681" y="352" fill="#ff2a6d" font-size="10.5">(untrusted, ignore it)</text>
  </g>
  <line x1="276" y1="338" x2="408" y2="338" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>

  <text x="400" y="398" text-anchor="middle" font-size="11" fill="#6c7b93">The extension is a label the attacker can change. The bytes are the evidence.</text>
</svg>
