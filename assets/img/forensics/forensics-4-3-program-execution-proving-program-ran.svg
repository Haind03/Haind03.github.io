<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="400" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Proving a program ran: six sources, one conclusion</text>
  <text x="400" y="48" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">execution artifacts prove a run, presence artifacts prove only that it existed</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- left column: execution -->
  <g font-size="12.5">
    <rect x="24" y="82" width="212" height="48" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="36" y="102" fill="#e3fffa">Prefetch</text>
    <text x="36" y="119" fill="#6c7b93" font-size="9.5" font-family="'JetBrains Mono',monospace">run count 3, up to 8 run times</text>

    <rect x="24" y="162" width="212" height="48" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="36" y="182" fill="#e3fffa">UserAssist</text>
    <text x="36" y="199" fill="#6c7b93" font-size="9.5" font-family="'JetBrains Mono',monospace">ran via Explorer, last run</text>

    <rect x="24" y="242" width="212" height="48" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="36" y="262" fill="#e3fffa">BAM/DAM</text>
    <text x="36" y="279" fill="#6c7b93" font-size="9.5" font-family="'JetBrains Mono',monospace">last run per SID</text>
  </g>

  <!-- right column: presence + srum -->
  <g font-size="12.5">
    <rect x="564" y="82" width="212" height="48" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="576" y="102" fill="#e3fffa">Amcache.hve</text>
    <text x="576" y="119" fill="#6c7b93" font-size="9.5" font-family="'JetBrains Mono',monospace">SHA1, presence only</text>

    <rect x="564" y="162" width="212" height="48" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="576" y="182" fill="#e3fffa">Shimcache</text>
    <text x="576" y="199" fill="#6c7b93" font-size="9.5" font-family="'JetBrains Mono',monospace">mtime, NOT a run time</text>

    <rect x="564" y="242" width="212" height="48" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="576" y="262" fill="#e3fffa">SRUM</text>
    <text x="576" y="279" fill="#6c7b93" font-size="9.5" font-family="'JetBrains Mono',monospace">bytes sent/received per hour</text>
  </g>

  <!-- center conclusion -->
  <rect x="300" y="186" width="200" height="74" rx="7" fill="#111827" stroke="#ff2a6d"/>
  <text x="400" y="210" text-anchor="middle" font-size="13" fill="#e3fffa">Suspect: evil.exe</text>
  <text x="400" y="228" text-anchor="middle" font-size="10" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">ran 14:22 UTC, user An</text>
  <text x="400" y="244" text-anchor="middle" font-size="10" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">3.1 GB sent out</text>

  <!-- arrows -->
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="238" y1="106" x2="298" y2="198"/>
    <line x1="238" y1="186" x2="298" y2="214"/>
    <line x1="238" y1="266" x2="298" y2="248"/>
    <line x1="562" y1="106" x2="502" y2="198"/>
    <line x1="562" y1="186" x2="502" y2="214"/>
    <line x1="562" y1="266" x2="502" y2="248"/>
  </g>

  <line x1="24" y1="306" x2="776" y2="306" stroke="#263451" stroke-width="1"/>
  <rect x="24" y="320" width="14" height="10" rx="2" fill="#111827" stroke="#5fe3b0"/>
  <text x="44" y="329" font-size="11" fill="#9fb0c8">proves execution</text>
  <rect x="190" y="320" width="14" height="10" rx="2" fill="#111827" stroke="#fcee0a"/>
  <text x="210" y="329" font-size="11" fill="#9fb0c8">proves presence only</text>
  <text x="24" y="356" font-size="11" fill="#6c7b93">Six independent sources agreeing is a conclusion no one can argue with; one presence artifact alone only says the file existed.</text>
</svg>
