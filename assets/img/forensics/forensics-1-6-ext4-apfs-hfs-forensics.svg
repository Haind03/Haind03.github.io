<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="430" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">ext4 and APFS for the investigator</text>
  <text x="400" y="55" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">ext4: inode and extents. APFS: copy-on-write and snapshots.</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- Row 1: ext4 block group -->
  <text x="33" y="72" font-size="11.5" fill="#00f0ff" font-family="'JetBrains Mono',monospace">ext4 block group</text>
  <g font-size="10" text-anchor="middle">
    <rect x="33" y="78" width="118" height="38" rx="6" fill="#111827" stroke="#00f0ff"/>
    <text x="92" y="101" fill="#e3fffa">superblock</text>
    <rect x="155" y="78" width="118" height="38" rx="6" fill="#111827" stroke="#263451"/>
    <text x="214" y="101" fill="#9fb0c8">group desc</text>
    <rect x="277" y="78" width="110" height="38" rx="6" fill="#111827" stroke="#263451"/>
    <text x="332" y="101" fill="#9fb0c8">block bmp</text>
    <rect x="391" y="78" width="110" height="38" rx="6" fill="#111827" stroke="#263451"/>
    <text x="446" y="101" fill="#9fb0c8">inode bmp</text>
    <rect x="505" y="78" width="118" height="38" rx="6" fill="#111827" stroke="#fcee0a"/>
    <text x="564" y="101" fill="#e3fffa">inode table</text>
    <rect x="627" y="78" width="140" height="38" rx="6" fill="#111827" stroke="#5fe3b0"/>
    <text x="697" y="101" fill="#e3fffa">data blocks</text>
  </g>

  <!-- Row 2: inode -> extent -> data -->
  <text x="33" y="150" font-size="11.5" fill="#9fb0c8">The inode holds the metadata; an extent maps a run of blocks.</text>
  <g font-size="11" text-anchor="middle">
    <rect x="33" y="162" width="210" height="58" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="138" y="182" fill="#e3fffa">inode (metadata, 4 times)</text>
    <text x="138" y="200" fill="#9fb0c8" font-size="10" font-family="'JetBrains Mono',monospace">atime mtime ctime crtime</text>
    <text x="138" y="213" fill="#6c7b93" font-size="9">name lives in the directory entry</text>

    <rect x="300" y="172" width="190" height="40" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="395" y="196" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">extent: start, len, phys</text>

    <rect x="555" y="172" width="212" height="40" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="661" y="196" fill="#e3fffa">contiguous data blocks</text>
  </g>
  <line x1="243" y1="192" x2="296" y2="192" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <line x1="490" y1="192" x2="551" y2="192" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <text x="33" y="240" font-size="10.5" fill="#ff2a6d">ctime = inode Change, NOT create. crtime = create, read it with debugfs.</text>

  <!-- Row 3: APFS copy-on-write + snapshot -->
  <text x="33" y="268" font-size="11.5" fill="#9fb0c8">APFS never overwrites: a write goes to a new block, and a snapshot pins the old one.</text>
  <g font-size="11" text-anchor="middle">
    <rect x="33" y="278" width="180" height="46" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="123" y="306" fill="#e3fffa">original block v1</text>
    <rect x="280" y="278" width="180" height="46" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="370" y="306" fill="#e3fffa">new block v2</text>
    <rect x="527" y="278" width="240" height="46" rx="7" fill="#0b1518" stroke="#00f0ff" stroke-dasharray="5 4"/>
    <text x="647" y="300" fill="#9fb0c8">snapshot = pointer to v1</text>
    <text x="647" y="315" fill="#6c7b93" font-size="9.5">past state stays on disk</text>
  </g>
  <line x1="213" y1="301" x2="277" y2="301" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <text x="245" y="293" text-anchor="middle" font-size="9.5" fill="#6c7b93">edit</text>
  <path d="M527,288 C 430,242 230,242 125,276" stroke="#00f0ff" stroke-width="1.8" fill="none" marker-end="url(#a)" opacity="0.85"/>
  <text x="330" y="236" text-anchor="middle" font-size="9.5" fill="#00f0ff">snapshot pins v1</text>

  <text x="400" y="404" text-anchor="middle" font-size="11" fill="#6c7b93">Deleting an ext4 file clears the extents, so recovery leans on the journal or carving, not on a simple undelete.</text>
</svg>
