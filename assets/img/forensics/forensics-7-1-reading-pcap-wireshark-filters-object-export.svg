<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="360" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Wireshark pcap triage pipeline</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">from a raw capture to the extracted file, verified by hash</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- main chain -->
  <g font-size="12" text-anchor="middle">
    <rect x="24"  y="150" width="130" height="58" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="89"  y="174" fill="#e3fffa">raw pcap</text>
    <text x="89"  y="192" fill="#6c7b93" font-size="10.5">capinfos: count, time</text>

    <rect x="171" y="150" width="130" height="58" rx="7" fill="#111827" stroke="#263451"/>
    <text x="236" y="174" fill="#e3fffa">Statistics</text>
    <text x="236" y="192" fill="#9fb0c8" font-size="10.5">Conversations</text>

    <rect x="318" y="150" width="130" height="58" rx="7" fill="#111827" stroke="#263451"/>
    <text x="383" y="174" fill="#e3fffa">display filter</text>
    <text x="383" y="192" fill="#9fb0c8" font-size="10" font-family="'JetBrains Mono',monospace">tcp.stream==N</text>

    <rect x="465" y="150" width="130" height="58" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="530" y="174" fill="#ff2a6d" font-weight="700">Follow Stream</text>
    <text x="530" y="192" fill="#9fb0c8" font-size="10.5">body starts with MZ</text>

    <rect x="612" y="150" width="130" height="58" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="677" y="174" fill="#5fe3b0" font-weight="700">Export Objects</text>
    <text x="677" y="192" fill="#9fb0c8" font-size="10.5">file to disk</text>
  </g>

  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="154" y1="179" x2="167" y2="179"/>
    <line x1="301" y1="179" x2="314" y2="179"/>
    <line x1="448" y1="179" x2="461" y2="179"/>
    <line x1="595" y1="179" x2="608" y2="179"/>
  </g>

  <!-- verify step -->
  <rect x="612" y="258" width="130" height="50" rx="7" fill="#111827" stroke="#5fe3b0"/>
  <text x="677" y="279" text-anchor="middle" font-size="12" fill="#e3fffa">verify</text>
  <text x="677" y="296" text-anchor="middle" font-size="10" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">sha256sum + file</text>
  <line x1="677" y1="258" x2="677" y2="210" stroke="#5fe3b0" stroke-width="2" marker-end="url(#a)" opacity="0.85"/>

  <!-- limitation / untrusted note -->
  <rect x="24" y="258" width="300" height="50" rx="7" fill="#0b1518" stroke="#00f0ff" stroke-dasharray="5 4"/>
  <text x="38" y="279" font-size="11" fill="#9fb0c8">If the session is HTTPS the payload is encrypted.</text>
  <text x="38" y="296" font-size="11" fill="#9fb0c8">Export Objects needs the key first (Lesson 7.3).</text>

  <text x="400" y="340" text-anchor="middle" font-size="11" fill="#6c7b93">Narrow a million packets down to one session, then pull its file and prove it is intact.</text>
</svg>
