<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="400" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Forensic disk imaging</text>
  <text x="400" y="54" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">read-only through a write blocker, verify by hash</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- OS write-attempt callout, blocked -->
  <rect x="214" y="68" width="150" height="30" rx="7" fill="#0b1518" stroke="#ff2a6d" stroke-dasharray="5 4"/>
  <text x="289" y="87" text-anchor="middle" font-size="10.5" fill="#9fb0c8">OS write attempts</text>
  <line x1="289" y1="98" x2="289" y2="120" stroke="#ff2a6d" stroke-width="2"/>
  <line x1="281" y1="105" x2="297" y2="115" stroke="#ff2a6d" stroke-width="2.5"/>
  <line x1="297" y1="105" x2="281" y2="115" stroke="#ff2a6d" stroke-width="2.5"/>

  <!-- acquisition path -->
  <g font-size="12.5" text-anchor="middle">
    <rect x="24" y="122" width="150" height="58" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="99" y="147" fill="#e3fffa">Suspect disk</text>
    <text x="99" y="165" fill="#6c7b93" font-size="10.5" font-family="'JetBrains Mono',monospace">/dev/sdb</text>

    <rect x="214" y="122" width="150" height="58" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="289" y="147" fill="#e3fffa">Write blocker</text>
    <text x="289" y="165" fill="#5fe3b0" font-size="10.5">read-only</text>

    <rect x="404" y="122" width="170" height="58" rx="7" fill="#111827" stroke="#263451"/>
    <text x="489" y="147" fill="#e3fffa">Imager</text>
    <text x="489" y="165" fill="#9fb0c8" font-size="10" font-family="'JetBrains Mono',monospace">dd / dc3dd / ewfacquire</text>

    <rect x="614" y="122" width="162" height="58" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="695" y="147" fill="#e3fffa">Image file</text>
    <text x="695" y="165" fill="#fcee0a" font-size="10.5">E01 / raw</text>
  </g>

  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="174" y1="151" x2="212" y2="151"/>
    <line x1="364" y1="151" x2="402" y2="151"/>
    <line x1="574" y1="151" x2="612" y2="151"/>
    <!-- down into hashes -->
    <line x1="99" y1="180" x2="99" y2="252"/>
    <line x1="695" y1="180" x2="695" y2="252"/>
    <!-- hashes into compare -->
    <line x1="196" y1="277" x2="326" y2="277"/>
    <line x1="604" y1="277" x2="474" y2="277"/>
    <!-- compare into result -->
    <line x1="400" y1="300" x2="400" y2="330"/>
  </g>

  <!-- verification -->
  <g font-size="12.5" text-anchor="middle">
    <rect x="24" y="254" width="172" height="46" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="110" y="282" fill="#e3fffa">hash of source</text>

    <rect x="330" y="254" width="140" height="46" rx="7" fill="#111827" stroke="#263451"/>
    <text x="400" y="276" fill="#e3fffa">compare</text>
    <text x="400" y="292" fill="#9fb0c8" font-size="11" font-family="'JetBrains Mono',monospace">==</text>

    <rect x="604" y="254" width="172" height="46" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="690" y="282" fill="#e3fffa">hash of image</text>

    <rect x="290" y="330" width="220" height="44" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="400" y="358" fill="#e3fffa">match = exact copy, seal it</text>
  </g>

  <text x="400" y="392" text-anchor="middle" font-size="11" fill="#6c7b93">A mismatch means a read error or tampering: redo it or note it clearly.</text>
</svg>
