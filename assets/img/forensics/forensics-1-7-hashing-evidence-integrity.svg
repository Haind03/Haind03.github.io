<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="420" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Hashing proves the image did not change</text>
  <text x="400" y="55" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">hash at acquisition, hash again later, compare</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- Band 1: integrity verify flow -->
  <g font-size="11" text-anchor="middle">
    <rect x="33" y="80" width="150" height="42" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="108" y="105" fill="#e3fffa">disk.img (acquire)</text>
    <rect x="205" y="80" width="100" height="42" rx="7" fill="#111827" stroke="#263451"/>
    <text x="255" y="105" fill="#9fb0c8">SHA-256</text>
    <rect x="325" y="80" width="180" height="42" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="415" y="105" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">digest 3b8e...</text>

    <rect x="33" y="136" width="150" height="42" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="108" y="161" fill="#e3fffa">disk.img (verify)</text>
    <rect x="205" y="136" width="100" height="42" rx="7" fill="#111827" stroke="#263451"/>
    <text x="255" y="161" fill="#9fb0c8">SHA-256</text>
    <rect x="325" y="136" width="180" height="42" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="415" y="161" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">digest ...</text>

    <rect x="540" y="96" width="100" height="66" rx="7" fill="#111827" stroke="#263451"/>
    <text x="590" y="134" fill="#e3fffa">compare</text>

    <rect x="672" y="80" width="95" height="42" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="719" y="105" fill="#5fe3b0">OK: match</text>
    <rect x="672" y="136" width="95" height="42" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="719" y="161" fill="#ff2a6d">FAILED</text>
  </g>
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="183" y1="101" x2="203" y2="101"/>
    <line x1="305" y1="101" x2="323" y2="101"/>
    <line x1="183" y1="157" x2="203" y2="157"/>
    <line x1="305" y1="157" x2="323" y2="157"/>
    <line x1="505" y1="105" x2="538" y2="116"/>
    <line x1="505" y1="153" x2="538" y2="142"/>
    <line x1="640" y1="112" x2="670" y2="103"/>
    <line x1="640" y1="146" x2="670" y2="155"/>
  </g>

  <!-- Band 2: avalanche -->
  <text x="33" y="214" font-size="11.5" fill="#9fb0c8">Avalanche: changing one bit changes the whole digest, so any tampering shows.</text>
  <g font-size="11" text-anchor="middle">
    <rect x="33" y="228" width="120" height="40" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="93" y="252" fill="#e3fffa" font-family="'JetBrains Mono',monospace">bang chung</text>
    <rect x="173" y="228" width="185" height="40" rx="7" fill="#111827" stroke="#263451"/>
    <text x="265" y="252" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">2c26b46b68ff...</text>

    <rect x="400" y="228" width="140" height="40" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="470" y="247" fill="#e3fffa" font-family="'JetBrains Mono',monospace">Bang chung</text>
    <text x="470" y="261" fill="#ff2a6d" font-size="9">capital B, 1 bit</text>
    <rect x="560" y="228" width="207" height="40" rx="7" fill="#111827" stroke="#263451"/>
    <text x="663" y="252" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">9f4390f8d30c...</text>
  </g>
  <line x1="153" y1="248" x2="171" y2="248" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <line x1="540" y1="248" x2="558" y2="248" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>

  <!-- Band 3: fuzzy hashing -->
  <text x="33" y="312" font-size="11.5" fill="#9fb0c8">Fuzzy hashing (ssdeep) scores how similar two files are, from 0 to 100.</text>
  <g font-size="11" text-anchor="middle">
    <rect x="33" y="326" width="110" height="40" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="88" y="350" fill="#e3fffa" font-family="'JetBrains Mono',monospace">v1.txt</text>
    <rect x="153" y="326" width="180" height="40" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="243" y="350" fill="#e3fffa" font-family="'JetBrains Mono',monospace">v2.txt (one extra line)</text>
    <rect x="400" y="326" width="120" height="40" rx="7" fill="#111827" stroke="#263451"/>
    <text x="460" y="350" fill="#9fb0c8">ssdeep</text>
    <rect x="560" y="326" width="207" height="40" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="663" y="350" fill="#5fe3b0">match 99 / 100</text>
  </g>
  <line x1="333" y1="346" x2="398" y2="346" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <line x1="520" y1="346" x2="558" y2="346" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>

  <text x="400" y="400" text-anchor="middle" font-size="11" fill="#6c7b93">MD5 still verifies a fixed image (second-preimage resistant); never use it where an attacker builds both files.</text>
</svg>
