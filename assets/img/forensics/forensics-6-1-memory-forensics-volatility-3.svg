<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="420" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">From a RAM dump to the process list</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">Volatility 3 matches a symbol table, no --profile, then reads EPROCESS</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- top pipeline -->
  <g font-size="12.5" text-anchor="middle">
    <rect x="20"  y="92" width="150" height="60" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="95"  y="118" fill="#e3fffa">memory.raw</text>
    <text x="95"  y="136" fill="#6c7b93" font-size="10.5">8-32 GB raw dump</text>

    <rect x="196" y="92" width="168" height="60" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="280" y="118" fill="#5fe3b0" font-weight="700">Volatility 3</text>
    <text x="280" y="136" fill="#9fb0c8" font-size="10.5">matches ISF symbols</text>

    <rect x="392" y="92" width="160" height="60" rx="7" fill="#111827" stroke="#263451"/>
    <text x="472" y="118" fill="#e3fffa">windows.info</text>
    <text x="472" y="136" fill="#9fb0c8" font-size="10.5">verify + SystemTime</text>

    <rect x="580" y="92" width="170" height="60" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="665" y="118" fill="#e3fffa">windows.pslist</text>
    <text x="665" y="136" fill="#9fb0c8" font-size="10.5">PID PPID CreateTime</text>
  </g>

  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="170" y1="122" x2="194" y2="122"/>
    <line x1="364" y1="122" x2="390" y2="122"/>
    <line x1="552" y1="122" x2="578" y2="122"/>
  </g>

  <!-- ISF symbol store feeding Volatility -->
  <rect x="196" y="176" width="168" height="44" rx="7" fill="#0b1518" stroke="#fcee0a" stroke-dasharray="5 4"/>
  <text x="280" y="195" text-anchor="middle" font-size="11" fill="#fcee0a">ISF symbol store</text>
  <text x="280" y="210" text-anchor="middle" font-size="10" fill="#6c7b93" font-family="'JetBrains Mono',monospace">kernel GUID -&gt; JSON PDB</text>
  <line x1="280" y1="176" x2="280" y2="154" stroke="#fcee0a" stroke-width="2" marker-end="url(#a)" opacity="0.85"/>

  <!-- arrow down to result panel -->
  <line x1="665" y1="152" x2="665" y2="242" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none"/>

  <!-- result panel -->
  <rect x="20" y="246" width="730" height="140" rx="7" fill="#0b1518" stroke="#263451"/>
  <text x="36" y="268" font-size="11.5" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">windows.pslist  (snapshot of EPROCESS list)</text>
  <g font-size="11.5" font-family="'JetBrains Mono',monospace" fill="#9fb0c8">
    <text x="36" y="290">PID   PPID  ImageFileName   CreateTime</text>
    <text x="36" y="308">4     0     System          08:00:12 UTC</text>
    <text x="36" y="326">652   4     smss.exe        08:00:13 UTC</text>
    <text x="36" y="344">2104  1988  winword.exe     14:21:10 UTC</text>
  </g>
  <text x="36" y="362" font-size="11.5" font-family="'JetBrains Mono',monospace" fill="#ff2a6d">3120  2104  powershell.exe  14:21:40 UTC  &lt;- Word spawned PowerShell</text>
  <text x="36" y="378" font-size="10.5" fill="#6c7b93">Parent/child anomaly: a phishing macro opening a shell 30 seconds after Word.</text>
</svg>
