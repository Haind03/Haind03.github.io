<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="420" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Three signals that give away a hidden C2</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">an even beacon, high-entropy DNS, and upload bigger than download</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- infected host -->
  <rect x="320" y="78" width="160" height="56" rx="7" fill="#111827" stroke="#ff2a6d" stroke-dasharray="5 4"/>
  <text x="400" y="102" text-anchor="middle" font-size="13" fill="#ff2a6d" font-weight="700">infected host</text>
  <text x="400" y="120" text-anchor="middle" font-size="10.5" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">10.3.1.22</text>

  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="360" y1="134" x2="160" y2="192"/>
    <line x1="400" y1="134" x2="400" y2="192"/>
    <line x1="440" y1="134" x2="640" y2="192"/>
  </g>

  <!-- three signal boxes -->
  <g font-size="12" text-anchor="middle">
    <rect x="22" y="196" width="232" height="92" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="138" y="220" fill="#00f0ff" font-weight="700">C2 beacon</text>
    <text x="138" y="241" fill="#9fb0c8" font-size="11">interval even, low jitter</text>
    <text x="138" y="259" fill="#9fb0c8" font-size="11">CV of deltas ~0.05</text>
    <text x="138" y="277" fill="#6c7b93" font-size="10" font-family="'JetBrains Mono',monospace">same JA3 to many IPs</text>

    <rect x="276" y="196" width="232" height="92" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="392" y="220" fill="#fcee0a" font-weight="700">DNS tunneling</text>
    <text x="392" y="241" fill="#9fb0c8" font-size="11">long TXT/NULL labels</text>
    <text x="392" y="259" fill="#9fb0c8" font-size="11">high entropy, no repeats</text>
    <text x="392" y="277" fill="#6c7b93" font-size="10" font-family="'JetBrains Mono',monospace">many queries, one parent</text>

    <rect x="530" y="196" width="232" height="92" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="646" y="220" fill="#ff2a6d" font-weight="700">exfiltration</text>
    <text x="646" y="241" fill="#9fb0c8" font-size="11">orig_bytes &gt;&gt; resp_bytes</text>
    <text x="646" y="259" fill="#9fb0c8" font-size="11">wrong direction, odd hours</text>
    <text x="646" y="277" fill="#6c7b93" font-size="10" font-family="'JetBrains Mono',monospace">sum per IP for low-and-slow</text>
  </g>

  <!-- bottom row -->
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="138" y1="288" x2="230" y2="330"/>
    <line x1="392" y1="288" x2="300" y2="330"/>
  </g>
  <rect x="40" y="332" width="470" height="56" rx="7" fill="#111827" stroke="#5fe3b0"/>
  <text x="275" y="356" text-anchor="middle" font-size="12.5" fill="#5fe3b0" font-weight="700">combine signals into evidence</text>
  <text x="275" y="375" text-anchor="middle" font-size="10.5" fill="#9fb0c8">one signal is a hint, several together are a conclusion</text>

  <rect x="530" y="332" width="232" height="56" rx="7" fill="#0b1518" stroke="#5fe3b0" stroke-dasharray="5 4"/>
  <text x="646" y="356" text-anchor="middle" font-size="11.5" fill="#e3fffa">with SSLKEYLOGFILE</text>
  <text x="646" y="374" text-anchor="middle" font-size="10.5" fill="#9fb0c8">decrypt TLS, read the content</text>
  <line x1="646" y1="288" x2="646" y2="330" stroke="#5fe3b0" stroke-width="2" marker-end="url(#a)" opacity="0.85"/>
</svg>
