<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 384" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="384" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Work on a copy, anchored by a hash</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">the hash at collection is what proves nothing was changed</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- top acquisition flow -->
  <g text-anchor="middle">
    <rect x="24"  y="80" width="150" height="66" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="99"  y="106" font-size="13" font-weight="700" fill="#fcee0a">Original</text>
    <text x="99"  y="126" font-size="11" fill="#e3fffa">the evidence</text>

    <rect x="214" y="80" width="182" height="66" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="305" y="104" font-size="12.5" font-weight="700" fill="#00f0ff">Hash at collection</text>
    <text x="305" y="124" font-size="10.5" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">sha256sum + md5sum</text>
    <text x="305" y="138" font-size="10" fill="#6c7b93">integrity anchor</text>

    <rect x="436" y="80" width="150" height="66" rx="7" fill="#111827" stroke="#263451"/>
    <text x="511" y="106" font-size="12.5" font-weight="700" fill="#e3fffa">Bit-for-bit image</text>
    <text x="511" y="126" font-size="11" fill="#9fb0c8">the working copy</text>

    <rect x="626" y="80" width="150" height="66" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="701" y="104" font-size="12.5" font-weight="700" fill="#5fe3b0">Verify</text>
    <text x="701" y="123" font-size="10.5" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">sha256sum -c</text>
    <text x="701" y="138" font-size="10.5" fill="#9fb0c8">copy hash = original</text>
  </g>
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="174" y1="113" x2="210" y2="113"/>
    <line x1="396" y1="113" x2="432" y2="113"/>
    <line x1="586" y1="113" x2="622" y2="113"/>
  </g>

  <!-- outcomes -->
  <g text-anchor="middle">
    <rect x="24"  y="186" width="150" height="56" rx="7" fill="#0b1518" stroke="#fcee0a"/>
    <text x="99"  y="208" font-size="11" fill="#e3fffa">Sealed in locked</text>
    <text x="99"  y="224" font-size="11" fill="#e3fffa">cabinet, untouched</text>

    <rect x="436" y="186" width="150" height="56" rx="7" fill="#0b1518" stroke="#5fe3b0"/>
    <text x="511" y="208" font-size="11" fill="#e3fffa">All analysis</text>
    <text x="511" y="224" font-size="11" fill="#e3fffa">happens here</text>
  </g>
  <line x1="99"  y1="146" x2="99"  y2="184" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <line x1="511" y1="146" x2="511" y2="184" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>

  <!-- chain of custody ledger -->
  <rect x="24" y="268" width="752" height="96" rx="7" fill="#0b1518" stroke="#263451"/>
  <text x="40" y="290" font-size="12" font-weight="700" fill="#9fb0c8">Chain of custody (continuous, no gaps)</text>
  <g font-size="11" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">
    <text x="40" y="314">2026-10-08 09:40 +07:00  collected  USB SN:FAKE123   by A    SHA-256 3f8a...c1</text>
    <text x="40" y="334">2026-10-08 10:15 +07:00  handoff    copy A -&gt; B         original sealed, not moved</text>
    <text x="40" y="354" fill="#6c7b93">who held it, when, and that it was not altered, from collection onward</text>
  </g>
</svg>
