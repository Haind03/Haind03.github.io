<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 392" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="392" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">A report three audiences can trust</text>
  <text x="400" y="50" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">layer the readers, anchor every finding, over a strict chain of custody</text>

  <defs>
    <marker id="af3" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- divider -->
  <line x1="400" y1="72" x2="400" y2="306" stroke="#263451" stroke-width="1"/>

  <!-- LEFT: audiences map to sections -->
  <text x="26" y="88" font-size="12.5" font-weight="700" fill="#00f0ff">Three audiences, one report</text>
  <g font-size="11" text-anchor="middle">
    <!-- row1 -->
    <rect x="24" y="100" width="146" height="44" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="97" y="118" fill="#e3fffa">Leadership</text>
    <text x="97" y="134" fill="#9fb0c8" font-size="10">client</text>
    <rect x="200" y="100" width="184" height="44" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="292" y="118" fill="#5fe3b0" font-weight="700">Executive Summary</text>
    <text x="292" y="134" fill="#9fb0c8" font-size="10">1 page, no jargon</text>
    <!-- row2 -->
    <rect x="24" y="156" width="146" height="44" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="97" y="174" fill="#e3fffa">Technical / IT</text>
    <text x="97" y="190" fill="#9fb0c8" font-size="10">remediate, scan</text>
    <rect x="200" y="156" width="184" height="44" rx="7" fill="#111827" stroke="#263451"/>
    <text x="292" y="180" fill="#e3fffa">Findings + IOC table</text>
    <!-- row3 -->
    <rect x="24" y="212" width="146" height="56" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="97" y="234" fill="#e3fffa">Legal /</text>
    <text x="97" y="250" fill="#e3fffa">opposing expert</text>
    <rect x="200" y="212" width="184" height="56" rx="7" fill="#111827" stroke="#263451"/>
    <text x="292" y="232" fill="#e3fffa" font-size="10.5">Methodology,</text>
    <text x="292" y="247" fill="#e3fffa" font-size="10.5">Chain of Custody,</text>
    <text x="292" y="262" fill="#e3fffa" font-size="10.5">Appendix</text>
  </g>
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#af3)" fill="none">
    <line x1="170" y1="122" x2="198" y2="122"/>
    <line x1="170" y1="178" x2="198" y2="178"/>
    <line x1="170" y1="240" x2="198" y2="240"/>
  </g>

  <!-- RIGHT: anchor a finding to evidence -->
  <text x="430" y="88" font-size="12.5" font-weight="700" fill="#ff2a6d">Anchor every finding</text>
  <g font-size="11" text-anchor="middle">
    <rect x="452" y="100" width="296" height="48" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="600" y="120" fill="#e3fffa">Fact (observed)</text>
    <text x="600" y="137" fill="#9fb0c8" font-size="10" font-family="'JetBrains Mono',monospace">4688 EXCEL -&gt; powershell -enc</text>

    <rect x="452" y="174" width="296" height="48" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="600" y="194" fill="#e3fffa">Opinion + confidence</text>
    <text x="600" y="211" fill="#9fb0c8" font-size="10">user likely opened macro (high)</text>

    <rect x="452" y="248" width="296" height="48" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="600" y="268" fill="#fcee0a" font-weight="700">Appendix A-4: evidence</text>
    <text x="600" y="285" fill="#9fb0c8" font-size="10">artifact, path, hash</text>
  </g>
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#af3)" fill="none">
    <line x1="600" y1="148" x2="600" y2="172"/>
    <line x1="600" y1="222" x2="600" y2="246"/>
  </g>

  <!-- base: chain of custody -->
  <rect x="24" y="318" width="752" height="44" rx="7" fill="#0b1f18" stroke="#5fe3b0"/>
  <text x="40" y="340" font-size="12" fill="#5fe3b0" font-weight="700">Chain of custody</text>
  <text x="40" y="356" font-size="11" fill="#9fb0c8">work on a copy, hash before and after, every handoff logged; one broken link and the evidence is thrown out</text>

  <text x="400" y="382" text-anchor="middle" font-size="11" fill="#6c7b93">Fact separated from opinion, each fact citing a numbered appendix.</text>
</svg>
