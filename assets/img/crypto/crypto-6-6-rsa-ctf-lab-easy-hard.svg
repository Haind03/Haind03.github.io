<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="430" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">RSA triage, from the numbers to the attack</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">print n.bit_length(), e, e.bit_length(), gcd of every pair of n</text>

  <g font-size="12.5" text-anchor="middle">
    <rect x="30" y="150" width="170" height="90" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="115" y="188" fill="#e3fffa">Challenge</text>
    <text x="115" y="208" fill="#9fb0c8" font-family="'JetBrains Mono',monospace" font-size="11">n, e, c</text>

    <rect x="260" y="78" width="210" height="34" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="365" y="100" fill="#e3fffa" font-size="11.5">small n</text>
    <rect x="260" y="122" width="210" height="34" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="365" y="144" fill="#e3fffa" font-size="11.5">small e</text>
    <rect x="260" y="166" width="210" height="34" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="365" y="188" fill="#e3fffa" font-size="11.5">e close to n</text>
    <rect x="260" y="210" width="210" height="34" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="365" y="232" fill="#e3fffa" font-size="11.5">p close to q</text>
    <rect x="260" y="254" width="210" height="34" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="365" y="276" fill="#e3fffa" font-size="11.5">several keys or moduli</text>
    <rect x="260" y="298" width="210" height="34" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="365" y="320" fill="#e3fffa" font-size="11.5">partial secret or oracle</text>

    <rect x="540" y="78" width="230" height="34" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="655" y="100" fill="#ff2a6d" font-size="11.5">factordb, factorint</text>
    <rect x="540" y="122" width="230" height="34" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="655" y="144" fill="#ff2a6d" font-size="11.5">e-th root, or Hastad</text>
    <rect x="540" y="166" width="230" height="34" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="655" y="188" fill="#ff2a6d" font-size="11.5">Wiener</text>
    <rect x="540" y="210" width="230" height="34" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="655" y="232" fill="#ff2a6d" font-size="11.5">Fermat</text>
    <rect x="540" y="254" width="230" height="34" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="655" y="276" fill="#ff2a6d" font-size="11.5">gcd(n1, n2), common modulus</text>
    <rect x="540" y="298" width="230" height="34" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="655" y="320" fill="#ff2a6d" font-size="11.5">Coppersmith, Bleichenbacher</text>
  </g>

  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="200" y1="195" x2="256" y2="195"/>
    <line x1="470" y1="95" x2="536" y2="95"/>
    <line x1="470" y1="139" x2="536" y2="139"/>
    <line x1="470" y1="183" x2="536" y2="183"/>
    <line x1="470" y1="227" x2="536" y2="227"/>
    <line x1="470" y1="271" x2="536" y2="271"/>
    <line x1="470" y1="315" x2="536" y2="315"/>
  </g>

  <rect x="190" y="356" width="420" height="44" rx="7" fill="#111827" stroke="#5fe3b0"/>
  <text x="400" y="376" text-anchor="middle" font-size="12.5" fill="#5fe3b0" font-weight="700">No clear sign: run RsaCtfTool and factordb in parallel</text>
  <text x="400" y="392" text-anchor="middle" font-size="11" fill="#9fb0c8">then think by hand, and open Sage for lattice work</text>
</svg>
