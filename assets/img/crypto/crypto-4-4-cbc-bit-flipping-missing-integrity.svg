<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="400" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">CBC bit flipping: edit one block, steer the next</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">Pi_new[j] = Pi_old[j] XOR delta, delta = old XOR want</text>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>
  <g font-size="12.5" text-anchor="middle">
    <rect x="60" y="90" width="260" height="62" rx="7" fill="#111827" stroke="#ff2a6d" stroke-dasharray="5 4"/>
    <text x="190" y="114" fill="#e3fffa">c2 (attacker edits bytes 5 and 11)</text>
    <text x="190" y="134" fill="#9fb0c8" font-size="11">XOR delta into the ciphertext</text>

    <rect x="480" y="90" width="260" height="62" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="610" y="114" fill="#e3fffa">c3 (unchanged)</text>
    <text x="610" y="134" fill="#9fb0c8" font-size="11">D(c3) stays fixed</text>

    <rect x="60" y="238" width="260" height="62" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="190" y="262" fill="#ff2a6d">p2 becomes garbage</text>
    <text x="190" y="282" fill="#9fb0c8" font-size="11">D(c2) changed completely</text>

    <rect x="480" y="238" width="260" height="62" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="610" y="262" fill="#5fe3b0" font-family="'JetBrains Mono',monospace">AAAAA;admin=true</text>
    <text x="610" y="282" fill="#9fb0c8" font-size="11">p3 = D(c3) XOR edited c2</text>
  </g>
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="190" y1="152" x2="190" y2="234"/>
    <line x1="260" y1="152" x2="520" y2="234"/>
    <line x1="610" y1="152" x2="610" y2="234"/>
  </g>
  <text x="168" y="196" text-anchor="end" font-size="11" fill="#9fb0c8">decrypt</text>
  <text x="400" y="176" text-anchor="middle" font-size="11" fill="#9fb0c8">XOR in p3</text>
  <rect x="60" y="326" width="680" height="50" rx="7" fill="#111827" stroke="#fcee0a"/>
  <text x="400" y="349" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-family="'JetBrains Mono',monospace">c2[5] ^= '?' ^ ';'     c2[11] ^= '?' ^ '='</text>
  <text x="400" y="366" text-anchor="middle" font-size="11" fill="#6c7b93">no MAC or tag, so the server decrypts the edited ciphertext without complaint</text>
</svg>
