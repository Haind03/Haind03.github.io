<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="400" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Length extension on H(secret || msg)</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">the digest is the internal state, so anyone can keep hashing from it</text>

  <text x="30" y="92" font-size="12" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">server computes</text>
  <g font-size="12" text-anchor="middle">
    <rect x="30" y="104" width="100" height="48" rx="7" fill="#111827" stroke="#263451"/>
    <text x="80" y="124" fill="#e3fffa">IV</text>
    <text x="80" y="141" fill="#6c7b93" font-size="10.5">fixed constant</text>
    <rect x="176" y="104" width="170" height="48" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="261" y="124" fill="#e3fffa">compress</text>
    <text x="261" y="141" fill="#fcee0a" font-size="10.5">secret || msg</text>
    <rect x="392" y="104" width="170" height="48" rx="7" fill="#111827" stroke="#263451"/>
    <text x="477" y="124" fill="#e3fffa">compress</text>
    <text x="477" y="141" fill="#6c7b93" font-size="10.5">pad1 (0x80, 0s, bit length)</text>
    <rect x="608" y="104" width="162" height="48" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="689" y="124" fill="#e3fffa">state = tag</text>
    <text x="689" y="141" fill="#00f0ff" font-size="10.5">attacker sees this</text>
  </g>
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="130" y1="128" x2="172" y2="128"/>
    <line x1="346" y1="128" x2="388" y2="128"/>
    <line x1="562" y1="128" x2="604" y2="128"/>
  </g>

  <line x1="689" y1="152" x2="689" y2="218" stroke="#00f0ff" stroke-width="2" marker-end="url(#a)"/>
  <text x="702" y="190" font-size="11" fill="#00f0ff" font-family="'JetBrains Mono',monospace">load as state</text>

  <text x="30" y="226" font-size="12" fill="#ff2a6d" font-family="'JetBrains Mono',monospace">attacker continues, secret never needed</text>
  <g font-size="12" text-anchor="middle">
    <rect x="392" y="240" width="170" height="52" rx="7" fill="#0b1518" stroke="#ff2a6d" stroke-dasharray="5 4"/>
    <text x="477" y="262" fill="#e3fffa">compress</text>
    <text x="477" y="280" fill="#ff2a6d" font-size="10.5">append = &amp;role=admin</text>
    <rect x="608" y="240" width="162" height="52" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="689" y="262" fill="#e3fffa">forged tag</text>
    <text x="689" y="280" fill="#5fe3b0" font-size="10.5">valid for new message</text>
    <rect x="30" y="240" width="320" height="52" rx="7" fill="#0b1518" stroke="#00f0ff" stroke-dasharray="5 4"/>
    <text x="190" y="262" fill="#e3fffa">forged msg</text>
    <text x="190" y="280" fill="#9fb0c8" font-size="10.5" font-family="'JetBrains Mono',monospace">msg || pad1 || append</text>
  </g>
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="562" y1="266" x2="604" y2="266"/>
  </g>

  <g font-size="12" text-anchor="middle">
    <rect x="30" y="322" width="740" height="40" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="400" y="346" fill="#5fe3b0">Fix: HMAC hashes twice, so the visible tag is not a resumable state.</text>
  </g>
</svg>
