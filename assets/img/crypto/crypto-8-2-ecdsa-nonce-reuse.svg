<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="380" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">ECDSA nonce reuse leaks the private key</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">s = k^-1 (z + r*d) mod n, same k means same r</text>

  <g font-size="12" text-anchor="middle">
    <rect x="40" y="90" width="300" height="58" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="190" y="112" fill="#e3fffa">signature 1 on message m1</text>
    <text x="190" y="132" fill="#00f0ff" font-family="'JetBrains Mono',monospace">(r = 19, s1 = 39), z1</text>

    <rect x="460" y="90" width="300" height="58" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="610" y="112" fill="#e3fffa">signature 2 on message m2</text>
    <text x="610" y="132" fill="#00f0ff" font-family="'JetBrains Mono',monospace">(r = 19, s2 = 73), z2</text>

    <rect x="330" y="166" width="140" height="34" rx="7" fill="#0b1518" stroke="#ff2a6d" stroke-dasharray="5 4"/>
    <text x="400" y="188" fill="#ff2a6d" font-weight="700">same r = same k</text>

    <rect x="230" y="224" width="340" height="52" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="400" y="246" fill="#e3fffa">subtract: s1 - s2 = k^-1 (z1 - z2)</text>
    <text x="400" y="265" fill="#ff2a6d" font-family="'JetBrains Mono',monospace">k = (z1 - z2) / (s1 - s2) mod n</text>

    <rect x="40" y="304" width="320" height="52" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="200" y="326" fill="#e3fffa">recovered nonce</text>
    <text x="200" y="345" fill="#fcee0a" font-family="'JetBrains Mono',monospace">k = 23</text>

    <rect x="440" y="304" width="320" height="52" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="600" y="326" fill="#e3fffa">private key</text>
    <text x="600" y="345" fill="#fcee0a" font-family="'JetBrains Mono',monospace">d = (s1*k - z1) / r = 42</text>
  </g>

  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="190" y1="149" x2="360" y2="164"/>
    <line x1="610" y1="149" x2="440" y2="164"/>
    <line x1="400" y1="201" x2="400" y2="220"/>
    <line x1="330" y1="277" x2="230" y2="300"/>
    <line x1="362" y1="330" x2="436" y2="330"/>
  </g>
</svg>
