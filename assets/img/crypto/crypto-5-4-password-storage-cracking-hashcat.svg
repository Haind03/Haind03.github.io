<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="420" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Storing passwords: salt stops tables, cost stops guessing</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">a fast hash lets a leaked database be guessed at GPU speed</text>

  <g font-size="12" text-anchor="middle">
    <rect x="30" y="84" width="130" height="54" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="95" y="106" fill="#e3fffa">Password</text>
    <text x="95" y="123" fill="#6c7b93" font-size="10.5">hunter2</text>
    <rect x="200" y="84" width="130" height="54" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="265" y="106" fill="#e3fffa">Random salt</text>
    <text x="265" y="123" fill="#6c7b93" font-size="10.5">per user, public</text>
    <rect x="370" y="84" width="190" height="54" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="465" y="106" fill="#e3fffa">Slow KDF</text>
    <text x="465" y="123" fill="#5fe3b0" font-size="10.5">bcrypt / argon2id, cost</text>
    <rect x="600" y="84" width="170" height="54" rx="7" fill="#111827" stroke="#263451"/>
    <text x="685" y="106" fill="#e3fffa">Stored string</text>
    <text x="685" y="123" fill="#6c7b93" font-size="10.5">$2b$12$salt+hash</text>
  </g>
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="160" y1="111" x2="196" y2="111"/>
    <line x1="330" y1="111" x2="366" y2="111"/>
    <line x1="560" y1="111" x2="596" y2="111"/>
  </g>

  <text x="30" y="184" font-size="12" fill="#ff2a6d" font-family="'JetBrains Mono',monospace">attacker with the leaked database: guesses per second on one CPU</text>
  <g font-size="12">
    <text x="30" y="216" fill="#e3fffa">MD5, no salt</text>
    <rect x="160" y="203" width="590" height="18" rx="3" fill="#ff2a6d"/>
    <text x="165" y="236" fill="#9fb0c8" font-family="'JetBrains Mono',monospace" font-size="11">5,297,734 hash/s</text>
    <text x="30" y="276" fill="#e3fffa">bcrypt, cost 12</text>
    <rect x="160" y="263" width="3" height="18" rx="1" fill="#5fe3b0"/>
    <text x="172" y="276" fill="#9fb0c8" font-family="'JetBrains Mono',monospace" font-size="11">4.2 hash/s</text>
  </g>
  <text x="30" y="306" font-size="11" fill="#6c7b93">Bar lengths are not to scale. Measured gap on the demo machine: about 1,263,639 times.</text>

  <g font-size="11.5" text-anchor="middle">
    <rect x="30" y="330" width="360" height="50" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="210" y="351" fill="#00f0ff">Salt</text>
    <text x="210" y="368" fill="#9fb0c8">kills rainbow tables and duplicate hashes</text>
    <rect x="410" y="330" width="360" height="50" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="590" y="351" fill="#5fe3b0">Cost</text>
    <text x="590" y="368" fill="#9fb0c8">slows brute force against each account</text>
  </g>
</svg>
