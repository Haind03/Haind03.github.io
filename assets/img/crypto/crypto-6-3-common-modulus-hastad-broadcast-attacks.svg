<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="380" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">One message encrypted more than once</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">both attacks use only public values</text>

  <text x="30" y="92" font-size="12" fill="#fcee0a" font-family="'JetBrains Mono',monospace">COMMON MODULUS: same n, e1 and e2 coprime</text>
  <g font-size="12.5" text-anchor="middle">
    <rect x="30" y="106" width="200" height="60" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="130" y="131" fill="#e3fffa">c1 = m^e1 mod n</text>
    <text x="130" y="151" fill="#e3fffa">c2 = m^e2 mod n</text>

    <rect x="300" y="106" width="200" height="60" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="400" y="131" fill="#ff2a6d" font-weight="700">Extended Euclid</text>
    <text x="400" y="151" fill="#9fb0c8" font-family="'JetBrains Mono',monospace" font-size="11">a*e1 + b*e2 = 1</text>

    <rect x="570" y="106" width="200" height="60" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="670" y="131" fill="#5fe3b0" font-weight="700">m = c1^a * c2^b</text>
    <text x="670" y="151" fill="#9fb0c8" font-size="11">mod n</text>
  </g>

  <text x="30" y="232" font-size="12" fill="#fcee0a" font-family="'JetBrains Mono',monospace">HASTAD BROADCAST: same m, e = 3, three moduli</text>
  <g font-size="12.5" text-anchor="middle">
    <rect x="30" y="246" width="200" height="60" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="130" y="271" fill="#e3fffa">c1, c2, c3 = m^3</text>
    <text x="130" y="291" fill="#9fb0c8" font-size="11">mod n1, n2, n3</text>

    <rect x="300" y="246" width="200" height="60" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="400" y="271" fill="#ff2a6d" font-weight="700">CRT, then cube root</text>
    <text x="400" y="291" fill="#9fb0c8" font-family="'JetBrains Mono',monospace" font-size="11">m^3 &lt; n1*n2*n3</text>

    <rect x="570" y="246" width="200" height="60" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="670" y="271" fill="#5fe3b0" font-weight="700">Plaintext m</text>
    <text x="670" y="291" fill="#9fb0c8" font-size="11">no factoring needed</text>
  </g>

  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="230" y1="136" x2="296" y2="136"/>
    <line x1="500" y1="136" x2="566" y2="136"/>
    <line x1="230" y1="276" x2="296" y2="276"/>
    <line x1="500" y1="276" x2="566" y2="276"/>
  </g>
  <text x="400" y="350" text-anchor="middle" font-size="11" fill="#6c7b93">Fix: never share n, and always use randomized padding.</text>
</svg>
