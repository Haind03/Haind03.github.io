<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
<rect x="0" y="0" width="800" height="380" rx="12" fill="#0d121d" stroke="#263451"/>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/></marker></defs>
<text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Hastad broadcast: CRT turns 3 ciphertexts into m^3</text>
<text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">RSA with e = 3, same message sent to three recipients</text>
<rect x="30" y="90" width="190" height="52" rx="7" fill="#111827" stroke="#00f0ff"/><text x="125.0" y="112.0" text-anchor="middle" font-size="11" fill="#e3fffa" font-family="'JetBrains Mono',monospace">c1 = m^3 mod n1</text><text x="125.0" y="128.0" text-anchor="middle" font-size="10.5" fill="#6c7b93">modulus n1 (public)</text>
<line x1="220" y1="116" x2="300" y2="190" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<rect x="30" y="160" width="190" height="52" rx="7" fill="#111827" stroke="#00f0ff"/><text x="125.0" y="182.0" text-anchor="middle" font-size="11" fill="#e3fffa" font-family="'JetBrains Mono',monospace">c2 = m^3 mod n2</text><text x="125.0" y="198.0" text-anchor="middle" font-size="10.5" fill="#6c7b93">modulus n2 (public)</text>
<line x1="220" y1="186" x2="300" y2="190" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<rect x="30" y="230" width="190" height="52" rx="7" fill="#111827" stroke="#00f0ff"/><text x="125.0" y="252.0" text-anchor="middle" font-size="11" fill="#e3fffa" font-family="'JetBrains Mono',monospace">c3 = m^3 mod n3</text><text x="125.0" y="268.0" text-anchor="middle" font-size="10.5" fill="#6c7b93">modulus n3 (public)</text>
<line x1="220" y1="256" x2="300" y2="190" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<rect x="300" y="150" width="170" height="80" rx="7" fill="#111827" stroke="#fcee0a"/><text x="385.0" y="178.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">CRT merge</text><text x="385.0" y="194.0" text-anchor="middle" font-size="11" fill="#fcee0a" font-family="'JetBrains Mono',monospace">C = m^3 mod n1*n2*n3</text><text x="385.0" y="210.0" text-anchor="middle" font-size="10.5" fill="#6c7b93">moduli pairwise coprime</text>
<line x1="470" y1="190" x2="520" y2="190" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<rect x="520" y="150" width="120" height="80" rx="7" fill="#111827" stroke="#ff2a6d"/><text x="580.0" y="178.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">C = m^3</text><text x="580.0" y="194.0" text-anchor="middle" font-size="10.5" fill="#6c7b93">no wrap around</text><text x="580.0" y="210.0" text-anchor="middle" font-size="10.5" fill="#6c7b93">since m^3 &lt; n1*n2*n3</text>
<line x1="640" y1="190" x2="670" y2="190" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<rect x="670" y="150" width="100" height="80" rx="7" fill="#111827" stroke="#5fe3b0"/><text x="720.0" y="178.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">cube root</text><text x="720.0" y="194.0" text-anchor="middle" font-size="11" fill="#5fe3b0" font-family="'JetBrains Mono',monospace">m</text><text x="720.0" y="210.0" text-anchor="middle" font-size="10.5" fill="#6c7b93">integer root</text>
<rect x="300" y="262" width="340" height="44" rx="7" fill="#0b1518" stroke="#ff2a6d" stroke-dasharray="5 4"/><text x="470.0" y="288.0" text-anchor="middle" font-size="11.5" fill="#ff2a6d">never use floats: C ** (1/3) loses precision</text>
<text x="400" y="350" text-anchor="middle" font-size="11" fill="#6c7b93">Same m, small e, at least e recipients, no random padding.</text>
</svg>
