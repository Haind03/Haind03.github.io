<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="400" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">PKCS#1 v1.5 block and the Bleichenbacher oracle</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">a single valid / invalid bit is enough</text>

  <g font-size="12.5" text-anchor="middle">
    <rect x="60" y="84" width="70" height="44" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="95" y="111" fill="#e3fffa" font-family="'JetBrains Mono',monospace">00</text>
    <rect x="136" y="84" width="70" height="44" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="171" y="111" fill="#e3fffa" font-family="'JetBrains Mono',monospace">02</text>
    <rect x="212" y="84" width="270" height="44" rx="7" fill="#111827" stroke="#263451"/>
    <text x="347" y="111" fill="#9fb0c8">PS: random non-zero bytes (8 or more)</text>
    <rect x="488" y="84" width="70" height="44" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="523" y="111" fill="#e3fffa" font-family="'JetBrains Mono',monospace">00</text>
    <rect x="564" y="84" width="176" height="44" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="652" y="111" fill="#fcee0a">M (the secret)</text>
  </g>
  <text x="400" y="150" text-anchor="middle" font-size="11" fill="#6c7b93" font-family="'JetBrains Mono',monospace">valid block means 2B &lt;= m &lt; 3B, with B = 2^(8*(k-2))</text>

  <g font-size="12.5" text-anchor="middle">
    <rect x="40" y="206" width="190" height="64" rx="7" fill="#0b1518" stroke="#ff2a6d" stroke-dasharray="5 4"/>
    <text x="135" y="232" fill="#ff2a6d" font-weight="700">Attacker</text>
    <text x="135" y="252" fill="#9fb0c8" font-family="'JetBrains Mono',monospace" font-size="11">sends c * s^e mod n</text>

    <rect x="300" y="206" width="200" height="64" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="400" y="232" fill="#e3fffa">Server with d</text>
    <text x="400" y="252" fill="#9fb0c8" font-size="11">is it 00 02 ...?</text>

    <rect x="570" y="206" width="190" height="64" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="665" y="232" fill="#5fe3b0" font-weight="700">Interval M shrinks</text>
    <text x="665" y="252" fill="#9fb0c8" font-size="11">until one point: m</text>
  </g>
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="230" y1="228" x2="296" y2="228"/>
    <line x1="500" y1="228" x2="566" y2="228"/>
    <path d="M300 256 L234 256"/>
  </g>
  <text x="265" y="290" text-anchor="middle" font-size="11" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">yes / no</text>

  <g font-size="12.5" text-anchor="middle">
    <rect x="200" y="320" width="400" height="48" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="400" y="341" fill="#5fe3b0" font-weight="700">Fix: OAEP for encryption, PSS for signatures</text>
    <text x="400" y="358" fill="#9fb0c8" font-size="11">random seed, all-or-nothing, no numeric interval to narrow</text>
  </g>
</svg>
