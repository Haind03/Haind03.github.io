<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
<rect x="0" y="0" width="800" height="390" rx="12" fill="#0d121d" stroke="#263451"/>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/></marker></defs>
<text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Birthday bound: collisions cost the square root</text>
<text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">for an n-bit output, collision is 2^(n/2) and preimage is 2^n</text>
<rect x="40" y="95" width="220" height="60" rx="7" fill="#111827" stroke="#00f0ff"/><text x="150.0" y="121.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">n-bit hash</text><text x="150.0" y="137.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">N = 2^n possible outputs</text>
<line x1="260" y1="115" x2="330" y2="115" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<line x1="260" y1="135" x2="330" y2="175" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<rect x="330" y="90" width="200" height="50" rx="7" fill="#111827" stroke="#ff2a6d"/><text x="430.0" y="111.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">Collision (birthday)</text><text x="430.0" y="127.0" text-anchor="middle" font-size="11" fill="#ff2a6d" font-family="'JetBrains Mono',monospace">cost ~ 2^(n/2)</text>
<rect x="330" y="160" width="200" height="50" rx="7" fill="#111827" stroke="#fcee0a"/><text x="430.0" y="181.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">Preimage</text><text x="430.0" y="197.0" text-anchor="middle" font-size="11" fill="#fcee0a" font-family="'JetBrains Mono',monospace">cost ~ 2^n</text>
<rect x="580" y="90" width="180" height="50" rx="7" fill="#111827" stroke="#5fe3b0"/><text x="670.0" y="111.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">MD5 128-bit</text><text x="670.0" y="127.0" text-anchor="middle" font-size="11" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">collision ~ 2^64</text>
<rect x="580" y="160" width="180" height="50" rx="7" fill="#111827" stroke="#5fe3b0"/><text x="670.0" y="181.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">SHA-256</text><text x="670.0" y="197.0" text-anchor="middle" font-size="11" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">collision ~ 2^128</text>
<line x1="530" y1="115" x2="580" y2="115" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<line x1="530" y1="185" x2="580" y2="185" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="250" width="350" height="70" rx="7" fill="#111827" stroke="#263451"/><text x="215.0" y="273.0" text-anchor="middle" font-size="11" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">P(collision) = 1 - e^(-k^2 / 2N)</text><text x="215.0" y="289.0" text-anchor="middle" font-size="10.5" fill="#6c7b93">23 people, 365 days: P = 0.507</text><text x="215.0" y="305.0" text-anchor="middle" font-size="10.5" fill="#6c7b93">253 pairs, not 23 people, drive the odds</text>
<rect x="420" y="250" width="340" height="70" rx="7" fill="#111827" stroke="#fcee0a"/><text x="590.0" y="273.0" text-anchor="middle" font-size="11" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">H = -sum p_i log2 p_i   (Shannon)</text><text x="590.0" y="289.0" text-anchor="middle" font-size="11" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">H_inf = -log2 p_max   (min-entropy)</text><text x="590.0" y="305.0" text-anchor="middle" font-size="10.5" fill="#6c7b93">guessing resistance follows p_max</text>
<text x="400" y="360" text-anchor="middle" font-size="11" fill="#6c7b93">A 32-bit hash collided after 86515 tries in the demo, near 2^16 = 65536.</text>
</svg>
