<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
<rect x="0" y="0" width="800" height="380" rx="12" fill="#0d121d" stroke="#263451"/>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/></marker></defs>
<text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Group, ring, field, and the two finite field families</text>
<text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">each step adds a requirement on the structure</text>
<rect x="30" y="90" width="125" height="76" rx="7" fill="#111827" stroke="#00f0ff"/><text x="92.5" y="116.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">Group</text><text x="92.5" y="132.0" text-anchor="middle" font-size="10.5" fill="#6c7b93">one operation</text><text x="92.5" y="148.0" text-anchor="middle" font-size="10.5" fill="#6c7b93">closure, identity, inverse</text>
<line x1="155" y1="128" x2="235" y2="128" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<rect x="235" y="90" width="125" height="76" rx="7" fill="#111827" stroke="#fcee0a"/><text x="297.5" y="116.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">Ring</text><text x="297.5" y="132.0" text-anchor="middle" font-size="10.5" fill="#6c7b93">add and multiply</text><text x="297.5" y="148.0" text-anchor="middle" font-size="10.5" fill="#6c7b93">no inverse needed, e.g. Z_6</text>
<line x1="360" y1="128" x2="440" y2="128" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<rect x="440" y="90" width="125" height="76" rx="7" fill="#111827" stroke="#5fe3b0"/><text x="502.5" y="116.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">Field</text><text x="502.5" y="132.0" text-anchor="middle" font-size="10.5" fill="#6c7b93">every nonzero element</text><text x="502.5" y="148.0" text-anchor="middle" font-size="10.5" fill="#6c7b93">has an inverse</text>
<line x1="565" y1="128" x2="645" y2="128" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<rect x="645" y="90" width="125" height="76" rx="7" fill="#111827" stroke="#263451"/><text x="707.5" y="116.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">Finite field</text><text x="707.5" y="132.0" text-anchor="middle" font-size="10.5" fill="#6c7b93">size q = p^n</text><text x="707.5" y="148.0" text-anchor="middle" font-size="10.5" fill="#6c7b93">unique for each q</text>
<line x1="480" y1="166" x2="230" y2="215" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<line x1="560" y1="166" x2="610" y2="215" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<rect x="80" y="215" width="300" height="100" rx="7" fill="#111827" stroke="#00f0ff"/><text x="230.0" y="245.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">GF(p) = Z_p, p prime</text><text x="230.0" y="261.0" text-anchor="middle" font-size="11" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">add, multiply mod p</text><text x="230.0" y="277.0" text-anchor="middle" font-size="10.5" fill="#6c7b93">used by DH and RSA arithmetic</text><text x="230.0" y="293.0" text-anchor="middle" font-size="10.5" fill="#6c7b93">Z_7*: 3 is a generator (order 6)</text>
<rect x="430" y="215" width="300" height="100" rx="7" fill="#111827" stroke="#fcee0a"/><text x="580.0" y="245.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">GF(2^n), polynomials over bits</text><text x="580.0" y="261.0" text-anchor="middle" font-size="11" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">add = XOR, no carry</text><text x="580.0" y="277.0" text-anchor="middle" font-size="11" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">mul = poly mul mod irreducible</text><text x="580.0" y="293.0" text-anchor="middle" font-size="10.5" fill="#6c7b93">AES: GF(2^8), 0x11B</text>
<text x="400" y="350" text-anchor="middle" font-size="11" fill="#6c7b93">Z_n is a field only when n is prime. Z_256 is not GF(2^8).</text>
</svg>
