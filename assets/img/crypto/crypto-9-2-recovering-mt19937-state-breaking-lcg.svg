<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="400" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Untemper 624 outputs, clone the generator</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">temper is four reversible steps, so output gives back state</text>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/></marker></defs>
  <g font-size="12.5" text-anchor="middle">
    <rect x="30" y="86" width="130" height="54" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="95" y="109" fill="#e3fffa">624 outputs</text>
    <text x="95" y="126" fill="#6c7b93" font-size="10.5">getrandbits(32)</text>
    <rect x="190" y="86" width="150" height="54" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="265" y="109" fill="#e3fffa">untemper</text>
    <text x="265" y="126" fill="#6c7b93" font-size="10.5">&gt;&gt;18, &lt;&lt;15, &lt;&lt;7, &gt;&gt;11</text>
    <rect x="370" y="86" width="130" height="54" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="435" y="109" fill="#e3fffa">624 state words</text>
    <text x="435" y="126" fill="#6c7b93" font-size="10.5">setstate(..., 624)</text>
    <rect x="530" y="86" width="110" height="54" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="585" y="109" fill="#e3fffa">clone</text>
    <text x="585" y="126" fill="#6c7b93" font-size="10.5">same stream</text>
    <rect x="670" y="86" width="100" height="54" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="720" y="109" fill="#e3fffa">next 5</text>
    <text x="720" y="126" fill="#6c7b93" font-size="10.5">match</text>
  </g>
  <g font-size="11.5" font-family="'JetBrains Mono',monospace" fill="#9fb0c8">
    <text x="30" y="178" fill="#6c7b93">LCG: X(n+1) = (a * X(n) + c) mod m</text>
  </g>
  <g font-size="12" text-anchor="middle">
    <rect x="30" y="200" width="170" height="54" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="115" y="223" fill="#e3fffa">12 outputs s0..s11</text>
    <text x="115" y="240" fill="#6c7b93" font-size="10.5">no secret known</text>
    <rect x="230" y="200" width="170" height="54" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="315" y="223" fill="#e3fffa">m = gcd of</text>
    <text x="315" y="240" fill="#e3fffa">t(i+1)t(i-1) - t(i)^2</text>
    <rect x="430" y="200" width="170" height="54" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="515" y="223" fill="#e3fffa">a = (s2-s1)(s1-s0)^-1</text>
    <text x="515" y="240" fill="#6c7b93" font-size="10.5">mod m</text>
    <rect x="630" y="200" width="140" height="54" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="700" y="223" fill="#e3fffa">c = s1 - a*s0</text>
    <text x="700" y="240" fill="#6c7b93" font-size="10.5">predict next</text>
  </g>
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="160" y1="113" x2="186" y2="113"/>
    <line x1="340" y1="113" x2="366" y2="113"/>
    <line x1="500" y1="113" x2="526" y2="113"/>
    <line x1="640" y1="113" x2="666" y2="113"/>
    <line x1="200" y1="227" x2="226" y2="227"/>
    <line x1="400" y1="227" x2="426" y2="227"/>
    <line x1="600" y1="227" x2="626" y2="227"/>
  </g>
  <rect x="30" y="292" width="740" height="46" rx="7" fill="#0b1518" stroke="#ff2a6d" stroke-dasharray="5 4"/>
  <text x="400" y="312" text-anchor="middle" font-size="11.5" fill="#9fb0c8">Victim seed is never used. Only raw, untruncated output is needed.</text>
  <text x="400" y="328" text-anchor="middle" font-size="11.5" fill="#9fb0c8">Fix: use a CSPRNG and never expose raw PRNG output.</text>
  <text x="400" y="372" text-anchor="middle" font-size="11" fill="#6c7b93">Demo result: 5 of 5 predicted numbers match, LCG (a, c, m) recovered exactly.</text>
</svg>
