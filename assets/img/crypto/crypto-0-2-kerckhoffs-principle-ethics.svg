<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="360" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Kerckhoffs: the enemy knows the system</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">only the key may stay secret</text>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/></marker></defs>
  <g font-size="12.5" text-anchor="middle">
    <rect x="28" y="110" width="150" height="70" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="103" y="136" fill="#e3fffa">Plaintext</text>
    <text x="103" y="156" fill="#9fb0c8" font-size="10.5">message</text>
    <rect x="236" y="96" width="190" height="98" rx="7" fill="#111827" stroke="#00f0ff" stroke-dasharray="5 4"/>
    <text x="331" y="122" fill="#e3fffa">Public algorithm</text>
    <text x="331" y="142" fill="#9fb0c8" font-size="10.5">spec, source, hardware</text>
    <text x="331" y="160" fill="#9fb0c8" font-size="10.5">attacker has all of it</text>
    <text x="331" y="180" fill="#00f0ff" font-size="10.5">known</text>
    <rect x="484" y="110" width="130" height="70" rx="7" fill="#111827" stroke="#263451"/>
    <text x="549" y="136" fill="#e3fffa">Ciphertext</text>
    <text x="549" y="156" fill="#9fb0c8" font-size="10.5">on the wire</text>
    <rect x="672" y="110" width="100" height="70" rx="7" fill="#111827" stroke="#ff2a6d" stroke-dasharray="5 4"/>
    <text x="722" y="140" fill="#ff2a6d">Attacker</text>
    <text x="722" y="158" fill="#9fb0c8" font-size="10.5">sees it</text>
    <rect x="256" y="236" width="150" height="56" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="331" y="260" fill="#fcee0a" font-weight="700">Secret key</text>
    <text x="331" y="278" fill="#9fb0c8" font-size="10.5">short, replaceable</text>
  </g>
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="178" y1="145" x2="232" y2="145"/>
    <line x1="426" y1="145" x2="480" y2="145"/>
    <line x1="614" y1="145" x2="668" y2="145"/>
    <line x1="331" y1="236" x2="331" y2="198" stroke="#fcee0a"/>
  </g>
  <g font-size="11.5">
    <text x="440" y="252" fill="#5fe3b0" font-family="'JetBrains Mono',monospace">safe: change the key after a leak</text>
    <text x="440" y="276" fill="#ff2a6d" font-family="'JetBrains Mono',monospace">unsafe: hide the algorithm instead</text>
  </g>
  <text x="400" y="330" text-anchor="middle" font-size="11" fill="#6c7b93">A leaked algorithm cannot be patched like a key, so design as if it is already public.</text>
</svg>
