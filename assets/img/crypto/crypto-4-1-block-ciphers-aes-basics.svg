<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <defs>
    <marker id="a" markerWidth="9" marker380eight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="380" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">AES: one 16-byte block in, one 16-byte block out</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">keyed permutation on 2^128 blocks, reversible with the key</text>
  <g font-size="12.5" text-anchor="middle">
    <rect x="28" y="130" width="120" height="58" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="88" y="155" fill="#e3fffa">Plaintext</text>
    <text x="88" y="174" fill="#6c7b93" font-size="10.5">16 bytes</text>
    <rect x="186" y="96" width="430" height="210" rx="7" fill="#111827" stroke="#263451"/>
    <text x="401" y="120" fill="#e3fffa" font-weight="700">AES, repeated 10 / 12 / 14 rounds</text>
    <rect x="206" y="138" width="190" height="38" rx="7" fill="#0d121d" stroke="#ff2a6d"/>
    <text x="301" y="162" fill="#ff2a6d">SubBytes (S-box, nonlinear)</text>
    <rect x="406" y="138" width="190" height="38" rx="7" fill="#0d121d" stroke="#263451"/>
    <text x="501" y="162" fill="#e3fffa">ShiftRows</text>
    <rect x="206" y="188" width="190" height="38" rx="7" fill="#0d121d" stroke="#263451"/>
    <text x="301" y="212" fill="#e3fffa">MixColumns (GF(2^8))</text>
    <rect x="406" y="188" width="190" height="38" rx="7" fill="#0d121d" stroke="#fcee0a"/>
    <text x="501" y="212" fill="#fcee0a">AddRoundKey (xor)</text>
    <text x="401" y="256" fill="#9fb0c8" font-size="11.5">last round skips MixColumns</text>
    <text x="401" y="278" fill="#9fb0c8" font-size="11.5">1 flipped input bit flips about 64 of 128 output bits</text>
    <rect x="654" y="130" width="118" height="58" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="713" y="155" fill="#e3fffa">Ciphertext</text>
    <text x="713" y="174" fill="#6c7b93" font-size="10.5">16 bytes</text>
    <rect x="186" y="324" width="130" height="38" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="251" y="348" fill="#fcee0a">Key 16/24/32 B</text>
    <rect x="360" y="324" width="256" height="38" rx="7" fill="#111827" stroke="#fcee0a" stroke-dasharray="5 4"/>
    <text x="488" y="348" fill="#fcee0a" font-size="11.5">key schedule: 11 x 16 = 176 B (AES-128)</text>
  </g>
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="148" y1="159" x2="182" y2="159"/><line x1="616" y1="159" x2="650" y2="159"/>
    <line x1="316" y1="343" x2="356" y2="343"/>
    <line x1="488" y1="324" x2="488" y2="310"/>
  </g>
</svg>
