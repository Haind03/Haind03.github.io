<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="380" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Small d and small roots</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">Wiener uses continued fractions, Coppersmith uses LLL</text>

  <text x="30" y="92" font-size="12" fill="#fcee0a" font-family="'JetBrains Mono',monospace">WIENER: d &lt; n^(1/4) / 3</text>
  <g font-size="12.5" text-anchor="middle">
    <rect x="30" y="106" width="200" height="60" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="130" y="131" fill="#e3fffa">e/n is close to k/d</text>
    <text x="130" y="151" fill="#9fb0c8" font-family="'JetBrains Mono',monospace" font-size="11">e*d = 1 + k*phi</text>

    <rect x="300" y="106" width="200" height="60" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="400" y="131" fill="#ff2a6d" font-weight="700">Convergents of e/n</text>
    <text x="400" y="151" fill="#9fb0c8" font-size="11">test each k/d with phi</text>

    <rect x="570" y="106" width="200" height="60" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="670" y="131" fill="#5fe3b0" font-weight="700">Private key d</text>
    <text x="670" y="151" fill="#9fb0c8" font-size="11">x^2 - (p+q)x + n has roots</text>
  </g>

  <text x="30" y="232" font-size="12" fill="#fcee0a" font-family="'JetBrains Mono',monospace">COPPERSMITH: |x0| &lt; N^(1/deg)</text>
  <g font-size="12.5" text-anchor="middle">
    <rect x="30" y="246" width="200" height="60" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="130" y="271" fill="#e3fffa">f(x) = 0 mod N</text>
    <text x="130" y="291" fill="#9fb0c8" font-size="11">known prefix or high bits of p</text>

    <rect x="300" y="246" width="200" height="60" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="400" y="271" fill="#ff2a6d" font-weight="700">Lattice + LLL</text>
    <text x="400" y="291" fill="#9fb0c8" font-family="'JetBrains Mono',monospace" font-size="11">small_roots(X, beta)</text>

    <rect x="570" y="246" width="200" height="60" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="670" y="271" fill="#5fe3b0" font-weight="700">Small root x0</text>
    <text x="670" y="291" fill="#9fb0c8" font-size="11">message tail or p</text>
  </g>

  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="230" y1="136" x2="296" y2="136"/>
    <line x1="500" y1="136" x2="566" y2="136"/>
    <line x1="230" y1="276" x2="296" y2="276"/>
    <line x1="500" y1="276" x2="566" y2="276"/>
  </g>
  <text x="400" y="350" text-anchor="middle" font-size="11" fill="#6c7b93">A very large e hints at a small d. Both attacks have hard theoretical limits.</text>
</svg>
