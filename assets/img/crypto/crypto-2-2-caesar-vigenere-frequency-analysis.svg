<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
<rect x="0" y="0" width="800" height="370" rx="12" fill="#0d121d" stroke="#263451"/>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/></marker></defs>
<text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Breaking Vigenere: key length first, then Caesar</text>
<text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">index of coincidence exposes the repeat period of the key</text>
<rect x="30" y="85" width="150" height="60" rx="7" fill="#111827" stroke="#00f0ff"/><text x="105.0" y="111.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">Vigenere ciphertext</text><text x="105.0" y="127.0" text-anchor="middle" font-size="10.5" fill="#6c7b93">key length m unknown</text>
<line x1="180" y1="115" x2="225" y2="115" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<rect x="225" y="85" width="170" height="60" rx="7" fill="#111827" stroke="#263451"/><text x="310.0" y="111.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">Split into m columns</text><text x="310.0" y="127.0" text-anchor="middle" font-size="10.5" fill="#6c7b93">cols j, j+m, j+2m, ...</text>
<line x1="395" y1="115" x2="440" y2="115" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<rect x="440" y="85" width="170" height="60" rx="7" fill="#111827" stroke="#fcee0a"/><text x="525.0" y="111.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">Average IoC per m</text><text x="525.0" y="127.0" text-anchor="middle" font-size="10.5" fill="#6c7b93">English ~0.066, random ~0.038</text>
<line x1="610" y1="115" x2="650" y2="115" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="85" width="120" height="60" rx="7" fill="#111827" stroke="#ff2a6d"/><text x="710.0" y="111.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">Pick m</text><text x="710.0" y="127.0" text-anchor="middle" font-size="11" fill="#ff2a6d" font-family="'JetBrains Mono',monospace">m = 5: 0.0714</text>
<line x1="710" y1="145" x2="710" y2="190" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<rect x="520" y="190" width="250" height="60" rx="7" fill="#111827" stroke="#263451"/><text x="645.0" y="216.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">Each column is a Caesar shift</text><text x="645.0" y="232.0" text-anchor="middle" font-size="10.5" fill="#6c7b93">score 26 shifts by chi-squared</text>
<line x1="520" y1="220" x2="440" y2="220" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<rect x="250" y="190" width="190" height="60" rx="7" fill="#111827" stroke="#fcee0a"/><text x="345.0" y="216.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">Key letters</text><text x="345.0" y="232.0" text-anchor="middle" font-size="11" fill="#fcee0a" font-family="'JetBrains Mono',monospace">L E M O N</text>
<line x1="250" y1="220" x2="200" y2="220" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
<rect x="30" y="190" width="170" height="60" rx="7" fill="#111827" stroke="#5fe3b0"/><text x="115.0" y="216.0" text-anchor="middle" font-size="12.5" fill="#e3fffa">Plaintext</text><text x="115.0" y="232.0" text-anchor="middle" font-size="10.5" fill="#6c7b93">no key needed upfront</text>
<text x="30" y="284" text-anchor="start" font-size="11" fill="#6c7b93" font-family="'JetBrains Mono',monospace">IoC by key length (demo output)</text>
<rect x="40" y="306.4" width="50" height="23.6" rx="3" fill="#263451"/>
<text x="65" y="346" text-anchor="middle" font-size="10" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">m=1  0.0422</text>
<rect x="130" y="305.6" width="50" height="24.4" rx="3" fill="#263451"/>
<text x="155" y="346" text-anchor="middle" font-size="10" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">m=2  0.0435</text>
<rect x="220" y="306.4" width="50" height="23.6" rx="3" fill="#263451"/>
<text x="245" y="346" text-anchor="middle" font-size="10" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">m=3  0.0422</text>
<rect x="310" y="305.0" width="50" height="25.0" rx="3" fill="#263451"/>
<text x="335" y="346" text-anchor="middle" font-size="10" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">m=4  0.0446</text>
<rect x="400" y="290.0" width="50" height="40.0" rx="3" fill="#ff2a6d"/>
<text x="425" y="346" text-anchor="middle" font-size="10" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">m=5  0.0714</text>
<rect x="490" y="304.8" width="50" height="25.2" rx="3" fill="#263451"/>
<text x="515" y="346" text-anchor="middle" font-size="10" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">m=6  0.0449</text>
<rect x="580" y="307.1" width="50" height="22.9" rx="3" fill="#263451"/>
<text x="605" y="346" text-anchor="middle" font-size="10" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">m=7  0.0408</text>
<rect x="670" y="304.7" width="50" height="25.3" rx="3" fill="#263451"/>
<text x="695" y="346" text-anchor="middle" font-size="10" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">m=8  0.0451</text>
</svg>
