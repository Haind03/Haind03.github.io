<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="400" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Padding oracle: recovering one byte of Ii</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">Pi = D(Ci) XOR C(i-1), and the attacker controls C(i-1)</text>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>
  <g font-size="12.5" text-anchor="middle">
    <rect x="28" y="100" width="150" height="62" rx="7" fill="#111827" stroke="#ff2a6d" stroke-dasharray="5 4"/>
    <text x="103" y="124" fill="#e3fffa">forged C'</text>
    <text x="103" y="144" fill="#9fb0c8" font-size="11">last byte = guess 0..255</text>

    <rect x="28" y="182" width="150" height="62" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="103" y="206" fill="#e3fffa">target block Ci</text>
    <text x="103" y="226" fill="#9fb0c8" font-size="11">taken from the ciphertext</text>

    <rect x="240" y="126" width="190" height="92" rx="7" fill="#111827" stroke="#263451"/>
    <text x="335" y="150" fill="#e3fffa">Server</text>
    <text x="335" y="172" fill="#9fb0c8" font-size="11">P' = D(Ci) XOR C'</text>
    <text x="335" y="190" fill="#9fb0c8" font-size="11">unpad(P')</text>
    <text x="335" y="208" fill="#fcee0a" font-size="11">KEY stays on the server</text>

    <rect x="492" y="100" width="130" height="50" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="557" y="120" fill="#5fe3b0">padding valid</text>
    <text x="557" y="138" fill="#9fb0c8" font-size="11">P'[15] = 0x01</text>
    <rect x="492" y="190" width="130" height="50" rx="7" fill="#111827" stroke="#263451"/>
    <text x="557" y="210" fill="#e3fffa">padding invalid</text>
    <text x="557" y="228" fill="#9fb0c8" font-size="11">try next guess</text>

    <rect x="664" y="126" width="112" height="92" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="720" y="150" fill="#fcee0a">1 bit leak</text>
    <text x="720" y="172" fill="#9fb0c8" font-size="11">valid or not</text>
    <text x="720" y="190" fill="#9fb0c8" font-size="11">error, status</text>
    <text x="720" y="208" fill="#9fb0c8" font-size="11">or timing</text>
  </g>
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="178" y1="131" x2="236" y2="150"/>
    <line x1="178" y1="213" x2="236" y2="194"/>
    <line x1="430" y1="160" x2="488" y2="130"/>
    <line x1="430" y1="184" x2="488" y2="212"/>
    <line x1="622" y1="125" x2="660" y2="160"/>
    <line x1="622" y1="215" x2="660" y2="190"/>
  </g>
  <rect x="28" y="274" width="744" height="100" rx="7" fill="#111827" stroke="#00f0ff"/>
  <g font-family="'JetBrains Mono',monospace" font-size="12.5" fill="#e3fffa">
    <text x="48" y="302">Ii[15] = guess XOR 0x01</text>
    <text x="48" y="326">Pi[15] = Ii[15] XOR C(i-1)[15]    (real previous block)</text>
    <text x="48" y="350" fill="#9fb0c8">next byte: force P'[15] = 0x02, search byte 14, repeat to byte 0</text>
  </g>
</svg>
