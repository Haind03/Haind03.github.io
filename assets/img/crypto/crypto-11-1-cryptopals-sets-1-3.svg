<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="380" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">CBC padding oracle, one byte at a time</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">P_i = D(C_i) XOR C_(i-1), and we control C_(i-1)</text>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>
  <g font-size="12.5" text-anchor="middle">
    <rect x="28" y="110" width="150" height="56" rx="7" fill="#0b1518" stroke="#ff2a6d" stroke-dasharray="5 4"/>
    <text x="103" y="133" fill="#e3fffa">Forged block</text>
    <text x="103" y="151" fill="#ff2a6d" font-family="'JetBrains Mono',monospace" font-size="11">guess, 0..255</text>

    <rect x="28" y="214" width="150" height="56" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="103" y="237" fill="#e3fffa">Target block C_i</text>
    <text x="103" y="255" fill="#6c7b93" font-size="10.5">known ciphertext</text>

    <rect x="232" y="214" width="140" height="56" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="302" y="237" fill="#e3fffa">AES decrypt D</text>
    <text x="302" y="255" fill="#6c7b93" font-size="10.5">secret key</text>

    <rect x="232" y="110" width="140" height="56" rx="7" fill="#111827" stroke="#263451"/>
    <text x="302" y="133" fill="#e3fffa">XOR</text>
    <text x="302" y="151" fill="#6c7b93" font-size="10.5">D(C_i) XOR forged</text>

    <rect x="426" y="110" width="150" height="56" rx="7" fill="#111827" stroke="#263451"/>
    <text x="501" y="133" fill="#e3fffa">Unpad check</text>
    <text x="501" y="151" fill="#6c7b93" font-size="10.5">PKCS#7</text>

    <rect x="620" y="110" width="152" height="56" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="696" y="133" fill="#ff2a6d" font-weight="700">Oracle</text>
    <text x="696" y="151" fill="#9fb0c8" font-size="11">valid / invalid</text>

    <rect x="426" y="214" width="346" height="56" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="599" y="237" fill="#e3fffa" font-family="'JetBrains Mono',monospace" font-size="11.5">inter = guess XOR pad_val</text>
    <text x="599" y="255" fill="#5fe3b0" font-family="'JetBrains Mono',monospace" font-size="11.5">P_i = inter XOR real C_(i-1)</text>
  </g>
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="178" y1="242" x2="228" y2="242"/>
    <line x1="302" y1="212" x2="302" y2="170"/>
    <line x1="178" y1="138" x2="228" y2="138"/>
    <line x1="372" y1="138" x2="422" y2="138"/>
    <line x1="576" y1="138" x2="616" y2="138"/>
    <line x1="696" y1="168" x2="640" y2="212"/>
  </g>
  <text x="400" y="320" text-anchor="middle" font-size="12" fill="#9fb0c8">Repeat for every byte, last to first, forcing the known bytes to the next pad value.</text>
  <text x="400" y="344" text-anchor="middle" font-size="11" fill="#6c7b93">One bit of feedback per query is enough to recover the full plaintext without the key.</text>
</svg>
