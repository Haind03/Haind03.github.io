<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <defs>
    <marker id="a" markerWidth="9" marker380eight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="380" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Two-time pad: key reuse cancels the key</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">k xor k = 0, so c1 xor c2 = p1 xor p2</text>
  <g font-size="12.5" text-anchor="middle">
    <rect x="28" y="92" width="150" height="48" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="103" y="121" fill="#e3fffa" font-family="'JetBrains Mono',monospace">p1</text>
    <rect x="28" y="196" width="150" height="48" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="103" y="225" fill="#e3fffa" font-family="'JetBrains Mono',monospace">p2</text>
    <rect x="215" y="144" width="110" height="48" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="270" y="173" fill="#fcee0a" font-family="'JetBrains Mono',monospace">same key k</text>
    <rect x="362" y="92" width="150" height="48" rx="7" fill="#111827" stroke="#263451"/>
    <text x="437" y="121" fill="#e3fffa" font-family="'JetBrains Mono',monospace">c1 = p1 xor k</text>
    <rect x="362" y="196" width="150" height="48" rx="7" fill="#111827" stroke="#263451"/>
    <text x="437" y="225" fill="#e3fffa" font-family="'JetBrains Mono',monospace">c2 = p2 xor k</text>
    <rect x="590" y="144" width="182" height="48" rx="7" fill="#111827" stroke="#ff2a6d" stroke-dasharray="5 4"/>
    <text x="681" y="165" fill="#ff2a6d" font-weight="700">attacker: c1 xor c2</text>
    <text x="681" y="183" fill="#e3fffa" font-size="11.5" font-family="'JetBrains Mono',monospace">= p1 xor p2</text>
    <rect x="590" y="272" width="182" height="62" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="681" y="296" fill="#ff2a6d" font-weight="700">crib dragging</text>
    <text x="681" y="316" fill="#9fb0c8" font-size="11">"flag{", "the ", space trick</text>
    <rect x="362" y="272" width="182" height="62" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="453" y="296" fill="#5fe3b0" font-weight="700">p1 and p2 recovered</text>
    <text x="453" y="316" fill="#9fb0c8" font-size="11">key never needed</text>
  </g>
  <text x="28" y="300" font-size="11.5" fill="#9fb0c8">OTP needs: random key,</text>
  <text x="28" y="318" font-size="11.5" fill="#9fb0c8">same length, used once.</text>
  <text x="28" y="336" font-size="11.5" fill="#9fb0c8">CTR/ChaCha nonce reuse = same bug.</text>
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="178" y1="116" x2="358" y2="116"/><line x1="178" y1="220" x2="358" y2="220"/>
    <line x1="270" y1="144" x2="270" y2="124" stroke-dasharray="4 3"/><line x1="270" y1="192" x2="270" y2="212" stroke-dasharray="4 3"/>
    <line x1="512" y1="116" x2="586" y2="160"/><line x1="512" y1="220" x2="586" y2="176"/>
    <line x1="681" y1="192" x2="681" y2="268"/><line x1="590" y1="303" x2="548" y2="303"/>
  </g>
</svg>
