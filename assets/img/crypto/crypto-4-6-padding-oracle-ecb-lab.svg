<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="420" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Two oracles, two ways to recover plaintext without the key</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">ECB byte-at-a-time (left) and CBC padding oracle (right)</text>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>
  <line x1="400" y1="76" x2="400" y2="396" stroke="#263451" stroke-dasharray="4 4"/>
  <g font-size="12.5" text-anchor="middle">
    <text x="205" y="86" fill="#00f0ff" font-weight="700">ECB(input || SECRET)</text>
    <rect x="40" y="102" width="330" height="56" rx="7" fill="#111827" stroke="#ff2a6d" stroke-dasharray="5 4"/>
    <text x="205" y="124" fill="#e3fffa" font-family="'JetBrains Mono',monospace" font-size="11.5">oracle("A"*15) -> target block</text>
    <text x="205" y="144" fill="#9fb0c8" font-size="11">block = 15 x A + SECRET[0]</text>
    <rect x="40" y="184" width="330" height="56" rx="7" fill="#111827" stroke="#ff2a6d" stroke-dasharray="5 4"/>
    <text x="205" y="206" fill="#e3fffa" font-family="'JetBrains Mono',monospace" font-size="11.5">oracle("A"*15 + guess), 256 times</text>
    <text x="205" y="226" fill="#9fb0c8" font-size="11">compare the first block</text>
    <rect x="40" y="266" width="330" height="56" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="205" y="288" fill="#5fe3b0">equal blocks: guess = SECRET[0]</text>
    <text x="205" y="308" fill="#9fb0c8" font-size="11">shorten prefix, repeat for next byte</text>
    <text x="205" y="352" fill="#fcee0a" font-size="11.5">root cause: ECB is deterministic per block</text>

    <text x="595" y="86" fill="#00f0ff" font-weight="700">CBC + padding_ok(ct)</text>
    <rect x="430" y="102" width="330" height="56" rx="7" fill="#111827" stroke="#ff2a6d" stroke-dasharray="5 4"/>
    <text x="595" y="124" fill="#e3fffa">send forged C' + target Ci</text>
    <text x="595" y="144" fill="#9fb0c8" font-size="11">guess last byte of C'</text>
    <rect x="430" y="184" width="330" height="56" rx="7" fill="#111827" stroke="#263451"/>
    <text x="595" y="206" fill="#e3fffa">oracle answers valid or invalid</text>
    <text x="595" y="226" fill="#9fb0c8" font-size="11">target padding N = 16 - pos</text>
    <rect x="430" y="266" width="330" height="56" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="595" y="288" fill="#5fe3b0" font-family="'JetBrains Mono',monospace" font-size="11.5">Ii = guess XOR N</text>
    <text x="595" y="308" fill="#9fb0c8" font-size="11">Pi = Ii XOR real C(i-1)</text>
    <text x="595" y="352" fill="#fcee0a" font-size="11.5">root cause: no integrity check on ciphertext</text>
  </g>
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="205" y1="158" x2="205" y2="180"/>
    <line x1="205" y1="240" x2="205" y2="262"/>
    <line x1="595" y1="158" x2="595" y2="180"/>
    <line x1="595" y1="240" x2="595" y2="262"/>
  </g>
  <text x="400" y="394" text-anchor="middle" font-size="12" fill="#5fe3b0">Defense: AEAD (GCM) or encrypt-then-MAC, never ECB for user data</text>
</svg>
