<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="400" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Shor breaks public-key, Grover halves symmetric</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">the fix is a different hard problem, not longer keys</text>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/></marker></defs>
  <g font-size="12.5" text-anchor="middle">
    <rect x="30" y="90" width="170" height="60" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="115" y="113" fill="#e3fffa">RSA, DH, ECC</text>
    <text x="115" y="130" fill="#6c7b93" font-size="10.5">factoring, discrete log</text>
    <rect x="260" y="90" width="170" height="60" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="345" y="113" fill="#e3fffa">Shor</text>
    <text x="345" y="130" fill="#6c7b93" font-size="10.5">period finding, polynomial</text>
    <rect x="490" y="90" width="130" height="60" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="555" y="113" fill="#e3fffa">broken</text>
    <text x="555" y="130" fill="#6c7b93" font-size="10.5">any key size</text>
    <rect x="30" y="176" width="170" height="60" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="115" y="199" fill="#e3fffa">AES, SHA-2/3</text>
    <text x="115" y="216" fill="#6c7b93" font-size="10.5">search 2^k</text>
    <rect x="260" y="176" width="170" height="60" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="345" y="199" fill="#e3fffa">Grover</text>
    <text x="345" y="216" fill="#6c7b93" font-size="10.5">square root: 2^(k/2)</text>
    <rect x="490" y="176" width="130" height="60" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="555" y="199" fill="#e3fffa">double bits</text>
    <text x="555" y="216" fill="#6c7b93" font-size="10.5">AES-256 is fine</text>
  </g>
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="200" y1="120" x2="256" y2="120"/>
    <line x1="430" y1="120" x2="486" y2="120"/>
    <line x1="200" y1="206" x2="256" y2="206"/>
    <line x1="430" y1="206" x2="486" y2="206"/>
    <line x1="555" y1="150" x2="555" y2="268"/>
  </g>
  <g font-size="12" text-anchor="middle">
    <rect x="30" y="270" width="590" height="54" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="325" y="293" fill="#e3fffa">Post-quantum: lattice (LWE), code-based, hash-based</text>
    <text x="325" y="310" fill="#6c7b93" font-size="10.5">ML-KEM (FIPS 203) key exchange, ML-DSA (204) and SLH-DSA (205) signatures</text>
  </g>
  <rect x="650" y="90" width="120" height="146" rx="7" fill="#0b1518" stroke="#ff2a6d" stroke-dasharray="5 4"/>
  <g font-size="11" text-anchor="middle" fill="#9fb0c8">
    <text x="710" y="130">harvest now,</text>
    <text x="710" y="148">decrypt later</text>
    <text x="710" y="180">recorded traffic</text>
    <text x="710" y="198">waits for a</text>
    <text x="710" y="216">quantum machine</text>
  </g>
  <text x="400" y="364" text-anchor="middle" font-size="11" fill="#6c7b93">LWE hides the secret behind small noise: b = A.s + e (mod q).</text>
</svg>
