<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="420" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Why RSA decryption returns m</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">toy RSA: p=61, q=53, n=3233, e=17</text>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/></marker></defs>
  <g font-size="12" text-anchor="middle" font-family="'JetBrains Mono',monospace">
    <rect x="30" y="80" width="170" height="62" rx="7" fill="#111827" stroke="#ff2a6d" stroke-dasharray="5 4"/>
    <text x="115" y="104" fill="#e3fffa">factor n = p * q</text><text x="115" y="124" fill="#ff2a6d" font-size="10.5">hard for large n</text>
    <rect x="250" y="80" width="200" height="62" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="350" y="104" fill="#e3fffa">phi = (p-1)(q-1)</text><text x="350" y="124" fill="#fcee0a" font-size="10.5">60 * 52 = 3120</text>
    <rect x="500" y="80" width="270" height="62" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="635" y="104" fill="#e3fffa">d = e^-1 mod phi</text><text x="635" y="124" fill="#fcee0a" font-size="10.5">17^-1 mod 3120 = 2753</text>
  </g>
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="200" y1="111" x2="246" y2="111"/><line x1="450" y1="111" x2="496" y2="111"/>
  </g>
  <g font-size="12" text-anchor="middle" font-family="'JetBrains Mono',monospace">
    <rect x="30" y="196" width="170" height="62" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="115" y="220" fill="#e3fffa">m = 65 ('A')</text><text x="115" y="240" fill="#9fb0c8" font-size="10.5">plaintext</text>
    <rect x="250" y="196" width="200" height="62" rx="7" fill="#111827" stroke="#263451"/>
    <text x="350" y="220" fill="#e3fffa">c = m^e mod n</text><text x="350" y="240" fill="#9fb0c8" font-size="10.5">c = 2790</text>
    <rect x="500" y="196" width="270" height="62" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="635" y="220" fill="#e3fffa">c^d mod n</text><text x="635" y="240" fill="#5fe3b0" font-size="10.5">= 65, original m</text>
  </g>
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="200" y1="227" x2="246" y2="227"/><line x1="450" y1="227" x2="496" y2="227"/>
    <line x1="635" y1="142" x2="635" y2="192" stroke="#fcee0a"/>
  </g>
  <rect x="30" y="292" width="740" height="86" rx="7" fill="#111827" stroke="#00f0ff"/>
  <g font-size="12" font-family="'JetBrains Mono',monospace">
    <text x="48" y="318" fill="#e3fffa">e*d = 1 + k*phi(n)</text>
    <text x="48" y="340" fill="#e3fffa">c^d = m^(1 + k*phi) = m * (m^phi)^k</text>
    <text x="48" y="362" fill="#5fe3b0">Euler: m^phi(n) = 1 (mod n)  =&gt;  c^d = m</text>
    <text x="520" y="318" fill="#ff2a6d">reduce exponents mod phi(n),</text>
    <text x="520" y="338" fill="#ff2a6d">never mod n</text>
  </g>
  <text x="400" y="404" text-anchor="middle" font-size="11" fill="#6c7b93">Knowing phi(n) is equivalent to factoring n, which breaks RSA.</text>
</svg>
