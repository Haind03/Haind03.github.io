<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="420" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Early-exit comparison leaks the tag byte by byte</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">more matching leading bytes means a longer response time</text>

  <text x="30" y="92" font-size="12" fill="#fcee0a" font-family="'JetBrains Mono',monospace">correct tag (secret)</text>
  <g font-size="13" text-anchor="middle" font-family="'JetBrains Mono',monospace">
    <rect x="30" y="102" width="56" height="32" rx="7" fill="#111827" stroke="#fcee0a"/><text x="58" y="123" fill="#e3fffa">2a</text>
    <rect x="94" y="102" width="56" height="32" rx="7" fill="#111827" stroke="#fcee0a"/><text x="122" y="123" fill="#e3fffa">e7</text>
    <rect x="158" y="102" width="56" height="32" rx="7" fill="#111827" stroke="#fcee0a"/><text x="186" y="123" fill="#e3fffa">ca</text>
    <rect x="222" y="102" width="56" height="32" rx="7" fill="#111827" stroke="#fcee0a"/><text x="250" y="123" fill="#e3fffa">80</text>
  </g>

  <text x="30" y="170" font-size="12" fill="#ff2a6d" font-family="'JetBrains Mono',monospace">attacker guesses (dashed) and server response time</text>
  <g font-size="13" text-anchor="middle" font-family="'JetBrains Mono',monospace">
    <rect x="30" y="184" width="56" height="30" rx="7" fill="#0b1518" stroke="#ff2a6d" stroke-dasharray="5 4"/><text x="58" y="204" fill="#9fb0c8">00</text>
    <rect x="94" y="184" width="56" height="30" rx="7" fill="#0b1518" stroke="#ff2a6d" stroke-dasharray="5 4"/><text x="122" y="204" fill="#9fb0c8">00</text>
    <rect x="158" y="184" width="56" height="30" rx="7" fill="#0b1518" stroke="#ff2a6d" stroke-dasharray="5 4"/><text x="186" y="204" fill="#9fb0c8">00</text>
    <rect x="222" y="184" width="56" height="30" rx="7" fill="#0b1518" stroke="#ff2a6d" stroke-dasharray="5 4"/><text x="250" y="204" fill="#9fb0c8">00</text>

    <rect x="30" y="224" width="56" height="30" rx="7" fill="#111827" stroke="#00f0ff"/><text x="58" y="244" fill="#00f0ff">2a</text>
    <rect x="94" y="224" width="56" height="30" rx="7" fill="#0b1518" stroke="#ff2a6d" stroke-dasharray="5 4"/><text x="122" y="244" fill="#9fb0c8">00</text>
    <rect x="158" y="224" width="56" height="30" rx="7" fill="#0b1518" stroke="#ff2a6d" stroke-dasharray="5 4"/><text x="186" y="244" fill="#9fb0c8">00</text>
    <rect x="222" y="224" width="56" height="30" rx="7" fill="#0b1518" stroke="#ff2a6d" stroke-dasharray="5 4"/><text x="250" y="244" fill="#9fb0c8">00</text>

    <rect x="30" y="264" width="56" height="30" rx="7" fill="#111827" stroke="#00f0ff"/><text x="58" y="284" fill="#00f0ff">2a</text>
    <rect x="94" y="264" width="56" height="30" rx="7" fill="#111827" stroke="#00f0ff"/><text x="122" y="284" fill="#00f0ff">e7</text>
    <rect x="158" y="264" width="56" height="30" rx="7" fill="#0b1518" stroke="#ff2a6d" stroke-dasharray="5 4"/><text x="186" y="284" fill="#9fb0c8">00</text>
    <rect x="222" y="264" width="56" height="30" rx="7" fill="#0b1518" stroke="#ff2a6d" stroke-dasharray="5 4"/><text x="250" y="284" fill="#9fb0c8">00</text>
  </g>
  <g>
    <rect x="320" y="192" width="70" height="14" rx="3" fill="#ff2a6d"/>
    <rect x="320" y="232" width="140" height="14" rx="3" fill="#ff2a6d"/>
    <rect x="320" y="272" width="210" height="14" rx="3" fill="#ff2a6d"/>
  </g>
  <g font-size="11" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">
    <text x="400" y="204">1 byte checked</text>
    <text x="470" y="244">2 bytes checked</text>
    <text x="540" y="284">3 bytes checked</text>
  </g>
  <text x="30" y="322" font-size="11.5" fill="#9fb0c8">Pick the byte value with the slowest reply, lock it, move to the next byte. Cost 256 x L, not 256^L.</text>

  <rect x="30" y="344" width="740" height="46" rx="7" fill="#111827" stroke="#5fe3b0"/>
  <text x="400" y="364" text-anchor="middle" font-size="12" fill="#5fe3b0">Fix: hmac.compare_digest checks every byte, so the time no longer depends on where the first mismatch is.</text>
  <text x="400" y="381" text-anchor="middle" font-size="11" fill="#6c7b93" font-family="'JetBrains Mono',monospace">HMAC(k, m) = H((k xor opad) || H((k xor ipad) || m))</text>
</svg>
