<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="360" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Three weak parameter choices, three cheap attacks</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">no private key d is needed in any of them</text>

  <g font-size="12.5" text-anchor="middle">
    <rect x="30" y="88" width="220" height="62" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="140" y="113" fill="#e3fffa">e = 3, no padding</text>
    <text x="140" y="132" fill="#9fb0c8" font-family="'JetBrains Mono',monospace" font-size="11">m^3 &lt; n, so c = m^3</text>

    <rect x="30" y="170" width="220" height="62" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="140" y="195" fill="#e3fffa">n is small or known</text>
    <text x="140" y="214" fill="#9fb0c8" font-family="'JetBrains Mono',monospace" font-size="11">under ~256 bits</text>

    <rect x="30" y="252" width="220" height="62" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="140" y="277" fill="#e3fffa">p and q are close</text>
    <text x="140" y="296" fill="#9fb0c8" font-family="'JetBrains Mono',monospace" font-size="11">q = nextprime(p)</text>

    <rect x="320" y="88" width="190" height="62" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="415" y="113" fill="#ff2a6d" font-weight="700">Integer cube root</text>
    <text x="415" y="132" fill="#9fb0c8" font-family="'JetBrains Mono',monospace" font-size="11">iroot(c, 3)</text>

    <rect x="320" y="170" width="190" height="62" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="415" y="195" fill="#ff2a6d" font-weight="700">factordb / factorint</text>
    <text x="415" y="214" fill="#9fb0c8" font-family="'JetBrains Mono',monospace" font-size="11">look up p and q</text>

    <rect x="320" y="252" width="190" height="62" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="415" y="277" fill="#ff2a6d" font-weight="700">Fermat factoring</text>
    <text x="415" y="296" fill="#9fb0c8" font-family="'JetBrains Mono',monospace" font-size="11">n = a^2 - b^2</text>

    <rect x="590" y="150" width="180" height="100" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="680" y="190" fill="#5fe3b0" font-weight="700">Plaintext m</text>
    <text x="680" y="212" fill="#9fb0c8" font-size="11">or p, q, then d</text>
  </g>

  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="250" y1="119" x2="316" y2="119"/>
    <line x1="250" y1="201" x2="316" y2="201"/>
    <line x1="250" y1="283" x2="316" y2="283"/>
    <line x1="510" y1="119" x2="586" y2="180"/>
    <line x1="510" y1="201" x2="586" y2="200"/>
    <line x1="510" y1="283" x2="586" y2="222"/>
  </g>
</svg>
