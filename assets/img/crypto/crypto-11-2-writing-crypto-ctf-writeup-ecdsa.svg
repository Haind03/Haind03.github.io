<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="380" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">ECDSA nonce reuse, from two signatures to the key</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">same k means same r, so r1 == r2 gives it away</text>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>
  <g font-size="12.5" text-anchor="middle">
    <rect x="28" y="92" width="200" height="56" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="128" y="115" fill="#e3fffa">Signature 1</text>
    <text x="128" y="133" fill="#9fb0c8" font-family="'JetBrains Mono',monospace" font-size="11">(r, s1) over m1, z1</text>

    <rect x="28" y="168" width="200" height="56" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="128" y="191" fill="#e3fffa">Signature 2</text>
    <text x="128" y="209" fill="#9fb0c8" font-family="'JetBrains Mono',monospace" font-size="11">(r, s2) over m2, z2</text>

    <rect x="290" y="128" width="230" height="64" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="405" y="152" fill="#ff2a6d" font-weight="700">Subtract the equations</text>
    <text x="405" y="172" fill="#e3fffa" font-family="'JetBrains Mono',monospace" font-size="11">k = (z1-z2) / (s1-s2) mod n</text>

    <rect x="580" y="128" width="192" height="64" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="676" y="152" fill="#fcee0a" font-weight="700">Nonce k</text>
    <text x="676" y="172" fill="#6c7b93" font-size="10.5">should be secret</text>

    <rect x="290" y="252" width="230" height="64" rx="7" fill="#111827" stroke="#263451"/>
    <text x="405" y="276" fill="#e3fffa">Solve s1*k = z1 + r*d</text>
    <text x="405" y="296" fill="#e3fffa" font-family="'JetBrains Mono',monospace" font-size="11">d = (s1*k - z1) / r mod n</text>

    <rect x="580" y="252" width="192" height="64" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="676" y="276" fill="#5fe3b0" font-weight="700">Private key d</text>
    <text x="676" y="296" fill="#9fb0c8" font-size="11">long_to_bytes(d) = flag</text>
  </g>
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="228" y1="120" x2="286" y2="150"/>
    <line x1="228" y1="196" x2="286" y2="172"/>
    <line x1="520" y1="160" x2="576" y2="160"/>
    <path d="M676 194 L676 222 L405 222 L405 248"/>
    <line x1="520" y1="284" x2="576" y2="284"/>
  </g>
  <text x="540" y="216" text-anchor="middle" font-size="11" fill="#6c7b93">plug k back in</text>
  <text x="400" y="352" text-anchor="middle" font-size="11" fill="#6c7b93">No discrete log needed. The fix is a deterministic nonce (RFC 6979).</text>
</svg>
