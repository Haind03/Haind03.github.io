<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="400" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Bit-flipping a CTR token with no MAC</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">ct' = ct XOR old XOR new, no key needed</text>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>
  <g font-size="12.5" text-anchor="middle">
    <rect x="28" y="92" width="170" height="60" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="113" y="116" fill="#e3fffa">Server issues token</text>
    <text x="113" y="136" fill="#9fb0c8" font-family="'JetBrains Mono',monospace" font-size="10.5">user=bob&amp;role=guest</text>

    <rect x="250" y="92" width="150" height="60" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="325" y="116" fill="#e3fffa">AES-CTR</text>
    <text x="325" y="136" fill="#6c7b93" font-size="10.5">fixed key + nonce</text>

    <rect x="452" y="92" width="150" height="60" rx="7" fill="#111827" stroke="#263451"/>
    <text x="527" y="116" fill="#e3fffa">Token (ciphertext)</text>
    <text x="527" y="136" fill="#6c7b93" font-size="10.5">no MAC attached</text>

    <rect x="28" y="206" width="250" height="68" rx="7" fill="#0b1518" stroke="#ff2a6d" stroke-dasharray="5 4"/>
    <text x="153" y="230" fill="#ff2a6d" font-weight="700">Attacker flips 5 bytes</text>
    <text x="153" y="250" fill="#e3fffa" font-family="'JetBrains Mono',monospace" font-size="11">guest XOR admin at the offset</text>
    <text x="153" y="266" fill="#6c7b93" font-size="10.5">same length, key unknown</text>

    <rect x="340" y="206" width="170" height="68" rx="7" fill="#111827" stroke="#263451"/>
    <text x="425" y="230" fill="#e3fffa">Server decrypts</text>
    <text x="425" y="250" fill="#9fb0c8" font-family="'JetBrains Mono',monospace" font-size="10.5">user=bob&amp;role=admin</text>
    <text x="425" y="266" fill="#6c7b93" font-size="10.5">trusts it blindly</text>

    <rect x="572" y="206" width="200" height="68" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="672" y="236" fill="#5fe3b0" font-weight="700">role == admin</text>
    <text x="672" y="256" fill="#9fb0c8" font-size="11">flag returned</text>
  </g>
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="198" y1="122" x2="246" y2="122"/>
    <line x1="400" y1="122" x2="448" y2="122"/>
    <path d="M527 154 L527 180 L153 180 L153 202"/>
    <line x1="278" y1="240" x2="336" y2="240"/>
    <line x1="510" y1="240" x2="568" y2="240"/>
  </g>
  <rect x="28" y="304" width="744" height="52" rx="7" fill="#111827" stroke="#5fe3b0"/>
  <text x="400" y="326" text-anchor="middle" font-size="12" fill="#5fe3b0" font-weight="700">Fix</text>
  <text x="400" y="344" text-anchor="middle" font-size="11.5" fill="#9fb0c8">Use AES-GCM with a random nonce per token. Any changed bit breaks the tag and the token is rejected.</text>
  <text x="400" y="382" text-anchor="middle" font-size="11" fill="#6c7b93">Encryption hides content. It does not authenticate it.</text>
</svg>
