<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="400" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Three modular tools: pow, inverse, gcd</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">reduce mod m after every step, so values stay below m</text>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/></marker></defs>
  <text x="30" y="88" font-size="12" fill="#00f0ff" font-family="'JetBrains Mono',monospace">square-and-multiply: 3^13 mod 7, 13 = 1101b</text>
  <g font-size="12" text-anchor="middle" font-family="'JetBrains Mono',monospace">
    <rect x="30" y="100" width="150" height="50" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="105" y="122" fill="#e3fffa">3^1 = 3</text><text x="105" y="139" fill="#5fe3b0" font-size="10.5">bit 1: use</text>
    <rect x="224" y="100" width="150" height="50" rx="7" fill="#111827" stroke="#263451"/>
    <text x="299" y="122" fill="#e3fffa">3^2 = 2</text><text x="299" y="139" fill="#6c7b93" font-size="10.5">bit 0: skip</text>
    <rect x="418" y="100" width="150" height="50" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="493" y="122" fill="#e3fffa">3^4 = 4</text><text x="493" y="139" fill="#5fe3b0" font-size="10.5">bit 1: use</text>
    <rect x="612" y="100" width="160" height="50" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="692" y="122" fill="#e3fffa">3^8 = 2</text><text x="692" y="139" fill="#5fe3b0" font-size="10.5">bit 1: use</text>
  </g>
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="180" y1="125" x2="220" y2="125"/><line x1="374" y1="125" x2="414" y2="125"/><line x1="568" y1="125" x2="608" y2="125"/>
  </g>
  <text x="400" y="182" text-anchor="middle" font-size="12.5" fill="#fcee0a" font-family="'JetBrains Mono',monospace">2 * 4 * 3 mod 7 = 3     (O(log e) multiplications)</text>
  <text x="30" y="226" font-size="12" fill="#00f0ff" font-family="'JetBrains Mono',monospace">extended Euclid: inverse of 17 mod 43</text>
  <g font-size="12" text-anchor="middle" font-family="'JetBrains Mono',monospace">
    <rect x="30" y="240" width="170" height="54" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="115" y="262" fill="#e3fffa">gcd(17, 43) = 1</text><text x="115" y="280" fill="#9fb0c8" font-size="10.5">coprime, inverse exists</text>
    <rect x="258" y="240" width="220" height="54" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="368" y="262" fill="#e3fffa">1 = 2*43 - 5*17</text><text x="368" y="280" fill="#9fb0c8" font-size="10.5">Bezout coefficients</text>
    <rect x="536" y="240" width="236" height="54" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="654" y="262" fill="#e3fffa">17^-1 = -5 mod 43 = 38</text><text x="654" y="280" fill="#5fe3b0" font-size="10.5">17 * 38 = 15*43 + 1</text>
  </g>
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="200" y1="267" x2="254" y2="267"/><line x1="478" y1="267" x2="532" y2="267"/>
  </g>
  <rect x="30" y="322" width="742" height="44" rx="7" fill="#0b1518" stroke="#ff2a6d" stroke-dasharray="5 4"/>
  <text x="401" y="349" text-anchor="middle" font-size="12" fill="#ff2a6d" font-family="'JetBrains Mono',monospace">gcd(a, m) != 1  =&gt;  no inverse (2 mod 6 has none)</text>
</svg>
