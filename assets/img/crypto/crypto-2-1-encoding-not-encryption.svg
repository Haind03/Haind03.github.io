<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
<rect x="0" y="0" width="800" height="350" rx="12" fill="#0d121d" stroke="#263451"/>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/></marker></defs>
<text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Encoding, encryption and hashing are different tools</text>
<text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">only encryption depends on a secret key</text>
<rect x="40" y="85" width="220" height="150" rx="7" fill="#111827" stroke="#00f0ff"/><text x="150.0" y="124.0" text-anchor="middle" font-size="15" fill="#00f0ff">Encoding</text><text x="150.0" y="140.0" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-family="'JetBrains Mono',monospace">no key</text><text x="150.0" y="156.0" text-anchor="middle" font-size="10.5" fill="#6c7b93">Base64, Base32, Base85</text><text x="150.0" y="172.0" text-anchor="middle" font-size="10.5" fill="#6c7b93">hex, URL encoding</text><text x="150.0" y="188.0" text-anchor="middle" font-size="11.5" fill="#9fb0c8">anyone can decode</text><text x="150.0" y="204.0" text-anchor="middle" font-size="11.5" fill="#9fb0c8">purpose: compatibility</text>
<rect x="290" y="85" width="220" height="150" rx="7" fill="#111827" stroke="#fcee0a"/><text x="400.0" y="124.0" text-anchor="middle" font-size="15" fill="#fcee0a">Encryption</text><text x="400.0" y="140.0" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-family="'JetBrains Mono',monospace">secret key</text><text x="400.0" y="156.0" text-anchor="middle" font-size="10.5" fill="#6c7b93">AES, ChaCha20</text><text x="400.0" y="172.0" text-anchor="middle" font-size="10.5" fill="#6c7b93">needs the key to reverse</text><text x="400.0" y="188.0" text-anchor="middle" font-size="11.5" fill="#9fb0c8">key required</text><text x="400.0" y="204.0" text-anchor="middle" font-size="11.5" fill="#9fb0c8">purpose: confidentiality</text>
<rect x="540" y="85" width="220" height="150" rx="7" fill="#111827" stroke="#5fe3b0"/><text x="650.0" y="124.0" text-anchor="middle" font-size="15" fill="#5fe3b0">Hashing</text><text x="650.0" y="140.0" text-anchor="middle" font-size="12.5" fill="#e3fffa" font-family="'JetBrains Mono',monospace">no key</text><text x="650.0" y="156.0" text-anchor="middle" font-size="10.5" fill="#6c7b93">SHA-256, MD5</text><text x="650.0" y="172.0" text-anchor="middle" font-size="10.5" fill="#6c7b93">fixed length output</text><text x="650.0" y="188.0" text-anchor="middle" font-size="11.5" fill="#9fb0c8">no way back</text><text x="650.0" y="204.0" text-anchor="middle" font-size="11.5" fill="#9fb0c8">purpose: integrity</text>
<rect x="40" y="265" width="360" height="56" rx="7" fill="#0b1518" stroke="#ff2a6d" stroke-dasharray="5 4"/><text x="220.0" y="297.0" text-anchor="middle" font-size="12" fill="#ff2a6d">Base64 of a password is the password in the clear</text>
<rect x="430" y="265" width="330" height="56" rx="7" fill="#0b1518" stroke="#00f0ff" stroke-dasharray="5 4"/><text x="595.0" y="289.0" text-anchor="middle" font-size="11.5" fill="#00f0ff">Classify first: decode if the charset is narrow</text><text x="595.0" y="305.0" text-anchor="middle" font-size="11.5" fill="#00f0ff">analyze or attack if entropy is near 8 bits/byte</text>
</svg>
