<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="410" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">A map of jailbreaks</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">families of attacks against model alignment</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- attack families -->
  <text x="26" y="82" font-size="11" fill="#6c7b93" font-family="'JetBrains Mono',monospace">ATTACK FAMILIES</text>
  <g font-size="12" text-anchor="middle">
    <rect x="24" y="92"  width="150" height="44" rx="7" fill="#0b1518" stroke="#00f0ff" stroke-dasharray="5 4"/>
    <text x="99" y="112" fill="#e3fffa">DAN / persona</text>
    <text x="99" y="127" fill="#6c7b93" font-size="10">single-turn</text>

    <rect x="24" y="146" width="150" height="44" rx="7" fill="#0b1518" stroke="#00f0ff" stroke-dasharray="5 4"/>
    <text x="99" y="166" fill="#e3fffa">Fictional framing</text>
    <text x="99" y="181" fill="#6c7b93" font-size="10">single-turn</text>

    <rect x="24" y="200" width="150" height="44" rx="7" fill="#0b1518" stroke="#00f0ff" stroke-dasharray="5 4"/>
    <text x="99" y="220" fill="#e3fffa">Policy Puppetry</text>
    <text x="99" y="235" fill="#6c7b93" font-size="10">fake config file</text>

    <rect x="24" y="254" width="150" height="62" rx="7" fill="#0b1518" stroke="#00f0ff" stroke-dasharray="5 4"/>
    <text x="99" y="274" fill="#e3fffa">Crescendo</text>
    <text x="99" y="289" fill="#6c7b93" font-size="10">multi-turn escalation</text>
    <polyline points="54,308 74,308 74,300 94,300 94,292 114,292" fill="none" stroke="#00f0ff" stroke-width="1.6"/>
  </g>

  <!-- alignment barrier (soft) -->
  <rect x="210" y="92" width="130" height="224" rx="9" fill="#140d16" stroke="#ff2a6d" stroke-dasharray="6 5"/>
  <text x="275" y="192" text-anchor="middle" font-size="13" font-weight="700" fill="#ff2a6d">Model</text>
  <text x="275" y="210" text-anchor="middle" font-size="13" font-weight="700" fill="#ff2a6d">alignment</text>
  <text x="275" y="232" text-anchor="middle" font-size="10.5" fill="#9fb0c8">soft, probabilistic</text>
  <text x="275" y="246" text-anchor="middle" font-size="10.5" fill="#9fb0c8">barrier</text>

  <!-- arrows families -> barrier -->
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="174" y1="114" x2="206" y2="140"/>
    <line x1="174" y1="168" x2="206" y2="178"/>
    <line x1="174" y1="222" x2="206" y2="214"/>
    <line x1="174" y1="285" x2="206" y2="252"/>
  </g>

  <!-- barrier -> LLM -->
  <line x1="340" y1="204" x2="372" y2="204" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <text x="356" y="196" text-anchor="middle" font-size="9.5" fill="#6c7b93" font-family="'JetBrains Mono',monospace">some get through</text>

  <rect x="374" y="168" width="118" height="72" rx="7" fill="#111827" stroke="#ff2a6d"/>
  <text x="433" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#ff2a6d">LLM</text>
  <text x="433" y="220" text-anchor="middle" font-size="10.5" fill="#9fb0c8">may comply</text>

  <!-- LLM -> hard controls -->
  <line x1="492" y1="204" x2="526" y2="204" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>

  <!-- hard controls (outside the model) -->
  <rect x="528" y="110" width="248" height="190" rx="9" fill="#0c1a16" stroke="#5fe3b0"/>
  <text x="652" y="134" text-anchor="middle" font-size="13" font-weight="700" fill="#5fe3b0">HARD CONTROLS</text>
  <text x="652" y="150" text-anchor="middle" font-size="10.5" fill="#6c7b93">outside the model</text>
  <g font-size="11.5" fill="#e3fffa">
    <text x="548" y="178">escape and validate output</text>
    <text x="548" y="202">least-privilege tools</text>
    <text x="548" y="226">human confirmation</text>
    <text x="548" y="250">monitor the whole conversation</text>
  </g>
  <text x="652" y="282" text-anchor="middle" font-size="11.5" fill="#5fe3b0">damage is contained</text>

  <text x="400" y="344" text-anchor="middle" font-size="11.5" fill="#9fb0c8">Multi-turn (Crescendo) spreads the intent so per-message filters miss it.</text>
  <text x="400" y="384" text-anchor="middle" font-size="11.5" fill="#6c7b93">Alignment is a soft wall. The real wall is outside the model.</text>
</svg>
