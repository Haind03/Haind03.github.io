<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 404" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="404" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Indirect prompt injection</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">the attacker never chats; the payload rides in on data</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- feeders -->
  <rect x="36" y="80" width="128" height="52" rx="7" fill="#0b1518" stroke="#00f0ff" stroke-dasharray="5 4"/>
  <text x="100" y="102" text-anchor="middle" font-size="12" fill="#00f0ff">Attacker</text>
  <text x="100" y="119" text-anchor="middle" font-size="9.5" fill="#6c7b93">plants 1 email</text>

  <rect x="186" y="80" width="128" height="52" rx="7" fill="#111827" stroke="#00f0ff"/>
  <text x="250" y="102" text-anchor="middle" font-size="12" fill="#e3fffa">Victim</text>
  <text x="250" y="119" text-anchor="middle" font-size="9.5" fill="#6c7b93">summarize my inbox</text>

  <!-- main chain -->
  <g text-anchor="middle">
    <rect x="36" y="200" width="128" height="60" rx="7" fill="#0b1518" stroke="#00f0ff" stroke-dasharray="5 4"/>
    <text x="100" y="226" font-size="12" fill="#e3fffa">Inbox (docs/)</text>
    <text x="100" y="244" font-size="9.5" fill="#6c7b93">one poisoned email</text>

    <rect x="186" y="200" width="128" height="60" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="250" y="226" font-size="12" font-weight="700" fill="#ff2a6d">Assistant</text>
    <text x="250" y="244" font-size="9.5" fill="#6c7b93">(LLM reads it)</text>

    <rect x="336" y="200" width="128" height="60" rx="7" fill="#111827" stroke="#263451"/>
    <text x="400" y="226" font-size="12" fill="#e3fffa">Reads internal</text>
    <text x="400" y="244" font-size="9.5" fill="#6c7b93">revenue + secrets</text>

    <rect x="486" y="200" width="128" height="60" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="550" y="226" font-size="12" fill="#fcee0a">SEND_EMAIL</text>
    <text x="550" y="244" font-size="9.5" fill="#6c7b93">app auto-runs</text>

    <rect x="636" y="200" width="128" height="60" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="700" y="226" font-size="12" fill="#e3fffa">Outside inbox</text>
    <text x="700" y="244" font-size="9.5" fill="#6c7b93">attacker receives</text>
  </g>

  <!-- feeder arrows -->
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="100" y1="132" x2="100" y2="196"/>
    <line x1="250" y1="132" x2="250" y2="196"/>
    <line x1="164" y1="230" x2="182" y2="230"/>
    <line x1="314" y1="230" x2="332" y2="230"/>
    <line x1="464" y1="230" x2="482" y2="230"/>
    <line x1="614" y1="230" x2="632" y2="230"/>
  </g>

  <text x="400" y="288" text-anchor="middle" font-size="10.5" fill="#6c7b93" font-family="'JetBrains Mono',monospace">plant payload -&gt; assistant reads -&gt; injection fires -&gt; read sensitive -&gt; exfiltrate</text>

  <!-- callouts -->
  <rect x="36" y="312" width="380" height="60" rx="7" fill="#0b1016" stroke="#263451"/>
  <text x="226" y="338" text-anchor="middle" font-size="11.5" fill="#9fb0c8">It runs with the victim's privileges.</text>
  <text x="226" y="358" text-anchor="middle" font-size="10.5" fill="#6c7b93">plain injection only talks; with a tool it acts (LLM06)</text>

  <rect x="440" y="312" width="324" height="60" rx="7" fill="#0b1518" stroke="#5fe3b0" stroke-dasharray="5 4"/>
  <text x="602" y="338" text-anchor="middle" font-size="11.5" fill="#5fe3b0">Put the barrier here, at the action.</text>
  <text x="602" y="358" text-anchor="middle" font-size="10.5" fill="#6c7b93">allowlist, human-in-the-loop, privilege split</text>

  <line x1="550" y1="312" x2="550" y2="264" stroke="#5fe3b0" stroke-width="2" marker-end="url(#a)" opacity="0.85"/>
</svg>
