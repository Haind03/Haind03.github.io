<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="360" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">A safe lab: everything stays on localhost</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">you reach the server through an SSH tunnel, never a public port</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
    <marker id="c" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#00f0ff"/>
    </marker>
  </defs>

  <!-- laptop -->
  <g font-size="12.5" text-anchor="middle">
    <rect x="28" y="160" width="200" height="80" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="128" y="192" fill="#e3fffa">Your laptop + browser</text>
    <text x="128" y="214" fill="#9fb0c8" font-size="11" font-family="'JetBrains Mono',monospace">http://localhost:5003</text>
  </g>

  <!-- tunnel -->
  <line x1="228" y1="200" x2="366" y2="200" stroke="#00f0ff" stroke-width="2" marker-end="url(#c)"/>
  <g font-size="11" text-anchor="middle" fill="#9fb0c8">
    <text x="284" y="184">SSH tunnel</text>
    <text x="284" y="222">(port forward)</text>
  </g>

  <!-- server boundary -->
  <rect x="340" y="84" width="432" height="224" rx="10" fill="none" stroke="#5fe3b0" stroke-dasharray="5 4"/>
  <text x="556" y="106" text-anchor="middle" font-size="11.5" fill="#5fe3b0" font-family="'JetBrains Mono',monospace">Server: localhost only</text>

  <g stroke="#6c7b93" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M366,200 L366,155 L400,155" />
    <path d="M366,200 L366,255 L400,255" />
  </g>

  <g font-size="12.5" text-anchor="middle">
    <rect x="404" y="128" width="340" height="54" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="574" y="151" fill="#e3fffa">Ollama</text>
    <text x="574" y="168" fill="#9fb0c8" font-size="11" font-family="'JetBrains Mono',monospace">127.0.0.1:11434</text>

    <rect x="404" y="228" width="340" height="54" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="574" y="251" fill="#e3fffa">Lab web apps</text>
    <text x="574" y="268" fill="#9fb0c8" font-size="11" font-family="'JetBrains Mono',monospace">127.0.0.1:500x</text>
  </g>

  <text x="400" y="338" text-anchor="middle" font-size="11" fill="#6c7b93">Nothing listens on a public interface, so only you can reach the vulnerable apps.</text>
</svg>
