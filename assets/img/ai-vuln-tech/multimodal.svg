<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="410" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Multimodal injection</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">every modality is another input channel</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- clean monitored path -->
  <rect x="24" y="74" width="150" height="42" rx="7" fill="#0b1518" stroke="#00f0ff" stroke-dasharray="5 4"/>
  <text x="99" y="100" text-anchor="middle" font-size="12" fill="#e3fffa">Typed message</text>

  <rect x="214" y="74" width="156" height="42" rx="7" fill="#0c1a16" stroke="#5fe3b0"/>
  <text x="292" y="92" text-anchor="middle" font-size="12" fill="#5fe3b0" font-weight="700">Text filter</text>
  <text x="292" y="108" text-anchor="middle" font-size="9.5" fill="#6c7b93">scans typed text only</text>

  <!-- media channels -->
  <g font-size="11.5" text-anchor="middle">
    <rect x="24" y="150" width="150" height="50" rx="7" fill="#0b1518" stroke="#00f0ff" stroke-dasharray="5 4"/>
    <text x="99" y="170" fill="#e3fffa">Image</text>
    <text x="99" y="187" fill="#6c7b93" font-size="9.5">faint / tiny text</text>

    <rect x="24" y="212" width="150" height="50" rx="7" fill="#0b1518" stroke="#00f0ff" stroke-dasharray="5 4"/>
    <text x="99" y="232" fill="#e3fffa">PDF / Office</text>
    <text x="99" y="249" fill="#6c7b93" font-size="9.5">hidden layer, metadata</text>

    <rect x="24" y="274" width="150" height="50" rx="7" fill="#0b1518" stroke="#00f0ff" stroke-dasharray="5 4"/>
    <text x="99" y="294" fill="#e3fffa">Audio / video</text>
    <text x="99" y="311" fill="#6c7b93" font-size="9.5">spoken instruction</text>
  </g>

  <!-- extraction -->
  <g font-size="11.5" text-anchor="middle">
    <rect x="214" y="150" width="156" height="50" rx="7" fill="#111827" stroke="#263451"/>
    <text x="292" y="172" fill="#e3fffa">OCR</text>
    <text x="292" y="189" fill="#6c7b93" font-size="9.5">pixels -&gt; text</text>

    <rect x="214" y="212" width="156" height="50" rx="7" fill="#111827" stroke="#263451"/>
    <text x="292" y="234" fill="#e3fffa">PDF extract</text>
    <text x="292" y="251" fill="#6c7b93" font-size="9.5">layers -&gt; text</text>

    <rect x="214" y="274" width="156" height="50" rx="7" fill="#111827" stroke="#263451"/>
    <text x="292" y="296" fill="#e3fffa">Speech-to-text</text>
    <text x="292" y="313" fill="#6c7b93" font-size="9.5">audio -&gt; text</text>
  </g>

  <!-- channel -> extraction arrows -->
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="174" y1="175" x2="210" y2="175"/>
    <line x1="174" y1="237" x2="210" y2="237"/>
    <line x1="174" y1="299" x2="210" y2="299"/>
    <line x1="174" y1="95"  x2="210" y2="95"/>
  </g>

  <!-- prompt -->
  <rect x="440" y="110" width="160" height="214" rx="9" fill="#0b1518" stroke="#00f0ff" stroke-dasharray="5 4"/>
  <text x="520" y="134" text-anchor="middle" font-size="12.5" fill="#e3fffa">Prompt to model</text>
  <rect x="456" y="146" width="128" height="34" rx="5" fill="#101826" stroke="#5fe3b0"/>
  <text x="520" y="168" text-anchor="middle" font-size="10" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">typed text (checked)</text>
  <rect x="456" y="190" width="128" height="120" rx="5" fill="#140d16" stroke="#ff2a6d"/>
  <text x="520" y="238" text-anchor="middle" font-size="10.5" fill="#ff2a6d">extracted text</text>
  <text x="520" y="256" text-anchor="middle" font-size="10" fill="#9fb0c8">carries the hidden</text>
  <text x="520" y="270" text-anchor="middle" font-size="10" fill="#9fb0c8">instruction, never</text>
  <text x="520" y="284" text-anchor="middle" font-size="10" fill="#9fb0c8">seen by the filter</text>

  <!-- filter -> prompt, extraction -> prompt -->
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <path d="M370,95 L410,95 L410,160 L436,160"/>
  </g>
  <g stroke="#00f0ff" stroke-width="2" marker-end="url(#a)" fill="none" opacity="0.9">
    <path d="M370,175 L404,175 L404,220 L436,220"/>
    <path d="M370,237 L436,237"/>
    <path d="M370,299 L404,299 L404,256 L436,256"/>
  </g>

  <!-- model -->
  <line x1="600" y1="217" x2="632" y2="217" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <rect x="634" y="182" width="142" height="70" rx="7" fill="#111827" stroke="#ff2a6d"/>
  <text x="705" y="212" text-anchor="middle" font-size="13" fill="#ff2a6d" font-weight="700">Multimodal</text>
  <text x="705" y="230" text-anchor="middle" font-size="13" fill="#ff2a6d" font-weight="700">model</text>

  <text x="400" y="360" text-anchor="middle" font-size="11.5" fill="#9fb0c8">The extraction step turns untrusted media into text that lands in the prompt below the filter.</text>
  <text x="400" y="388" text-anchor="middle" font-size="11.5" fill="#6c7b93">Treat every modality as untrusted and funnel extracted text through the same pipeline.</text>
</svg>
