<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="410" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">A proxy on the app-to-model hop</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">the real prompt only appears on hop (2), between the app and Ollama</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/></marker>
    <marker id="c" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#00f0ff"/></marker>
  </defs>

  <!-- hop labels -->
  <text x="202" y="142" text-anchor="middle" font-size="11" fill="#6c7b93">(1) HTTP - Burp here</text>
  <text x="408" y="142" text-anchor="middle" font-size="11" fill="#6c7b93">(2) app -> model</text>

  <!-- boxes -->
  <g text-anchor="middle">
    <rect x="24" y="150" width="140" height="60" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="94" y="176" font-size="12.5" fill="#e3fffa">You / browser</text>
    <text x="94" y="195" font-size="10" fill="#6c7b93">(the tester)</text>

    <rect x="240" y="150" width="130" height="60" rx="7" fill="#111827" stroke="#263451"/>
    <text x="305" y="176" font-size="12.5" fill="#e3fffa">Web app</text>
    <text x="305" y="195" font-size="10" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">app.py</text>

    <rect x="446" y="145" width="150" height="70" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="521" y="169" font-size="12.5" font-weight="700" fill="#e3fffa">mitmproxy</text>
    <text x="521" y="187" font-size="10" fill="#fcee0a" font-family="'JetBrains Mono',monospace">reverse :11435</text>
    <text x="521" y="203" font-size="10" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">forward -> :11434</text>

    <rect x="672" y="150" width="104" height="60" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="724" y="176" font-size="12.5" font-weight="700" fill="#ff2a6d">Ollama</text>
    <text x="724" y="195" font-size="10" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">:11434</text>
  </g>

  <!-- hop arrows -->
  <g stroke="#6c7b93" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="164" y1="180" x2="238" y2="180"/>
    <line x1="370" y1="180" x2="444" y2="180"/>
    <line x1="596" y1="180" x2="670" y2="180"/>
  </g>

  <!-- tap down to callout -->
  <line x1="521" y1="215" x2="521" y2="262" stroke="#00f0ff" stroke-width="2" marker-end="url(#c)"/>

  <!-- callout: what the tap reveals -->
  <g>
    <rect x="330" y="262" width="420" height="104" rx="8" fill="#0b1518" stroke="#00f0ff" stroke-dasharray="5 4"/>
    <text x="540" y="284" text-anchor="middle" font-size="12" fill="#00f0ff">What the tap reveals: the fully assembled request</text>
    <text x="352" y="307" font-size="11" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">system:  the hidden instructions + rules</text>
    <text x="352" y="327" font-size="11" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">user:    your payload lands here</text>
    <text x="352" y="347" font-size="11" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">rag:     documents pasted into the prompt</text>
  </g>

  <text x="400" y="394" text-anchor="middle" font-size="11" fill="#6c7b93">Point base_url through your own proxy - only for keys and systems that are yours.</text>
</svg>
