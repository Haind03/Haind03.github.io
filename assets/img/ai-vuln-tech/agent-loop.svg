<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="400" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">The agent loop</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">the model proposes, the app executes</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
    <marker id="c" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#00f0ff"/>
    </marker>
  </defs>

  <g font-size="12.5" text-anchor="middle">
    <rect x="28" y="150" width="150" height="58" rx="7" fill="#0b1518" stroke="#00f0ff" stroke-dasharray="5 4"/>
    <text x="103" y="175" fill="#e3fffa">User / data</text>
    <text x="103" y="193" fill="#6c7b93" font-size="10.5">(untrusted)</text>

    <rect x="260" y="150" width="170" height="58" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="345" y="175" fill="#ff2a6d" font-weight="700">LLM</text>
    <text x="345" y="193" fill="#9fb0c8" font-size="10.5">proposes a tool call</text>

    <rect x="520" y="150" width="170" height="58" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="605" y="175" fill="#fcee0a" font-weight="700">App</text>
    <text x="605" y="193" fill="#9fb0c8" font-size="10.5">executes the tool</text>
  </g>

  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="178" y1="179" x2="256" y2="179"/>
    <line x1="430" y1="179" x2="516" y2="179"/>
  </g>
  <text x="473" y="170" text-anchor="middle" font-size="10.5" fill="#6c7b93" font-family="'JetBrains Mono',monospace">tool call</text>

  <!-- loop back -->
  <path d="M605,208 L605,262 L345,262 L345,212" stroke="#00f0ff" stroke-width="2" fill="none" marker-end="url(#c)" opacity="0.9"/>
  <text x="475" y="280" text-anchor="middle" font-size="11" fill="#00f0ff" font-family="'JetBrains Mono',monospace">result goes back to the LLM (loop)</text>

  <!-- callouts -->
  <g font-size="11.5" font-family="'JetBrains Mono',monospace">
    <rect x="520" y="96" width="250" height="34" rx="7" fill="#0d121d" stroke="#fcee0a" stroke-dasharray="5 4"/>
    <text x="645" y="117" text-anchor="middle" fill="#fcee0a">the app holds the real permission</text>
    <line x1="605" y1="130" x2="605" y2="146" stroke="#fcee0a" stroke-width="1.5" marker-end="url(#a)"/>

    <rect x="150" y="310" width="500" height="34" rx="7" fill="#0d121d" stroke="#00f0ff" stroke-dasharray="5 4"/>
    <text x="400" y="331" text-anchor="middle" fill="#00f0ff">tool results are new untrusted input</text>
  </g>
  <text x="400" y="372" text-anchor="middle" font-size="11" fill="#6c7b93">The model is not the place to enforce permissions. Enforce them in the app.</text>
</svg>
