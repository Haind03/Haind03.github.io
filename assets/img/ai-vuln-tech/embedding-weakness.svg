<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="420" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Vector and embedding weaknesses</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">the retriever ranks by similarity, not by who is allowed to see what</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- user -->
  <rect x="20" y="175" width="112" height="52" rx="7" fill="#111827" stroke="#00f0ff"/>
  <text x="76" y="197" text-anchor="middle" font-size="12.5" fill="#e3fffa">User A</text>
  <text x="76" y="214" text-anchor="middle" font-size="10.5" fill="#6c7b93">asks a question</text>

  <!-- shared store -->
  <rect x="150" y="96" width="212" height="230" rx="7" fill="#111827" stroke="#fcee0a"/>
  <text x="256" y="120" text-anchor="middle" font-size="12.5" fill="#e3fffa">Shared vector store</text>
  <text x="256" y="136" text-anchor="middle" font-size="10.5" fill="#6c7b93">one index, all tenants</text>

  <rect x="166" y="148" width="180" height="36" rx="6" fill="#0b1518" stroke="#5fe3b0"/>
  <text x="256" y="171" text-anchor="middle" font-size="11.5" fill="#e3fffa">A: public chunk</text>

  <rect x="166" y="192" width="180" height="36" rx="6" fill="#0b1518" stroke="#ff2a6d" stroke-dasharray="5 4"/>
  <text x="256" y="215" text-anchor="middle" font-size="11.5" fill="#e3fffa">B: private chunk</text>

  <rect x="166" y="236" width="180" height="36" rx="6" fill="#0b1518" stroke="#ff2a6d"/>
  <text x="256" y="259" text-anchor="middle" font-size="11.5" fill="#e3fffa">magnet chunk, matches all</text>

  <text x="256" y="310" text-anchor="middle" font-size="10.5" fill="#6c7b93">ranked by meaning, not permission</text>

  <!-- retriever -->
  <rect x="382" y="175" width="146" height="52" rx="7" fill="#111827" stroke="#263451"/>
  <text x="455" y="197" text-anchor="middle" font-size="12.5" fill="#e3fffa">Top-k nearest</text>
  <text x="455" y="214" text-anchor="middle" font-size="10.5" fill="#ff2a6d">returns B + magnet</text>

  <!-- prompt -->
  <rect x="548" y="175" width="146" height="52" rx="7" fill="#0b1518" stroke="#00f0ff" stroke-dasharray="5 4"/>
  <text x="621" y="197" text-anchor="middle" font-size="12.5" fill="#e3fffa">A's prompt</text>
  <text x="621" y="214" text-anchor="middle" font-size="10.5" fill="#9fb0c8">chunks inserted</text>

  <!-- llm -->
  <rect x="712" y="175" width="68" height="52" rx="7" fill="#111827" stroke="#ff2a6d"/>
  <text x="746" y="206" text-anchor="middle" font-size="13" font-weight="700" fill="#ff2a6d">LLM</text>

  <!-- arrows -->
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="132" y1="201" x2="147" y2="201"/>
    <line x1="362" y1="201" x2="379" y2="201"/>
    <line x1="528" y1="201" x2="545" y2="201"/>
    <line x1="694" y1="201" x2="709" y2="201"/>
    <line x1="746" y1="227" x2="746" y2="296"/>
  </g>
  <text x="372" y="166" text-anchor="middle" font-size="10" fill="#6c7b93" font-family="'JetBrains Mono',monospace">similarity search</text>

  <!-- outcome -->
  <rect x="382" y="298" width="398" height="44" rx="7" fill="#111827" stroke="#ff2a6d"/>
  <text x="581" y="316" text-anchor="middle" font-size="12" fill="#e3fffa">A's answer leaks B's data and follows the</text>
  <text x="581" y="333" text-anchor="middle" font-size="12" fill="#e3fffa">magnet chunk's hidden text</text>

  <!-- fix -->
  <rect x="20" y="350" width="760" height="38" rx="7" fill="#0b1518" stroke="#5fe3b0"/>
  <text x="36" y="374" font-size="11.5" fill="#5fe3b0" font-family="'JetBrains Mono',monospace">FIX</text>
  <text x="80" y="374" font-size="11.5" fill="#e3fffa">split the store per tenant, filter chunks by the asker's permission before the prompt, and set a distance threshold.</text>

  <text x="400" y="406" text-anchor="middle" font-size="11" fill="#6c7b93">Embedding inversion can rebuild source text from a vector, so treat the vector store itself as sensitive data.</text>
</svg>
