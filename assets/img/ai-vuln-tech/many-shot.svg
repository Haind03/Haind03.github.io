<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="400" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Many-shot jailbreak</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">overwhelm alignment with the volume of examples</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- context window -->
  <rect x="24" y="80" width="300" height="256" rx="9" fill="#0b1518" stroke="#00f0ff" stroke-dasharray="5 4"/>
  <text x="174" y="102" text-anchor="middle" font-size="12.5" fill="#e3fffa">Context window (long)</text>

  <g font-size="10" font-family="'JetBrains Mono',monospace">
    <rect x="40" y="112" width="268" height="22" rx="4" fill="#101826" stroke="#263451"/>
    <text x="50" y="127" fill="#9fb0c8">user: harmless Q  ->  assistant: complies</text>
    <rect x="40" y="138" width="268" height="22" rx="4" fill="#101826" stroke="#263451"/>
    <text x="50" y="153" fill="#9fb0c8">user: harmless Q  ->  assistant: complies</text>
    <rect x="40" y="164" width="268" height="22" rx="4" fill="#101826" stroke="#263451"/>
    <text x="50" y="179" fill="#9fb0c8">user: harmless Q  ->  assistant: complies</text>
    <rect x="40" y="190" width="268" height="22" rx="4" fill="#101826" stroke="#263451"/>
    <text x="50" y="205" fill="#9fb0c8">user: harmless Q  ->  assistant: complies</text>
  </g>
  <text x="174" y="232" text-anchor="middle" font-size="11" fill="#fcee0a" font-family="'JetBrains Mono',monospace">... repeated hundreds of times</text>

  <rect x="40" y="244" width="268" height="30" rx="5" fill="#140d16" stroke="#ff2a6d"/>
  <text x="50" y="263" font-size="10.5" fill="#e3fffa" font-family="'JetBrains Mono',monospace">user: the real request</text>

  <text x="174" y="298" text-anchor="middle" font-size="10.5" fill="#6c7b93">the block sets a pattern; alignment is outvoted</text>

  <!-- model -->
  <line x1="324" y1="170" x2="368" y2="170" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <rect x="370" y="134" width="110" height="72" rx="7" fill="#111827" stroke="#ff2a6d"/>
  <text x="425" y="166" text-anchor="middle" font-size="13" font-weight="700" fill="#ff2a6d">Model</text>
  <text x="425" y="186" text-anchor="middle" font-size="10" fill="#9fb0c8">pattern &gt; rules</text>

  <!-- complies output -->
  <line x1="480" y1="170" x2="520" y2="170" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <rect x="522" y="134" width="150" height="72" rx="7" fill="#140d16" stroke="#ff2a6d"/>
  <text x="597" y="162" text-anchor="middle" font-size="12" fill="#ff2a6d" font-weight="700">complies</text>
  <text x="597" y="182" text-anchor="middle" font-size="10" fill="#9fb0c8">fits the pattern</text>
  <text x="597" y="196" text-anchor="middle" font-size="10" fill="#9fb0c8">above it</text>

  <!-- bar chart: success vs shots -->
  <text x="546" y="244" text-anchor="middle" font-size="11.5" fill="#9fb0c8">success rate vs. number of shots</text>
  <line x1="378" y1="340" x2="720" y2="340" stroke="#263451" stroke-width="1.5"/>
  <g fill="#ff2a6d">
    <rect x="392" y="328" width="34" height="12"/>
    <rect x="444" y="314" width="34" height="26" opacity="0.8"/>
    <rect x="496" y="296" width="34" height="44" opacity="0.8"/>
    <rect x="548" y="274" width="34" height="66" opacity="0.85"/>
    <rect x="600" y="248" width="34" height="92" opacity="0.9"/>
    <rect x="652" y="256" width="34" height="84" opacity="0.95"/>
  </g>
  <g font-size="9.5" fill="#6c7b93" text-anchor="middle" font-family="'JetBrains Mono',monospace">
    <text x="409" y="354">1</text>
    <text x="461" y="354">5</text>
    <text x="513" y="354">20</text>
    <text x="565" y="354">50</text>
    <text x="617" y="354">100</text>
    <text x="669" y="354">200</text>
  </g>

  <text x="400" y="384" text-anchor="middle" font-size="11" fill="#6c7b93">More examples, higher success. A hard cap on input length cuts it off.</text>
</svg>
