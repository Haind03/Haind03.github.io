<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="400" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">TokenBreak and the tokenizer gap</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">the filter and the model do not split the same bytes the same way</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- input -->
  <rect x="26" y="168" width="150" height="66" rx="7" fill="#0b1518" stroke="#00f0ff" stroke-dasharray="5 4"/>
  <text x="101" y="192" text-anchor="middle" font-size="12" fill="#e3fffa">input string</text>
  <text x="101" y="214" text-anchor="middle" font-size="11" fill="#00f0ff" font-family="'JetBrains Mono',monospace">abcdefg</text>
  <text x="101" y="228" text-anchor="middle" font-size="9.5" fill="#6c7b93">same bytes</text>

  <!-- split arrows -->
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <path d="M176,186 L200,186 L200,120 L224,120"/>
    <path d="M176,216 L200,216 L200,300 L224,300"/>
  </g>

  <!-- TOP branch: guardrail -->
  <rect x="226" y="94" width="150" height="54" rx="7" fill="#111827" stroke="#263451"/>
  <text x="301" y="116" text-anchor="middle" font-size="12" fill="#e3fffa">Guardrail classifier</text>
  <text x="301" y="134" text-anchor="middle" font-size="10" fill="#6c7b93">its own tokenizer</text>

  <g font-size="10.5" font-family="'JetBrains Mono',monospace" text-anchor="middle">
    <rect x="404" y="100" width="34" height="24" rx="4" fill="#0b1518" stroke="#6c7b93"/><text x="421" y="116" fill="#9fb0c8">a</text>
    <rect x="442" y="100" width="40" height="24" rx="4" fill="#0b1518" stroke="#6c7b93"/><text x="462" y="116" fill="#9fb0c8">bc</text>
    <rect x="486" y="100" width="40" height="24" rx="4" fill="#0b1518" stroke="#6c7b93"/><text x="506" y="116" fill="#9fb0c8">de</text>
    <rect x="530" y="100" width="40" height="24" rx="4" fill="#0b1518" stroke="#6c7b93"/><text x="550" y="116" fill="#9fb0c8">fg</text>
  </g>
  <text x="487" y="142" text-anchor="middle" font-size="9.5" fill="#6c7b93">odd boundaries, no trigger token</text>

  <line x1="376" y1="121" x2="400" y2="112" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <line x1="572" y1="112" x2="596" y2="120" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <rect x="598" y="96" width="178" height="52" rx="7" fill="#0c1a16" stroke="#5fe3b0"/>
  <text x="687" y="118" text-anchor="middle" font-size="12" fill="#5fe3b0" font-weight="700">verdict: benign</text>
  <text x="687" y="136" text-anchor="middle" font-size="11" fill="#e3fffa" font-family="'JetBrains Mono',monospace">-&gt; PASS</text>

  <!-- BOTTOM branch: target model -->
  <rect x="226" y="274" width="150" height="54" rx="7" fill="#111827" stroke="#ff2a6d"/>
  <text x="301" y="296" text-anchor="middle" font-size="12" fill="#ff2a6d" font-weight="700">Target model</text>
  <text x="301" y="314" text-anchor="middle" font-size="10" fill="#6c7b93">its own tokenizer</text>

  <g font-size="10.5" font-family="'JetBrains Mono',monospace" text-anchor="middle">
    <rect x="410" y="288" width="40" height="24" rx="4" fill="#0b1518" stroke="#ff2a6d"/><text x="430" y="304" fill="#e3fffa">ab</text>
    <rect x="454" y="288" width="48" height="24" rx="4" fill="#0b1518" stroke="#ff2a6d"/><text x="478" y="304" fill="#e3fffa">cde</text>
    <rect x="506" y="288" width="40" height="24" rx="4" fill="#0b1518" stroke="#ff2a6d"/><text x="526" y="304" fill="#e3fffa">fg</text>
  </g>
  <text x="478" y="330" text-anchor="middle" font-size="9.5" fill="#6c7b93">boundaries that preserve the meaning</text>

  <line x1="376" y1="300" x2="404" y2="300" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <line x1="548" y1="300" x2="596" y2="300" stroke="#6c7b93" stroke-width="2" marker-end="url(#a)"/>
  <rect x="598" y="274" width="178" height="52" rx="7" fill="#140d16" stroke="#ff2a6d"/>
  <text x="687" y="296" text-anchor="middle" font-size="12" fill="#ff2a6d" font-weight="700">harmful meaning</text>
  <text x="687" y="314" text-anchor="middle" font-size="10" fill="#9fb0c8">understood, unchanged</text>

  <text x="400" y="376" text-anchor="middle" font-size="11.5" fill="#9fb0c8">A few characters shift the boundaries: benign to the filter, harmful to the model. Unify the tokenizer to close it.</text>
</svg>
