<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="420" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Four places to put a defense</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">soft layers around the model reduce risk; hard barriers at the exit remove it</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/></marker>
    <marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#5fe3b0"/></marker>
    <marker id="y" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#00f0ff"/></marker>
  </defs>

  <!-- soft layers (above the chain) -->
  <g>
    <rect x="24" y="92" width="100" height="46" rx="7" fill="#0b1518" stroke="#00f0ff" stroke-dasharray="5 4"/>
    <text x="74" y="112" text-anchor="middle" font-size="11" fill="#e3fffa">1 Input</text>
    <text x="74" y="128" text-anchor="middle" font-size="9.5" fill="#9fb0c8">classify, normalize</text>

    <rect x="172" y="92" width="120" height="46" rx="7" fill="#0b1518" stroke="#00f0ff" stroke-dasharray="5 4"/>
    <text x="232" y="112" text-anchor="middle" font-size="11" fill="#e3fffa">2 Prompt hardening</text>
    <text x="232" y="128" text-anchor="middle" font-size="9.5" fill="#9fb0c8">delimiters, spotlight</text>

    <rect x="470" y="92" width="130" height="46" rx="7" fill="#0b1518" stroke="#00f0ff" stroke-dasharray="5 4"/>
    <text x="535" y="112" text-anchor="middle" font-size="11" fill="#e3fffa">3 Output guardrail</text>
    <text x="535" y="128" text-anchor="middle" font-size="9.5" fill="#9fb0c8">classifier, leak scan</text>
  </g>

  <!-- soft connectors -->
  <g stroke="#00f0ff" stroke-width="1.6" fill="none" marker-end="url(#y)" opacity="0.8">
    <line x1="74" y1="138" x2="74" y2="168"/>
    <line x1="232" y1="138" x2="232" y2="168"/>
    <line x1="535" y1="138" x2="535" y2="168"/>
  </g>

  <!-- the data flow chain -->
  <g text-anchor="middle">
    <rect x="24" y="170" width="100" height="60" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="74" y="205" font-size="12" fill="#e3fffa">input</text>

    <rect x="172" y="170" width="120" height="60" rx="7" fill="#111827" stroke="#263451"/>
    <text x="232" y="197" font-size="12" fill="#e3fffa">build</text>
    <text x="232" y="214" font-size="12" fill="#e3fffa">prompt</text>

    <rect x="340" y="170" width="92" height="60" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="386" y="205" font-size="13" font-weight="700" fill="#ff2a6d">LLM</text>

    <rect x="480" y="170" width="120" height="60" rx="7" fill="#111827" stroke="#263451"/>
    <text x="540" y="197" font-size="12" fill="#e3fffa">handle</text>
    <text x="540" y="214" font-size="12" fill="#e3fffa">output</text>

    <rect x="648" y="170" width="128" height="60" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="712" y="197" font-size="12" fill="#e3fffa">tool / DB</text>
    <text x="712" y="214" font-size="12" fill="#e3fffa">browser</text>
  </g>

  <!-- chain arrows -->
  <g stroke="#6c7b93" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="124" y1="200" x2="170" y2="200"/>
    <line x1="292" y1="200" x2="338" y2="200"/>
    <line x1="432" y1="200" x2="478" y2="200"/>
    <line x1="600" y1="200" x2="646" y2="200"/>
  </g>
  <text x="712" y="250" text-anchor="middle" font-size="11" fill="#fcee0a">4 action control</text>

  <!-- hard barriers (below the chain, solid green) -->
  <g stroke="#5fe3b0" stroke-width="2" fill="none" marker-end="url(#g)">
    <line x1="540" y1="300" x2="540" y2="232"/>
    <line x1="712" y1="300" x2="712" y2="262"/>
  </g>
  <g>
    <rect x="470" y="300" width="140" height="58" rx="7" fill="#0b1518" stroke="#5fe3b0"/>
    <text x="540" y="321" text-anchor="middle" font-size="11" font-weight="700" fill="#5fe3b0">HARD at the exit</text>
    <text x="540" y="338" text-anchor="middle" font-size="9.5" fill="#9fb0c8">escape, validate,</text>
    <text x="540" y="352" text-anchor="middle" font-size="9.5" fill="#9fb0c8">parse a schema</text>

    <rect x="636" y="300" width="152" height="58" rx="7" fill="#0b1518" stroke="#5fe3b0"/>
    <text x="712" y="321" text-anchor="middle" font-size="11" font-weight="700" fill="#5fe3b0">HARD on actions</text>
    <text x="712" y="338" text-anchor="middle" font-size="9.5" fill="#9fb0c8">least privilege, rate</text>
    <text x="712" y="352" text-anchor="middle" font-size="9.5" fill="#9fb0c8">limit, human confirm</text>
  </g>

  <!-- legend -->
  <g font-size="11">
    <line x1="30" y1="330" x2="64" y2="330" stroke="#00f0ff" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="72" y="334" fill="#9fb0c8">probabilistic layer - reduces risk</text>
    <line x1="30" y1="352" x2="64" y2="352" stroke="#5fe3b0" stroke-width="2"/>
    <text x="72" y="356" fill="#9fb0c8">deterministic barrier - removes the class</text>
  </g>

  <text x="400" y="400" text-anchor="middle" font-size="11" fill="#6c7b93">Add the hard barrier first, then build up the soft layers. Measure leak rate and false positives.</text>
</svg>
