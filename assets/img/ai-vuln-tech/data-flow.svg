<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="380" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">The data flow every LLM app shares</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">almost every OWASP LLM risk is one uncontrolled arrow below</text>

  <!-- main chain -->
  <g font-size="12.5" text-anchor="middle">
    <rect x="28"  y="150" width="118" height="54" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="87"  y="173" fill="#e3fffa">User</text>
    <text x="87"  y="190" fill="#6c7b93" font-size="10.5">(untrusted)</text>

    <rect x="188" y="150" width="128" height="54" rx="7" fill="#111827" stroke="#263451"/>
    <text x="252" y="173" fill="#e3fffa">App builds</text>
    <text x="252" y="189" fill="#e3fffa">the prompt</text>

    <rect x="360" y="150" width="96" height="54" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="408" y="182" fill="#ff2a6d" font-weight="700">LLM</text>

    <rect x="500" y="150" width="128" height="54" rx="7" fill="#111827" stroke="#263451"/>
    <text x="564" y="173" fill="#e3fffa">App handles</text>
    <text x="564" y="189" fill="#e3fffa">the output</text>

    <rect x="672" y="150" width="104" height="54" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="724" y="173" fill="#e3fffa">Tool / DB</text>
    <text x="724" y="189" fill="#e3fffa">Browser</text>
  </g>

  <!-- arrows -->
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="146" y1="177" x2="184" y2="177"/>
    <line x1="316" y1="177" x2="356" y2="177"/>
    <line x1="456" y1="177" x2="496" y2="177"/>
    <line x1="628" y1="177" x2="668" y2="177"/>
  </g>

  <!-- external data into prompt -->
  <g font-size="11" text-anchor="middle">
    <rect x="178" y="256" width="148" height="46" rx="7" fill="#0b1518" stroke="#00f0ff" stroke-dasharray="5 4"/>
    <text x="252" y="275" fill="#9fb0c8">External data:</text>
    <text x="252" y="291" fill="#9fb0c8">RAG, web, email</text>
  </g>
  <line x1="252" y1="256" x2="252" y2="206" stroke="#00f0ff" stroke-width="2" marker-end="url(#a)" opacity="0.8"/>

  <!-- model/libs into LLM -->
  <g font-size="11" text-anchor="middle">
    <rect x="500" y="256" width="148" height="46" rx="7" fill="#0b1518" stroke="#fcee0a" stroke-dasharray="5 4"/>
    <text x="574" y="275" fill="#9fb0c8">Model &amp; 3rd-party</text>
    <text x="574" y="291" fill="#9fb0c8">libraries</text>
  </g>
  <line x1="470" y1="256" x2="420" y2="206" stroke="#fcee0a" stroke-width="2" marker-end="url(#a)" opacity="0.8"/>

  <!-- golden questions -->
  <g font-size="11.5">
    <text x="30" y="120" fill="#00f0ff" font-family="'JetBrains Mono',monospace">1. Where does untrusted data come IN?</text>
    <text x="300" y="120" fill="#ff2a6d" font-family="'JetBrains Mono',monospace">2. Where does output go OUT, over-trusted?</text>
    <text x="30" y="98" fill="#fcee0a" font-family="'JetBrains Mono',monospace">3. What is the LLM allowed to DO?</text>
  </g>
  <text x="400" y="348" text-anchor="middle" font-size="11" fill="#6c7b93">Each vulnerability is untrusted data crossing one arrow without a check.</text>
</svg>
