<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="380" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">The life cycle of a RAG system</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">retrieved chunks end up inside the prompt as untrusted input</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- row labels -->
  <text x="28" y="92" font-size="12" font-weight="700" fill="#5fe3b0" font-family="'JetBrains Mono',monospace">INGEST</text>
  <text x="28" y="212" font-size="12" font-weight="700" fill="#00f0ff" font-family="'JetBrains Mono',monospace">QUERY</text>

  <!-- ingest row -->
  <g font-size="12.5" text-anchor="middle">
    <rect x="28" y="102" width="140" height="54" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="98" y="126" fill="#e3fffa">Documents</text>
    <text x="98" y="143" fill="#6c7b93" font-size="10.5">(who can write here?)</text>

    <rect x="208" y="102" width="140" height="54" rx="7" fill="#111827" stroke="#263451"/>
    <text x="278" y="134" fill="#e3fffa">Split into chunks</text>

    <rect x="388" y="102" width="140" height="54" rx="7" fill="#111827" stroke="#263451"/>
    <text x="458" y="134" fill="#e3fffa">Embed each chunk</text>

    <rect x="568" y="102" width="140" height="54" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="638" y="126" fill="#e3fffa">Vector DB</text>
    <text x="638" y="143" fill="#6c7b93" font-size="10.5">(one index?)</text>
  </g>

  <!-- query row -->
  <g font-size="12.5" text-anchor="middle">
    <rect x="28" y="222" width="130" height="54" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="93" y="246" fill="#e3fffa">Question</text>
    <text x="93" y="263" fill="#6c7b93" font-size="10.5">(untrusted)</text>

    <rect x="188" y="222" width="130" height="54" rx="7" fill="#111827" stroke="#263451"/>
    <text x="253" y="254" fill="#e3fffa">Embed question</text>

    <rect x="348" y="222" width="130" height="54" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="413" y="246" fill="#e3fffa">Top-k nearest</text>
    <text x="413" y="263" fill="#e3fffa">chunks</text>

    <rect x="508" y="222" width="140" height="54" rx="7" fill="#0b1518" stroke="#00f0ff" stroke-dasharray="5 4"/>
    <text x="578" y="246" fill="#e3fffa">Chunks inserted</text>
    <text x="578" y="263" fill="#9fb0c8" font-size="10.5">into prompt (untrusted)</text>

    <rect x="688" y="222" width="88" height="54" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="732" y="254" fill="#ff2a6d" font-weight="700">LLM</text>
  </g>

  <!-- arrows -->
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="168" y1="129" x2="204" y2="129"/>
    <line x1="348" y1="129" x2="384" y2="129"/>
    <line x1="528" y1="129" x2="564" y2="129"/>
    <line x1="158" y1="249" x2="184" y2="249"/>
    <line x1="318" y1="249" x2="344" y2="249"/>
    <line x1="478" y1="249" x2="504" y2="249"/>
    <line x1="648" y1="249" x2="684" y2="249"/>
    <path d="M638,156 L638,190 L413,190 L413,218"/>
  </g>
  <text x="525" y="183" text-anchor="middle" font-size="10.5" fill="#6c7b93" font-family="'JetBrains Mono',monospace">similarity search</text>

  <text x="400" y="326" text-anchor="middle" font-size="11" fill="#9fb0c8">The retriever picks chunks by meaning, not by who is allowed to see them.</text>
  <text x="400" y="348" text-anchor="middle" font-size="11" fill="#6c7b93">Anyone who can write to the store can put text into the prompt.</text>
</svg>
