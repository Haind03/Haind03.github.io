<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 384" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="384" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Part 3 lab: break it, then fix it</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">two labs: direct leak, and indirect injection</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <!-- lab cards -->
  <rect x="36" y="80" width="350" height="112" rx="8" fill="#111827" stroke="#263451"/>
  <text x="50" y="102" font-size="12" font-weight="700" fill="#00f0ff" font-family="'JetBrains Mono',monospace">lab01-prompt-injection</text>
  <text x="372" y="102" text-anchor="end" font-size="10" fill="#6c7b93">GoatBot, terminal</text>
  <line x1="50" y1="112" x2="372" y2="112" stroke="#263451"/>
  <text x="50" y="132" font-size="10" fill="#9fb0c8">system prompt hides the discount code + admin email</text>
  <text x="50" y="150" font-size="10" fill="#9fb0c8">tasks: leak the code, leak the full prompt, go off-scope</text>
  <text x="50" y="168" font-size="10" fill="#9fb0c8">classify 5 technique families, record each rate</text>
  <text x="50" y="186" font-size="10" fill="#ff2a6d" font-family="'JetBrains Mono',monospace">LLM01 . LLM07 . LLM02</text>

  <rect x="414" y="80" width="350" height="112" rx="8" fill="#111827" stroke="#263451"/>
  <text x="428" y="102" font-size="12" font-weight="700" fill="#00f0ff" font-family="'JetBrains Mono',monospace">lab02-indirect-injection</text>
  <text x="750" y="102" text-anchor="end" font-size="10" fill="#6c7b93">inbox summarizer</text>
  <line x1="428" y1="112" x2="750" y2="112" stroke="#263451"/>
  <text x="428" y="132" font-size="10" fill="#9fb0c8">each docs/*.txt is one email; you add only ONE file</text>
  <text x="428" y="150" font-size="10" fill="#9fb0c8">assistant may propose SEND_EMAIL(), the app auto-runs it</text>
  <text x="428" y="168" font-size="10" fill="#9fb0c8">tasks escalate: misstate, send out, leak revenue</text>
  <text x="428" y="186" font-size="10" fill="#ff2a6d" font-family="'JetBrains Mono',monospace">LLM01 indirect . LLM06</text>

  <!-- routine -->
  <text x="400" y="222" text-anchor="middle" font-size="11" fill="#6c7b93" font-family="'JetBrains Mono',monospace">the routine for every lab</text>

  <g text-anchor="middle">
    <rect x="36" y="236" width="160" height="64" rx="7" fill="#111827" stroke="#00f0ff"/>
    <text x="116" y="262" font-size="12" fill="#e3fffa">Read the code</text>
    <text x="116" y="280" font-size="9.5" fill="#6c7b93">find the bug first</text>

    <rect x="225" y="236" width="160" height="64" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="305" y="262" font-size="12" fill="#ff2a6d">Break it</text>
    <text x="305" y="280" font-size="9.5" fill="#6c7b93">5 tries, record the rate</text>

    <rect x="414" y="236" width="160" height="64" rx="7" fill="#0b1518" stroke="#5fe3b0"/>
    <text x="494" y="262" font-size="12" fill="#5fe3b0">Fix it</text>
    <text x="494" y="280" font-size="9.5" fill="#6c7b93">app_fixed.py, 4 measures</text>

    <rect x="603" y="236" width="160" height="64" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="683" y="262" font-size="12" fill="#fcee0a">Compare</text>
    <text x="683" y="280" font-size="9.5" fill="#6c7b93">same payloads and temp</text>
  </g>

  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="196" y1="268" x2="223" y2="268"/>
    <line x1="385" y1="268" x2="412" y2="268"/>
    <line x1="574" y1="268" x2="601" y2="268"/>
    <path d="M683,300 L683,330 L305,330 L305,302"/>
  </g>
  <text x="494" y="324" text-anchor="middle" font-size="10" fill="#6c7b93" font-family="'JetBrains Mono',monospace">repeat</text>

  <text x="400" y="366" text-anchor="middle" font-size="11" fill="#6c7b93">Soft barriers lower the rate; only the architectural barrier removes the risk.</text>
</svg>
