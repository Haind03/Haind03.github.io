<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="400" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Ollama serves a local model over one HTTP API</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">lab code calls 127.0.0.1:11434 through common/llm.py</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/></marker>
    <marker id="p" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#ff2a6d"/></marker>
  </defs>

  <!-- localhost boundary around Ollama + model + params + modelfile -->
  <rect x="314" y="118" width="478" height="232" rx="10" fill="none" stroke="#5fe3b0" stroke-dasharray="5 4"/>
  <text x="553" y="136" text-anchor="middle" font-size="11" fill="#5fe3b0" font-family="'JetBrains Mono',monospace">binds to 127.0.0.1 only, never OLLAMA_HOST=0.0.0.0</text>

  <!-- left: your code -->
  <g text-anchor="middle">
    <rect x="24" y="150" width="140" height="58" rx="7" fill="#111827" stroke="#263451"/>
    <text x="94" y="180" font-size="12.5" fill="#e3fffa">Your lab code</text>
    <text x="94" y="198" font-size="10" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">import chat</text>

    <rect x="188" y="150" width="120" height="58" rx="7" fill="#111827" stroke="#263451"/>
    <text x="248" y="180" font-size="12" fill="#e3fffa" font-family="'JetBrains Mono',monospace">common/llm.py</text>
    <text x="248" y="198" font-size="10" fill="#9fb0c8">one wrapper</text>
  </g>

  <!-- Ollama runtime -->
  <g text-anchor="middle">
    <rect x="322" y="140" width="190" height="86" rx="7" fill="#111827" stroke="#fcee0a"/>
    <text x="417" y="162" font-size="13" font-weight="700" fill="#e3fffa">Ollama</text>
    <text x="417" y="180" font-size="10.5" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">127.0.0.1:11434</text>
    <text x="417" y="200" font-size="10" fill="#fcee0a" font-family="'JetBrains Mono',monospace">/api/chat   - roles</text>
    <text x="417" y="216" font-size="10" fill="#fcee0a" font-family="'JetBrains Mono',monospace">/api/generate - prompt</text>
  </g>

  <!-- model -->
  <g text-anchor="middle">
    <rect x="600" y="150" width="176" height="58" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="688" y="176" font-size="13" font-weight="700" fill="#ff2a6d">Model (the LLM)</text>
    <text x="688" y="195" font-size="10.5" fill="#9fb0c8" font-family="'JetBrains Mono',monospace">qwen2.5:3b</text>
  </g>

  <!-- flow arrows -->
  <g stroke="#6c7b93" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="164" y1="179" x2="186" y2="179"/>
    <line x1="308" y1="179" x2="320" y2="179"/>
    <line x1="512" y1="179" x2="598" y2="179"/>
  </g>

  <!-- params box -->
  <g>
    <rect x="322" y="248" width="190" height="96" rx="7" fill="#0b1518" stroke="#263451"/>
    <text x="417" y="270" text-anchor="middle" font-size="11.5" fill="#e3fffa">Parameters that shape an attack</text>
    <text x="417" y="292" text-anchor="middle" font-size="10.5" fill="#9fb0c8">temperature, seed - reproducible</text>
    <text x="417" y="310" text-anchor="middle" font-size="10.5" fill="#9fb0c8">num_ctx - many-shot (Lesson 10.2)</text>
    <text x="417" y="328" text-anchor="middle" font-size="10.5" fill="#9fb0c8">num_predict - cost (Lesson 8)</text>
  </g>

  <!-- modelfile box -->
  <g>
    <rect x="586" y="248" width="190" height="96" rx="7" fill="#0b1518" stroke="#ff2a6d" stroke-dasharray="5 4"/>
    <text x="681" y="270" text-anchor="middle" font-size="11.5" fill="#ff2a6d">Modelfile</text>
    <text x="681" y="292" text-anchor="middle" font-size="10.5" fill="#9fb0c8">SYSTEM = default prompt</text>
    <text x="681" y="310" text-anchor="middle" font-size="10.5" fill="#9fb0c8">can hide a backdoor</text>
    <text x="681" y="328" text-anchor="middle" font-size="10.5" fill="#6c7b93">Lesson 7: supply chain</text>
  </g>
  <line x1="681" y1="248" x2="681" y2="210" stroke="#ff2a6d" stroke-width="2" marker-end="url(#p)"/>

  <text x="400" y="378" text-anchor="middle" font-size="11" fill="#6c7b93">Your payloads never leave the machine for a third-party server.</text>
</svg>
