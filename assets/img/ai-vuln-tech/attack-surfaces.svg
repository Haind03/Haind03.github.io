<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 392" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
<rect x="0" y="0" width="800" height="392" rx="12" fill="#0d121d" stroke="#263451"/>
<text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Three attack-surface zones</text>
<text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">the OWASP Top 10 for LLM sorted by where it sits on the data flow</text>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/></marker></defs>
<rect x="24" y="84" width="232" height="238" rx="7" fill="#111827" stroke="#00f0ff"/>
<text x="140" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#00f0ff">1. Input</text>
<text x="140" y="128" text-anchor="middle" font-size="10.5" fill="#6c7b93">user text, RAG, web, email</text>
<line x1="38" y1="140" x2="242" y2="140" stroke="#263451"/>
<text x="40" y="162" font-size="11.5" fill="#00f0ff" font-family="'JetBrains Mono',monospace">LLM01</text>
<text x="40" y="177" font-size="11.5" fill="#e3fffa">Prompt Injection</text>
<text x="40" y="201" font-size="11.5" fill="#00f0ff" font-family="'JetBrains Mono',monospace">LLM02</text>
<text x="40" y="216" font-size="11.5" fill="#e3fffa">Sensitive Information Disclosure</text>
<text x="40" y="240" font-size="11.5" fill="#00f0ff" font-family="'JetBrains Mono',monospace">LLM07</text>
<text x="40" y="255" font-size="11.5" fill="#e3fffa">System Prompt Leakage</text>
<rect x="284" y="84" width="232" height="238" rx="7" fill="#111827" stroke="#fcee0a"/>
<text x="400" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#fcee0a">2. Model and data</text>
<text x="400" y="128" text-anchor="middle" font-size="10.5" fill="#6c7b93">weights, training data, vector store</text>
<line x1="298" y1="140" x2="502" y2="140" stroke="#263451"/>
<text x="300" y="162" font-size="11.5" fill="#fcee0a" font-family="'JetBrains Mono',monospace">LLM03</text>
<text x="300" y="177" font-size="11.5" fill="#e3fffa">Supply Chain</text>
<text x="300" y="201" font-size="11.5" fill="#fcee0a" font-family="'JetBrains Mono',monospace">LLM04</text>
<text x="300" y="216" font-size="11.5" fill="#e3fffa">Data and Model Poisoning</text>
<text x="300" y="240" font-size="11.5" fill="#fcee0a" font-family="'JetBrains Mono',monospace">LLM08</text>
<text x="300" y="255" font-size="11.5" fill="#e3fffa">Vector and Embedding Weaknesses</text>
<rect x="544" y="84" width="232" height="238" rx="7" fill="#111827" stroke="#ff2a6d"/>
<text x="660" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#ff2a6d">3. Output and actions</text>
<text x="660" y="128" text-anchor="middle" font-size="10.5" fill="#6c7b93">HTML, SQL, tools, mail, files</text>
<line x1="558" y1="140" x2="762" y2="140" stroke="#263451"/>
<text x="560" y="162" font-size="11.5" fill="#ff2a6d" font-family="'JetBrains Mono',monospace">LLM05</text>
<text x="560" y="177" font-size="11.5" fill="#e3fffa">Improper Output Handling</text>
<text x="560" y="201" font-size="11.5" fill="#ff2a6d" font-family="'JetBrains Mono',monospace">LLM06</text>
<text x="560" y="216" font-size="11.5" fill="#e3fffa">Excessive Agency</text>
<text x="560" y="240" font-size="11.5" fill="#ff2a6d" font-family="'JetBrains Mono',monospace">LLM09</text>
<text x="560" y="255" font-size="11.5" fill="#e3fffa">Misinformation</text>
<g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
<line x1="257" y1="203" x2="282" y2="203"/><line x1="517" y1="203" x2="542" y2="203"/></g>
<rect x="24" y="338" width="752" height="36" rx="7" fill="#0b1518" stroke="#263451" stroke-dasharray="5 4"/>
<text x="400" y="361" text-anchor="middle" font-size="11.5" fill="#9fb0c8"><tspan fill="#e3fffa" font-family="'JetBrains Mono',monospace">LLM10</tspan>  Unbounded Consumption spans all three zones (compute, cost, tokens)</text>
</svg>
