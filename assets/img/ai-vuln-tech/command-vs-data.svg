<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Chakra Petch','Segoe UI',Arial,sans-serif">
  <rect x="0" y="0" width="800" height="400" rx="12" fill="#0d121d" stroke="#263451"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#e3fffa">Two channels versus one</text>
  <text x="400" y="56" text-anchor="middle" font-size="12" fill="#6c7b93" font-family="'JetBrains Mono',monospace">prompt injection comes from the missing separation</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#6c7b93"/>
    </marker>
  </defs>

  <line x1="400" y1="76" x2="400" y2="372" stroke="#263451" stroke-dasharray="3 5"/>

  <!-- LEFT: SQL -->
  <text x="205" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#5fe3b0" font-family="'JetBrains Mono',monospace">SQL prepared statement</text>
  <g font-size="12" text-anchor="middle">
    <rect x="40" y="120" width="130" height="50" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="105" y="141" fill="#e3fffa">Command channel</text>
    <text x="105" y="157" fill="#6c7b93" font-size="10.5">SELECT ... WHERE id = ?</text>

    <rect x="40" y="206" width="130" height="50" rx="7" fill="#0b1518" stroke="#00f0ff" stroke-dasharray="5 4"/>
    <text x="105" y="227" fill="#e3fffa">Data channel</text>
    <text x="105" y="243" fill="#6c7b93" font-size="10.5">user input (bound)</text>

    <rect x="248" y="150" width="110" height="76" rx="7" fill="#111827" stroke="#5fe3b0"/>
    <text x="303" y="184" fill="#e3fffa">Database</text>
    <text x="303" y="201" fill="#5fe3b0" font-size="10.5">data stays data</text>
  </g>
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <path d="M170,145 L210,145 L210,170 L244,170"/>
    <path d="M170,231 L210,231 L210,206 L244,206"/>
  </g>
  <text x="205" y="296" text-anchor="middle" font-size="11.5" fill="#5fe3b0">Data never becomes a command.</text>

  <!-- RIGHT: LLM -->
  <text x="595" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#ff2a6d" font-family="'JetBrains Mono',monospace">LLM</text>
  <g font-size="11.5" text-anchor="middle">
    <rect x="430" y="106" width="130" height="34" rx="7" fill="#111827" stroke="#263451"/>
    <text x="495" y="127" fill="#e3fffa">System prompt</text>
    <rect x="430" y="148" width="130" height="34" rx="7" fill="#0b1518" stroke="#00f0ff" stroke-dasharray="5 4"/>
    <text x="495" y="169" fill="#e3fffa">User message</text>
    <rect x="430" y="190" width="130" height="34" rx="7" fill="#0b1518" stroke="#00f0ff" stroke-dasharray="5 4"/>
    <text x="495" y="211" fill="#e3fffa">RAG chunks</text>
    <rect x="430" y="232" width="130" height="34" rx="7" fill="#0b1518" stroke="#00f0ff" stroke-dasharray="5 4"/>
    <text x="495" y="253" fill="#e3fffa">Tool results</text>

    <rect x="640" y="130" width="120" height="112" rx="7" fill="#111827" stroke="#ff2a6d"/>
    <text x="700" y="172" fill="#ff2a6d" font-weight="700" font-size="12.5">ONE token</text>
    <text x="700" y="190" fill="#ff2a6d" font-weight="700" font-size="12.5">stream</text>
    <text x="700" y="213" fill="#9fb0c8" font-size="10.5">commands and</text>
    <text x="700" y="227" fill="#9fb0c8" font-size="10.5">data mixed</text>
  </g>
  <g stroke="#6c7b93" stroke-width="2" marker-end="url(#a)" fill="none">
    <line x1="560" y1="123" x2="636" y2="150"/>
    <line x1="560" y1="165" x2="636" y2="173"/>
    <line x1="560" y1="207" x2="636" y2="199"/>
    <line x1="560" y1="249" x2="636" y2="222"/>
  </g>
  <text x="595" y="296" text-anchor="middle" font-size="11.5" fill="#ff2a6d">Nothing marks a token as command or data.</text>

  <text x="400" y="344" text-anchor="middle" font-size="11" fill="#9fb0c8">Because the model cannot separate them, defenses go outside the model:</text>
  <text x="400" y="364" text-anchor="middle" font-size="11" fill="#6c7b93">filter input, validate output, limit what tools can do.</text>
</svg>
